#
# actionlint configuration (https://github.com/rhysd/actionlint).

# actionlint 1.7.12, the latest release, predates GitHub's Ubuntu 26.04
# runner and reports its label as unknown. It's a hosted runner, not a
# self-hosted one, but this is the only way to tell actionlint about a
# label. Remove it once a release knows the label.
self-hosted-runner:
  labels:
    - ubuntu-26.04

paths:
  .github/workflows/**/*.yml:
    ignore:
      # actionlint 1.7.12, the latest release, doesn't know the $/
      # self-repository form of uses: that the workflows use for in-repo
      # actions and reusable workflows
      # (https://github.com/rhysd/actionlint/issues/711).
      - 'specifying action "\$/[^"]+" in invalid format'
      - 'reusable workflow call "\$/[^"]+" at "uses" is not following'
