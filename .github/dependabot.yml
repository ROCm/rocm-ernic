# SPDX-License-Identifier: MIT
version: 2
updates:
  # "/" covers .github/workflows; composite actions keep their own `uses:`
  # pins, so .github/actions has to be listed separately to get bumped.
  # Dependabot rejects a second github-actions entry that also covers "/",
  # so every directory for this ecosystem belongs in this one entry.
  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: daily
    # Hold new releases back for a week before proposing them.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      github-actions:
        patterns:
          - "*"

  # Current Python dependency manifests in this repo live at the top level
  # and under prometheus/.
  - package-ecosystem: pip
    directories:
      - "/"
      - "/prometheus"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      python:
        patterns:
          - "*"
