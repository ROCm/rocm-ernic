# SPDX-License-Identifier: MIT
version: 2
updates:
  # GitHub Dependabot can update the action references used by workflows
  # and the local composite action metadata in .github/actions/.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    # Hold new releases back for a week before proposing them.
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"

  # Current Python dependency manifests in this repo live at the top level
  # and under prometheus/.
  - package-ecosystem: pip
    directories:
      - "/"
      - "/prometheus"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      python:
        patterns:
          - "*"

  # ── GitHub Actions: keep workflow action versions current ──────────────────
  - package-ecosystem: "github-actions"
    # "/" covers .github/workflows; composite actions keep their own `uses:`
    # pins, so .github/actions has to be listed separately to get bumped.
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "daily"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      github-actions:
        patterns:
          - "*"
