---
name: Fetch guest VM image
description: Pull the guest qcow2 and its metadata from the ORAS artifact.

inputs:
  repo:
    description: >-
      Artifact repository. Defaults to GUEST_ARTIFACT_REPO in
      ci/guest-image.env, which is the only place the pin lives.
    required: false
    default: ''
  tag:
    description: >-
      Artifact tag. Defaults to GUEST_ARTIFACT_TAG in ci/guest-image.env.
      Pass one only to test a guest other than the pinned image -- a literal
      here is a second copy of the pin and will drift.
    required: false
    default: ''
  dest:
    description: Directory to unpack into
    required: false
    default: /guest-image
  info_artifact_type:
    description: >-
      artifactType of the referrer carrying vm-info.json. Defaults to
      GUEST_ARTIFACT_INFO_TYPE in ci/guest-image.env.
    required: false
    default: ''

outputs:
  output_dir:
    description: Directory holding the qcow2 and vm-info.json
    value: ${{ steps.fetch.outputs.output_dir }}

runs:
  using: composite
  steps:
  - id: fetch
    shell: bash
    env:
      REPO: ${{ inputs.repo }}
      TAG: ${{ inputs.tag }}
      DEST: ${{ inputs.dest }}
      INFO_TYPE: ${{ inputs.info_artifact_type }}
    run: |
      set -euo pipefail

      # The pin lives in exactly one file. Reading it here rather than in
      # every caller is what stops the three lanes drifting apart: a bump is
      # one edit, and a lane cannot keep testing an older guest because its
      # own copy was missed.
      PIN="${GITHUB_WORKSPACE}/ci/guest-image.env"
      if [ -z "${REPO}" ] || [ -z "${TAG}" ] || [ -z "${INFO_TYPE}" ]; then
        if [ ! -f "${PIN}" ]; then
          echo "::error::ci/guest-image.env not found at ${PIN}." \
               "fetch-guest-vm reads the image pin from there, so the" \
               "repository must be checked out before this action runs."
          exit 1
        fi
        # shellcheck source=/dev/null
        . "${PIN}"
        REPO="${REPO:-${GUEST_ARTIFACT_REPO}}"
        TAG="${TAG:-${GUEST_ARTIFACT_TAG}}"
        INFO_TYPE="${INFO_TYPE:-${GUEST_ARTIFACT_INFO_TYPE}}"
      fi
      REF="${REPO}:${TAG}"

      retry() {
        local rc=0
        for i in 1 2 3; do
          if "$@"; then
            return 0
          else
            rc=$?
          fi
          echo "Command failed (attempt $i/3): $*" >&2
          sleep 5
        done
        return "$rc"
      }

      # oras and zstd ship in the builder image; nothing to install, so
      # no apt-get sits on the path to a guest.
      mkdir -p "${DEST}/output"
      cd "${DEST}/output"

      echo "=== Fetching metadata for ${REF} ==="
      # Referrer first: it is kilobytes, so a bad reference fails in
      # seconds rather than after a 1.6 GB download.
      DIGEST=$(retry oras discover --format json "$REF" \
        | jq -r --arg t "$INFO_TYPE" \
            '[.referrers[] | select(.artifactType==$t)]
             | sort_by(.annotations["org.opencontainers.image.created"])
             | last | .digest')
      if [ -z "$DIGEST" ] || [ "$DIGEST" = "null" ]; then
        echo "✗ ${REF} has no ${INFO_TYPE} referrer"
        exit 1
      fi
      retry oras pull "${REPO}@${DIGEST}"
      # The image carries no key: ci/boot-guest.sh authorizes one at boot

      echo "=== Fetching disk for ${REF} ==="
      retry oras pull "$REF"

      # Take the disk name from what actually landed rather than pinning
      # it, so a renamed guest fails here instead of in Read VM info.
      shopt -s nullglob
      ZST=(*.qcow2.zst)
      if [ ${#ZST[@]} -ne 1 ]; then
        echo "✗ expected exactly one *.qcow2.zst, got: ${ZST[*]:-none}"
        ls -la
        exit 1
      fi

      # --long=27 matches the compressor's window, which zstd otherwise
      # refuses as needing too much memory to decode.  --rm releases the
      # 1.6 GB .zst as the 3.2 GB disk lands: the runner does not
      # comfortably hold both alongside a build tree.
      zstd -d --long=27 --rm -q "${ZST[0]}"

      ls -la "${DEST}/output"
      echo "output_dir=${DEST}/output" >> "$GITHUB_OUTPUT"
