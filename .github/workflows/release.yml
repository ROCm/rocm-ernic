# SPDX-License-Identifier: MIT
name: rocm-ernic - Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  INSTALL_PREFIX: /tmp/rocm-ernic-release

jobs:
  build:
    name: Build release assets
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-${{ runner.os }}-release-${{ hashFiles('.github/workflows/release.yml') }}
          restore-keys: apt-${{ runner.os }}-release-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            meson \
            ninja-build \
            pkg-config \
            libibverbs-dev \
            librdmacm-dev \
            libglib2.0-dev \
            libjson-c-dev

      - name: Cache libvfio-user build
        id: cache-libvfio-user
        uses: actions/cache@v4
        with:
          path: |
            /usr/lib/x86_64-linux-gnu/libvfio-user*
            /usr/lib/x86_64-linux-gnu/pkgconfig/libvfio-user.pc
            /usr/include/vfio-user
          key: libvfio-user-20e9803-${{ runner.os }}

      - name: Clone and build libvfio-user
        if: steps.cache-libvfio-user.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/nutanix/libvfio-user.git /tmp/libvfio-user
          cd /tmp/libvfio-user
          git checkout 20e9803
          meson setup build --prefix=/usr -Dwarning_level=0
          ninja -C build
          sudo ninja -C build install
          sudo ldconfig

      - name: Reload ldconfig after cache restore
        if: steps.cache-libvfio-user.outputs.cache-hit == 'true'
        run: sudo ldconfig

      - name: Read and validate release version
        id: version
        run: |
          version=$(python3 - <<'EOF'
          import pathlib, re
          text = pathlib.Path("CMakeLists.txt").read_text()
          parts = {}
          for key in ("MAJOR", "MINOR", "PATCH"):
              m = re.search(rf"set\(ROCM_ERNIC_VERSION_{key}\s+(\d+)\)", text)
              if not m:
                  raise SystemExit(f"missing ROCM_ERNIC_VERSION_{key}")
              parts[key] = m.group(1)
          print("{MAJOR}.{MINOR}.{PATCH}".format(**parts))
          EOF
          )
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME#v}"
            if [[ "${tag}" != "${version}" ]]; then
              echo "::error::tag ${GITHUB_REF_NAME} does not match version ${version} in CMakeLists.txt"
              exit 1
            fi
          fi

      - name: Configure project
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${INSTALL_PREFIX}" \
            -DERNIC_INSTALL_SERVICE=ON \
            -DERNIC_WERROR=ON

      - name: Build project
        run: cmake --build build

      - name: Verify release binaries
        run: |
          file build/rocm-ernic
          python3 service/ernicctl --help

      - name: Install release tree
        run: cmake --install build

      - name: Create release archives
        run: |
          version="${{ steps.version.outputs.version }}"
          arch="$(dpkg --print-architecture)"
          mkdir -p dist
          tar -C "${INSTALL_PREFIX}" -czf \
            "dist/rocm-ernic-${version}-linux-${arch}.tar.gz" \
            bin/rocm-ernic
          tar -C "${INSTALL_PREFIX}" -czf \
            "dist/ernicctl-${version}-linux-${arch}.tar.gz" \
            bin/ernicctl
          sha256sum dist/*.tar.gz > "dist/SHA256SUMS-${version}.txt"
          ls -lh dist

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/*
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: rocm-ernic ${{ needs.build.outputs.version }}
          generate_release_notes: true
          files: dist/*
