name: rocm-ernic - Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  INSTALL_PREFIX: /tmp/rocm-ernic-release

jobs:
  build:
    name: Build release assets
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect release architecture
        id: arch
        run: |
          echo "deb_arch=$(dpkg --print-architecture)" >> "${GITHUB_OUTPUT}"
          echo "multiarch=$(dpkg-architecture -qDEB_HOST_MULTIARCH)" >> "${GITHUB_OUTPUT}"

      # build-essential, cmake, ninja-build and pkg-config are preinstalled
      # on the hosted image -- the arch step above already relies on that,
      # since dpkg-architecture runs before this step.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libibverbs-dev \
            librdmacm-dev \
            libglib2.0-dev

      - name: Cache libvfio-user build
        id: cache-libvfio-user
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /usr/lib/${{ steps.arch.outputs.multiarch }}/libvfio-user*
            /usr/lib/${{ steps.arch.outputs.multiarch }}/pkgconfig/libvfio-user.pc
            /usr/include/vfio-user
          key: libvfio-user-20e9803-${{ runner.os }}-${{ steps.arch.outputs.multiarch }}

      - name: Clone and build libvfio-user
        if: steps.cache-libvfio-user.outputs.cache-hit != 'true'
        run: |
          # Only the from-source build needs these, and the cache key is
          # static, so the cache-hit path should not pay for them.
          sudo apt-get install -y meson libjson-c-dev
          git clone https://github.com/nutanix/libvfio-user.git /tmp/libvfio-user
          cd /tmp/libvfio-user
          git checkout 20e9803
          meson setup build --prefix=/usr -Dwarning_level=0
          ninja -C build
          sudo ninja -C build install
          sudo ldconfig

      - name: Reload ldconfig after cache restore
        if: steps.cache-libvfio-user.outputs.cache-hit == 'true'
        run: sudo ldconfig

      - name: Read and validate release version
        id: version
        run: |
          version=$(python3 - <<'EOF'
          import pathlib, re
          text = pathlib.Path("CMakeLists.txt").read_text()
          parts = {}
          for key in ("MAJOR", "MINOR", "PATCH"):
              m = re.search(rf"set\(ROCM_ERNIC_VERSION_{key}\s+(\d+)\)", text)
              if not m:
                  raise SystemExit(f"missing ROCM_ERNIC_VERSION_{key}")
              parts[key] = m.group(1)
          print("{MAJOR}.{MINOR}.{PATCH}".format(**parts))
          EOF
          )
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME#v}"
            if [[ "${tag}" != "${version}" ]]; then
              echo "::error::tag ${GITHUB_REF_NAME} does not match version ${version} in CMakeLists.txt"
              exit 1
            fi
          fi

      - name: Configure project
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${INSTALL_PREFIX}" \
            -DERNIC_INSTALL_SERVICE=ON \
            -DERNIC_WERROR=ON

      - name: Build project
        run: cmake --build build

      - name: Install release tree
        run: cmake --install build

      - name: Verify installed release payload
        run: |
          check_path() {
            if [ ! -e "${INSTALL_PREFIX}/$1" ]; then
              echo "::error::missing installed path ${INSTALL_PREFIX}/$1"
              exit 1
            fi
          }
          for path in \
            bin/rocm-ernic \
            bin/ernicctl \
            libexec/rocm-ernic/rocm-ernic-launcher \
            libexec/rocm-ernic/rocm-ernic-driver-pack \
            lib/systemd/system/rocm-ernic.service \
            lib/systemd/system/rocm-ernic-driver-pack.service \
            etc/rocm-ernic/rocm-ernic.env \
            share/rocm-ernic/patches \
            share/rocm-ernic/setup-ionic-dkms.sh \
            share/rocm-ernic/fetch-ionic-sources.sh; do
            check_path "${path}"
          done
          file "${INSTALL_PREFIX}/bin/rocm-ernic"
          python3 "${INSTALL_PREFIX}/bin/ernicctl" --help

      - name: Create release archives
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          arch="${{ steps.arch.outputs.deb_arch }}"
          mkdir -p dist
          cat > /tmp/rocm-ernic-release-files.txt <<'EOF'
          bin/rocm-ernic
          libexec/rocm-ernic
          lib/systemd/system/rocm-ernic.service
          lib/systemd/system/rocm-ernic-driver-pack.service
          etc/rocm-ernic
          share/rocm-ernic
          EOF
          cat > /tmp/ernicctl-release-files.txt <<'EOF'
          bin/ernicctl
          EOF
          tar --sort=name --mtime='UTC 1970-01-01' \
            --format=posix \
            --owner=0 --group=0 --numeric-owner \
            -C "${INSTALL_PREFIX}" \
            -cf - -T /tmp/rocm-ernic-release-files.txt \
            | gzip -n > "dist/rocm-ernic-${version}-linux-${arch}.tar.gz"
          tar --sort=name --mtime='UTC 1970-01-01' \
            --format=posix \
            --owner=0 --group=0 --numeric-owner \
            -C "${INSTALL_PREFIX}" \
            -cf - -T /tmp/ernicctl-release-files.txt \
            | gzip -n > "dist/ernicctl-${version}-linux-${arch}.tar.gz"
          sha256sum dist/*.tar.gz > "dist/SHA256SUMS-${version}.txt"
          ls -lh dist

      - name: Upload release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: dist/*
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: build
    if: >-
      github.ref_type == 'tag' &&
      github.ref_name == format('v{0}', needs.build.outputs.version)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: dist

      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: rocm-ernic ${{ needs.build.outputs.version }}
          make_latest: true
          generate_release_notes: true
          files: dist/*
