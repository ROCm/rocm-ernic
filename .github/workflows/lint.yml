name: Code Quality Checks

on:
  pull_request:
    branches: [ main ]
    paths:
      - '**.c'
      - '**.h'
      - '**.sh'
      - '.clang-format'
      - '.github/workflows/lint.yml'
  workflow_dispatch:

jobs:
  clang-format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format

      - name: Run clang-format check
        run: |
          # Find all C source and header files
          FILES=$(find src tests driver -type f \( -name "*.c" -o -name "*.h" \))

          # Check if any files need formatting
          NEEDS_FORMAT=0
          for file in $FILES; do
            if ! clang-format --dry-run --Werror "$file" 2>/dev/null; then
              echo "❌ $file needs formatting"
              NEEDS_FORMAT=1
              # Show the diff
              echo "Diff for $file:"
              clang-format "$file" | diff -u "$file" - || true
              echo ""
            fi
          done

          if [ $NEEDS_FORMAT -eq 1 ]; then
            echo ""
            echo "::error::Some files need formatting. Run 'clang-format -i' on the files above."
            echo ""
            echo "To fix all files, run:"
            echo "  find src tests driver -type f \( -name '*.c' -o -name '*.h' \) -exec clang-format -i {} \;"
            exit 1
          fi

          echo "✅ All files are properly formatted!"

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Check shell scripts
        run: |
          find . -name '*.sh' -type f -not -path './.git/*' | \
            xargs shellcheck \
              -e SC2086,SC2154,SC2024,SC2034,SC2164,SC2181,SC2317
