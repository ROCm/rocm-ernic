# SPDX-License-Identifier: MIT
name: rocm-ernic - System Tests

on:
  pull_request:
    branches: [ main ]
    # These jobs boot QEMU guests and run an hour of DKMS builds and
    # RDMA sweeps, so gate them on the things they actually consume.
    #
    # The guest drivers are the upstream in-tree ionic ones, fetched by
    # ernic_guest_setup rather than carried here, so there is no
    # in-repo driver path to list.
    paths:
      - 'src/**'                  # the vfio-user server under test
      - 'tests/**'                # rdma_verify, test_write_imm, ...
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'ansible/**'              # ernic_host_setup / ernic_guest_setup
      - 'scripts/**'              # find-rdma-device, DKMS, diagnostics
      - 'patches/**'              # staged into the guest in ionic mode
      - 'udev/**'                 # driver_common installs these
      - 'ci/lib/common.sh'        # carries a third copy of the guest tag
      - '.github/workflows/system-tests.yml'
      - '.github/workflows/nvmeof-lane.yml'   # the nvmeof job's body
      - '.github/workflows/s3-lane.yml'       # the s3 job's body
      - '.github/actions/fetch-guest-vm/**'
  schedule:
    # 04:23 UTC.  Off the hour on purpose -- the top of the hour is
    # when every cron on GitHub fires at once and queue times spike.
    #
    # One schedule for all three lanes: every badge is then fed from
    # one run, off one commit, by one code path.  The lanes still push
    # independently as each finishes, and the publish action retries
    # its push so the slower one replays onto the faster.
    - cron: '23 4 * * *'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Record the result in docs/perf-history'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseding a pull request's run is what you want; superseding a
  # run on main is not, now that main is what publishes.  A manual
  # dispatch would otherwise cancel the nightly part-way through its
  # commit-and-push and leave the shields on the previous run.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Container image with QEMU and libvfio-user pre-built
env:
  TCP_PORT: 5000
  # The emulated Ethernet segment for the two-VM job: one TAP per
  # instance, both enslaved to one bridge, which is the only way the
  # guests reach each other on ernic_nic_subnet.  These match the
  # ernic_host_setup defaults and are passed to it explicitly so the
  # --tap arguments below cannot drift from what the role created.
  ERNIC_TAP_BRIDGE: ernicbr0
  ERNIC_TAP_PREFIX: ernic-tap
  # The guest qcow2 ships as an ORAS artifact -- 3.7 GB zstd rather than
  # the 5.75 GB raw the FROM-scratch payload image carried, and no skopeo.
  # Both jobs pull it through .github/actions/fetch-guest-vm.  The builder
  # image carries no guest at all: guest building moved out to its own
  # repository, one per flavour, so there is nothing to fall back to if
  # this pull fails.
  #
  # Pin the date-prefixed tag.  Neither `latest-qcow2` nor the bare
  # `vm.<release>-<flavour>-qm.<sha>-qcow2` is immutable: the latter names
  # the build inputs, so a rebuild from the same sources republishes it.
  GUEST_ARTIFACT_TAG: 20260916.g2cc8e79-vm.resolute-ionic-qm.5d68689-qcow2

jobs:
  system-test-loopback-vm:
    name: Loopback Backend System Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      # TODO: move to ghcr.io/rocm/... once the image is published under the ROCm org
      image: sbates130272/batesste-ci-images-ubuntu-qemu-libvfio-user:latest
      # GitHub-hosted Linux runners expose /dev/kvm; pass it through so the
      # guests run accelerated instead of under TCG.
      options: --device /dev/kvm

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Select QEMU accelerator and guest size
      shell: bash
      env:
        VMS: 1
      run: |
        if [ -c /dev/kvm ] && qemu-system-x86_64 -accel help 2>/dev/null | grep -qw kvm; then
          echo "✓ /dev/kvm present; using KVM acceleration"
          echo "QEMU_ACCEL=kvm" >> $GITHUB_ENV
          echo "QEMU_CPU=host" >> $GITHUB_ENV
        else
          echo "⚠ /dev/kvm unavailable; falling back to TCG (guests will be slow)"
          echo "QEMU_ACCEL=tcg" >> $GITHUB_ENV
          echo "QEMU_CPU=qemu64" >> $GITHUB_ENV
        fi

        # Size the guests from the runner rather than pinning 2 vCPU / 1 GB.
        # The hosted runner is 4 vCPU / 16 GB, so the old numbers left most
        # of the machine idle while a DKMS kernel build ran single-file in
        # the guest.  Derive it instead: a larger runner class or the
        # self-hosted node then benefits without another edit here.
        #
        # One core and a quarter of RAM stay with the host -- the
        # vfio-user server, the harness and the runner agent share it --
        # and the memfd backend is not preallocated, so the guest only
        # takes what it touches.
        HOST_CPUS=$(nproc)
        HOST_MEM_MB=$(awk '/^MemTotal:/ {print int($2 / 1024)}' /proc/meminfo)

        VM_VCPUS=$(( (HOST_CPUS - 1) / VMS ))
        # Four is a hard floor, not a preference.  ionic_lif_size() sets
        # neqs = min(rdma.eq_qtype.qid_count, num_online_cpus()), and
        # ionic_create_rdma_admin() rejects anything below
        # IONIC_EQ_COUNT_MIN (4) with a silent -EINVAL that surfaces only
        # as "Failed to register ibdev".  A guest with fewer than 4 online
        # CPUs can never bring up ionic_rdma, whatever the device
        # advertises.  Oversubscribing the runner is fine; starving the
        # guest is not.
        [ "$VM_VCPUS" -lt 4 ] && VM_VCPUS=4
        VM_MEM_MB=$(( HOST_MEM_MB * 3 / 4 / VMS ))
        [ "$VM_MEM_MB" -gt 8192 ] && VM_MEM_MB=8192
        [ "$VM_MEM_MB" -lt 1024 ] && VM_MEM_MB=1024

        echo "VM_VCPUS=$VM_VCPUS" >> $GITHUB_ENV
        echo "VM_MEM_MB=$VM_MEM_MB" >> $GITHUB_ENV
        echo "runner: ${HOST_CPUS} vCPU, ${HOST_MEM_MB} MB"
        echo "guests: ${VMS} x ${VM_VCPUS} vCPU, ${VM_MEM_MB} MB"

    - name: Display environment
      run: |
        echo "=== Environment ==="
        echo "Container: Running inside Docker image"
        echo ""
        echo "=== Available Tools ==="
        qemu-system-x86_64 --version || echo "QEMU not found"
        cmake --version || echo "CMake not found"
        ninja --version || echo "Ninja not found"
        pkg-config --exists libibverbs && pkg-config --modversion libibverbs || echo "libibverbs not found"

    - name: Fetch the guest VM image
      id: guest_image
      uses: ./.github/actions/fetch-guest-vm
      with:
        tag: ${{ env.GUEST_ARTIFACT_TAG }}

    - name: Read VM info
      id: vm_info
      shell: bash
      run: |
        OUT="${{ steps.guest_image.outputs.output_dir }}"
        echo "=== Reading VM info from $OUT/vm-info.json ==="
        if [ ! -f "$OUT/vm-info.json" ]; then
          echo "✗ vm-info.json not found in $OUT"
          ls -la "$OUT"
          exit 1
        fi

        cat "$OUT/vm-info.json"

        # Paths in vm-info.json are absolute from the machine that built
        # the image, so resolve each against $OUT by basename.
        eval "$(python3 - "$OUT" <<'PYEOF'
        import json, os, shlex, sys
        out = sys.argv[1]
        d = json.load(open(os.path.join(out, "vm-info.json")))
        here = lambda p: os.path.join(out, os.path.basename(p)) if p else ""
        keys = {
            "VM_USER": d.get("username", "ci"),
            "VM_DISK": here(d.get("image_path", "")),
            "SSH_KEY": d.get("ssh_key", ""),
            "SSH_KEY_PRIVATE": here(d.get("ssh_keys", {}).get("private_key_path", "")),
            "SSH_KEY_PUBLIC": here(d.get("ssh_keys", {}).get("public_key_path", "")),
            # Only the payload image sets these.  kernel_ref is nested
            # under provisioning in schema v2; reading it from the top
            # level is why this reported "ionic ref unknown".
            "KERNEL_RELEASE": d.get("kernel_release", ""),
            "KERNEL_REF": d.get("provisioning", {}).get("kernel_ref", ""),
            "FLAVOUR": d.get("flavour", ""),
        }
        for k, v in keys.items():
            print(f"{k}={shlex.quote(str(v))}")
        PYEOF
        )"

        if [ -z "$VM_DISK" ]; then
          echo "✗ image_path not found in vm-info.json"
          exit 1
        fi

        if [ ! -f "$VM_DISK" ]; then
          echo "✗ VM disk image not found: $VM_DISK"
          ls -la "$OUT"
          exit 1
        fi

        # Verify disk image is accessible and check for missing backing file
        # Error out immediately if disk has a backing file reference that doesn't exist
        QEMU_IMG_OUTPUT=$(qemu-img info "$VM_DISK" 2>&1)
        QEMU_IMG_EXIT=$?
        if [ $QEMU_IMG_EXIT -ne 0 ]; then
          if echo "$QEMU_IMG_OUTPUT" | grep -q "Could not open backing file"; then
            echo "✗ Disk image has backing file reference but backing file does not exist"
            echo "The disk image metadata references a backing file that is missing."
            echo ""
            echo "Disk path: $VM_DISK"
            echo "qemu-img info output:"
            echo "$QEMU_IMG_OUTPUT"
            exit 1
          else
            echo "✗ Failed to read disk image info"
            echo "Disk path: $VM_DISK"
            echo "$QEMU_IMG_OUTPUT"
            exit 1
          fi
        fi

        echo "✓ VM username: $VM_USER"
        echo "✓ VM disk: $VM_DISK"
        echo "✓ SSH key: ${SSH_KEY:-not specified}"
        echo "✓ Guest flavour: ${FLAVOUR:-unknown}"
        echo "✓ Guest kernel: ${KERNEL_RELEASE:-unknown} (ionic ref ${KERNEL_REF:-unknown})"
        qemu-img info "$VM_DISK" || true

        echo "vm_user=$VM_USER" >> $GITHUB_OUTPUT
        echo "vm_disk=$VM_DISK" >> $GITHUB_OUTPUT
        echo "ssh_key=$SSH_KEY" >> $GITHUB_OUTPUT
        echo "ssh_key_private=$SSH_KEY_PRIVATE" >> $GITHUB_OUTPUT
        echo "ssh_key_public=$SSH_KEY_PUBLIC" >> $GITHUB_OUTPUT
        echo "kernel_release=$KERNEL_RELEASE" >> $GITHUB_OUTPUT

        # README.md line 9 hardcodes the guest kernel in a shields.io
        # badge, because shields.io has no way to read the image.  This
        # job is the only lane holding vm-info.json, so it is the only
        # place the badge and the image can be compared.  Only the
        # loopback job carries this: both jobs run on identical
        # triggers, so a second copy would buy nothing.
        README_KVER="$(sed -n \
          's/.*CI%20guest%20kernel-\([0-9][0-9.]*\)-.*/\1/p' \
          "$GITHUB_WORKSPACE/README.md")"
        if [ "$README_KVER" != "${KERNEL_RELEASE%%-*}" ]; then
          echo "✗ README.md advertises CI guest kernel '${README_KVER:-none}',"
          echo "  but $GUEST_ARTIFACT_TAG ships $KERNEL_RELEASE."
          echo "  Update the badge on README.md line 9."
          exit 1
        fi
        echo "✓ README kernel badge agrees with the image: $README_KVER"
    - name: Install dependencies
      run: |
        # Only what the container image does not already carry.
        # build-essential, cmake, meson, ninja-build, pkg-config,
        # libglib2.0-dev, libjson-c-dev and libcmocka-dev are baked
        # into the image; re-installing them cost an apt round trip
        # per job for nothing.  These three are genuinely absent, and
        # iproute2 in particular is what puts `ss` on PATH for the
        # TCP job's listener check.
        apt-get update
        apt-get install -y \
          libibverbs-dev \
          librdmacm-dev \
          iproute2

    - name: Verify libvfio-user from the image
      run: |
        # The image ships libvfio-user under /usr/local, and
        # CMakeLists.txt falls back to find_library/find_path there
        # when pkg-config misses, so there is nothing to build here.
        # What the build actually requires is the max_regions
        # parameter that f3742ed9 (#835) added to
        # vfu_setup_device_dma(); assert that rather than assuming
        # it, so a rebased image fails here with a clear message
        # instead of part-way through the compile.
        set -e
        ldconfig
        HDR=/usr/local/include/vfio-user/libvfio-user.h
        LIB=$(ls /usr/local/lib/x86_64-linux-gnu/libvfio-user.so* 2>/dev/null | head -1)
        if [ ! -f "$HDR" ] || [ -z "$LIB" ]; then
          echo "✗ libvfio-user missing from the container image"
          echo "  header: $HDR"
          ls -la /usr/local/lib/x86_64-linux-gnu/ /usr/local/include/ || true
          exit 1
        fi
        if ! grep -A2 'vfu_setup_device_dma' "$HDR" | grep -q 'max_regions'; then
          echo "✗ libvfio-user in the image predates the"
          echo "  vfu_setup_device_dma() max_regions parameter (#835)."
          exit 1
        fi
        echo "✓ libvfio-user present: $LIB"

    - name: Build rocm-ernic server
      run: |
        echo "=== Building rocm-ernic server ==="
        cmake -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=Debug \
          -DCMAKE_INSTALL_PREFIX=/usr \
          -DERNIC_WERROR=ON
        cmake --build build
        ls -lh build/rocm-ernic
        echo "✓ Server built successfully"

    - name: Start rocm-ernic server
      shell: bash
      run: |
        echo "=== Starting rocm-ernic server ==="
        # Remove any existing socket
        rm -f /tmp/vfio-user-rocm-ernic.sock

        ./build/rocm-ernic \
          --socket /tmp/vfio-user-rocm-ernic.sock \
          --backend loopback:mode=preserve \
          --verbose > /tmp/vfu_server.log 2>&1 &
        
        SERVER_PID=$!
        echo "SERVER_PID=$SERVER_PID" >> $GITHUB_ENV
        echo "Server PID: $SERVER_PID"
        
        # Wait for socket and verify server is running
        for i in {1..30}; do
          # Check if server process is still running
          if ! kill -0 "$SERVER_PID" 2>/dev/null; then
            echo "✗ Server process died (PID: $SERVER_PID)"
            echo "Exit code: $(wait $SERVER_PID 2>&1 || echo $?)"
            echo "=== Server log ==="
            cat /tmp/vfu_server.log
            exit 1
          fi
          
          # Check if socket exists and is a socket file
          if [ -S /tmp/vfio-user-rocm-ernic.sock ]; then
            chmod 666 /tmp/vfio-user-rocm-ernic.sock 2>/dev/null || true
            echo "✓ Server started (PID: $SERVER_PID)"
            echo "✓ Socket created: /tmp/vfio-user-rocm-ernic.sock"
            ls -la /tmp/vfio-user-rocm-ernic.sock
            exit 0
          fi
          
          # Show progress every 5 seconds
          if [ $((i % 5)) -eq 0 ]; then
            echo "Waiting for socket... (attempt $i/30)"
            echo "Server PID $SERVER_PID status: $(kill -0 $SERVER_PID 2>/dev/null && echo 'running' || echo 'dead')"
            echo "Socket exists: $([ -e /tmp/vfio-user-rocm-ernic.sock ] && echo 'yes' || echo 'no')"
            if [ -e /tmp/vfio-user-rocm-ernic.sock ]; then
              ls -la /tmp/vfio-user-rocm-ernic.sock
            fi
          fi
          sleep 1
        done
        
        echo "✗ Server failed to create socket after 30 seconds"
        echo "Server PID $SERVER_PID status: $(kill -0 $SERVER_PID 2>/dev/null && echo 'running' || echo 'dead')"
        echo "Socket exists: $([ -e /tmp/vfio-user-rocm-ernic.sock ] && echo 'yes' || echo 'no')"
        if [ -e /tmp/vfio-user-rocm-ernic.sock ]; then
          echo "Socket type:"
          ls -la /tmp/vfio-user-rocm-ernic.sock
          file /tmp/vfio-user-rocm-ernic.sock
        fi
        echo "=== Server log ==="
        cat /tmp/vfu_server.log
        exit 1
    
    - name: Start QEMU VM
      shell: bash
      run: |
        echo "=== Starting QEMU VM ==="
        VM_DISK="${{ steps.vm_info.outputs.vm_disk }}"
        SSH_PORT=2222
        
        # Start VM with vfio-user device
        # NOTE: memory-backend-memfd is REQUIRED for vfio-user DMA to work
        qemu-system-x86_64 \
          -machine q35,accel=${QEMU_ACCEL},memory-backend=mem0 \
          -cpu ${QEMU_CPU} \
          -smp ${VM_VCPUS} \
          -m ${VM_MEM_MB}M \
          -object memory-backend-memfd,id=mem0,share=on,size=${VM_MEM_MB}M \
          -nographic \
          -drive file="$VM_DISK",format=qcow2,if=virtio \
          -netdev user,id=net0,hostfwd=tcp::$SSH_PORT-:22 \
          -device virtio-net-pci,netdev=net0 \
          -device '{"driver":"vfio-user-pci","socket":{"type":"unix","path":"/tmp/vfio-user-rocm-ernic.sock"}}' \
          -serial file:/tmp/qemu-console.log \
          -monitor none \
          -qmp unix:/tmp/qmp.sock,server=on,wait=off > /tmp/qemu.log 2>&1 &

        QEMU_PID=$!
        echo "QEMU_PID=$QEMU_PID" >> $GITHUB_ENV
        echo "SSH_PORT=$SSH_PORT" >> $GITHUB_ENV
        echo "✓ QEMU started (PID: $QEMU_PID)"

        # Early failure detection: check if QEMU dies within 5 seconds
        echo "Monitoring QEMU for early failures..."
        sleep 5
        if ! kill -0 "$QEMU_PID" 2>/dev/null; then
          echo "✗ QEMU process died within 5 seconds (PID: $QEMU_PID)"
          echo "=== QEMU log ==="
          cat /tmp/qemu.log || echo "Log file not found"
          echo ""
          echo "=== Guest console ==="
          cat /tmp/qemu-console.log || echo "Console log not found"
          echo ""
          echo "=== QEMU exit code ==="
          wait "$QEMU_PID" 2>&1 || echo "Exit code: $?"
          exit 1
        fi
        echo "✓ QEMU still running after 5 seconds"
    
    - name: Setup SSH keys
      shell: bash
      run: |
        echo "=== Setting up SSH keys ==="
        SSH_KEY_PRIVATE="${{ steps.vm_info.outputs.ssh_key_private }}"
        SSH_KEY_PUBLIC="${{ steps.vm_info.outputs.ssh_key_public }}"
        SSH_KEY="${{ steps.vm_info.outputs.ssh_key }}"
        SSH_PORT="$SSH_PORT"
        
        mkdir -p ~/.ssh
        chmod 700 ~/.ssh
        
        # Require SSH key file paths from vm-info.json
        if [ -z "$SSH_KEY_PRIVATE" ] || [ -z "$SSH_KEY_PUBLIC" ]; then
          echo "✗ SSH key paths (ssh_key_private and ssh_key_public) are required in vm-info.json"
          echo "Found ssh_key_private: $([ -n "$SSH_KEY_PRIVATE" ] && echo "$SSH_KEY_PRIVATE" || echo 'not set')"
          echo "Found ssh_key_public: $([ -n "$SSH_KEY_PUBLIC" ] && echo "$SSH_KEY_PUBLIC" || echo 'not set')"
          exit 1
        fi
        
        # Check if key files exist at the specified paths
        if [ ! -f "$SSH_KEY_PRIVATE" ]; then
          echo "✗ SSH private key file not found: $SSH_KEY_PRIVATE"
          exit 1
        fi
        
        if [ ! -f "$SSH_KEY_PUBLIC" ]; then
          echo "✗ SSH public key file not found: $SSH_KEY_PUBLIC"
          exit 1
        fi
        
        echo "✓ Using SSH keys from vm-info.json"
        echo "  Private key: $SSH_KEY_PRIVATE"
        echo "  Public key: $SSH_KEY_PUBLIC"

        ssh-keyscan -p "$SSH_PORT" localhost >> ~/.ssh/known_hosts 2>/dev/null || true

        # Use the key where the fetch action left it rather than copying
        # it into ~/.ssh and letting ssh find it by default, because ssh
        # will not: ~ is $HOME, which a container job sets to
        # /github/home, but OpenSSH builds its default identity and
        # known_hosts paths from getpwuid() -- /root for us -- which is
        # empty.  The copy therefore landed somewhere ssh never looked,
        # and six runs died at "Permission denied (publickey,password)"
        # looking exactly like a guest that never booted.
        #
        # IdentitiesOnly stops an agent or those defaults from being
        # offered as well, so this stays legible if it ever breaks again;
        # BatchMode turns the password fallback into an immediate failure
        # with a usable message instead of a read_passphrase error.
        SSH_OPTS="-i $SSH_KEY_PRIVATE -o IdentitiesOnly=yes"
        SSH_OPTS="$SSH_OPTS -o BatchMode=yes -o StrictHostKeyChecking=no"
        SSH_OPTS="$SSH_OPTS -o UserKnownHostsFile=$HOME/.ssh/known_hosts"
        echo "SSH_OPTS=$SSH_OPTS" >> $GITHUB_ENV
        echo "SSH_KEY_PRIVATE=$SSH_KEY_PRIVATE" >> $GITHUB_ENV
        echo "✓ SSH_OPTS=$SSH_OPTS"
    
    - name: Wait for VM SSH
      shell: bash
      run: |
        echo "=== Waiting for VM SSH ==="
        SSH_PORT="$SSH_PORT"
        VM_USER="${{ steps.vm_info.outputs.vm_user }}"
        
        # Keep ssh's stderr rather than discarding it: "Connection
        # refused" and "Connection timed out" are different faults, and
        # the old 2>/dev/null hid which one this was for five runs.
        for i in {1..60}; do
          if ssh $SSH_OPTS -o ConnectTimeout=5 -p "$SSH_PORT" "${VM_USER}@localhost" 'echo VM Ready' 2>/tmp/ssh-attempt.err; then
            echo "✓ VM SSH is ready (attempt $i/60)"
            echo "VM_USER=$VM_USER" >> $GITHUB_ENV
            exit 0
          fi
          echo "Attempt $i/60: $(tr '\n' ' ' < /tmp/ssh-attempt.err | cut -c1-160)"
          sleep 5
        done

        echo "✗ VM SSH timeout"
        echo ""
        echo "=== Final attempt, verbose ==="
        ssh -vvv $SSH_OPTS -o ConnectTimeout=5 \
          -p "$SSH_PORT" "${VM_USER}@localhost" true 2>&1 | tail -40 || true

        "${GITHUB_WORKSPACE}/scripts/qemu-vm-diagnose.sh" \
          --label VM \
          --ssh-port "$SSH_PORT" \
          --qmp /tmp/qmp.sock \
          --console /tmp/qemu-console.log \
          --qemu-log /tmp/qemu.log \
          --pid "$QEMU_PID"
        exit 1
    
    - name: Verify the ionic PCI function is present in the VM
      shell: bash
      run: |
        echo "=== Verifying the emulated PCI function in the VM ==="
        SSH_PORT="$SSH_PORT"
        VM_USER="$VM_USER"

        # This runs before ernic_guest_setup, so ionic_rdma is not
        # loaded yet and there is deliberately no verbs check here --
        # that is "Verify RDMA device with running server", after
        # provisioning.
        #
        # The PCI function itself is a different matter: QEMU attached
        # the vfio-user device at boot, so 1dd8:100a is on the bus from
        # the first second.  This step used to end every probe in
        # `|| echo "... not found"`, so a guest that never saw the
        # device passed it exactly like a guest that did.  Assert it:
        # if the function is missing, nothing downstream can work and
        # the failure belongs here, where the cause is still visible.
        ssh $SSH_OPTS -p "$SSH_PORT" "${VM_USER}@localhost" 'bash -s' << 'EOFVM'
        set -e

        echo "=== PCI devices ==="
        sudo lspci -nn

        echo ""
        if ! sudo lspci -nn | grep -q '1dd8:100a'; then
          echo "✗ ionic PCI function 1dd8:100a not present on the guest bus"
          echo "  The vfio-user device did not attach.  Check the server"
          echo "  log and the QEMU console for the vfio-user handshake."
          exit 1
        fi
        echo "✓ ionic PCI function 1dd8:100a present"

        echo ""
        echo "=== Kernel modules (informational, pre-provisioning) ==="
        lsmod | grep -E 'ionic|ib_' || echo "(none loaded yet, as expected)"
        EOFVM


    - name: Install the Ansible collection dependencies
      shell: bash
      run: |
        echo "=== Installing the Ansible collection dependencies ==="
        # The guest is provisioned by the sbates130272.rocm_ernic
        # collection in this repo, so the same role the self-hosted CI
        # and developers use is what these jobs exercise.
        #
        # The container's ansible-core comes from pipx and searches
        # ~/.ansible/collections, not the dist-packages tree the
        # "ansible" apt bundle installs into, so installing that
        # bundle leaves community.general invisible.
        #
        # community.general by name rather than -r requirements.yml:
        # since 0.2.0 that file resolves to this one collection
        # anyway, so the two are equivalent and this needs no
        # checkout.  Through 0.1.0 it was six collections and ~29M --
        # sbates130272.batesste dragged in amazon.aws and
        # community.libvirt for ernic_image_prep, which no longer
        # exists -- and six galaxy round trips was six chances to hit
        # the 500 that has already reddened runs.
        ansible --version
        ansible-galaxy collection install community.general

    - name: Install kernel headers and build tools in VM
      shell: bash
      run: |
        echo "=== Installing kernel headers and build tools in VM ==="
        SSH_PORT="$SSH_PORT"
        VM_USER="$VM_USER"
        ssh $SSH_OPTS -p "$SSH_PORT" "${VM_USER}@localhost" << 'EOFVM'
        set -e
        KVER=$(uname -r)

        # The ionic flavour of the guest image bakes these in, but
        # these jobs run against a generic prebuilt CI qcow2, so the
        # build toolchain is installed here.  The kernel version
        # itself is the image's business, and ernic_guest_setup
        # asserts it matches the pinned ionic sources.
        #
        # Headers are a check, not an install.  A guest on a mainline
        # kernel has them from the .deb, and kernel.ubuntu.com is a
        # directory of loose .debs with no Packages index behind it --
        # so there is no apt source to install them from and
        # linux-headers-$(uname -r) 404s.  What matters is that the
        # build tree is there; ask for the package only when it is not.
        HEADER_PKG=""
        if [ -d "/lib/modules/${KVER}/build" ]; then
          echo "Kernel headers already present for ${KVER}"
        else
          echo "No build tree for ${KVER}; asking apt for the headers"
          HEADER_PKG="linux-headers-${KVER}"
        fi

        APT_LOCK_WAIT="-o DPkg::Lock::Timeout=300"
        for i in 1 2 3; do
          sudo apt-get $APT_LOCK_WAIT update -qq && break || { echo "apt-get update retry $i/3"; sleep 5; }
        done
        for i in 1 2 3 4 5; do
          sudo DEBIAN_FRONTEND=noninteractive apt-get $APT_LOCK_WAIT install -y -qq \
            ${HEADER_PKG} dkms git build-essential cmake ninja-build \
            pkg-config libnl-3-dev libnl-route-3-dev libudev-dev && break
          [ "$i" -eq 5 ] && { echo "apt-get install failed after 5 attempts"; exit 1; }
          echo "apt-get install retry $i/5"; sleep 10
        done

        echo "✓ Kernel packages installed for ${KVER}"
        EOFVM

    - name: Provision the VM with the Ansible collection
      shell: bash
      run: |
        echo "=== Provisioning the guest via ernic_guest_setup ==="
        SSH_PORT="$SSH_PORT"
        VM_USER="$VM_USER"
        ERNIC_RUN_DIR=/tmp/ernic-ci
        mkdir -p "$ERNIC_RUN_DIR"

        # vm-register.yml turns this manifest into the ernic_vms
        # inventory group; on the self-hosted path ernicctl writes it.
        cat > "$ERNIC_RUN_DIR/instances.json" << EOFJSON
        {
          "instances": [
            {
              "id": 1,
              "vm": {
                "vm_name": "gh-loopback-vm1",
                "ssh_port": ${SSH_PORT},
                "ssh_user": "${VM_USER}"
              }
            }
          ]
        }
        EOFJSON

        export ANSIBLE_HOST_KEY_CHECKING=false
        export ANSIBLE_PRIVATE_KEY_FILE="$SSH_KEY_PRIVATE"
        export ANSIBLE_ROLES_PATH="$PWD/ansible/roles"
        PROJECT_ROOT="$PWD"

        cd ansible
        ansible-playbook ci-site.yml --tags guest-setup \
          -e ernic_project_root="$PROJECT_ROOT" \
          -e ernic_run_dir="$ERNIC_RUN_DIR" \
          -e ernic_instances=1 \
          -e ernic_vm_ssh_base_port="$SSH_PORT" \
          -e ernic_vm_ssh_user="$VM_USER" \
          -e ernic_gpu_passthrough=false \
          -e ernic_guest_agent=false \
          -e ernic_set_hostname=false \
          -e ernic_configure_nic=false
    
    - name: Verify RDMA device with running server
      shell: bash
      run: |
        echo "=== Verifying RDMA device via loopback:mode=preserve backend ==="
        SSH_PORT="$SSH_PORT"
        VM_USER="$VM_USER"

        # The VM was launched against the server started in the
        # "Start rocm-ernic server" step (loopback:mode=preserve on
        # /tmp/vfio-user-rocm-ernic.sock).  We must NOT kill that
        # server or cycle configs -- doing so severs the vfio-user
        # connection and destabilises the VM.
        #
        # Config-cycling (startup-only, no VM) is covered by the
        # build-and-test workflow's test_loopback_ci.sh step.

        if ! kill -0 "$SERVER_PID" 2>/dev/null; then
          echo "✗ ERNIC server (PID $SERVER_PID) is no longer running"
          tail -30 /tmp/vfu_server.log || true
          exit 1
        fi
        echo "✓ ERNIC server still running (PID $SERVER_PID)"

        # Identify the device by PCI vendor ID rather than by name.  The
        # name is rewritten twice during boot -- kernel ionic_%d, then
        # 60-rdma-persistent-naming.rules to rocep<bus>s<slot>, then
        # 99-rocm-ernic.rules to rocm-rdma-ernic<n> -- so it says nothing
        # about which driver bound the device, and any name pattern is a
        # snapshot of one moment in that sequence.  A pattern that
        # silently stops matching is exactly how a guest with a working
        # NIC ended up "skipping" the tests meant to exercise it.
        # scripts/find-rdma-device.sh is the single definition, shared
        # with the ansible playbooks and the tests' ernic_device.h.
        #
        # `|| true` so an absent device reaches the diagnostics below
        # instead of tripping errexit at the assignment.
        DEVICE=$(ssh $SSH_OPTS -p "$SSH_PORT" "${VM_USER}@localhost" \
          'sh -s' < scripts/find-rdma-device.sh | tr -d '\r') || true

        if [ -z "$DEVICE" ]; then
          echo "✗ RDMA device not found in the guest"
          echo "=== ibv_devices ==="
          ssh $SSH_OPTS -p "$SSH_PORT" "${VM_USER}@localhost" 'ibv_devices' || true
          echo "=== ionic modules ==="
          ssh $SSH_OPTS -p "$SSH_PORT" "${VM_USER}@localhost" \
            'lsmod | grep ionic; dmesg | grep -i ionic | tail -30' || true
          exit 1
        fi
        echo "✓ RDMA device found: $DEVICE"

        # A device that enumerates but never reaches PORT_ACTIVE
        # carries no traffic, and every test below would fail in a
        # less obvious way.  Gate on it here.
        if ! ssh $SSH_OPTS -p "$SSH_PORT" "${VM_USER}@localhost" \
             "ibv_devinfo -d $DEVICE" | tee /dev/stderr | grep -q 'PORT_ACTIVE'; then
          echo "✗ $DEVICE never reached PORT_ACTIVE"
          exit 1
        fi

        echo "RDMA_DEVICE=$DEVICE" >> $GITHUB_ENV
        echo "✓ Loopback backend VM test passed ($DEVICE, PORT_ACTIVE)"

    - name: RDMA payload verification (rdma_verify)
      shell: bash
      run: |
        echo "=== RDMA payload verification on $RDMA_DEVICE ==="
        SSH_PORT="$SSH_PORT"
        VM_USER="$VM_USER"

        # perftest and the ibv_*_pingpong tools report completions,
        # not correctness: an emulator that posts CQEs without moving
        # bytes passes every one of them.  tests/rdma_verify.c runs
        # SEND, RDMA WRITE, WRITE_WITH_IMM and RDMA READ over one RC
        # pair and compares the bytes that actually landed, which is
        # the property the loopback backend exists to provide.
        #
        # It is plain libibverbs, so unlike the rocm_ernic direct-verbs
        # smoke tests it replaced it runs on the ionic path rather than
        # skipping there.
        ssh $SSH_OPTS -p "$SSH_PORT" "${VM_USER}@localhost" \
          "mkdir -p /tmp/rdma-verify"
        scp $SSH_OPTS -P "$SSH_PORT" \
          tests/rdma_verify.c \
          "${VM_USER}@localhost:/tmp/rdma-verify/"

        # 'bash -s' rather than a login shell: a login shell sources
        # ~/.bash_logout on exit, which runs clear_console; that fails
        # without a tty and its status would become the shell's.
        ssh $SSH_OPTS -p "$SSH_PORT" "${VM_USER}@localhost" 'bash -s' <<EOFVM
        set -e
        cd /tmp/rdma-verify
        cc -O2 -Wall -Wextra -o rdma_verify rdma_verify.c \$(pkg-config --libs libibverbs)
        # Bounded so a hang fails the step in seconds rather than
        # burning the job's 60-minute budget.
        timeout 120 ./rdma_verify "$RDMA_DEVICE"
        EOFVM
        echo "✓ RDMA payload verification passed on $RDMA_DEVICE"

    - name: WRITE_WITH_IMM guest smoke (build and run test_write_imm)
      shell: bash
      run: |
        echo "=== WRITE_WITH_IMM guest smoke (loopback responder delivery) ==="
        SSH_PORT="$SSH_PORT"
        VM_USER="$VM_USER"
        ssh $SSH_OPTS -p "$SSH_PORT" \
          "${VM_USER}@localhost" "mkdir -p /tmp/write-imm-smoke"
        scp $SSH_OPTS -P "$SSH_PORT" \
          tests/test_write_imm.c tests/ernic_device.h \
          "${VM_USER}@localhost:/tmp/write-imm-smoke/"

        # $RDMA_DEVICE is passed in rather than rediscovered: "Verify
        # RDMA device with running server" already proved this exact
        # device is present and PORT_ACTIVE, and two independent
        # discovery paths disagreeing is the bug that let this step
        # report success without ever running.  With it set the test
        # exits 1, not 77, if the device is missing -- so there is no
        # skip branch here and exit 77 is a failure like any other.
        set +e
        ssh $SSH_OPTS -p "$SSH_PORT" "${VM_USER}@localhost" \
          "RDMA_DEVICE='$RDMA_DEVICE' bash -s" <<'EOFVM'
        set -e
        cd /tmp/write-imm-smoke
        gcc -O2 -Wall -Wextra \
          -o test_write_imm test_write_imm.c \
          $(pkg-config --cflags --libs libibverbs)
        set +e
        timeout 30s ./test_write_imm
        exit $?
        EOFVM
        WIMM_EXIT=$?
        set -e

        if [ "$WIMM_EXIT" -eq 77 ]; then
          echo "✗ test_write_imm skipped (exit 77) despite RDMA_DEVICE"
          echo "  =$RDMA_DEVICE being set, which should make a missing"
          echo "  device exit 1.  Either the variable did not survive the"
          echo "  ssh, or ernic_device.h was not the header it built"
          echo "  against."
          exit 1
        fi
        if [ "$WIMM_EXIT" -ne 0 ]; then
          echo "✗ WRITE_WITH_IMM guest smoke failed (exit $WIMM_EXIT)"
          exit 1
        fi
        echo "✓ WRITE_WITH_IMM guest smoke passed"

    # These two used to be registered with CTest, where they ran on a host
    # with no RDMA device, returned 77 and were reported as passes.  They
    # are no longer registered; this is the only place they run, and here a
    # device is guaranteed, so exit 77 is a failure like any other.
    - name: Guest RDMA tests (test_data_transfer, test_rdma_cm)
      shell: bash
      run: |
        echo "=== Guest RDMA tests on $RDMA_DEVICE ==="
        SSH_PORT="$SSH_PORT"
        VM_USER="$VM_USER"
        ssh $SSH_OPTS -p "$SSH_PORT" \
          "${VM_USER}@localhost" "mkdir -p /tmp/guest-rdma-tests"
        scp $SSH_OPTS -P "$SSH_PORT" \
          tests/test_data_transfer.c tests/test_rdma_cm.c \
          tests/ernic_device.h \
          "${VM_USER}@localhost:/tmp/guest-rdma-tests/"

        FAILED=0
        for T in test_data_transfer test_rdma_cm; do
          echo ""
          echo "--- $T ---"
          set +e
          ssh $SSH_OPTS -p "$SSH_PORT" "${VM_USER}@localhost" \
            "RDMA_DEVICE='$RDMA_DEVICE' bash -s $T" <<'EOFVM'
        set -e
        T="$1"
        cd /tmp/guest-rdma-tests
        # -D_GNU_SOURCE matches target_compile_definitions() in
        # tests/CMakeLists.txt; without it test_data_transfer picks up an
        # implicit declaration of usleep().
        gcc -O2 -Wall -Wextra -D_GNU_SOURCE -o "$T" "$T.c" \
          $(pkg-config --cflags --libs libibverbs)
        set +e
        timeout 120s "./$T"
        exit $?
        EOFVM
          RC=$?
          set -e

          if [ "$RC" -eq 77 ]; then
            echo "✗ $T skipped (exit 77) despite RDMA_DEVICE=$RDMA_DEVICE"
            echo "  being set, which should make a missing device exit 1."
            echo "  Either the variable did not survive the ssh, or"
            echo "  ernic_device.h was not the header it built against."
            FAILED=1
          elif [ "$RC" -ne 0 ]; then
            echo "✗ $T failed (exit $RC)"
            FAILED=1
          else
            echo "✓ $T passed"
          fi
        done

        if [ "$FAILED" -ne 0 ]; then
          echo ""
          echo "✗ One or more guest RDMA tests failed"
          exit 1
        fi
        echo ""
        echo "✓ All guest RDMA tests passed"

    # This sweep used to live in benchmark.yml, on a hosted container with
    # no RDMA device and no perftest installed.  Every ib_*_bw call there
    # was `command not found`, silenced by 2>/dev/null into an empty CSV
    # field, and the regression check skipped on `[ -n "$bw_64k" ]` -- so
    # the job reported success having measured nothing, and uploaded a
    # header-only CSV to prove it.
    #
    # It runs here instead because this job already has what a benchmark
    # needs: a KVM-accelerated guest whose emulated device has been
    # asserted PORT_ACTIVE above.  Server and client are both in this one
    # guest, against the one device -- the loopback backend gives it a
    # path to itself, which rdma_verify and test_data_transfer already
    # exercise as an RC pair.
    - name: Bandwidth and latency sweep (perftest)
      shell: bash
      run: |
        echo "=== perftest sweep on $RDMA_DEVICE ==="
        SSH_PORT="$SSH_PORT"
        VM_USER="$VM_USER"

        ssh $SSH_OPTS -p "$SSH_PORT" "${VM_USER}@localhost" \
          "RDMA_DEVICE='$RDMA_DEVICE' bash -s" <<'EOFVM'
        set -euo pipefail
        DEV="$RDMA_DEVICE"

        # perftest is expected to come from the guest image; no
        # role installs it.  Assert rather than apt-install on the fly:
        # installing here would paper over a gap in the image, which is
        # the same silent-degradation this step exists to remove.
        for T in ib_send_bw ib_write_bw ib_read_bw \
                 ib_send_lat ib_write_lat ib_read_lat; do
          command -v "$T" >/dev/null || {
            echo "✗ $T not found in the guest"
            echo "perftest is expected in the guest image; got:"
            dpkg -l | grep -i perftest || echo "  (no perftest package)"
            exit 1
          }
        done

        # Print the GID table once.  "Failed to modify QP to RTR" says
        # nothing about which entry the -x index selected, and an index
        # with no GID behind it fails exactly the same way as a bad
        # attribute.
        # Index 0, not the 1 this step inherited from
        # sanity-tests.yml.  tests/test_data_transfer.c drives this
        # same device to RTR and back with sgid_index 0, and passes in
        # the step above; nothing here has ever shown index 1 to be
        # populated.
        GIDX=0

        echo "--- GID table for $DEV ---"
        for G in /sys/class/infiniband/"$DEV"/ports/1/gids/*; do
          [ -e "$G" ] || continue
          echo "  $(basename "$G"): $(cat "$G")"
        done

        # A fresh port per run: perftest's out-of-band listener would
        # otherwise hit a TIME_WAIT socket from the previous size and
        # fail in a way that looks like a device problem.
        PORT=18515
        next_port() { PORT=$((PORT + 1)); echo "$PORT"; }

        # $1 tool, $2 size, $3 iters, $4 column of the summary line,
        # $5.. extra args.  Prints the field, or nothing if the pair
        # did not complete -- the caller decides what an empty field
        # means.
        run_pair() {
          local tool=$1 sz=$2 iters=$3 col=$4; shift 4
          local p out
          p=$(next_port)

          timeout 90 "$tool" -d "$DEV" -x "$GIDX" -s "$sz" -n "$iters" \
            -p "$p" "$@" >/tmp/perf-server.log 2>&1 &
          local srv=$!
          sleep 1

          out=$(timeout 90 "$tool" -d "$DEV" -x "$GIDX" -s "$sz" -n "$iters" \
            -p "$p" "$@" 127.0.0.1 2>&1) || {
            local rc=$?
            # Dump both sides whole.  A tail is the wrong end here:
            # stdout is block-buffered into a capture while stderr is
            # not, so perftest's failure message lands *above* the test
            # header it was printed after, and a tail shows the header.
            echo "  $tool -s $sz failed (rc=$rc); client output:" >&2
            echo "$out" >&2
            echo "  server output:" >&2
            cat /tmp/perf-server.log >&2
            wait "$srv" 2>/dev/null || true
            return 1
          }
          wait "$srv" 2>/dev/null || true

          # The summary line is the last one carrying a leading byte
          # count; perftest prints a trailing blank line and, on some
          # builds, a warning after it.
          echo "$out" | awk -v c="$col" \
            '/^[[:space:]]*[0-9]+[[:space:]]/ { v=$c } END { print v }'
        }

        BW_SIZES="4096 8192 16384 32768 65536 131072"
        BW_SIZES="$BW_SIZES 262144 524288 1048576 2097152"
        echo "size,send_bw,write_bw,read_bw" > /tmp/bw.csv
        for sz in $BW_SIZES; do
          sbw=$(run_pair ib_send_bw  "$sz" 100 4 --report_gbits)
          wbw=$(run_pair ib_write_bw "$sz" 100 4 --report_gbits)
          rbw=$(run_pair ib_read_bw  "$sz" 100 4 --report_gbits)
          echo "$sz,$sbw,$wbw,$rbw" >> /tmp/bw.csv
        done
        cat /tmp/bw.csv

        LAT_SIZES="4096 8192 16384 32768 65536 131072"
        LAT_SIZES="$LAT_SIZES 262144 524288 1048576"
        echo "size,send_lat,write_lat,read_lat" > /tmp/lat.csv
        for sz in $LAT_SIZES; do
          slat=$(run_pair ib_send_lat  "$sz" 50 5)
          wlat=$(run_pair ib_write_lat "$sz" 50 5)
          rlat=$(run_pair ib_read_lat  "$sz" 50 5)
          echo "$sz,$slat,$wlat,$rlat" >> /tmp/lat.csv
        done
        cat /tmp/lat.csv
        EOFVM

        scp $SSH_OPTS -P "$SSH_PORT" \
          "${VM_USER}@localhost:/tmp/bw.csv" \
          "${VM_USER}@localhost:/tmp/lat.csv" .

        echo ""
        echo "=== Bandwidth regression check ==="
        MIN_BW_64K=0.5
        bw_64k=$(grep '^65536,' bw.csv | cut -d, -f2)

        # An empty sample is a failure, not a pass.  The old check read
        # `if [ -n "$bw_64k" ]`, which made "measured nothing" and
        # "measured fine" indistinguishable.
        if [ -z "$bw_64k" ]; then
          echo "✗ no 64K send bandwidth sample in bw.csv"
          exit 1
        fi

        echo "Send BW at 64K: ${bw_64k} Gb/s (threshold: ${MIN_BW_64K})"
        # awk rather than bc: the old check only invoked bc inside the
        # branch that never ran, so nothing ever proved bc is in this
        # image.  awk is used throughout this workflow already.
        if ! awk -v v="$bw_64k" -v t="$MIN_BW_64K" \
             'BEGIN { exit !(v >= t) }'; then
          echo "✗ REGRESSION: bandwidth below threshold"
          exit 1
        fi
        echo "✓ Sweep complete, regression checks passed"

    - name: Show logs
      if: always()
      run: |
        echo "=== Server Logs ==="
        ls -lh /tmp/vfu_server*.log || echo "No server logs"
        tail -50 /tmp/vfu_server*.log || true
        echo ""
        echo "=== QEMU Log ==="
        cat /tmp/qemu.log || echo "No QEMU log"
        echo ""
        # Whole file, not a tail: a boot log is under a thousand lines
        # and the network setup it has to explain is near the top.
        echo "=== Guest console (complete) ==="
        cat /tmp/qemu-console.log || echo "No console log"

    - name: Upload test logs
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: loopback-backend-test-logs
        path: |
          /tmp/vfu_server.log
          /tmp/qemu.log
          /tmp/qemu-console.log
          bw.csv
          lat.csv
        retention-days: 7
        if-no-files-found: ignore

    - name: Cleanup
      if: always()
      run: |
        # Stop QEMU
        if [ -n "$QEMU_PID" ]; then
          kill "$QEMU_PID" 2>/dev/null || true
        fi
        
        # Stop server
        if [ -n "$SERVER_PID" ]; then
          kill "$SERVER_PID" 2>/dev/null || true
        fi
        
        # Clean up
        rm -f /tmp/vfio-user-rocm-ernic*.sock
        echo "✓ Cleanup complete"

  system-test-nvmeof:
    # GitHub always prefixes a called workflow's job name with the
    # caller's name -- or, with no name:, the caller's job id, which is
    # how this check used to read "system-test-nvmeof / NVMe-oF Backend
    # System Tests".  The prefix cannot be suppressed, so name the
    # caller the way the sibling lanes are named and let the inner job
    # carry only the configuration, giving "NVMe-oF Backend System
    # Tests / Single Server" alongside "TCP Mesh Backend System Tests
    # (Two VMs)".
    name: NVMe-oF Backend System Tests
    # The lane body lives in its own reusable workflow because it is
    # long enough to be worth reading on its own; see
    # .github/workflows/nvmeof-lane.yml.
    #
    # Write lives on the calling job, not in the reusable workflow, so
    # a pull request run cannot inherit it: the expression below is
    # false on a pull request, and the lane's own publish steps are
    # gated on it a second time.
    permissions:
      contents: write
      # Dispatching docs-deploy after the publish commit: a push made
      # with this job's own GITHUB_TOKEN is exempt from triggering
      # other workflows, so Pages would otherwise never rebuild.
      actions: write
    uses: ./.github/workflows/nvmeof-lane.yml
    with:
      # The same rule the two-VM lane publishes under, so the three
      # badges are fed on identical terms: never from a pull request,
      # and a manual run does whatever the dispatch asked for.
      publish: >-
        ${{ github.event_name != 'pull_request' &&
            (github.event_name != 'workflow_dispatch' || inputs.publish) }}

  system-test-s3:
    # As with the NVMe-oF lane, GitHub prefixes the caller's name onto
    # the called workflow's job name, so this one says S3 and the inner
    # job carries only the configuration: "S3 Backend System Tests /
    # Single Server".
    name: S3 Backend System Tests
    # The lane body lives in its own reusable workflow; see
    # .github/workflows/s3-lane.yml.
    #
    # Write lives on the calling job, not in the reusable workflow, so
    # a pull request run cannot inherit it.
    permissions:
      contents: write
      # Dispatching docs-deploy after the publish commit: a push made
      # with this job's own GITHUB_TOKEN is exempt from triggering
      # other workflows, so Pages would otherwise never rebuild.
      actions: write
    uses: ./.github/workflows/s3-lane.yml
    with:
      # The same rule the other publishing lanes use, so every badge is
      # fed on identical terms: never from a pull request, and a manual
      # run does whatever the dispatch asked for.
      publish: >-
        ${{ github.event_name != 'pull_request' &&
            (github.event_name != 'workflow_dispatch' || inputs.publish) }}

  system-test-two-vms:
    name: TCP Mesh Backend System Tests (Two VMs)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # This job is the RDMA and TCP/IP perf source for the README
    # shields, so on a scheduled run it commits the trend history and
    # dispatches docs-deploy.  Pull request runs neither sweep nor
    # publish; the write scopes are unused there.
    permissions:
      contents: write
      actions: write
    env:
      # Canonical perf CSV directory: ci/report/gen-report.py globs
      # <results>/perf-csv/*.csv, and the two ansible perf plays write
      # their bw-*.csv / lat-*.csv straight into it.
      PERF_RESULTS: /tmp/ernic-ci-results
      PERF_CSV_DIR: /tmp/ernic-ci-results/perf-csv
    container:
      # TODO: move to ghcr.io/rocm/... once the image is published under the ROCm org
      image: sbates130272/batesste-ci-images-ubuntu-qemu-libvfio-user:latest
      # GitHub-hosted Linux runners expose /dev/kvm; pass it through so the
      # guests run accelerated instead of under TCG.
      #
      # /dev/net/tun and NET_ADMIN are what the emulated Ethernet needs.
      # In ionic mode guest frames leave through a host TAP, not over the
      # rocm-ernic TCP mesh -- --backend governs the RDMA data path and
      # --tap the Ethernet, and they are independent.  Neither the device
      # node nor the capability is in a container's default set, and
      # without them ionic_eth_net_send() has no fd, so every frame the
      # guest transmits is dropped however healthy the RDMA mesh is.
      options: --device /dev/kvm --device /dev/net/tun --cap-add=NET_ADMIN

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Select QEMU accelerator and guest size
      shell: bash
      env:
        VMS: 2
      run: |
        if [ -c /dev/kvm ] && qemu-system-x86_64 -accel help 2>/dev/null | grep -qw kvm; then
          echo "✓ /dev/kvm present; using KVM acceleration"
          echo "QEMU_ACCEL=kvm" >> $GITHUB_ENV
          echo "QEMU_CPU=host" >> $GITHUB_ENV
        else
          echo "⚠ /dev/kvm unavailable; falling back to TCG (guests will be slow)"
          echo "QEMU_ACCEL=tcg" >> $GITHUB_ENV
          echo "QEMU_CPU=qemu64" >> $GITHUB_ENV
        fi

        # See the loopback job; VMS is 2 here, so each guest gets half.
        HOST_CPUS=$(nproc)
        HOST_MEM_MB=$(awk '/^MemTotal:/ {print int($2 / 1024)}' /proc/meminfo)

        VM_VCPUS=$(( (HOST_CPUS - 1) / VMS ))
        # Four is a hard floor, not a preference.  ionic_lif_size() sets
        # neqs = min(rdma.eq_qtype.qid_count, num_online_cpus()), and
        # ionic_create_rdma_admin() rejects anything below
        # IONIC_EQ_COUNT_MIN (4) with a silent -EINVAL that surfaces only
        # as "Failed to register ibdev".  A guest with fewer than 4 online
        # CPUs can never bring up ionic_rdma, whatever the device
        # advertises.  Oversubscribing the runner is fine; starving the
        # guest is not.
        [ "$VM_VCPUS" -lt 4 ] && VM_VCPUS=4
        VM_MEM_MB=$(( HOST_MEM_MB * 3 / 4 / VMS ))
        [ "$VM_MEM_MB" -gt 8192 ] && VM_MEM_MB=8192
        [ "$VM_MEM_MB" -lt 1024 ] && VM_MEM_MB=1024

        echo "VM_VCPUS=$VM_VCPUS" >> $GITHUB_ENV
        echo "VM_MEM_MB=$VM_MEM_MB" >> $GITHUB_ENV
        echo "runner: ${HOST_CPUS} vCPU, ${HOST_MEM_MB} MB"
        echo "guests: ${VMS} x ${VM_VCPUS} vCPU, ${VM_MEM_MB} MB"

    - name: Verify environment
      run: |
        echo "=== QEMU Version ==="
        qemu-system-x86_64 --version
        echo ""
        echo "=== Build tools ==="
        cmake --version || echo "CMake not found (will be installed)"
        ninja --version || echo "Ninja not found (will be installed)"
        echo ""
        echo "=== Network ==="
        ip addr show || true

    - name: Install dependencies
      run: |
        # See the loopback job: everything else in the old list is
        # already in the container image.  iproute2 is what puts `ss`
        # on PATH for the listener check below, and `ip` for the TAP
        # setup.  sudo is here because ernic_host_setup's TAP tasks are
        # `become: true` and the image ships no sudo; the job is already
        # uid 0, so this only satisfies the become plugin.
        apt-get update
        apt-get install -y \
          libibverbs-dev \
          librdmacm-dev \
          iproute2 \
          sudo

    - name: Verify libvfio-user from the image
      run: |
        # See the loopback job for why this asserts rather than builds.
        set -e
        ldconfig
        HDR=/usr/local/include/vfio-user/libvfio-user.h
        LIB=$(ls /usr/local/lib/x86_64-linux-gnu/libvfio-user.so* 2>/dev/null | head -1)
        if [ ! -f "$HDR" ] || [ -z "$LIB" ]; then
          echo "✗ libvfio-user missing from the container image"
          ls -la /usr/local/lib/x86_64-linux-gnu/ /usr/local/include/ || true
          exit 1
        fi
        if ! grep -A2 'vfu_setup_device_dma' "$HDR" | grep -q 'max_regions'; then
          echo "✗ libvfio-user in the image predates the"
          echo "  vfu_setup_device_dma() max_regions parameter (#835)."
          exit 1
        fi
        echo "✓ libvfio-user present: $LIB"

    - name: Build project
      run: |
        cmake -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=Debug \
          -DCMAKE_INSTALL_PREFIX=/usr \
          -DERNIC_WERROR=ON
        cmake --build build

    - name: Verify binaries
      run: |
        ls -lh build/rocm-ernic
        file build/rocm-ernic

    - name: Fetch the guest VM image
      id: guest_image
      uses: ./.github/actions/fetch-guest-vm
      with:
        tag: ${{ env.GUEST_ARTIFACT_TAG }}

    - name: Read VM info
      id: vm_info
      shell: bash
      run: |
        OUT="${{ steps.guest_image.outputs.output_dir }}"
        echo "=== Reading VM info from $OUT/vm-info.json ==="
        if [ ! -f "$OUT/vm-info.json" ]; then
          echo "✗ vm-info.json not found in $OUT"
          ls -la "$OUT"
          exit 1
        fi

        cat "$OUT/vm-info.json"

        # Paths in vm-info.json are absolute from the machine that built
        # the image, so resolve each against $OUT by basename.
        eval "$(python3 - "$OUT" <<'PYEOF'
        import json, os, shlex, sys
        out = sys.argv[1]
        d = json.load(open(os.path.join(out, "vm-info.json")))
        here = lambda p: os.path.join(out, os.path.basename(p)) if p else ""
        keys = {
            "VM_USER": d.get("username", "ci"),
            "VM_DISK": here(d.get("image_path", "")),
            "SSH_KEY": d.get("ssh_key", ""),
            "SSH_KEY_PRIVATE": here(d.get("ssh_keys", {}).get("private_key_path", "")),
            "SSH_KEY_PUBLIC": here(d.get("ssh_keys", {}).get("public_key_path", "")),
            # Only the payload image sets these.  kernel_ref is nested
            # under provisioning in schema v2; reading it from the top
            # level is why this reported "ionic ref unknown".
            "KERNEL_RELEASE": d.get("kernel_release", ""),
            "KERNEL_REF": d.get("provisioning", {}).get("kernel_ref", ""),
            "FLAVOUR": d.get("flavour", ""),
        }
        for k, v in keys.items():
            print(f"{k}={shlex.quote(str(v))}")
        PYEOF
        )"

        if [ -z "$VM_DISK" ]; then
          echo "✗ image_path not found in vm-info.json"
          exit 1
        fi

        if [ ! -f "$VM_DISK" ]; then
          echo "✗ VM disk image not found: $VM_DISK"
          ls -la "$OUT"
          exit 1
        fi

        # Verify disk image is accessible and check for missing backing file
        # Error out immediately if disk has a backing file reference that doesn't exist
        QEMU_IMG_OUTPUT=$(qemu-img info "$VM_DISK" 2>&1)
        QEMU_IMG_EXIT=$?
        if [ $QEMU_IMG_EXIT -ne 0 ]; then
          if echo "$QEMU_IMG_OUTPUT" | grep -q "Could not open backing file"; then
            echo "✗ Disk image has backing file reference but backing file does not exist"
            echo "The disk image metadata references a backing file that is missing."
            echo ""
            echo "Disk path: $VM_DISK"
            echo "qemu-img info output:"
            echo "$QEMU_IMG_OUTPUT"
            exit 1
          else
            echo "✗ Failed to read disk image info"
            echo "Disk path: $VM_DISK"
            echo "$QEMU_IMG_OUTPUT"
            exit 1
          fi
        fi

        echo "✓ VM username: $VM_USER"
        echo "✓ VM disk: $VM_DISK"
        echo "✓ SSH key: ${SSH_KEY:-not specified}"
        echo "✓ Guest flavour: ${FLAVOUR:-unknown}"
        echo "✓ Guest kernel: ${KERNEL_RELEASE:-unknown} (ionic ref ${KERNEL_REF:-unknown})"
        qemu-img info "$VM_DISK" || true

        echo "vm_user=$VM_USER" >> $GITHUB_OUTPUT
        echo "vm_disk=$VM_DISK" >> $GITHUB_OUTPUT
        echo "ssh_key=$SSH_KEY" >> $GITHUB_OUTPUT
        echo "ssh_key_private=$SSH_KEY_PRIVATE" >> $GITHUB_OUTPUT
        echo "ssh_key_public=$SSH_KEY_PUBLIC" >> $GITHUB_OUTPUT
        echo "kernel_release=$KERNEL_RELEASE" >> $GITHUB_OUTPUT
    - name: Create the per-VM disk overlays
      id: copy_vm_disk
      shell: bash
      run: |
        set -euo pipefail
        echo "=== Creating per-VM overlays ==="
        # Overlays, not copies.  The fetched qcow2 is 5.75 GB, and both
        # guests boot the same backing image and diverge only in what they
        # write, so cp spent a minute and 5.75 GB to reproduce something
        # qemu-img create does instantly.
        #
        # Both VMs get one, including the first: with VM 1 writing to the
        # base directly, VM 2's backing file would mutate underneath it.
        BASE="${{ steps.vm_info.outputs.vm_disk }}"
        STEM="$(dirname "$BASE")/$(basename "$BASE" .qcow2)"
        VM_DISK_1="${STEM}.1.qcow2"
        VM_DISK_2="${STEM}.2.qcow2"

        for DISK in "$VM_DISK_1" "$VM_DISK_2"; do
          rm -f "$DISK"
          qemu-img create -f qcow2 -F qcow2 -b "$BASE" "$DISK"
          qemu-img info "$DISK"
        done

        echo "vm_disk_1=$VM_DISK_1" >> $GITHUB_OUTPUT
        echo "vm_disk_2=$VM_DISK_2" >> $GITHUB_OUTPUT
        echo "✓ overlays created over $BASE"
    
    - name: Setup SSH keys
      shell: bash
      run: |
        echo "=== Setting up SSH keys ==="
        SSH_KEY_PRIVATE="${{ steps.vm_info.outputs.ssh_key_private }}"
        SSH_KEY_PUBLIC="${{ steps.vm_info.outputs.ssh_key_public }}"
        SSH_KEY="${{ steps.vm_info.outputs.ssh_key }}"
        
        mkdir -p ~/.ssh
        chmod 700 ~/.ssh
        
        # Require SSH key file paths from vm-info.json
        if [ -z "$SSH_KEY_PRIVATE" ] || [ -z "$SSH_KEY_PUBLIC" ]; then
          echo "✗ SSH key paths (ssh_key_private and ssh_key_public) are required in vm-info.json"
          echo "Found ssh_key_private: $([ -n "$SSH_KEY_PRIVATE" ] && echo "$SSH_KEY_PRIVATE" || echo 'not set')"
          echo "Found ssh_key_public: $([ -n "$SSH_KEY_PUBLIC" ] && echo "$SSH_KEY_PUBLIC" || echo 'not set')"
          exit 1
        fi
        
        # Check if key files exist at the specified paths
        if [ ! -f "$SSH_KEY_PRIVATE" ]; then
          echo "✗ SSH private key file not found: $SSH_KEY_PRIVATE"
        exit 1
        fi
        
        if [ ! -f "$SSH_KEY_PUBLIC" ]; then
          echo "✗ SSH public key file not found: $SSH_KEY_PUBLIC"
          exit 1
        fi
        
        echo "✓ Using SSH keys from vm-info.json"
        echo "  Private key: $SSH_KEY_PRIVATE"
        echo "  Public key: $SSH_KEY_PUBLIC"
        ssh-keyscan -p 2222 localhost >> ~/.ssh/known_hosts 2>/dev/null || true
        ssh-keyscan -p 2223 localhost >> ~/.ssh/known_hosts 2>/dev/null || true

        # See the loopback job: ~ is $HOME (/github/home in a container
        # job) but OpenSSH builds its defaults from getpwuid(), so the key
        # is used where it lies rather than copied somewhere ssh will
        # never look for it.
        SSH_OPTS="-i $SSH_KEY_PRIVATE -o IdentitiesOnly=yes"
        SSH_OPTS="$SSH_OPTS -o BatchMode=yes -o StrictHostKeyChecking=no"
        SSH_OPTS="$SSH_OPTS -o UserKnownHostsFile=$HOME/.ssh/known_hosts"
        echo "SSH_OPTS=$SSH_OPTS" >> $GITHUB_ENV
        echo "SSH_KEY_PRIVATE=$SSH_KEY_PRIVATE" >> $GITHUB_ENV
        echo "✓ SSH_OPTS=$SSH_OPTS"

        # The sanity play builds bare `ssh -p <port> user@localhost`
        # command lines with no -i, so it can only work if the key is
        # where OpenSSH looks by default.  That is getpwuid()'s home --
        # /root here -- not $HOME, which the container job sets to
        # /github/home.  Install it in both so the play and the direct
        # probes below agree.
        PW_HOME=$(getent passwd "$(id -u)" | cut -d: -f6)
        for d in "$PW_HOME" "$HOME"; do
          [ -n "$d" ] || continue
          mkdir -p "$d/.ssh"
          chmod 700 "$d/.ssh"
          install -m 600 "$SSH_KEY_PRIVATE" "$d/.ssh/id_rsa"
        done
        echo "✓ key installed for default-path ssh in $PW_HOME and $HOME"

    - name: Install the Ansible collection dependencies
      shell: bash
      run: |
        echo "=== Installing the Ansible collection dependencies ==="
        # Both VMs are provisioned by the sbates130272.rocm_ernic
        # collection in this repo, so these jobs exercise the same role
        # the self-hosted CI and developers use.
        #
        # The container's ansible-core comes from pipx and searches
        # ~/.ansible/collections, not the dist-packages tree the
        # "ansible" apt bundle installs into, so installing that
        # bundle leaves community.general invisible.
        #
        # community.general by name rather than -r requirements.yml:
        # since 0.2.0 that file resolves to this one collection
        # anyway, so the two are equivalent and this needs no
        # checkout.  Through 0.1.0 it was six collections and ~29M --
        # sbates130272.batesste dragged in amazon.aws and
        # community.libvirt for ernic_image_prep, which no longer
        # exists -- and six galaxy round trips was six chances to hit
        # the 500 that has already reddened runs.
        #
        # This runs here rather than after the VMs boot because the TAP
        # step below is an Ansible play and has to precede the servers.
        ansible --version
        ansible-galaxy collection install community.general

    - name: Create the host bridge and per-instance TAPs
      shell: bash
      run: |
        echo "=== Creating ernicbr0 and the per-instance TAPs ==="
        # ernic_host_setup owns this on the self-hosted path; run the
        # same role rather than open-coding `ip tuntap` here, which is
        # the drift this branch exists to remove.  Everything else the
        # role does -- build, systemd unit, GPU binding -- is off: the
        # job builds from the checkout and launches the servers itself.
        #
        # Order matters and the role says so: the launcher only attaches
        # an instance to its TAP if the interface already exists, and
        # rocm-ernic treats a missing --tap as a startup failure.
        export ANSIBLE_ROLES_PATH="$PWD/ansible/roles"
        PROJECT_ROOT="$PWD"

        cd ansible
        ansible-playbook playbooks/host-setup.yml \
          -e ernic_project_root="$PROJECT_ROOT" \
          -e ernic_build=false \
          -e ernic_install_service=false \
          -e ernic_gpu_passthrough=false \
          -e ernic_instances=2 \
          -e ernic_tap_owner=root \
          -e ernic_tap_bridge="${ERNIC_TAP_BRIDGE}" \
          -e ernic_tap_prefix="${ERNIC_TAP_PREFIX}"

        ip -o link show "${ERNIC_TAP_BRIDGE}"
        for n in 1 2; do
          ip -o link show "${ERNIC_TAP_PREFIX}${n}"
        done

    - name: Start TCP server 1 (manager)
      shell: bash
      run: |
        echo "=== Starting TCP server 1 (manager) ==="
        # Remove any existing socket
        rm -f /tmp/vfio-user-server1.sock

        # --backend is the RDMA data path; --tap is the Ethernet one.
        # Both are needed here: the sanity suite pings and runs iperf3
        # between the guests before it touches RDMA.
        #
        # --mac is not optional once two instances share a bridge.  The
        # emulator's built-in address is a constant, so without it both
        # guests come up on 02:a0:d1:00:00:01 and ARP can never resolve
        # -- the ping fails with Destination Host Unreachable however
        # healthy the TAPs are.  rocm-ernic-launcher passes a distinct
        # MAC per instance for the same reason; this is that, spelled
        # out, because the job does not go through the launcher.
        ./build/rocm-ernic \
          --socket /tmp/vfio-user-server1.sock \
          --backend tcp:manager:listen:${{ env.TCP_PORT }} \
          --tap "${ERNIC_TAP_PREFIX}1" \
          --mac 02:a0:d1:00:00:01 \
          --verbose > /tmp/server1.log 2>&1 &
        
        SERVER1_PID=$!
        echo "SERVER1_PID=$SERVER1_PID" >> $GITHUB_ENV
        echo "Server 1 PID: $SERVER1_PID"
        
        # Wait for socket and verify server is running
        for i in {1..30}; do
          # Check if server process is still running
          if ! kill -0 "$SERVER1_PID" 2>/dev/null; then
            echo "✗ Server 1 process died (PID: $SERVER1_PID)"
            echo "Exit code: $(wait $SERVER1_PID 2>&1 || echo $?)"
            echo "=== Server 1 log ==="
            cat /tmp/server1.log
            exit 1
          fi
          
          # Check if socket exists and is a socket file
          if [ -S /tmp/vfio-user-server1.sock ]; then
            chmod 666 /tmp/vfio-user-server1.sock 2>/dev/null || true
            echo "✓ Server 1 started (PID: $SERVER1_PID)"
            echo "✓ Socket created: /tmp/vfio-user-server1.sock"
            ls -la /tmp/vfio-user-server1.sock
            exit 0
          fi
          
          # Show progress every 5 seconds
          if [ $((i % 5)) -eq 0 ]; then
            echo "Waiting for socket... (attempt $i/30)"
            echo "Server 1 PID $SERVER1_PID status: $(kill -0 $SERVER1_PID 2>/dev/null && echo 'running' || echo 'dead')"
            echo "Socket exists: $([ -e /tmp/vfio-user-server1.sock ] && echo 'yes' || echo 'no')"
            if [ -e /tmp/vfio-user-server1.sock ]; then
              ls -la /tmp/vfio-user-server1.sock
            fi
          fi
          sleep 1
        done
        
        echo "✗ Server 1 failed to create socket after 30 seconds"
        echo "Server 1 PID $SERVER1_PID status: $(kill -0 $SERVER1_PID 2>/dev/null && echo 'running' || echo 'dead')"
        echo "Socket exists: $([ -e /tmp/vfio-user-server1.sock ] && echo 'yes' || echo 'no')"
        if [ -e /tmp/vfio-user-server1.sock ]; then
          echo "Socket type:"
          ls -la /tmp/vfio-user-server1.sock
          file /tmp/vfio-user-server1.sock
        fi
        echo "=== Server 1 log ==="
        cat /tmp/server1.log
        exit 1
    
    - name: Wait for TCP server 1 to be ready
      shell: bash
      run: |
        echo "Waiting for TCP server 1 to listen on ${{ env.TCP_PORT }}..."
        PORT=${{ env.TCP_PORT }}

        # bash's /dev/tcp is the probe, not the last resort.  It needs
        # no package (the image ships neither ss, netstat nor nc -- ss
        # only arrives with the iproute2 install above), and unlike a
        # listener-table grep it proves the socket actually accepts a
        # connection.  /proc/net/tcp is kept as a corroborating read
        # for the log when the connect fails.
        #
        # This used to end in "Assuming server is ready", so on an
        # image without those tools the step passed without checking
        # anything and the failure surfaced much later as a VM that
        # could not reach its peer.
        for i in $(seq 1 30); do
          if ! kill -0 "$SERVER1_PID" 2>/dev/null; then
            echo "✗ Server 1 died while waiting for it to listen"
            cat /tmp/server1.log
            exit 1
          fi
          if timeout 1 bash -c "echo > /dev/tcp/localhost/$PORT" 2>/dev/null; then
            echo "✓ Server 1 is accepting connections on port $PORT (attempt $i/30)"
            exit 0
          fi
          sleep 1
        done

        echo "✗ Server 1 is not accepting connections on port $PORT after 30s"
        echo "=== listening sockets ==="
        ss -tlnp 2>/dev/null || awk 'NR>1 {print $2}' /proc/net/tcp
        echo "=== Server 1 log ==="
        cat /tmp/server1.log
        exit 1

    - name: Start TCP server 2 (worker)
      shell: bash
      run: |
        echo "=== Starting TCP server 2 (worker) ==="
        # Since both servers run in the same container, use localhost
        # Manager is listening on 0.0.0.0, so localhost will work
        MANAGER_HOST="localhost"
        echo "Connecting to manager at: $MANAGER_HOST:${{ env.TCP_PORT }}"
        
        # Remove any existing socket
        rm -f /tmp/vfio-user-server2.sock

        # See server 1: the second TAP on the same bridge is what gives
        # this guest a peer at layer 2, and the MAC is what lets the two
        # guests tell each other apart on it.
        ./build/rocm-ernic \
          --socket /tmp/vfio-user-server2.sock \
          --backend tcp:worker:$MANAGER_HOST:${{ env.TCP_PORT }} \
          --tap "${ERNIC_TAP_PREFIX}2" \
          --mac 02:a0:d1:00:00:02 \
          --verbose > /tmp/server2.log 2>&1 &
        
        SERVER2_PID=$!
        echo "SERVER2_PID=$SERVER2_PID" >> $GITHUB_ENV
        echo "Server 2 PID: $SERVER2_PID"
        
        # Wait for socket and verify server is running
        for i in {1..30}; do
          # Check if server process is still running
          if ! kill -0 "$SERVER2_PID" 2>/dev/null; then
            echo "✗ Server 2 process died (PID: $SERVER2_PID)"
            echo "Exit code: $(wait $SERVER2_PID 2>&1 || echo $?)"
            echo "=== Server 2 log ==="
            cat /tmp/server2.log
          exit 1
        fi
        
          # Check if socket exists and is a socket file
          if [ -S /tmp/vfio-user-server2.sock ]; then
            chmod 666 /tmp/vfio-user-server2.sock 2>/dev/null || true
            echo "✓ Server 2 started (PID: $SERVER2_PID)"
            echo "✓ Socket created: /tmp/vfio-user-server2.sock"
            ls -la /tmp/vfio-user-server2.sock
            exit 0
          fi
          
          # Show progress every 5 seconds
          if [ $((i % 5)) -eq 0 ]; then
            echo "Waiting for socket... (attempt $i/30)"
            echo "Server 2 PID $SERVER2_PID status: $(kill -0 $SERVER2_PID 2>/dev/null && echo 'running' || echo 'dead')"
            echo "Socket exists: $([ -e /tmp/vfio-user-server2.sock ] && echo 'yes' || echo 'no')"
            if [ -e /tmp/vfio-user-server2.sock ]; then
              ls -la /tmp/vfio-user-server2.sock
            fi
          fi
          sleep 1
        done
        
        echo "✗ Server 2 failed to create socket after 30 seconds"
        echo "Server 2 PID $SERVER2_PID status: $(kill -0 $SERVER2_PID 2>/dev/null && echo 'running' || echo 'dead')"
        echo "Socket exists: $([ -e /tmp/vfio-user-server2.sock ] && echo 'yes' || echo 'no')"
        if [ -e /tmp/vfio-user-server2.sock ]; then
          echo "Socket type:"
          ls -la /tmp/vfio-user-server2.sock
          file /tmp/vfio-user-server2.sock
        fi
        echo "=== Server 2 log ==="
        cat /tmp/server2.log
        exit 1

    - name: Verify TCP connection
      run: |
        echo "=== Verifying TCP connection ==="
        sleep 3

        # Check server logs for connection messages
        echo "=== Server 1 log (last 30 lines) ==="
        tail -30 /tmp/server1.log || true

        echo "=== Server 2 log (last 30 lines) ==="
        tail -30 /tmp/server2.log || true

        # Verify both servers are still running
        if ! ps -p $SERVER1_PID > /dev/null; then
          echo "✗ Server 1 (manager) has stopped"
          exit 1
        fi
        if ! ps -p $SERVER2_PID > /dev/null; then
          echo "✗ Server 2 (worker) has stopped"
          exit 1
        fi
        echo "✓ Both servers are running"

        # Check for worker connection to manager
        WORKER_CONNECTED=0
        PORT=${{ env.TCP_PORT }}
        if grep -q "TCP: Connected to.*:$PORT" /tmp/server2.log; then
          WORKER_CONNECTED=1
          echo "✓ Worker connected to manager on port $PORT"
        else
          echo "✗ Worker did not connect to manager on port $PORT"
        fi

        # Check for worker registration with manager
        WORKER_REGISTERED=0
        if grep -q "TCP: Registered with manager" /tmp/server2.log; then
          WORKER_REGISTERED=1
          echo "✓ Worker registered with manager"
        else
          echo "✗ Worker did not register with manager"
        fi

        # Check for mesh topology received by worker
        MESH_RECEIVED=0
        if grep -q "TCP: Received mesh topology" /tmp/server2.log; then
          MESH_RECEIVED=1
          echo "✓ Worker received mesh topology"
        else
          echo "✗ Worker did not receive mesh topology"
        fi

        # Check for manager accepting worker registration
        MANAGER_REGISTERED=0
        if grep -q "TCP: Registered node.*at" /tmp/server1.log; then
          MANAGER_REGISTERED=1
          echo "✓ Manager registered worker node"
        else
          echo "✗ Manager did not register worker node"
        fi

        # Check for manager broadcasting topology
        MANAGER_BROADCAST=0
        if grep -q "TCP: Broadcast mesh topology" /tmp/server1.log; then
          MANAGER_BROADCAST=1
          echo "✓ Manager broadcast mesh topology"
        else
          echo "✗ Manager did not broadcast mesh topology"
        fi

        # Fail if any critical step failed
        if [ $WORKER_CONNECTED -eq 0 ] || [ $WORKER_REGISTERED -eq 0 ] || \
           [ $MESH_RECEIVED -eq 0 ] || [ $MANAGER_REGISTERED -eq 0 ] || \
           [ $MANAGER_BROADCAST -eq 0 ]; then
          echo ""
          echo "✗ TCP connection verification FAILED"
          echo "Connection establishment incomplete. Check logs above for details."
          exit 1
        fi

        echo ""
        echo "✓ TCP connection fully established and verified"

    - name: Verify server sockets are ready for VMs
      shell: bash
      run: |
        echo "=== Verifying server sockets are ready ==="
        
        # Verify both servers are still running
        if ! ps -p $SERVER1_PID > /dev/null; then
          echo "✗ Server 1 (manager) has stopped"
          echo "Server 1 log:"
          tail -50 /tmp/server1.log || true
          exit 1
        fi
        if ! ps -p $SERVER2_PID > /dev/null; then
          echo "✗ Server 2 (worker) has stopped"
          echo "Server 2 log:"
          tail -50 /tmp/server2.log || true
          exit 1
        fi
        echo "✓ Both servers are running"
        
        # Wait for server 1 to be ready (device realized)
        echo "Waiting for server 1 to be ready..."
        SERVER1_READY=0
        for i in $(seq 1 30); do
          if grep -q "Socket permissions set\|Device realized, waiting for client connection" /tmp/server1.log; then
            echo "✓ Server 1 ready"
            SERVER1_READY=1
            break
          fi
          sleep 1
        done
        if [ $SERVER1_READY -eq 0 ]; then
          echo "✗ Server 1 not ready after 30 seconds"
          echo "Server 1 log (last 30 lines):"
          tail -30 /tmp/server1.log
          exit 1
        fi
        
        # Wait for server 2 to be ready (device realized)
        echo "Waiting for server 2 to be ready..."
        SERVER2_READY=0
        for i in $(seq 1 30); do
          if grep -q "Socket permissions set\|Device realized, waiting for client connection" /tmp/server2.log; then
            echo "✓ Server 2 ready"
            SERVER2_READY=1
            break
          fi
          sleep 1
        done
        if [ $SERVER2_READY -eq 0 ]; then
          echo "✗ Server 2 not ready after 30 seconds"
          echo "Server 2 log (last 30 lines):"
          tail -30 /tmp/server2.log
          exit 1
        fi
        
        # Verify sockets exist
        if [ ! -S /tmp/vfio-user-server1.sock ]; then
          echo "✗ Server 1 socket not found"
          exit 1
        fi
        if [ ! -S /tmp/vfio-user-server2.sock ]; then
          echo "✗ Server 2 socket not found"
          exit 1
        fi
        
        echo "✓ All server sockets verified and ready for VM connections"

    - name: Start VM 1
      shell: bash
      run: |
        echo "=== Starting VM 1 ==="
        VM_DISK_1="${{ steps.copy_vm_disk.outputs.vm_disk_1 }}"
        SSH_PORT_1=2222
        
        qemu-system-x86_64 \
          -machine q35,accel=${QEMU_ACCEL},memory-backend=mem1 \
          -cpu ${QEMU_CPU} \
          -smp ${VM_VCPUS} \
          -m ${VM_MEM_MB}M \
          -object memory-backend-memfd,id=mem1,share=on,size=${VM_MEM_MB}M \
          -nographic \
          -drive file="$VM_DISK_1",format=qcow2,if=virtio \
          -netdev user,id=net0,hostfwd=tcp::$SSH_PORT_1-:22 \
          -device virtio-net-pci,netdev=net0 \
          -device '{"driver":"vfio-user-pci","socket":{"type":"unix","path":"/tmp/vfio-user-server1.sock"}}' \
          -serial file:/tmp/qemu-vm1-console.log \
          -monitor none \
          -qmp unix:/tmp/qmp-vm1.sock,server=on,wait=off > /tmp/qemu-vm1.log 2>&1 &

        QEMU_VM1_PID=$!
        echo "QEMU_VM1_PID=$QEMU_VM1_PID" >> $GITHUB_ENV
        echo "✓ VM 1 started (PID: $QEMU_VM1_PID)"
        
        # Early failure detection: check if QEMU dies within 5 seconds
        echo "Monitoring VM 1 for early failures..."
        sleep 5
        if ! kill -0 "$QEMU_VM1_PID" 2>/dev/null; then
          echo "✗ VM 1 QEMU process died within 5 seconds (PID: $QEMU_VM1_PID)"
          echo "=== VM 1 QEMU log ==="
          cat /tmp/qemu-vm1.log || echo "Log file not found"
          echo ""
          echo "=== VM 1 guest console ==="
          cat /tmp/qemu-vm1-console.log || echo "Console log not found"
          echo ""
          echo "=== VM 1 QEMU exit code ==="
          wait "$QEMU_VM1_PID" 2>&1 || echo "Exit code: $?"
          exit 1
        fi
        echo "✓ VM 1 still running after 5 seconds"

    - name: Start VM 2
      shell: bash
      run: |
        echo "=== Starting VM 2 ==="
        VM_DISK_2="${{ steps.copy_vm_disk.outputs.vm_disk_2 }}"
        SSH_PORT_2=2223
        
        qemu-system-x86_64 \
          -machine q35,accel=${QEMU_ACCEL},memory-backend=mem2 \
          -cpu ${QEMU_CPU} \
          -smp ${VM_VCPUS} \
          -m ${VM_MEM_MB}M \
          -object memory-backend-memfd,id=mem2,share=on,size=${VM_MEM_MB}M \
          -nographic \
          -drive file="$VM_DISK_2",format=qcow2,if=virtio \
          -netdev user,id=net0,hostfwd=tcp::$SSH_PORT_2-:22 \
          -device virtio-net-pci,netdev=net0 \
          -device '{"driver":"vfio-user-pci","socket":{"type":"unix","path":"/tmp/vfio-user-server2.sock"}}' \
          -serial file:/tmp/qemu-vm2-console.log \
          -monitor none \
          -qmp unix:/tmp/qmp-vm2.sock,server=on,wait=off > /tmp/qemu-vm2.log 2>&1 &

        QEMU_VM2_PID=$!
        echo "QEMU_VM2_PID=$QEMU_VM2_PID" >> $GITHUB_ENV
        echo "✓ VM 2 started (PID: $QEMU_VM2_PID)"
        
        # Early failure detection: check if QEMU dies within 5 seconds
        echo "Monitoring VM 2 for early failures..."
        sleep 5
        if ! kill -0 "$QEMU_VM2_PID" 2>/dev/null; then
          echo "✗ VM 2 QEMU process died within 5 seconds (PID: $QEMU_VM2_PID)"
          echo "=== VM 2 QEMU log ==="
          cat /tmp/qemu-vm2.log || echo "Log file not found"
          echo ""
          echo "=== VM 2 guest console ==="
          cat /tmp/qemu-vm2-console.log || echo "Console log not found"
          echo ""
          echo "=== VM 2 QEMU exit code ==="
          wait "$QEMU_VM2_PID" 2>&1 || echo "Exit code: $?"
          exit 1
        fi
        echo "✓ VM 2 still running after 5 seconds"

    - name: Wait for VMs to boot
      shell: bash
      run: |
        echo "=== Waiting for VMs to boot ==="
        VM_USER="${{ steps.vm_info.outputs.vm_user }}"

        # Keep ssh's stderr rather than discarding it: "Connection
        # refused" and "Connection timed out" are different faults, and
        # the old 2>/dev/null hid which one this was for five runs.
        wait_for_vm() {
          local label="$1" port="$2" pid="$3" console="$4" qemu_log="$5" qmp="$6"
          local i

          for i in {1..60}; do
            if ssh $SSH_OPTS -o ConnectTimeout=5 \
                 -p "$port" "${VM_USER}@localhost" "echo ${label} Ready" \
                 2>/tmp/ssh-attempt.err; then
              echo "✓ ${label} is accessible via SSH"
              return 0
            fi
            echo "${label} attempt $i/60: $(tr '\n' ' ' < /tmp/ssh-attempt.err | cut -c1-160)"
            sleep 10
          done

          echo "✗ ${label} boot timeout"
          echo ""
          echo "=== ${label}: final attempt, verbose ==="
          ssh -vvv $SSH_OPTS -o ConnectTimeout=5 \
            -p "$port" "${VM_USER}@localhost" true 2>&1 | tail -40 || true

          "${GITHUB_WORKSPACE}/scripts/qemu-vm-diagnose.sh" \
            --label "$label" --ssh-port "$port" --qmp "$qmp" \
            --console "$console" --qemu-log "$qemu_log" --pid "$pid"
          return 1
        }

        wait_for_vm "VM1" 2222 "$QEMU_VM1_PID" \
          /tmp/qemu-vm1-console.log /tmp/qemu-vm1.log /tmp/qmp-vm1.sock

        wait_for_vm "VM2" 2223 "$QEMU_VM2_PID" \
          /tmp/qemu-vm2-console.log /tmp/qemu-vm2.log /tmp/qmp-vm2.sock

    - name: Install kernel headers and build tools in VMs (parallel)
      shell: bash
      run: |
        echo "=== Installing kernel headers and build tools in both VMs ==="
        VM_USER="${{ steps.vm_info.outputs.vm_user }}"

        # The ionic flavour of the guest image bakes these in, but
        # these jobs run against a generic prebuilt CI qcow2, so the
        # build toolchain goes in here.  The kernel version itself
        # is the image's business, and ernic_guest_setup asserts it
        # matches the pinned ionic sources.
        #
        # Headers are a check, not an install: a guest on a mainline
        # kernel has them from the .deb, and kernel.ubuntu.com carries
        # no Packages index, so linux-headers-$(uname -r) 404s there.
        cat > /tmp/vm-packages.sh << 'SCRIPT'
        set -e
        KVER=$(uname -r)
        HEADER_PKG=""
        if [ -d "/lib/modules/${KVER}/build" ]; then
          echo "Kernel headers already present for ${KVER}"
        else
          echo "No build tree for ${KVER}; asking apt for the headers"
          HEADER_PKG="linux-headers-${KVER}"
        fi
        APT_LOCK_WAIT="-o DPkg::Lock::Timeout=300"
        for i in 1 2 3; do
          sudo apt-get $APT_LOCK_WAIT update -qq && break || { echo "apt-get update retry $i/3"; sleep 5; }
        done
        for i in 1 2 3 4 5; do
          sudo DEBIAN_FRONTEND=noninteractive apt-get $APT_LOCK_WAIT install -y -qq \
            ${HEADER_PKG} dkms git build-essential cmake ninja-build \
            pkg-config libnl-3-dev libnl-route-3-dev libudev-dev && break
          [ "$i" -eq 5 ] && { echo "apt-get install failed after 5 attempts"; exit 1; }
          echo "apt-get install retry $i/5"; sleep 10
        done
        echo "Kernel packages installed for ${KVER}"
        SCRIPT

        _packages_vm() {
          local PORT="$1"
          scp $SSH_OPTS -P "$PORT" /tmp/vm-packages.sh \
            "${VM_USER}@localhost:/tmp/vm-packages.sh"
          ssh $SSH_OPTS -p "$PORT" "${VM_USER}@localhost" bash /tmp/vm-packages.sh
        }

        _packages_vm 2222 > /tmp/packages-vm1.log 2>&1 &
        PID1=$!
        _packages_vm 2223 > /tmp/packages-vm2.log 2>&1 &
        PID2=$!

        FAILED=0
        wait "$PID1" || { echo "✗ VM 1 package install failed"; cat /tmp/packages-vm1.log; FAILED=1; }
        wait "$PID2" || { echo "✗ VM 2 package install failed"; cat /tmp/packages-vm2.log; FAILED=1; }
        [ $FAILED -eq 0 ] && echo "✓ Kernel packages installed in both VMs"
        exit $FAILED

    - name: Provision the VMs with the Ansible collection
      shell: bash
      run: |
        echo "=== Provisioning both guests via ernic_guest_setup ==="
        VM_USER="${{ steps.vm_info.outputs.vm_user }}"
        ERNIC_RUN_DIR=/tmp/ernic-ci
        mkdir -p "$ERNIC_RUN_DIR"

        # vm-register.yml turns this manifest into the ernic_vms
        # inventory group; on the self-hosted path ernicctl writes it.
        # Ansible then drives both guests in parallel by itself.
        cat > "$ERNIC_RUN_DIR/instances.json" << EOFJSON
        {
          "instances": [
            {
              "id": 1,
              "vm": {
                "vm_name": "gh-tcp-vm1",
                "ssh_port": 2222,
                "ssh_user": "${VM_USER}"
              }
            },
            {
              "id": 2,
              "vm": {
                "vm_name": "gh-tcp-vm2",
                "ssh_port": 2223,
                "ssh_user": "${VM_USER}"
              }
            }
          ]
        }
        EOFJSON

        export ANSIBLE_HOST_KEY_CHECKING=false
        export ANSIBLE_PRIVATE_KEY_FILE="$SSH_KEY_PRIVATE"
        export ANSIBLE_ROLES_PATH="$PWD/ansible/roles"
        PROJECT_ROOT="$PWD"

        cd ansible
        ansible-playbook ci-site.yml --tags guest-setup \
          -e ernic_project_root="$PROJECT_ROOT" \
          -e ernic_run_dir="$ERNIC_RUN_DIR" \
          -e ernic_instances=2 \
          -e ernic_vm_ssh_base_port=2222 \
          -e ernic_vm_ssh_user="$VM_USER" \
          -e ernic_gpu_passthrough=false \
          -e ernic_guest_agent=false \
          -e ernic_set_hostname=false

    - name: Verify RDMA devices in VMs
      shell: bash
      run: |
        echo "=== Verifying RDMA devices ==="
        VM_USER="${{ steps.vm_info.outputs.vm_user }}"

        # Discover the device per guest by PCI vendor ID rather than by
        # name -- see the same lookup in the loopback job, and
        # scripts/find-rdma-device.sh for why the name cannot be relied
        # on.
        #
        # PORT_ACTIVE is checked as well as presence: a device that
        # enumerates but never trains carries no traffic, and the sanity
        # play below would then fail with a far less obvious error.
        _guest_dev() {
          ssh $SSH_OPTS -p "$1" "${VM_USER}@localhost" \
            'sh -s' < scripts/find-rdma-device.sh | tr -d '\r'
        }

        FAILED=0
        for spec in "VM 1:2222" "VM 2:2223"; do
          LABEL="${spec%%:*}"
          PORT="${spec##*:}"

          echo "--- ${LABEL} RDMA device ---"
          DEV=$(_guest_dev "$PORT") || true
          if [ -z "$DEV" ]; then
            echo "✗ ${LABEL}: no RDMA device found"
            ssh $SSH_OPTS -p "$PORT" "${VM_USER}@localhost" \
              'ibv_devices; lsmod | grep ionic; dmesg | grep -i ionic | tail -30' || true
            FAILED=$((FAILED + 1))
            continue
          fi

          if ! ssh $SSH_OPTS -p "$PORT" "${VM_USER}@localhost" \
               "ibv_devinfo -d $DEV" | tee /dev/stderr | grep -q 'PORT_ACTIVE'; then
            echo "✗ ${LABEL}: $DEV never reached PORT_ACTIVE"
            FAILED=$((FAILED + 1))
            continue
          fi
          echo "✓ ${LABEL} RDMA device: $DEV (PORT_ACTIVE)"
        done

        if [ $FAILED -gt 0 ]; then
          echo ""
          echo "✗ RDMA device verification failed"
          exit 1
        fi
        echo ""
        echo "✓ Both VMs have active RDMA devices"

    - name: RDMA sanity suite across the TCP mesh (Ansible)
      shell: bash
      run: |
        echo "=== Running the sanity play across both guests ==="
        VM_USER="${{ steps.vm_info.outputs.vm_user }}"

        # The same play ci/jobs/vm-functional.sh runs on the self-hosted
        # path: ping and a netcat echo over the emulated Ethernet, then
        # ib_send_bw and ibv_rc_pingpong over RDMA -- all of it between
        # VM 1 and VM 2, so every byte crosses the TCP mesh joining the
        # two rocm-ernic servers.  That is the thing this job is named
        # for and previously never exercised.
        export ANSIBLE_HOST_KEY_CHECKING=false
        export ANSIBLE_PRIVATE_KEY_FILE="$SSH_KEY_PRIVATE"
        export ANSIBLE_ROLES_PATH="$PWD/ansible/roles"

        cd ansible
        ansible-playbook ci-site.yml --tags sanity \
          -e ernic_run_dir=/tmp/ernic-ci \
          -e ernic_instances=2 \
          -e ernic_vm_ssh_base_port=2222 \
          -e ernic_vm_ssh_user="$VM_USER"

    - name: RDMA and TCP/IP performance sweeps (Ansible)
      # Not on pull requests: the sweep is minutes of perftest and
      # iperf3 on top of a job that already runs for the best part of
      # an hour, and a pull request's numbers may never be published
      # anyway.  Scheduled and dispatched runs sweep.
      if: github.event_name != 'pull_request'
      shell: bash
      run: |
        set -euo pipefail
        echo "=== perf sweeps across the two guests ==="
        VM_USER="${{ steps.vm_info.outputs.vm_user }}"

        # The same two plays ci/jobs/perf.sh drives on the self-hosted
        # path -- tcp-performance-tests.yml (iperf3, one sustained rate
        # under verb "tcp", size "stream") and performance-tests.yml
        # (perftest, the send/write/read size sweep).  results_dir is
        # what sends their CSVs to perf-csv/ rather than dirtying
        # docs/perf-results in the checkout.
        mkdir -p "$PERF_CSV_DIR"
        export ANSIBLE_HOST_KEY_CHECKING=false
        export ANSIBLE_PRIVATE_KEY_FILE="$SSH_KEY_PRIVATE"
        export ANSIBLE_ROLES_PATH="$PWD/ansible/roles"

        cd ansible
        # ernic_project_root, explicitly, for the same reason
        # ci/jobs/perf.sh passes it: the group_vars default is
        # {{ playbook_dir }}/../.., which resolves against the entry
        # playbook.  With ci-site.yml that is ansible/, so the default
        # lands one directory above the checkout and
        # performance-tests.yml cannot find free-perftest-port.sh or
        # find-rdma-device.sh.
        ansible-playbook ci-site.yml --tags perf \
          -e ernic_project_root="$GITHUB_WORKSPACE" \
          -e ernic_run_dir=/tmp/ernic-ci \
          -e ernic_instances=2 \
          -e ernic_vm_ssh_base_port=2222 \
          -e ernic_vm_ssh_user="$VM_USER" \
          -e results_dir="$PERF_CSV_DIR"

        echo "--- CSVs produced ---"
        ls -l "$PERF_CSV_DIR"

    - name: Upload the perf sweep
      if: always() && github.event_name != 'pull_request'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: two-vms-perf-csv
        path: /tmp/ernic-ci-results/perf-csv/
        if-no-files-found: ignore

    - name: Publish the RDMA and TCP/IP trends and shields
      # Only a green run on main may move the published history: a
      # failed job's numbers describe a broken mesh, a pull request's
      # describe the pull request, and a branch's describe the branch.
      #
      # A scheduled run always publishes; a manual one does whatever
      # the dispatch asked for, so the sweep can be exercised against
      # main without touching the history.
      if: >-
        success() &&
        github.ref == 'refs/heads/main' &&
        github.event_name != 'pull_request' &&
        (github.event_name != 'workflow_dispatch' || inputs.publish)
      uses: ./.github/actions/publish-perf
      with:
        results: ${{ env.PERF_RESULTS }}
        subject: RDMA and TCP
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Cleanup
      if: always()
      run: |
        echo "=== Cleaning up ==="

        # Stop VMs
        [ ! -z "$QEMU_VM1_PID" ] && kill $QEMU_VM1_PID 2>/dev/null || true
        [ ! -z "$QEMU_VM2_PID" ] && kill $QEMU_VM2_PID 2>/dev/null || true

        # Stop servers
        [ ! -z "$SERVER1_PID" ] && kill $SERVER1_PID 2>/dev/null || true
        [ ! -z "$SERVER2_PID" ] && kill $SERVER2_PID 2>/dev/null || true

        sleep 2

        # Force kill if needed
        pkill -9 qemu-system-x86_64 2>/dev/null || true
        pkill -9 rocm-ernic 2>/dev/null || true
        
        echo "✓ Cleanup complete"
  
    - name: Upload test logs
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: two-vms-test-logs
        path: |
          /tmp/server1.log
          /tmp/server2.log
          /tmp/qemu-vm1.log
          /tmp/qemu-vm2.log
          /tmp/qemu-vm1-console.log
          /tmp/qemu-vm2-console.log
        retention-days: 7
        if-no-files-found: ignore
