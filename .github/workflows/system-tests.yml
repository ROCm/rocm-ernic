# SPDX-License-Identifier: MIT
name: System Tests

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Container image with QEMU and libvfio-user pre-built
env:
  TCP_PORT: 5000

jobs:
  system-test-loopback-vm:
    name: Loopback Backend System Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      # TODO: move to ghcr.io/rocm/... once the image is published under the ROCm org
      image: sbates130272/batesste-ci-images-ubuntu-qemu-libvfio-user:latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Display environment
      run: |
        echo "=== Environment ==="
        echo "Container: Running inside Docker image"
        echo ""
        echo "=== Available Tools ==="
        qemu-system-x86_64 --version || echo "QEMU not found"
        cmake --version || echo "CMake not found"
        ninja --version || echo "Ninja not found"
        pkg-config --exists libibverbs && pkg-config --modversion libibverbs || echo "libibverbs not found"
        echo ""
        echo "=== VM Disk Image Location ==="
        echo "Checking /output directory..."
        if [ -d "/output" ]; then
          echo "✓ /output directory exists"
          echo "Contents:"
          ls -la /output || echo "Failed to list contents"
        else
          echo "✗ /output directory does not exist"
        fi
    
    - name: Read VM info
      id: vm_info
      shell: bash
      run: |
        echo "=== Reading VM info from /output/vm-info.json ==="
        if [ ! -f /output/vm-info.json ]; then
          echo "✗ vm-info.json not found in /output"
          ls -la /output
          exit 1
        fi
        
        cat /output/vm-info.json
        
        # Extract values using jq or python
        if command -v jq &> /dev/null; then
          VM_USER=$(jq -r '.username // "ci"' /output/vm-info.json)
          VM_DISK=$(jq -r '.image_path' /output/vm-info.json)
          SSH_KEY=$(jq -r '.ssh_key // ""' /output/vm-info.json)
          SSH_KEY_PRIVATE=$(jq -r '.ssh_keys.private_key_path // ""' /output/vm-info.json)
          SSH_KEY_PUBLIC=$(jq -r '.ssh_keys.public_key_path // ""' /output/vm-info.json)
        else
          # Fallback to python if jq not available
          VM_USER=$(python3 -c "import json; print(json.load(open('/output/vm-info.json')).get('username', 'ci'))")
          VM_DISK=$(python3 -c "import json; print(json.load(open('/output/vm-info.json')).get('image_path', ''))")
          SSH_KEY=$(python3 -c "import json; print(json.load(open('/output/vm-info.json')).get('ssh_key', ''))")
          SSH_KEY_PRIVATE=$(python3 -c "import json; d=json.load(open('/output/vm-info.json')); print(d.get('ssh_keys', {}).get('private_key_path', ''))")
          SSH_KEY_PUBLIC=$(python3 -c "import json; d=json.load(open('/output/vm-info.json')); print(d.get('ssh_keys', {}).get('public_key_path', ''))")
        fi
        
        # image_path should already be absolute, but verify
        if [ -z "$VM_DISK" ]; then
          echo "✗ image_path not found in vm-info.json"
          exit 1
        fi
    
        if [ ! -f "$VM_DISK" ]; then
          echo "✗ VM disk image not found: $VM_DISK"
          ls -la /output
          exit 1
        fi
        
        # Verify disk image is accessible and check for missing backing file
        # Error out immediately if disk has a backing file reference that doesn't exist
        QEMU_IMG_OUTPUT=$(qemu-img info "$VM_DISK" 2>&1)
        QEMU_IMG_EXIT=$?
        if [ $QEMU_IMG_EXIT -ne 0 ]; then
          if echo "$QEMU_IMG_OUTPUT" | grep -q "Could not open backing file"; then
            echo "✗ Disk image has backing file reference but backing file does not exist"
            echo "The disk image metadata references a backing file that is missing."
            echo "This indicates the disk image is corrupted or incorrectly generated."
            echo ""
            echo "Disk path: $VM_DISK"
            echo "qemu-img info output:"
            echo "$QEMU_IMG_OUTPUT"
            exit 1
          else
            echo "✗ Failed to read disk image info"
            echo "Disk path: $VM_DISK"
            echo "$QEMU_IMG_OUTPUT"
            exit 1
          fi
        fi
        
        echo "✓ VM username: $VM_USER"
        echo "✓ VM disk: $VM_DISK"
        echo "✓ SSH key: ${SSH_KEY:-not specified}"
        qemu-img info "$VM_DISK" || true
        
        echo "vm_user=$VM_USER" >> $GITHUB_OUTPUT
        echo "vm_disk=$VM_DISK" >> $GITHUB_OUTPUT
        echo "ssh_key=$SSH_KEY" >> $GITHUB_OUTPUT
        echo "ssh_key_private=$SSH_KEY_PRIVATE" >> $GITHUB_OUTPUT
        echo "ssh_key_public=$SSH_KEY_PUBLIC" >> $GITHUB_OUTPUT
    
    - name: Install dependencies
      run: |
        apt-get update
        apt-get install -y \
          build-essential \
          cmake \
          meson \
          ninja-build \
          pkg-config \
          libibverbs-dev \
          librdmacm-dev \
          libglib2.0-dev \
          libjson-c-dev \
          libcmocka-dev

    - name: Cache libvfio-user build
      id: cache-libvfio-user
      uses: actions/cache@v4
      with:
        path: |
          /usr/local/lib/x86_64-linux-gnu/libvfio-user*
          /usr/local/lib/x86_64-linux-gnu/pkgconfig/libvfio-user.pc
          /usr/local/include/vfio-user
        key: libvfio-user-20e9803-ubuntu-24.04-container

    - name: Upgrade libvfio-user
      if: steps.cache-libvfio-user.outputs.cache-hit != 'true'
      run: |
        # Pin to 20e9803 (De-duplicate FDs for DMA region access, Apr 7 2026)
        # This version includes the vfu_setup_device_dma() max_regions
        # parameter added in f3742ed9 (#835).
        git clone https://github.com/nutanix/libvfio-user.git /tmp/libvfio-user
        cd /tmp/libvfio-user
        git checkout 20e9803
        meson setup build --prefix=/usr/local -Dwarning_level=0
        ninja -C build
        ninja -C build install
        ldconfig

    - name: Reload ldconfig after cache restore
      if: steps.cache-libvfio-user.outputs.cache-hit == 'true'
      run: ldconfig

    - name: Cache rdma-core tarball
      uses: actions/cache@v4
      with:
        path: /tmp/rdma-core-62.0.tar.gz
        key: rdma-core-tarball-62.0

    - name: Download rdma-core tarball
      run: |
        if [ ! -f /tmp/rdma-core-62.0.tar.gz ]; then
          wget -q -O /tmp/rdma-core-62.0.tar.gz \
            https://github.com/linux-rdma/rdma-core/releases/download/v62.0/rdma-core-62.0.tar.gz
        fi

    - name: Build rocm-ernic server
      run: |
        echo "=== Building rocm-ernic server ==="
        cmake -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=Debug \
          -DCMAKE_INSTALL_PREFIX=/usr
        cmake --build build
        ls -lh build/rocm-ernic
        echo "✓ Server built successfully"

    - name: Start rocm-ernic server
      shell: bash
      run: |
        echo "=== Starting rocm-ernic server ==="
        # Remove any existing socket
        rm -f /tmp/vfio-user-rocm-ernic.sock
        
        ./build/rocm-ernic \
          --socket /tmp/vfio-user-rocm-ernic.sock \
          --backend loopback:mode=preserve \
          --verbose > /tmp/vfu_server.log 2>&1 &
        
        SERVER_PID=$!
        echo "SERVER_PID=$SERVER_PID" >> $GITHUB_ENV
        echo "Server PID: $SERVER_PID"
        
        # Wait for socket and verify server is running
        for i in {1..30}; do
          # Check if server process is still running
          if ! kill -0 "$SERVER_PID" 2>/dev/null; then
            echo "✗ Server process died (PID: $SERVER_PID)"
            echo "Exit code: $(wait $SERVER_PID 2>&1 || echo $?)"
            echo "=== Server log ==="
            cat /tmp/vfu_server.log
            exit 1
          fi
          
          # Check if socket exists and is a socket file
          if [ -S /tmp/vfio-user-rocm-ernic.sock ]; then
            chmod 666 /tmp/vfio-user-rocm-ernic.sock 2>/dev/null || true
            echo "✓ Server started (PID: $SERVER_PID)"
            echo "✓ Socket created: /tmp/vfio-user-rocm-ernic.sock"
            ls -la /tmp/vfio-user-rocm-ernic.sock
            exit 0
          fi
          
          # Show progress every 5 seconds
          if [ $((i % 5)) -eq 0 ]; then
            echo "Waiting for socket... (attempt $i/30)"
            echo "Server PID $SERVER_PID status: $(kill -0 $SERVER_PID 2>/dev/null && echo 'running' || echo 'dead')"
            echo "Socket exists: $([ -e /tmp/vfio-user-rocm-ernic.sock ] && echo 'yes' || echo 'no')"
            if [ -e /tmp/vfio-user-rocm-ernic.sock ]; then
              ls -la /tmp/vfio-user-rocm-ernic.sock
            fi
          fi
          sleep 1
        done
        
        echo "✗ Server failed to create socket after 30 seconds"
        echo "Server PID $SERVER_PID status: $(kill -0 $SERVER_PID 2>/dev/null && echo 'running' || echo 'dead')"
        echo "Socket exists: $([ -e /tmp/vfio-user-rocm-ernic.sock ] && echo 'yes' || echo 'no')"
        if [ -e /tmp/vfio-user-rocm-ernic.sock ]; then
          echo "Socket type:"
          ls -la /tmp/vfio-user-rocm-ernic.sock
          file /tmp/vfio-user-rocm-ernic.sock
        fi
        echo "=== Server log ==="
        cat /tmp/vfu_server.log
        exit 1
    
    - name: Start QEMU VM
      shell: bash
      run: |
        echo "=== Starting QEMU VM ==="
        VM_DISK="${{ steps.vm_info.outputs.vm_disk }}"
        SSH_PORT=2222
        
        # Start VM with vfio-user device
        # NOTE: memory-backend-memfd is REQUIRED for vfio-user DMA to work
        qemu-system-x86_64 \
          -machine q35,accel=tcg,memory-backend=mem0 \
          -cpu qemu64 \
          -smp 2 \
          -m 1G \
          -object memory-backend-memfd,id=mem0,share=on,size=1G \
          -nographic \
          -drive file="$VM_DISK",format=qcow2,if=virtio \
          -netdev user,id=net0,hostfwd=tcp::$SSH_PORT-:22 \
          -device virtio-net-pci,netdev=net0 \
          -device '{"driver":"vfio-user-pci","socket":{"type":"unix","path":"/tmp/vfio-user-rocm-ernic.sock"}}' \
          -serial mon:stdio > /tmp/qemu.log 2>&1 &
        
        QEMU_PID=$!
        echo "QEMU_PID=$QEMU_PID" >> $GITHUB_ENV
        echo "SSH_PORT=$SSH_PORT" >> $GITHUB_ENV
        echo "✓ QEMU started (PID: $QEMU_PID)"
        
        # Early failure detection: check if QEMU dies within 5 seconds
        echo "Monitoring QEMU for early failures..."
        sleep 5
        if ! kill -0 "$QEMU_PID" 2>/dev/null; then
          echo "✗ QEMU process died within 5 seconds (PID: $QEMU_PID)"
          echo "=== QEMU log (last 100 lines) ==="
          tail -100 /tmp/qemu.log || echo "Log file not found"
          echo ""
          echo "=== QEMU exit code ==="
          wait "$QEMU_PID" 2>&1 || echo "Exit code: $?"
          exit 1
        fi
        echo "✓ QEMU still running after 5 seconds"
    
    - name: Setup SSH keys
      shell: bash
      run: |
        echo "=== Setting up SSH keys ==="
        SSH_KEY_PRIVATE="${{ steps.vm_info.outputs.ssh_key_private }}"
        SSH_KEY_PUBLIC="${{ steps.vm_info.outputs.ssh_key_public }}"
        SSH_KEY="${{ steps.vm_info.outputs.ssh_key }}"
        SSH_PORT="$SSH_PORT"
        
        mkdir -p ~/.ssh
        chmod 700 ~/.ssh
        
        # Require SSH key file paths from vm-info.json
        if [ -z "$SSH_KEY_PRIVATE" ] || [ -z "$SSH_KEY_PUBLIC" ]; then
          echo "✗ SSH key paths (ssh_key_private and ssh_key_public) are required in vm-info.json"
          echo "Found ssh_key_private: $([ -n "$SSH_KEY_PRIVATE" ] && echo "$SSH_KEY_PRIVATE" || echo 'not set')"
          echo "Found ssh_key_public: $([ -n "$SSH_KEY_PUBLIC" ] && echo "$SSH_KEY_PUBLIC" || echo 'not set')"
          exit 1
        fi
        
        # Check if key files exist at the specified paths
        if [ ! -f "$SSH_KEY_PRIVATE" ]; then
          echo "✗ SSH private key file not found: $SSH_KEY_PRIVATE"
          exit 1
        fi
        
        if [ ! -f "$SSH_KEY_PUBLIC" ]; then
          echo "✗ SSH public key file not found: $SSH_KEY_PUBLIC"
          exit 1
        fi
        
        echo "✓ Using SSH keys from vm-info.json"
        echo "  Private key: $SSH_KEY_PRIVATE"
        echo "  Public key: $SSH_KEY_PUBLIC"
        cp "$SSH_KEY_PRIVATE" ~/.ssh/id_ed25519
        cp "$SSH_KEY_PUBLIC" ~/.ssh/id_ed25519.pub
        chmod 600 ~/.ssh/id_ed25519
        chmod 644 ~/.ssh/id_ed25519.pub
        
        ssh-keyscan -p "$SSH_PORT" localhost >> ~/.ssh/known_hosts 2>/dev/null || true
    
    - name: Wait for VM SSH
      shell: bash
      run: |
        echo "=== Waiting for VM SSH ==="
        SSH_PORT="$SSH_PORT"
        VM_USER="${{ steps.vm_info.outputs.vm_user }}"
        
        for i in {1..60}; do
          if ssh -o StrictHostKeyChecking=no -o ConnectTimeout=5 -p "$SSH_PORT" "${VM_USER}@localhost" 'echo VM Ready' 2>/dev/null; then
            echo "✓ VM SSH is ready (attempt $i/60)"
            echo "VM_USER=$VM_USER" >> $GITHUB_ENV
            exit 0
          fi
          echo "Attempt $i/60: Waiting for SSH..."
          sleep 5
        done
        
        echo "✗ VM SSH timeout"
        echo "=== QEMU Log ==="
        tail -100 /tmp/qemu.log
        exit 1
    
    - name: Verify RDMA NIC in VM
      shell: bash
      run: |
        echo "=== Verifying RDMA NIC in VM ==="
        SSH_PORT="$SSH_PORT"
        VM_USER="$VM_USER"
        
        ssh -o StrictHostKeyChecking=no -p "$SSH_PORT" "${VM_USER}@localhost" << 'EOFVM'
        set -e
        
        echo "=== PCI Devices ==="
        sudo lspci | grep -i amd || echo "AMD device not found yet"
        sudo lspci -nn | grep -E "1022:8000|AMD.*ERNIC" || echo "ROCm ERNIC device not found"
        
        echo ""
        echo "=== Checking for RDMA device ==="
        if command -v ibv_devices &> /dev/null; then
          ibv_devices || echo "No RDMA devices found"
        else
          echo "ibv_devices not available"
        fi
        
        echo ""
        echo "=== Kernel modules ==="
        lsmod | grep -E "ib_|rocm" || echo "No IB or ROCm modules loaded"
        EOFVM
    
    - name: Copy driver source to VM
      shell: bash
      run: |
        echo "=== Copying driver source to VM ==="
        SSH_PORT="$SSH_PORT"
        VM_USER="$VM_USER"
        
        scp -o StrictHostKeyChecking=no -P "$SSH_PORT" -r \
          driver/ "${VM_USER}@localhost:/tmp/" || {
          echo "✗ Failed to copy driver source to VM"
          exit 1
        }
        echo "✓ Driver source copied to VM"
    
    - name: Copy rdma-core provider to VM
      shell: bash
      run: |
        echo "=== Copying rdma-core provider to VM ==="
        SSH_PORT="$SSH_PORT"
        VM_USER="$VM_USER"
        ssh -o StrictHostKeyChecking=no -p "$SSH_PORT" \
          "${VM_USER}@localhost" "mkdir -p /tmp/rdma-core-provider"
        scp -o StrictHostKeyChecking=no -P "$SSH_PORT" -r \
          rdma-core/providers rdma-core/rocm-ernic-dv \
          "${VM_USER}@localhost:/tmp/rdma-core-provider/"
        echo "✓ Provider source copied to VM"

    - name: Copy rdma-core tarball to VM
      shell: bash
      run: |
        echo "=== Copying rdma-core tarball to VM ==="
        SSH_PORT="$SSH_PORT"
        VM_USER="$VM_USER"
        ssh -o StrictHostKeyChecking=no -p "$SSH_PORT" "${VM_USER}@localhost" "mkdir -p /tmp/rdma-core-build"
        scp -o StrictHostKeyChecking=no -P "$SSH_PORT" \
          /tmp/rdma-core-62.0.tar.gz \
          "${VM_USER}@localhost:/tmp/rdma-core-build/rdma-core-62.0.tar.gz"
        echo "✓ rdma-core tarball copied to VM"

    - name: Build custom rdma-core provider in VM
      shell: bash
      run: |
        echo "=== Building custom rdma-core provider ==="
        SSH_PORT="$SSH_PORT"
        VM_USER="$VM_USER"
        ssh -o StrictHostKeyChecking=no -p "$SSH_PORT" "${VM_USER}@localhost" << 'EOFVM'
        set -e
        RDMA_CORE_VER="62.0"
        BUILD_DIR="/tmp/rdma-core-build"
        SRC_DIR="${BUILD_DIR}/rdma-core-${RDMA_CORE_VER}"
        TARBALL="${BUILD_DIR}/rdma-core-${RDMA_CORE_VER}.tar.gz"
        mkdir -p "${BUILD_DIR}"
        echo "Extracting rdma-core v${RDMA_CORE_VER}..."
        tar xf "${TARBALL}" -C "${BUILD_DIR}"
        echo "Injecting rocm_ernic provider..."
        cp -r /tmp/rdma-core-provider/providers/rocm_ernic "${SRC_DIR}/providers/rocm_ernic"
        if ! grep -q "rocm_ernic" "${SRC_DIR}/CMakeLists.txt"; then
          echo "add_subdirectory(providers/rocm_ernic)" >> "${SRC_DIR}/CMakeLists.txt"
        fi
        echo "Building rdma-core..."
        cmake -S "${SRC_DIR}" -B "${BUILD_DIR}/build" -GNinja -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_BUILD_TYPE=Release -DNO_PYVERBS=1 -DNO_MAN_PAGES=1 -DENABLE_STATIC=0
        cmake --build "${BUILD_DIR}/build" -j$(nproc)
        echo "Installing rdma-core..."
        sudo cmake --install "${BUILD_DIR}/build"
        sudo ldconfig
        echo "Verifying provider..."
        find /usr/lib -name "librocm_ernic*" 2>/dev/null || echo "Provider may be in lib64"
        echo "✓ Custom rdma-core provider installed"
        EOFVM

    - name: Build and load driver in VM
      shell: bash
      run: |
        echo "=== Building and loading driver in VM ==="
        SSH_PORT="$SSH_PORT"
        VM_USER="$VM_USER"
        
        ssh -o StrictHostKeyChecking=no -p "$SSH_PORT" "${VM_USER}@localhost" << 'EOFVM'
        set -e
        
        echo "=== Kernel Version ==="
        uname -r
        
        echo ""
        echo "=== Building Driver ==="
        cd /tmp/driver
        make KDIR=/lib/modules/$(uname -r)/build
        if [ ! -f rocm_ernic_eth.ko ] || [ ! -f rocm_ernic_rdma.ko ]; then
          echo "✗ Driver modules not found!"
          echo "Expected: rocm_ernic_eth.ko and rocm_ernic_rdma.ko"
          ls -lh *.ko 2>/dev/null || echo "No .ko files found"
          exit 1
        fi
        ls -lh rocm_ernic_eth.ko rocm_ernic_rdma.ko
        echo "✓ Driver built for kernel $(uname -r)"
        
        echo ""
        echo "=== Loading InfiniBand Core ==="
        if ! sudo modprobe ib_core; then
          echo "✗ Failed to load ib_core module"
          echo "This module is required for the rocm_ernic driver."
          echo "Checking available modules:"
          find /lib/modules/$(uname -r) -name "*ib_core*" 2>/dev/null || echo "No ib_core module found"
          echo ""
          echo "You may need to install linux-modules-extra:"
          echo "  sudo apt-get update && sudo apt-get install linux-modules-extra-$(uname -r)"
          exit 1
        fi
        
        if ! sudo modprobe ib_uverbs; then
          echo "✗ Failed to load ib_uverbs module"
          echo "This module is required for the rocm_ernic driver."
          echo "Checking available modules:"
          find /lib/modules/$(uname -r) -name "*ib_uverbs*" 2>/dev/null || echo "No ib_uverbs module found"
          exit 1
        fi
        
        echo "Loaded IB modules:"
        lsmod | grep ib_ || echo "No IB modules loaded"
        
        # Verify required symbols are available
        echo ""
        echo "=== Verifying InfiniBand symbols ==="
        if ! grep -q "ib_umem_get" /proc/kallsyms 2>/dev/null; then
          echo "✗ ib_umem_get symbol not found in kernel"
          echo "The InfiniBand core modules may not be properly loaded or may not export symbols."
          exit 1
        fi
        if ! grep -q "ib_umem_release" /proc/kallsyms 2>/dev/null; then
          echo "✗ ib_umem_release symbol not found in kernel"
          echo "The InfiniBand core modules may not be properly loaded or may not export symbols."
          exit 1
        fi
        echo "✓ Required InfiniBand symbols are available"
        
        echo ""
        echo "=== Loading Driver ==="
        # Load eth module first (required dependency)
        sudo insmod ./rocm_ernic_eth.ko 2>&1 || {
          echo "⚠️  Driver eth module load failed"
          echo "Kernel messages:"
          sudo dmesg | tail -30
          exit 1
        }
        
        # Load rdma module (depends on eth module)
        sudo insmod ./rocm_ernic_rdma.ko 2>&1 || {
          echo "⚠️  Driver rdma module load failed"
          echo "Kernel messages:"
          sudo dmesg | tail -30
          exit 1
        }
        
        echo "✓ Driver loaded successfully"
        lsmod | grep rocm_ernic
        
        echo ""
        echo "=== Checking RDMA Device ==="
        sleep 2  # Give device time to register
        if ibv_devices | grep -E "rocm_ernic|rocep"; then
          DEVICE=$(ibv_devices | grep -E "rocm_ernic|rocep" | awk '{print $1}' | head -1)
          echo "✓ RDMA device found: $DEVICE"
          ibv_devinfo -d "$DEVICE" | head -20 || true
        else
          echo "⚠️  RDMA device not found after driver load"
          echo "PCI devices:"
          sudo lspci | grep -i amd || true
          echo "Kernel messages:"
          sudo dmesg | tail -30
          exit 1
        fi
        EOFVM
    
    - name: Verify RDMA device with running server
      shell: bash
      run: |
        echo "=== Verifying RDMA device via loopback:mode=preserve backend ==="
        SSH_PORT="$SSH_PORT"
        VM_USER="$VM_USER"

        # The VM was launched against the server started in the
        # "Start rocm-ernic server" step (loopback:mode=preserve on
        # /tmp/vfio-user-rocm-ernic.sock).  We must NOT kill that
        # server or cycle configs -- doing so severs the vfio-user
        # connection and destabilises the VM.
        #
        # Config-cycling (startup-only, no VM) is covered by the
        # build-test workflow's test_loopback_ci.sh step.

        if ! kill -0 "$SERVER_PID" 2>/dev/null; then
          echo "✗ ERNIC server (PID $SERVER_PID) is no longer running"
          tail -30 /tmp/vfu_server.log || true
          exit 1
        fi
        echo "✓ ERNIC server still running (PID $SERVER_PID)"

        set +e
        ssh -o StrictHostKeyChecking=no -p "$SSH_PORT" \
          "${VM_USER}@localhost" <<-'EOFVM'
        	if ! ibv_devices | grep -qE "rocm_ernic|rocep"; then
        	  echo "✗ RDMA device not found"
        	  exit 1
        	fi

        	DEVICE=$(ibv_devices | grep -E "rocm_ernic|rocep" \
        	         | awk '{print $1}' | head -1)
        	echo "✓ RDMA device found: $DEVICE"
        	ibv_devinfo -d "$DEVICE" | head -20 || true
        EOFVM
        TEST_EXIT=$?
        set -e

        if [ $TEST_EXIT -ne 0 ]; then
          echo "✗ RDMA device verification failed (exit $TEST_EXIT)"
          exit 1
        fi
        echo "✓ Loopback backend VM test passed"
    
    - name: Sysfs loopback smoke test
      shell: bash
      run: |
        echo "=== Sysfs Loopback Smoke Test ==="
        SSH_PORT="$SSH_PORT"
        VM_USER="$VM_USER"

        # Start a loopback server for the sysfs test
        ./build/rocm-ernic \
          --socket /tmp/vfio-user-rocm-ernic-test.sock \
          --backend loopback \
          --verbose > /tmp/vfu_server_sysfs.log 2>&1 &
        SERVER_PID=$!
        SOCKET_READY=0
        for i in {1..10}; do
          if [ -S /tmp/vfio-user-rocm-ernic-test.sock ]; then
            chmod 666 /tmp/vfio-user-rocm-ernic-test.sock
            SOCKET_READY=1
            break
          fi
          sleep 0.5
        done
        if [ $SOCKET_READY -eq 0 ]; then
          echo "Server failed to start for sysfs test"
          tail -20 /tmp/vfu_server_sysfs.log
          exit 1
        fi

        set +e
        ssh -o StrictHostKeyChecking=no -p "$SSH_PORT" \
          "${VM_USER}@localhost" <<-'EOFVM'
        	SYSFS_ETH=""
        	SYSFS_IB=""

        	# Locate the Ethernet loopback attribute
        	for d in /sys/class/net/rocm_ernic*; do
        	  if [ -f "$d/device/loopback" ]; then
        	    SYSFS_ETH="$d/device/loopback"
        	    break
        	  fi
        	done

        	# Locate the IB loopback attribute
        	for d in /sys/class/infiniband/rocm_ernic*; do
        	  if [ -f "$d/loopback" ]; then
        	    SYSFS_IB="$d/loopback"
        	    break
        	  fi
        	done

        	if [ -z "$SYSFS_ETH" ] && [ -z "$SYSFS_IB" ]; then
        	  echo "No sysfs loopback attributes found"
        	  exit 77
        	fi

        	FAIL=0

        	# -- Ethernet attribute --
        	if [ -n "$SYSFS_ETH" ]; then
        	  echo "Ethernet attr: $SYSFS_ETH"
        	  V=$(cat "$SYSFS_ETH")
        	  echo "  default value: $V"
        	  [ "$V" = "0" ] || { echo "  expected 0"; FAIL=1; }

        	  echo 1 | sudo tee "$SYSFS_ETH" > /dev/null
        	  V=$(cat "$SYSFS_ETH")
        	  echo "  after enable: $V"
        	  [ "$V" = "1" ] || { echo "  expected 1"; FAIL=1; }

        	  echo 0 | sudo tee "$SYSFS_ETH" > /dev/null
        	  V=$(cat "$SYSFS_ETH")
        	  echo "  after disable: $V"
        	  [ "$V" = "0" ] || { echo "  expected 0"; FAIL=1; }
        	fi

        	# -- IB attribute --
        	if [ -n "$SYSFS_IB" ]; then
        	  echo "IB attr: $SYSFS_IB"
        	  V=$(cat "$SYSFS_IB")
        	  echo "  default value: $V"
        	  [ "$V" = "0" ] || { echo "  expected 0"; FAIL=1; }

        	  echo 1 | sudo tee "$SYSFS_IB" > /dev/null
        	  V=$(cat "$SYSFS_IB")
        	  echo "  after enable: $V"
        	  [ "$V" = "1" ] || { echo "  expected 1"; FAIL=1; }

        	  echo 0 | sudo tee "$SYSFS_IB" > /dev/null
        	  V=$(cat "$SYSFS_IB")
        	  echo "  after disable: $V"
        	  [ "$V" = "0" ] || { echo "  expected 0"; FAIL=1; }
        	fi

        	if [ $FAIL -ne 0 ]; then
        	  echo "Sysfs loopback smoke test FAILED"
        	  exit 1
        	fi
        	echo "Sysfs loopback smoke test PASSED"
        EOFVM
        TEST_EXIT=$?
        set -e

        kill "$SERVER_PID" 2>/dev/null || true
        wait "$SERVER_PID" 2>/dev/null || true
        rm -f /tmp/vfio-user-rocm-ernic-test.sock

        if [ $TEST_EXIT -eq 0 ]; then
          echo "Sysfs loopback smoke test passed"
        elif [ $TEST_EXIT -eq 77 ]; then
          echo "Sysfs loopback smoke test skipped"
          echo "(RDMA device not available)"
        else
          echo "Sysfs loopback smoke test FAILED"
          exit 1
        fi
    
    - name: Show logs
      if: always()
      run: |
        echo "=== Server Logs ==="
        ls -lh /tmp/vfu_server*.log || echo "No server logs"
        tail -50 /tmp/vfu_server*.log || true
        echo ""
        echo "=== QEMU Log (last 100 lines) ==="
        tail -100 /tmp/qemu.log || echo "No QEMU log"
    
    - name: Cleanup
      if: always()
      run: |
        # Stop QEMU
        if [ -n "$QEMU_PID" ]; then
          kill "$QEMU_PID" 2>/dev/null || true
        fi
        
        # Stop server
        if [ -n "$SERVER_PID" ]; then
          kill "$SERVER_PID" 2>/dev/null || true
        fi
        
        # Clean up
        rm -f /tmp/vfio-user-rocm-ernic*.sock
        echo "✓ Cleanup complete"

  system-test-tcp:
    name: TCP Backend System Tests (Two Servers)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container:
      # TODO: move to ghcr.io/rocm/... once the image is published under the ROCm org
      image: sbates130272/batesste-ci-images-ubuntu-qemu-libvfio-user:latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Verify environment
      run: |
        echo "=== QEMU Version ==="
        qemu-system-x86_64 --version
        echo ""
        echo "=== Build tools ==="
        cmake --version || echo "CMake not found (will be installed)"
        ninja --version || echo "Ninja not found (will be installed)"
        echo ""
        echo "=== Network ==="
        ip addr show || true

    - name: Install dependencies
      run: |
        apt-get update
        apt-get install -y \
          build-essential \
          cmake \
          meson \
          ninja-build \
          pkg-config \
          libibverbs-dev \
          librdmacm-dev \
          libglib2.0-dev \
          libjson-c-dev \
          libcmocka-dev

    - name: Cache libvfio-user build
      id: cache-libvfio-user
      uses: actions/cache@v4
      with:
        path: |
          /usr/local/lib/x86_64-linux-gnu/libvfio-user*
          /usr/local/lib/x86_64-linux-gnu/pkgconfig/libvfio-user.pc
          /usr/local/include/vfio-user
        key: libvfio-user-20e9803-ubuntu-24.04-container

    - name: Upgrade libvfio-user
      if: steps.cache-libvfio-user.outputs.cache-hit != 'true'
      run: |
        # Pin to 20e9803 (De-duplicate FDs for DMA region access, Apr 7 2026)
        # This version includes the vfu_setup_device_dma() max_regions
        # parameter added in f3742ed9 (#835).
        git clone https://github.com/nutanix/libvfio-user.git /tmp/libvfio-user
        cd /tmp/libvfio-user
        git checkout 20e9803
        meson setup build --prefix=/usr/local -Dwarning_level=0
        ninja -C build
        ninja -C build install
        ldconfig

    - name: Reload ldconfig after cache restore
      if: steps.cache-libvfio-user.outputs.cache-hit == 'true'
      run: ldconfig

    - name: Cache rdma-core tarball
      uses: actions/cache@v4
      with:
        path: /tmp/rdma-core-62.0.tar.gz
        key: rdma-core-tarball-62.0

    - name: Download rdma-core tarball
      run: |
        if [ ! -f /tmp/rdma-core-62.0.tar.gz ]; then
          wget -q -O /tmp/rdma-core-62.0.tar.gz \
            https://github.com/linux-rdma/rdma-core/releases/download/v62.0/rdma-core-62.0.tar.gz
        fi

    - name: Build project
      run: |
        cmake -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=Debug \
          -DCMAKE_INSTALL_PREFIX=/usr
        cmake --build build

    - name: Verify binaries
      run: |
        ls -lh build/rocm-ernic
        file build/rocm-ernic

    - name: Read VM info
      id: vm_info
      shell: bash
      run: |
        echo "=== Reading VM info from /output/vm-info.json ==="
        if [ ! -f /output/vm-info.json ]; then
          echo "✗ vm-info.json not found in /output"
          ls -la /output
          exit 1
        fi
        
        cat /output/vm-info.json
        
        # Extract values using jq or python
        if command -v jq &> /dev/null; then
          VM_USER=$(jq -r '.username // "ci"' /output/vm-info.json)
          VM_DISK=$(jq -r '.image_path' /output/vm-info.json)
          SSH_KEY=$(jq -r '.ssh_key // ""' /output/vm-info.json)
          SSH_KEY_PRIVATE=$(jq -r '.ssh_keys.private_key_path // ""' /output/vm-info.json)
          SSH_KEY_PUBLIC=$(jq -r '.ssh_keys.public_key_path // ""' /output/vm-info.json)
        else
          # Fallback to python if jq not available
          VM_USER=$(python3 -c "import json; print(json.load(open('/output/vm-info.json')).get('username', 'ci'))")
          VM_DISK=$(python3 -c "import json; print(json.load(open('/output/vm-info.json')).get('image_path', ''))")
          SSH_KEY=$(python3 -c "import json; print(json.load(open('/output/vm-info.json')).get('ssh_key', ''))")
          SSH_KEY_PRIVATE=$(python3 -c "import json; d=json.load(open('/output/vm-info.json')); print(d.get('ssh_keys', {}).get('private_key_path', ''))")
          SSH_KEY_PUBLIC=$(python3 -c "import json; d=json.load(open('/output/vm-info.json')); print(d.get('ssh_keys', {}).get('public_key_path', ''))")
        fi
        
        # image_path should already be absolute, but verify
        if [ -z "$VM_DISK" ]; then
          echo "✗ image_path not found in vm-info.json"
          exit 1
        fi
    
        if [ ! -f "$VM_DISK" ]; then
          echo "✗ VM disk image not found: $VM_DISK"
          ls -la /output
          exit 1
        fi
        
        # Verify disk image is accessible and check for missing backing file
        # Error out immediately if disk has a backing file reference that doesn't exist
        QEMU_IMG_OUTPUT=$(qemu-img info "$VM_DISK" 2>&1)
        QEMU_IMG_EXIT=$?
        if [ $QEMU_IMG_EXIT -ne 0 ]; then
          if echo "$QEMU_IMG_OUTPUT" | grep -q "Could not open backing file"; then
            echo "✗ Disk image has backing file reference but backing file does not exist"
            echo "The disk image metadata references a backing file that is missing."
            echo "This indicates the disk image is corrupted or incorrectly generated."
            echo ""
            echo "Disk path: $VM_DISK"
            echo "qemu-img info output:"
            echo "$QEMU_IMG_OUTPUT"
            exit 1
          else
            echo "✗ Failed to read disk image info"
            echo "Disk path: $VM_DISK"
            echo "$QEMU_IMG_OUTPUT"
          exit 1
          fi
        fi
        
        echo "✓ VM username: $VM_USER"
        echo "✓ VM disk: $VM_DISK"
        echo "✓ SSH key: ${SSH_KEY:-not specified}"
        qemu-img info "$VM_DISK" || true
        
        echo "vm_user=$VM_USER" >> $GITHUB_OUTPUT
        echo "vm_disk=$VM_DISK" >> $GITHUB_OUTPUT
        echo "ssh_key=$SSH_KEY" >> $GITHUB_OUTPUT
        echo "ssh_key_private=$SSH_KEY_PRIVATE" >> $GITHUB_OUTPUT
        echo "ssh_key_public=$SSH_KEY_PUBLIC" >> $GITHUB_OUTPUT
    
    - name: Copy VM disk for second VM
      id: copy_vm_disk
      shell: bash
      run: |
        echo "=== Copying VM disk for second VM ==="
        VM_DISK_1="${{ steps.vm_info.outputs.vm_disk }}"
        
        # Create second VM disk name by inserting .2 before .qcow2 extension
        # e.g., /output/ci-vm.qcow2 -> /output/ci-vm.2.qcow2
        VM_DISK_DIR=$(dirname "$VM_DISK_1")
        VM_DISK_BASENAME=$(basename "$VM_DISK_1")
        VM_DISK_NAME="${VM_DISK_BASENAME%.qcow2}"
        VM_DISK_2="${VM_DISK_DIR}/${VM_DISK_NAME}.2.qcow2"
        
        echo "VM disk 1: $VM_DISK_1"
        echo "VM disk 2: $VM_DISK_2"
        echo "Copying $VM_DISK_1 to $VM_DISK_2..."
        # Use cp to create an exact copy preserving all disk structure and metadata
        cp "$VM_DISK_1" "$VM_DISK_2" || {
          echo "✗ Failed to copy VM disk"
          exit 1
        }
        
        echo "Verifying copied disk..."
        qemu-img info "$VM_DISK_2" || {
          echo "✗ Failed to read copied disk info"
          exit 1
        }
        
        echo "vm_disk_1=$VM_DISK_1" >> $GITHUB_OUTPUT
        echo "vm_disk_2=$VM_DISK_2" >> $GITHUB_OUTPUT
        echo "✓ VM disk copied for second VM"
    
    - name: Setup SSH keys
      shell: bash
      run: |
        echo "=== Setting up SSH keys ==="
        SSH_KEY_PRIVATE="${{ steps.vm_info.outputs.ssh_key_private }}"
        SSH_KEY_PUBLIC="${{ steps.vm_info.outputs.ssh_key_public }}"
        SSH_KEY="${{ steps.vm_info.outputs.ssh_key }}"
        
        mkdir -p ~/.ssh
        chmod 700 ~/.ssh
        
        # Require SSH key file paths from vm-info.json
        if [ -z "$SSH_KEY_PRIVATE" ] || [ -z "$SSH_KEY_PUBLIC" ]; then
          echo "✗ SSH key paths (ssh_key_private and ssh_key_public) are required in vm-info.json"
          echo "Found ssh_key_private: $([ -n "$SSH_KEY_PRIVATE" ] && echo "$SSH_KEY_PRIVATE" || echo 'not set')"
          echo "Found ssh_key_public: $([ -n "$SSH_KEY_PUBLIC" ] && echo "$SSH_KEY_PUBLIC" || echo 'not set')"
          exit 1
        fi
        
        # Check if key files exist at the specified paths
        if [ ! -f "$SSH_KEY_PRIVATE" ]; then
          echo "✗ SSH private key file not found: $SSH_KEY_PRIVATE"
        exit 1
        fi
        
        if [ ! -f "$SSH_KEY_PUBLIC" ]; then
          echo "✗ SSH public key file not found: $SSH_KEY_PUBLIC"
          exit 1
        fi
        
        echo "✓ Using SSH keys from vm-info.json"
        echo "  Private key: $SSH_KEY_PRIVATE"
        echo "  Public key: $SSH_KEY_PUBLIC"
        cp "$SSH_KEY_PRIVATE" ~/.ssh/id_ed25519
        cp "$SSH_KEY_PUBLIC" ~/.ssh/id_ed25519.pub
        chmod 600 ~/.ssh/id_ed25519
        chmod 644 ~/.ssh/id_ed25519.pub
        
        ssh-keyscan -p 2222 localhost >> ~/.ssh/known_hosts 2>/dev/null || true
        ssh-keyscan -p 2223 localhost >> ~/.ssh/known_hosts 2>/dev/null || true

    - name: Start TCP server 1 (manager)
      shell: bash
      run: |
        echo "=== Starting TCP server 1 (manager) ==="
        # Remove any existing socket
        rm -f /tmp/vfio-user-server1.sock
        
        ./build/rocm-ernic \
          --socket /tmp/vfio-user-server1.sock \
          --backend tcp:manager:listen:${{ env.TCP_PORT }} \
          --verbose > /tmp/server1.log 2>&1 &
        
        SERVER1_PID=$!
        echo "SERVER1_PID=$SERVER1_PID" >> $GITHUB_ENV
        echo "Server 1 PID: $SERVER1_PID"
        
        # Wait for socket and verify server is running
        for i in {1..30}; do
          # Check if server process is still running
          if ! kill -0 "$SERVER1_PID" 2>/dev/null; then
            echo "✗ Server 1 process died (PID: $SERVER1_PID)"
            echo "Exit code: $(wait $SERVER1_PID 2>&1 || echo $?)"
            echo "=== Server 1 log ==="
            cat /tmp/server1.log
            exit 1
          fi
          
          # Check if socket exists and is a socket file
          if [ -S /tmp/vfio-user-server1.sock ]; then
            chmod 666 /tmp/vfio-user-server1.sock 2>/dev/null || true
            echo "✓ Server 1 started (PID: $SERVER1_PID)"
            echo "✓ Socket created: /tmp/vfio-user-server1.sock"
            ls -la /tmp/vfio-user-server1.sock
            exit 0
          fi
          
          # Show progress every 5 seconds
          if [ $((i % 5)) -eq 0 ]; then
            echo "Waiting for socket... (attempt $i/30)"
            echo "Server 1 PID $SERVER1_PID status: $(kill -0 $SERVER1_PID 2>/dev/null && echo 'running' || echo 'dead')"
            echo "Socket exists: $([ -e /tmp/vfio-user-server1.sock ] && echo 'yes' || echo 'no')"
            if [ -e /tmp/vfio-user-server1.sock ]; then
              ls -la /tmp/vfio-user-server1.sock
            fi
          fi
          sleep 1
        done
        
        echo "✗ Server 1 failed to create socket after 30 seconds"
        echo "Server 1 PID $SERVER1_PID status: $(kill -0 $SERVER1_PID 2>/dev/null && echo 'running' || echo 'dead')"
        echo "Socket exists: $([ -e /tmp/vfio-user-server1.sock ] && echo 'yes' || echo 'no')"
        if [ -e /tmp/vfio-user-server1.sock ]; then
          echo "Socket type:"
          ls -la /tmp/vfio-user-server1.sock
          file /tmp/vfio-user-server1.sock
        fi
        echo "=== Server 1 log ==="
        cat /tmp/server1.log
        exit 1
    
    - name: Wait for TCP server 1 to be ready
      shell: bash
      run: |
        echo "Waiting for TCP server 1 to be ready..."
        sleep 5
        
        # Check if port is listening using available tools
        PORT=${{ env.TCP_PORT }}
        PORT_LISTENING=0
        
        # Try netstat first
        if command -v netstat &> /dev/null; then
          if netstat -tlnp 2>/dev/null | grep -q ":$PORT "; then
            PORT_LISTENING=1
            echo "✓ Port $PORT is listening (checked via netstat)"
          fi
        fi
        
        # Try ss if netstat didn't work
        if [ $PORT_LISTENING -eq 0 ] && command -v ss &> /dev/null; then
          if ss -tlnp 2>/dev/null | grep -q ":$PORT "; then
            PORT_LISTENING=1
            echo "✓ Port $PORT is listening (checked via ss)"
          fi
        fi
        
        # Try using /proc/net/tcp as fallback
        if [ $PORT_LISTENING -eq 0 ] && [ -f /proc/net/tcp ]; then
          HEX_PORT=$(printf "%04X" $PORT)
          if grep -q ":$HEX_PORT " /proc/net/tcp; then
            PORT_LISTENING=1
            echo "✓ Port $PORT is listening (checked via /proc/net/tcp)"
          fi
        fi
        
        # Try connecting to the port as final check
        if [ $PORT_LISTENING -eq 0 ]; then
          if command -v nc &> /dev/null; then
            if nc -z localhost $PORT 2>/dev/null; then
              PORT_LISTENING=1
              echo "✓ Port $PORT is accepting connections (checked via nc)"
            fi
          elif command -v timeout &> /dev/null && command -v bash &> /dev/null; then
            # Use bash built-in TCP connection test
            if timeout 1 bash -c "echo > /dev/tcp/localhost/$PORT" 2>/dev/null; then
              PORT_LISTENING=1
              echo "✓ Port $PORT is accepting connections (checked via /dev/tcp)"
            fi
          fi
        fi
        
        if [ $PORT_LISTENING -eq 1 ]; then
          echo "✓ Server 1 is ready and listening on port $PORT"
        else
          echo "⚠️  Could not verify port $PORT is listening (tools not available)"
          echo "Checking server log for TCP backend initialization..."
          tail -10 /tmp/server1.log || echo "Server log not available"
          echo "Assuming server is ready based on successful socket creation"
        fi

    - name: Start TCP server 2 (worker)
      shell: bash
      run: |
        echo "=== Starting TCP server 2 (worker) ==="
        # Since both servers run in the same container, use localhost
        # Manager is listening on 0.0.0.0, so localhost will work
        MANAGER_HOST="localhost"
        echo "Connecting to manager at: $MANAGER_HOST:${{ env.TCP_PORT }}"
        
        # Remove any existing socket
        rm -f /tmp/vfio-user-server2.sock

        ./build/rocm-ernic \
          --socket /tmp/vfio-user-server2.sock \
          --backend tcp:worker:$MANAGER_HOST:${{ env.TCP_PORT }} \
          --verbose > /tmp/server2.log 2>&1 &
        
        SERVER2_PID=$!
        echo "SERVER2_PID=$SERVER2_PID" >> $GITHUB_ENV
        echo "Server 2 PID: $SERVER2_PID"
        
        # Wait for socket and verify server is running
        for i in {1..30}; do
          # Check if server process is still running
          if ! kill -0 "$SERVER2_PID" 2>/dev/null; then
            echo "✗ Server 2 process died (PID: $SERVER2_PID)"
            echo "Exit code: $(wait $SERVER2_PID 2>&1 || echo $?)"
            echo "=== Server 2 log ==="
            cat /tmp/server2.log
          exit 1
        fi
        
          # Check if socket exists and is a socket file
          if [ -S /tmp/vfio-user-server2.sock ]; then
            chmod 666 /tmp/vfio-user-server2.sock 2>/dev/null || true
            echo "✓ Server 2 started (PID: $SERVER2_PID)"
            echo "✓ Socket created: /tmp/vfio-user-server2.sock"
            ls -la /tmp/vfio-user-server2.sock
            exit 0
          fi
          
          # Show progress every 5 seconds
          if [ $((i % 5)) -eq 0 ]; then
            echo "Waiting for socket... (attempt $i/30)"
            echo "Server 2 PID $SERVER2_PID status: $(kill -0 $SERVER2_PID 2>/dev/null && echo 'running' || echo 'dead')"
            echo "Socket exists: $([ -e /tmp/vfio-user-server2.sock ] && echo 'yes' || echo 'no')"
            if [ -e /tmp/vfio-user-server2.sock ]; then
              ls -la /tmp/vfio-user-server2.sock
            fi
          fi
          sleep 1
        done
        
        echo "✗ Server 2 failed to create socket after 30 seconds"
        echo "Server 2 PID $SERVER2_PID status: $(kill -0 $SERVER2_PID 2>/dev/null && echo 'running' || echo 'dead')"
        echo "Socket exists: $([ -e /tmp/vfio-user-server2.sock ] && echo 'yes' || echo 'no')"
        if [ -e /tmp/vfio-user-server2.sock ]; then
          echo "Socket type:"
          ls -la /tmp/vfio-user-server2.sock
          file /tmp/vfio-user-server2.sock
        fi
        echo "=== Server 2 log ==="
        cat /tmp/server2.log
        exit 1

    - name: Verify TCP connection
      run: |
        echo "=== Verifying TCP connection ==="
        sleep 3

        # Check server logs for connection messages
        echo "=== Server 1 log (last 30 lines) ==="
        tail -30 /tmp/server1.log || true

        echo "=== Server 2 log (last 30 lines) ==="
        tail -30 /tmp/server2.log || true

        # Verify both servers are still running
        if ! ps -p $SERVER1_PID > /dev/null; then
          echo "✗ Server 1 (manager) has stopped"
          exit 1
        fi
        if ! ps -p $SERVER2_PID > /dev/null; then
          echo "✗ Server 2 (worker) has stopped"
          exit 1
        fi
        echo "✓ Both servers are running"

        # Check for worker connection to manager
        WORKER_CONNECTED=0
        PORT=${{ env.TCP_PORT }}
        if grep -q "TCP: Connected to.*:$PORT" /tmp/server2.log; then
          WORKER_CONNECTED=1
          echo "✓ Worker connected to manager on port $PORT"
        else
          echo "✗ Worker did not connect to manager on port $PORT"
        fi

        # Check for worker registration with manager
        WORKER_REGISTERED=0
        if grep -q "TCP: Registered with manager" /tmp/server2.log; then
          WORKER_REGISTERED=1
          echo "✓ Worker registered with manager"
        else
          echo "✗ Worker did not register with manager"
        fi

        # Check for mesh topology received by worker
        MESH_RECEIVED=0
        if grep -q "TCP: Received mesh topology" /tmp/server2.log; then
          MESH_RECEIVED=1
          echo "✓ Worker received mesh topology"
        else
          echo "✗ Worker did not receive mesh topology"
        fi

        # Check for manager accepting worker registration
        MANAGER_REGISTERED=0
        if grep -q "TCP: Registered node.*at" /tmp/server1.log; then
          MANAGER_REGISTERED=1
          echo "✓ Manager registered worker node"
        else
          echo "✗ Manager did not register worker node"
        fi

        # Check for manager broadcasting topology
        MANAGER_BROADCAST=0
        if grep -q "TCP: Broadcast mesh topology" /tmp/server1.log; then
          MANAGER_BROADCAST=1
          echo "✓ Manager broadcast mesh topology"
        else
          echo "✗ Manager did not broadcast mesh topology"
        fi

        # Fail if any critical step failed
        if [ $WORKER_CONNECTED -eq 0 ] || [ $WORKER_REGISTERED -eq 0 ] || \
           [ $MESH_RECEIVED -eq 0 ] || [ $MANAGER_REGISTERED -eq 0 ] || \
           [ $MANAGER_BROADCAST -eq 0 ]; then
          echo ""
          echo "✗ TCP connection verification FAILED"
          echo "Connection establishment incomplete. Check logs above for details."
          exit 1
        fi

        echo ""
        echo "✓ TCP connection fully established and verified"

    - name: Verify server sockets are ready for VMs
      shell: bash
      run: |
        echo "=== Verifying server sockets are ready ==="
        
        # Verify both servers are still running
        if ! ps -p $SERVER1_PID > /dev/null; then
          echo "✗ Server 1 (manager) has stopped"
          echo "Server 1 log:"
          tail -50 /tmp/server1.log || true
          exit 1
        fi
        if ! ps -p $SERVER2_PID > /dev/null; then
          echo "✗ Server 2 (worker) has stopped"
          echo "Server 2 log:"
          tail -50 /tmp/server2.log || true
          exit 1
        fi
        echo "✓ Both servers are running"
        
        # Wait for server 1 to be ready (device realized)
        echo "Waiting for server 1 to be ready..."
        SERVER1_READY=0
        for i in $(seq 1 30); do
          if grep -q "Socket permissions set\|Device realized, waiting for client connection" /tmp/server1.log; then
            echo "✓ Server 1 ready"
            SERVER1_READY=1
            break
          fi
          sleep 1
        done
        if [ $SERVER1_READY -eq 0 ]; then
          echo "✗ Server 1 not ready after 30 seconds"
          echo "Server 1 log (last 30 lines):"
          tail -30 /tmp/server1.log
          exit 1
        fi
        
        # Wait for server 2 to be ready (device realized)
        echo "Waiting for server 2 to be ready..."
        SERVER2_READY=0
        for i in $(seq 1 30); do
          if grep -q "Socket permissions set\|Device realized, waiting for client connection" /tmp/server2.log; then
            echo "✓ Server 2 ready"
            SERVER2_READY=1
            break
          fi
          sleep 1
        done
        if [ $SERVER2_READY -eq 0 ]; then
          echo "✗ Server 2 not ready after 30 seconds"
          echo "Server 2 log (last 30 lines):"
          tail -30 /tmp/server2.log
          exit 1
        fi
        
        # Verify sockets exist
        if [ ! -S /tmp/vfio-user-server1.sock ]; then
          echo "✗ Server 1 socket not found"
          exit 1
        fi
        if [ ! -S /tmp/vfio-user-server2.sock ]; then
          echo "✗ Server 2 socket not found"
          exit 1
        fi
        
        echo "✓ All server sockets verified and ready for VM connections"

    - name: Start VM 1
      shell: bash
      run: |
        echo "=== Starting VM 1 ==="
        VM_DISK_1="${{ steps.vm_info.outputs.vm_disk }}"
        SSH_PORT_1=2222
        
        qemu-system-x86_64 \
          -machine q35,accel=tcg,memory-backend=mem1 \
          -cpu qemu64 \
          -smp 2 \
          -m 1G \
          -object memory-backend-memfd,id=mem1,share=on,size=1G \
          -nographic \
          -drive file="$VM_DISK_1",format=qcow2,if=virtio \
          -netdev user,id=net0,hostfwd=tcp::$SSH_PORT_1-:22 \
          -device virtio-net-pci,netdev=net0 \
          -device '{"driver":"vfio-user-pci","socket":{"type":"unix","path":"/tmp/vfio-user-server1.sock"}}' \
          -serial mon:stdio > /tmp/qemu-vm1.log 2>&1 &
        
        QEMU_VM1_PID=$!
        echo "QEMU_VM1_PID=$QEMU_VM1_PID" >> $GITHUB_ENV
        echo "✓ VM 1 started (PID: $QEMU_VM1_PID)"
        
        # Early failure detection: check if QEMU dies within 5 seconds
        echo "Monitoring VM 1 for early failures..."
        sleep 5
        if ! kill -0 "$QEMU_VM1_PID" 2>/dev/null; then
          echo "✗ VM 1 QEMU process died within 5 seconds (PID: $QEMU_VM1_PID)"
          echo "=== VM 1 QEMU log (last 100 lines) ==="
          tail -100 /tmp/qemu-vm1.log || echo "Log file not found"
          echo ""
          echo "=== VM 1 QEMU exit code ==="
          wait "$QEMU_VM1_PID" 2>&1 || echo "Exit code: $?"
          exit 1
        fi
        echo "✓ VM 1 still running after 5 seconds"

    - name: Start VM 2
      shell: bash
      run: |
        echo "=== Starting VM 2 ==="
        VM_DISK_2="${{ steps.copy_vm_disk.outputs.vm_disk_2 }}"
        SSH_PORT_2=2223
        
        qemu-system-x86_64 \
          -machine q35,accel=tcg,memory-backend=mem2 \
          -cpu qemu64 \
          -smp 2 \
          -m 1G \
          -object memory-backend-memfd,id=mem2,share=on,size=1G \
          -nographic \
          -drive file="$VM_DISK_2",format=qcow2,if=virtio \
          -netdev user,id=net0,hostfwd=tcp::$SSH_PORT_2-:22 \
          -device virtio-net-pci,netdev=net0 \
          -device '{"driver":"vfio-user-pci","socket":{"type":"unix","path":"/tmp/vfio-user-server2.sock"}}' \
          -serial mon:stdio > /tmp/qemu-vm2.log 2>&1 &
        
        QEMU_VM2_PID=$!
        echo "QEMU_VM2_PID=$QEMU_VM2_PID" >> $GITHUB_ENV
        echo "✓ VM 2 started (PID: $QEMU_VM2_PID)"
        
        # Early failure detection: check if QEMU dies within 5 seconds
        echo "Monitoring VM 2 for early failures..."
        sleep 5
        if ! kill -0 "$QEMU_VM2_PID" 2>/dev/null; then
          echo "✗ VM 2 QEMU process died within 5 seconds (PID: $QEMU_VM2_PID)"
          echo "=== VM 2 QEMU log (last 100 lines) ==="
          tail -100 /tmp/qemu-vm2.log || echo "Log file not found"
          echo ""
          echo "=== VM 2 QEMU exit code ==="
          wait "$QEMU_VM2_PID" 2>&1 || echo "Exit code: $?"
          exit 1
        fi
        echo "✓ VM 2 still running after 5 seconds"

    - name: Wait for VMs to boot
      shell: bash
      run: |
        echo "=== Waiting for VMs to boot ==="
        VM_USER="${{ steps.vm_info.outputs.vm_user }}"

        # Wait for VM 1 SSH
        for i in {1..60}; do
          if ssh -o StrictHostKeyChecking=no -o ConnectTimeout=5 -p 2222 "${VM_USER}@localhost" 'echo VM1 Ready' 2>/dev/null; then
            echo "✓ VM 1 is accessible via SSH"
            break
          fi
          if [ $i -eq 60 ]; then
            echo "✗ VM 1 boot timeout"
            tail -50 /tmp/qemu-vm1.log
            exit 1
          fi
          sleep 10
        done

        # Wait for VM 2 SSH
        for i in {1..60}; do
          if ssh -o StrictHostKeyChecking=no -o ConnectTimeout=5 -p 2223 "${VM_USER}@localhost" 'echo VM2 Ready' 2>/dev/null; then
            echo "✓ VM 2 is accessible via SSH"
            break
          fi
          if [ $i -eq 60 ]; then
            echo "✗ VM 2 boot timeout"
            echo "=== VM 2 QEMU log (last 100 lines) ==="
            tail -100 /tmp/qemu-vm2.log || echo "Log file not found"
            echo ""
            echo "=== Checking VM 2 QEMU process ==="
            if [ -n "$QEMU_VM2_PID" ]; then
              if kill -0 "$QEMU_VM2_PID" 2>/dev/null; then
                echo "VM 2 QEMU process is still running (PID: $QEMU_VM2_PID)"
              else
                echo "VM 2 QEMU process has died (PID: $QEMU_VM2_PID)"
              fi
            fi
          echo ""
            echo "=== Disk image info ==="
            VM_DISK_2="${{ steps.copy_vm_disk.outputs.vm_disk_2 }}"
            qemu-img info "$VM_DISK_2" || echo "Failed to get disk info"
          exit 1
        fi
          sleep 10
        done

    - name: Copy files to VMs (parallel)
      shell: bash
      run: |
        echo "=== Copying driver source, rdma-core provider, and tarball to both VMs in parallel ==="
        VM_USER="${{ steps.vm_info.outputs.vm_user }}"

        _copy_to_vm() {
          local PORT="$1"
          scp -o StrictHostKeyChecking=no -P "$PORT" -r driver "${VM_USER}@localhost:~/" || {
            echo "✗ Failed to copy driver to VM (port $PORT)"
            return 1
          }
          ssh -o StrictHostKeyChecking=no -p "$PORT" "${VM_USER}@localhost" "mkdir -p ~/rdma-core-provider"
          scp -o StrictHostKeyChecking=no -P "$PORT" -r \
            rdma-core/providers rdma-core/rocm-ernic-dv \
            "${VM_USER}@localhost:~/rdma-core-provider/" || {
            echo "✗ Failed to copy rdma-core provider to VM (port $PORT)"
            return 1
          }
          # Copy pre-downloaded tarball to avoid in-VM network download
          ssh -o StrictHostKeyChecking=no -p "$PORT" "${VM_USER}@localhost" "mkdir -p /tmp/rdma-core-build"
          scp -o StrictHostKeyChecking=no -P "$PORT" \
            /tmp/rdma-core-62.0.tar.gz \
            "${VM_USER}@localhost:/tmp/rdma-core-build/rdma-core-62.0.tar.gz" || {
            echo "✗ Failed to copy rdma-core tarball to VM (port $PORT)"
            return 1
          }
          echo "✓ Files copied to VM on port $PORT"
        }

        _copy_to_vm 2222 > /tmp/copy-vm1.log 2>&1 &
        PID1=$!
        _copy_to_vm 2223 > /tmp/copy-vm2.log 2>&1 &
        PID2=$!

        FAILED=0
        wait "$PID1" || { echo "✗ Copy to VM 1 failed"; cat /tmp/copy-vm1.log; FAILED=1; }
        wait "$PID2" || { echo "✗ Copy to VM 2 failed"; cat /tmp/copy-vm2.log; FAILED=1; }
        [ $FAILED -eq 0 ] && echo "✓ All files copied to both VMs"
        exit $FAILED

    - name: Write VM setup script
      shell: bash
      run: |
        cat > /tmp/vm-setup.sh << 'SCRIPT'
        #!/bin/bash
        set -e
        BUILD_DIR="/tmp/rdma-core-build"
        SRC_DIR="${BUILD_DIR}/rdma-core-62.0"
        mkdir -p "${BUILD_DIR}"
        tar xf "${BUILD_DIR}/rdma-core-62.0.tar.gz" -C "${BUILD_DIR}"
        cp -r ~/rdma-core-provider/providers/rocm_ernic "${SRC_DIR}/providers/rocm_ernic"
        grep -q "rocm_ernic" "${SRC_DIR}/CMakeLists.txt" || \
          echo "add_subdirectory(providers/rocm_ernic)" >> "${SRC_DIR}/CMakeLists.txt"
        cmake -S "${SRC_DIR}" -B "${BUILD_DIR}/build" -GNinja \
          -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_BUILD_TYPE=Release \
          -DNO_PYVERBS=1 -DNO_MAN_PAGES=1 -DENABLE_STATIC=0
        cmake --build "${BUILD_DIR}/build" -j$(nproc)
        sudo cmake --install "${BUILD_DIR}/build"
        sudo ldconfig
        echo "rdma-core provider installed"
        cd ~/driver
        make KDIR=/lib/modules/$(uname -r)/build
        sudo modprobe ib_core
        sudo modprobe ib_uverbs
        sudo insmod rocm_ernic_eth.ko
        sudo insmod rocm_ernic_rdma.ko
        sleep 2
        ibv_devinfo || echo "No RDMA devices yet"
        echo "Driver loaded"
        SCRIPT
        chmod +x /tmp/vm-setup.sh

    - name: Build rdma-core provider and driver in VMs (parallel)
      shell: bash
      run: |
        echo "=== Running per-VM setup in parallel ==="
        VM_USER="${{ steps.vm_info.outputs.vm_user }}"

        _setup_vm() {
          local PORT="$1"
          scp -o StrictHostKeyChecking=no -P "$PORT" /tmp/vm-setup.sh "${VM_USER}@localhost:/tmp/vm-setup.sh"
          ssh -o StrictHostKeyChecking=no -p "$PORT" "${VM_USER}@localhost" bash /tmp/vm-setup.sh
        }

        _setup_vm 2222 > /tmp/setup-vm1.log 2>&1 &
        PID1=$!
        _setup_vm 2223 > /tmp/setup-vm2.log 2>&1 &
        PID2=$!

        FAILED=0
        wait "$PID1" || { echo "✗ VM 1 setup failed"; cat /tmp/setup-vm1.log; FAILED=1; }
        wait "$PID2" || { echo "✗ VM 2 setup failed"; cat /tmp/setup-vm2.log; FAILED=1; }
        [ $FAILED -eq 0 ] && echo "✓ Both VMs set up successfully"
        exit $FAILED

    - name: Verify RDMA devices in VMs
      shell: bash
      run: |
        echo "=== Verifying RDMA devices ==="
        VM_USER="${{ steps.vm_info.outputs.vm_user }}"
        
        FAILED=0

        echo "--- VM 1 RDMA devices ---"
        if ssh -o StrictHostKeyChecking=no -p 2222 "${VM_USER}@localhost" 'ibv_devices | grep -qE "rocm_ernic|rocep"'; then
          DEVICE=$(ssh -o StrictHostKeyChecking=no -p 2222 "${VM_USER}@localhost" 'ibv_devices | grep -E "rocm_ernic|rocep" | awk "{print \$1}" | head -1')
          echo "✓ VM 1 RDMA device found: $DEVICE"
          ssh -o StrictHostKeyChecking=no -p 2222 "${VM_USER}@localhost" "ibv_devinfo -d $DEVICE | head -20" || true
        else
          echo "✗ VM 1: RDMA device not found"
          echo "Checking ibv_devices output:"
          ssh -o StrictHostKeyChecking=no -p 2222 "${VM_USER}@localhost" 'ibv_devices || echo "Command failed"'
          FAILED=$((FAILED + 1))
        fi

        echo ""
        echo "--- VM 2 RDMA devices ---"
        if ssh -o StrictHostKeyChecking=no -p 2223 "${VM_USER}@localhost" 'ibv_devices | grep -qE "rocm_ernic|rocep"'; then
          DEVICE=$(ssh -o StrictHostKeyChecking=no -p 2223 "${VM_USER}@localhost" 'ibv_devices | grep -E "rocm_ernic|rocep" | awk "{print \$1}" | head -1')
          echo "✓ VM 2 RDMA device found: $DEVICE"
          ssh -o StrictHostKeyChecking=no -p 2223 "${VM_USER}@localhost" "ibv_devinfo -d $DEVICE | head -20" || true
        else
          echo "✗ VM 2: RDMA device not found"
          echo "Checking ibv_devices output:"
          ssh -o StrictHostKeyChecking=no -p 2223 "${VM_USER}@localhost" 'ibv_devices || echo "Command failed"'
          FAILED=$((FAILED + 1))
        fi
        
        if [ $FAILED -gt 0 ]; then
          echo ""
          echo "✗ RDMA device verification failed"
          exit 1
        fi
        
        echo ""
        echo "✓ Both VMs have RDMA devices available"

    - name: Test TCP backend connection
      run: |
        echo "=== Testing TCP backend connection ==="

        # Check server logs for connection activity
        echo "--- Server 1 recent activity ---"
        tail -30 /tmp/server1.log | grep -i "tcp\|connect\|send\|recv" || echo "No TCP activity in server 1 log"

        echo "--- Server 2 recent activity ---"
        tail -30 /tmp/server2.log | grep -i "tcp\|connect\|send\|recv" || echo "No TCP activity in server 2 log"

        # Verify both servers are still running
        if ps -p $SERVER1_PID > /dev/null && ps -p $SERVER2_PID > /dev/null; then
          echo "✓ Both servers are running"
        else
          echo "✗ One or both servers have stopped"
          exit 1
        fi
    
    - name: Cleanup
      if: always()
      run: |
        echo "=== Cleaning up ==="

        # Stop VMs
        [ ! -z "$QEMU_VM1_PID" ] && kill $QEMU_VM1_PID 2>/dev/null || true
        [ ! -z "$QEMU_VM2_PID" ] && kill $QEMU_VM2_PID 2>/dev/null || true

        # Stop servers
        [ ! -z "$SERVER1_PID" ] && kill $SERVER1_PID 2>/dev/null || true
        [ ! -z "$SERVER2_PID" ] && kill $SERVER2_PID 2>/dev/null || true

        sleep 2

        # Force kill if needed
        pkill -9 qemu-system-x86_64 2>/dev/null || true
        pkill -9 rocm-ernic 2>/dev/null || true
        
        echo "✓ Cleanup complete"
  
    - name: Upload test logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: tcp-backend-test-logs
        path: |
          /tmp/server1.log
          /tmp/server2.log
          /tmp/qemu-vm1.log
          /tmp/qemu-vm2.log
        retention-days: 7
        if-no-files-found: ignore
  
  system-test-status:
    name: System Test Status
    needs: [system-test-loopback-vm, system-test-tcp]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
    - name: Check test results
      run: |
        LOOPBACK_VM_RESULT="${{ needs.system-test-loopback-vm.result }}"
        TCP_RESULT="${{ needs.system-test-tcp.result }}"
        
        if [ "$LOOPBACK_VM_RESULT" = "success" ] && [ "$TCP_RESULT" = "success" ]; then
          echo "✅ All system tests passed!"
          exit 0
        else
          echo "❌ Some system tests failed!"
          echo "Loopback VM test: $LOOPBACK_VM_RESULT"
          echo "TCP backend test: $TCP_RESULT"
          exit 1
        fi

