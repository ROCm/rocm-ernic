# SPDX-License-Identifier: MIT
#
# Slash-command dispatcher for the self-hosted CI.
#
# Comment on any pull request or issue:
#
#   /run-ci                 tier=functional, accel=kvm
#   /run-ci build           build + ctest + loopback only
#   /run-ci functional      ... plus 2-VM RDMA tests
#   /run-ci full            ... plus performance sweeps
#   /run-ci full tcg        run VMs under emulation
#   /run-ci help            print usage
#
# SECURITY
# --------
# rocm-ernic is a public repository, so anyone can leave
# a comment.  Three properties keep this honest:
#
#   1. This dispatcher runs on ubuntu-latest, never on
#      the self-hosted runner.  Untrusted comment text is
#      never processed on the lab node.
#   2. The commenter must have write access or above,
#      checked against the API at trigger time.
#   3. The dispatch always targets the workflow file on the
#      default branch, passing the pull request number as an
#      input.  A fork supplies the code under test but cannot
#      change what the workflow does with it.
#
# issue_comment always runs the workflow file from the
# default branch, so this gate cannot be edited by a
# pull request to weaken it.
#
# Fork pull requests ARE runnable, deliberately: a
# maintainer asking for it is the gate.  Note that fork code
# then executes as the runner's user on the lab node, so
# treat "can run /run-ci on a fork PR" as equivalent to
# shell access there.

name: CI Command

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write
  actions: write

concurrency:
  # One dispatch per comment; re-runs supersede.
  group: ci-command-${{ github.event.comment.id }}
  cancel-in-progress: true

jobs:
  dispatch:
    name: Dispatch
    # Cheap pre-filter so the job does not spin up for
    # every comment in the repository.
    if: startsWith(github.event.comment.body, '/run-ci')
    runs-on: ubuntu-latest

    steps:
      - name: Parse command
        id: parse
        env:
          BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail

          # Only the first line is the command; anything
          # after it is treated as prose.
          line="$(printf '%s' "${BODY}" | head -1 | tr -d '\r')"
          # shellcheck disable=SC2206
          read -r -a words <<<"${line}"

          # The workflow-level startsWith() filter is a
          # prefix match, so it also lets through /run-cix,
          # /run-ci-nightly and friends.  Require the first
          # word to be exactly /run-ci before acting.
          if [ "${words[0]:-}" != "/run-ci" ]; then
            echo "not a /run-ci command: ${words[0]:-<empty>}"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          tier=""
          accel="kvm"
          help="false"

          for w in "${words[@]:1}"; do
            case "${w,,}" in
              build|functional|full) tier="${w,,}" ;;
              kvm|tcg)               accel="${w,,}" ;;
              help|-h|--help)        help="true" ;;
              "") ;;
              *)
                echo "unknown=${w}" >> "$GITHUB_OUTPUT"
                echo "bad=true"     >> "$GITHUB_OUTPUT"
                ;;
            esac
          done

          # Bare "/run-ci" is the common case: a middle-tier
          # run that exercises real RDMA without paying
          # for the full performance sweep.
          [ -n "${tier}" ] || tier="functional"

          {
            echo "tier=${tier}"
            echo "accel=${accel}"
            echo "help=${help}"
          } >> "$GITHUB_OUTPUT"

      - name: Acknowledge
        if: steps.parse.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --silent -X POST \
            "repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions" \
            -f content=eyes || true

      - name: Show usage
        if: >-
          steps.parse.outputs.skip != 'true' &&
          (steps.parse.outputs.help == 'true' ||
           steps.parse.outputs.bad == 'true')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UNKNOWN: ${{ steps.parse.outputs.unknown }}
        run: |
          {
            if [ -n "${UNKNOWN:-}" ]; then
              echo "Unrecognised argument \`${UNKNOWN}\`."
              echo
            fi
            echo "**Self-hosted CI**"
            echo
            echo '| Command | Runs |'
            echo '|---|---|'
            echo '| `/run-ci` | build + loopback + 2-VM RDMA functional |'
            echo '| `/run-ci build` | build + ctest + loopback only |'
            echo '| `/run-ci functional` | same as bare `/run-ci` |'
            echo '| `/run-ci full` | functional + performance sweeps |'
            echo '| `/run-ci full tcg` | run VMs under emulation (no valid perf) |'
            echo
            echo 'Requires write access. Fork pull requests are eligible: the run tests the fork'"'"'s code but always uses this repository'"'"'s workflow definition.'
          } > body.md
          gh api -X POST \
            "repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/comments" \
            -F body=@body.md --silent
          echo "usage posted"

      - name: Check commenter permission
        id: perm
        if: >-
          steps.parse.outputs.skip != 'true' &&
          steps.parse.outputs.help != 'true' &&
          steps.parse.outputs.bad != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.event.comment.user.login }}
        run: |
          set -euo pipefail
          # role_name distinguishes maintain/triage, which
          # the coarser .permission field collapses.
          role="$(gh api \
            "repos/${{ github.repository }}/collaborators/${ACTOR}/permission" \
            --jq '.role_name // .permission' 2>/dev/null || echo none)"
          echo "role=${role}"
          case "${role}" in
            admin|maintain|write) echo "allowed=true"  >> "$GITHUB_OUTPUT" ;;
            *)                    echo "allowed=false" >> "$GITHUB_OUTPUT" ;;
          esac
          echo "role=${role}" >> "$GITHUB_OUTPUT"

      - name: Refuse unauthorised commenter
        if: steps.perm.outcome == 'success' && steps.perm.outputs.allowed == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.event.comment.user.login }}
          ROLE: ${{ steps.perm.outputs.role }}
        run: |
          gh api --silent -X POST \
            "repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions" \
            -f content=-1 || true
          echo "::error::@${ACTOR} has role '${ROLE}'; write access or above is required."
          exit 1

      - name: Resolve target
        id: ref
        if: steps.perm.outputs.allowed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${{ github.event.issue.pull_request.url || '' }}" ]; then
            # A plain issue has no code to test; run the
            # default branch as-is.
            echo "target=default branch" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Pass the pull request number rather than a branch.
          # The workflow checks out refs/pull/<n>/head, which
          # resolves for forks too, while the workflow file
          # itself still comes from the default branch.
          pr="${{ github.event.issue.number }}"
          head_repo="$(gh api \
            "repos/${{ github.repository }}/pulls/${pr}" \
            --jq '.head.repo.full_name')"

          echo "pr=${pr}" >> "$GITHUB_OUTPUT"
          if [ "${head_repo}" != "${{ github.repository }}" ]; then
            echo "target=PR #${pr} (fork: \`${head_repo}\`)" >> "$GITHUB_OUTPUT"
            echo "fork=true" >> "$GITHUB_OUTPUT"
          else
            echo "target=PR #${pr}" >> "$GITHUB_OUTPUT"
          fi

      - name: Dispatch workflow
        id: run
        if: steps.perm.outputs.allowed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.ref.outputs.pr }}
          TIER: ${{ steps.parse.outputs.tier }}
          ACCEL: ${{ steps.parse.outputs.accel }}
        run: |
          set -euo pipefail

          # --repo is required: this job deliberately does not
          # check the repository out, so gh has no git remote to
          # infer the target from and would fail with
          # "not a git repository".
          # --ref is the default branch on purpose: the
          # workflow definition must come from trusted code
          # even when the code under test is a fork's.
          args=(--repo "${{ github.repository }}"
                --ref "${{ github.event.repository.default_branch }}"
                -f tier="${TIER}" -f accel="${ACCEL}")
          [ -n "${PR}" ] && args+=(-f pr="${PR}")
          gh workflow run self-hosted-ci.yml "${args[@]}"

          # gh does not return the run id, so poll briefly
          # for the run this dispatch created.
          url=""
          for _ in $(seq 1 10); do
            sleep 3
            url="$(gh run list \
              --repo "${{ github.repository }}" \
              --workflow=self-hosted-ci.yml \
              --event=workflow_dispatch \
              --limit 1 --json url --jq '.[0].url' 2>/dev/null || true)"
            [ -n "${url}" ] && break
          done
          echo "url=${url}" >> "$GITHUB_OUTPUT"
          echo "dispatched ${TIER}/${ACCEL} pr=${PR:-none}: ${url:-<pending>}"

      - name: Report back
        if: steps.run.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          URL: ${{ steps.run.outputs.url }}
          TIER: ${{ steps.parse.outputs.tier }}
          ACCEL: ${{ steps.parse.outputs.accel }}
          TARGET: ${{ steps.ref.outputs.target }}
        run: |
          {
            echo "Self-hosted CI started."
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Tier | \`${TIER}\` |"
            echo "| Accelerator | \`${ACCEL}\` |"
            echo "| Target | ${TARGET} |"
            if [ -n "${URL}" ]; then
              echo "| Run | ${URL} |"
            fi
            echo
            # GitHub renders comment bodies with hard line breaks, so each
            # echo becomes a literal <br>. Keep one echo per paragraph and
            # let the reader's client wrap it.
            if [ "${ACCEL}" = "tcg" ]; then
              echo "> Running under emulation. Performance sweeps are skipped; emulated numbers are not recorded."
              echo
            fi
            echo "The functional and performance report is attached to the run as the \`ci-report\` artifact and mirrored into its job summary."
          } > body.md
          gh api -X POST \
            "repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/comments" \
            -F body=@body.md --silent

          gh api --silent -X POST \
            "repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions" \
            -f content=rocket || true

      - name: Report dispatch failure
        if: failure() && steps.run.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "Failed to dispatch the self-hosted CI workflow."
            echo
            echo "Common causes:"
            echo "- \`self-hosted-ci.yml\` is not on the default"
            echo "  branch; \`workflow_dispatch\` only resolves"
            echo "  workflows present there."
            echo "- the target ref no longer exists."
            echo
            echo "See the [dispatcher run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."
          } > body.md
          gh api -X POST \
            "repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/comments" \
            -F body=@body.md --silent
