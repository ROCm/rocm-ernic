name: rocm-ernic - Docs Check

on:
  workflow_dispatch:
  pull_request:
    branches:
      - develop
    paths:
      - 'docs/**'
      - 'src/**/*.h'
      - 'service/**'
      - 'README.md'
      - 'requirements.txt'
      # The counter lists under docs/generated/ are built from these,
      # so a counter added in either one changes the documentation.
      # src/**/*.h above already covers ionic_adminq_priv.h.
      - 'src/ionic_emu_stats.c'
      - 'tools/gen-counter-docs.py'
      - 'cmake/ErnicDocumentation.cmake'
      - '.github/workflows/docs-check.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sphinx:
    name: sphinx-build
    runs-on: ubuntu-latest
    steps:
    - name: Check out code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y doxygen

    # Before the build, not after: the sphinx-html target regenerates
    # docs/generated/, so a check that ran afterwards would compare the
    # files with themselves and always pass. What matters is whether
    # what is committed matches the C sources, since that is what the
    # site serves to anyone reading the page between deploys.
    #
    # --check rather than `git diff`, which only sees tracked files and
    # would say nothing about one of them having been deleted.
    - name: Check the generated counter lists are current
      run: python3 tools/gen-counter-docs.py --check

    - name: Configure docs-only build
      run: |
        cmake -S . -B build \
          -DERNIC_DOCS_ONLY=ON \
          -DERNIC_BUILD_DOCS=ON

    - name: Build documentation
      run: cmake --build build --target sphinx-html

  rst-lint:
    name: rst-lint
    runs-on: ubuntu-latest
    steps:
    - name: Check out code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install doc8
      run: pip install doc8

    - name: Lint RST files
      run: doc8 docs/ --max-line-length 80
