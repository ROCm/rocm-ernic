name: vfu-rdma-build-test

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            meson \
            ninja-build \
            pkg-config \
            libibverbs-dev \
            librdmacm-dev \
            libglib2.0-dev \
            libjson-c-dev \
            libcmocka-dev
      
      - name: Clone and build libvfio-user
        run: |
          git clone https://github.com/nutanix/libvfio-user.git /tmp/libvfio-user
          cd /tmp/libvfio-user
          meson setup build --prefix=/usr
          ninja -C build
          sudo ninja -C build install
          sudo ldconfig
      
      - name: Configure with Meson
        run: |
          meson setup build \
            --buildtype=debug \
            --prefix=/usr
      
      - name: Build with Ninja
        run: ninja -C build
      
      - name: Check binary exists
        run: |
          ls -lh build/vfu_pvrdma
          file build/vfu_pvrdma
          ldd build/vfu_pvrdma
      
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: vfu_pvrdma-${{ matrix.os }}
          path: build/vfu_pvrdma
          retention-days: 7

  build-status:
    name: Build Status
    needs: build
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Check build result
        run: |
          if [ "${{ needs.build.result }}" = "success" ]; then
            echo "✅ All builds succeeded!"
            exit 0
          else
            echo "❌ Build failed!"
            exit 1
          fi

