name: rocm-ernic - P4 Lane

# The guest-driven P4 system-test lane, built on the same shape as the
# S3 and NVMe-oF lanes.
# the way the NVMe-oF one is, because it is long enough to be worth
# reading on its own.
#
# Caller:
#   .github/workflows/system-tests.yml
#
# There is deliberately no `permissions:` block here: a reusable
# workflow runs with the CALLING job's token, so the scopes are the
# caller's business, not this file's.
#
# Unlike the S3 and NVMe-oF lanes this one takes no `publish` input and
# records no trend. It measures nothing: the result is a fixed set of
# fp8 values that are either right or wrong, and a number to plot would
# only be how long a 4 KiB reduction took on a shared runner.

on:
  workflow_call:

jobs:
  system-test-p4:
    # Only the configuration, not the lane name: every caller's name is
    # prefixed onto this one, and the callers already say P4.
    name: Single Server
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: sbates130272/batesste-ci-images-ubuntu-qemu-libvfio-user:20260918.g7438e48-qemu11.1.1-vfu.8039244
      options: --device /dev/kvm
    # One guest, one server, no TAP and no peer.  What this lane
    # covers that no other does: the guest programming the NIC's P4
    # pipeline itself, through /dev/ernic-p4, and then seeing an
    # ordinary RDMA write become an elementwise fp8 reduction because
    # of a table entry it installed.
    #
    # The server is started with NO program loaded.  Loading it here
    # would test the host's --p4-program flag, which the Python tests
    # already cover; the point of this lane is the guest-facing path,
    # so the guest pushes the program down itself and the lane fails if
    # it cannot.

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    # The guest image pin, from the one file that holds it. Loading it into
    # the job environment keeps $GUEST_ARTIFACT_TAG usable in later shell
    # steps (diagnostics name the image they expected) without any lane
    # carrying its own copy of the tag.
    - name: Load the guest image pin
      shell: bash
      run: grep -E '^[A-Za-z_][A-Za-z0-9_]*=' ci/guest-image.env
        >> "$GITHUB_ENV"

    - name: Select QEMU accelerator and guest size
      shell: bash
      env:
        VMS: 1
      run: |
        if [ -c /dev/kvm ] && qemu-system-x86_64 -accel help 2>/dev/null | grep -qw kvm; then
          echo "✓ /dev/kvm present; using KVM acceleration"
          echo "QEMU_ACCEL=kvm" >> "$GITHUB_ENV"
          echo "QEMU_CPU=host" >> "$GITHUB_ENV"
        else
          echo "⚠ /dev/kvm unavailable; falling back to TCG (guests will be slow)"
          echo "QEMU_ACCEL=tcg" >> "$GITHUB_ENV"
          echo "QEMU_CPU=qemu64" >> "$GITHUB_ENV"
        fi

        # Size the guests from the runner rather than pinning 2 vCPU / 1 GB;
        # the same derivation the other lanes use.
        HOST_CPUS=$(nproc)
        HOST_MEM_MB=$(awk '/^MemTotal:/ {print int($2 / 1024)}' /proc/meminfo)

        VM_VCPUS=$(( (HOST_CPUS - 1) / VMS ))
        # Four is a hard floor, not a preference.  ionic_lif_size() sets
        # neqs = min(rdma.eq_qtype.qid_count, num_online_cpus()), and
        # ionic_create_rdma_admin() rejects anything below
        # IONIC_EQ_COUNT_MIN (4) with a silent -EINVAL that surfaces only
        # as "Failed to register ibdev".
        [ "$VM_VCPUS" -lt 4 ] && VM_VCPUS=4
        VM_MEM_MB=$(( HOST_MEM_MB * 3 / 4 / VMS ))
        [ "$VM_MEM_MB" -gt 8192 ] && VM_MEM_MB=8192
        [ "$VM_MEM_MB" -lt 1024 ] && VM_MEM_MB=1024

        echo "VM_VCPUS=$VM_VCPUS" >> "$GITHUB_ENV"
        echo "VM_MEM_MB=$VM_MEM_MB" >> "$GITHUB_ENV"
        echo "runner: ${HOST_CPUS} vCPU, ${HOST_MEM_MB} MB"
        echo "guests: ${VMS} x ${VM_VCPUS} vCPU, ${VM_MEM_MB} MB"

    - name: Display environment
      run: |
        echo "=== Environment ==="
        echo "Container: Running inside Docker image"
        echo ""
        echo "=== Available Tools ==="
        qemu-system-x86_64 --version || echo "QEMU not found"
        cmake --version || echo "CMake not found"
        ninja --version || echo "Ninja not found"
        pkg-config --exists libibverbs && pkg-config --modversion libibverbs || echo "libibverbs not found"

    - name: Fetch the guest VM image
      id: guest_image
      uses: $/.github/actions/fetch-guest-vm
      with:
        tag: ${{ env.GUEST_ARTIFACT_TAG }}

    - name: Read VM info
      id: vm_info
      shell: bash
      env:
        GUEST_IMAGE_DIR: ${{ steps.guest_image.outputs.output_dir }}
      run: |
        OUT="${GUEST_IMAGE_DIR}"
        echo "=== Reading VM info from $OUT/vm-info.json ==="
        if [ ! -f "$OUT/vm-info.json" ]; then
          echo "✗ vm-info.json not found in $OUT"
          ls -la "$OUT"
          exit 1
        fi

        cat "$OUT/vm-info.json"

        # Paths in vm-info.json are absolute from the machine that built
        # the image, so resolve each against $OUT by basename.
        eval "$(python3 - "$OUT" <<'PYEOF'
        import json, os, shlex, sys
        out = sys.argv[1]
        d = json.load(open(os.path.join(out, "vm-info.json")))
        here = lambda p: os.path.join(out, os.path.basename(p)) if p else ""
        keys = {
            "VM_USER": d.get("username", "ci"),
            "VM_DISK": here(d.get("image_path", "")),
            "SSH_KEY": d.get("ssh_key", ""),
            "SSH_KEY_PRIVATE": here(d.get("ssh_keys", {}).get("private_key_path", "")),
            "SSH_KEY_PUBLIC": here(d.get("ssh_keys", {}).get("public_key_path", "")),
            "KERNEL_RELEASE": d.get("kernel_release", ""),
            "KERNEL_REF": d.get("provisioning", {}).get("kernel_ref", ""),
            "FLAVOUR": d.get("flavour", ""),
        }
        for k, v in keys.items():
            print(f"{k}={shlex.quote(str(v))}")
        PYEOF
        )"

        if [ -z "$VM_DISK" ]; then
          echo "✗ image_path not found in vm-info.json"
          exit 1
        fi

        if [ ! -f "$VM_DISK" ]; then
          echo "✗ VM disk image not found: $VM_DISK"
          ls -la "$OUT"
          exit 1
        fi

        QEMU_IMG_OUTPUT=$(qemu-img info "$VM_DISK" 2>&1)
        QEMU_IMG_EXIT=$?
        if [ $QEMU_IMG_EXIT -ne 0 ]; then
          if echo "$QEMU_IMG_OUTPUT" | grep -q "Could not open backing file"; then
            echo "✗ Disk image has backing file reference but backing file does not exist"
            echo "Disk path: $VM_DISK"
            echo "$QEMU_IMG_OUTPUT"
            exit 1
          else
            echo "✗ Failed to read disk image info"
            echo "Disk path: $VM_DISK"
            echo "$QEMU_IMG_OUTPUT"
            exit 1
          fi
        fi

        echo "✓ VM username: $VM_USER"
        echo "✓ VM disk: $VM_DISK"
        echo "✓ SSH key: ${SSH_KEY:-not specified}"
        echo "✓ Guest flavour: ${FLAVOUR:-unknown}"
        echo "✓ Guest kernel: ${KERNEL_RELEASE:-unknown} (ionic ref ${KERNEL_REF:-unknown})"
        qemu-img info "$VM_DISK" || true

        {
          echo "vm_user=$VM_USER"
          echo "vm_disk=$VM_DISK"
          echo "ssh_key=$SSH_KEY"
          echo "ssh_key_private=$SSH_KEY_PRIVATE"
          echo "ssh_key_public=$SSH_KEY_PUBLIC"
          echo "kernel_release=$KERNEL_RELEASE"
        } >> "$GITHUB_OUTPUT"

    - name: Install dependencies
      run: |
        # Only what the container image does not already carry.
        apt-get update
        apt-get install -y \
          libibverbs-dev \
          librdmacm-dev \
          iproute2

    - name: Verify libvfio-user from the image
      run: |
        # The image ships libvfio-user under /usr/local, and
        # CMakeLists.txt falls back to find_library/find_path there
        # when pkg-config misses.  What the build actually requires is
        # the max_regions parameter that f3742ed9 (#835) added to
        # vfu_setup_device_dma(); assert that rather than assuming it.
        set -e
        ldconfig
        HDR=/usr/local/include/vfio-user/libvfio-user.h
        LIB=$(find /usr/local/lib/x86_64-linux-gnu -maxdepth 1 -name 'libvfio-user.so*' 2>/dev/null | sort | head -1)
        if [ ! -f "$HDR" ] || [ -z "$LIB" ]; then
          echo "✗ libvfio-user missing from the container image"
          echo "  header: $HDR"
          ls -la /usr/local/lib/x86_64-linux-gnu/ /usr/local/include/ || true
          exit 1
        fi
        if ! grep -A2 'vfu_setup_device_dma' "$HDR" | grep -q 'max_regions'; then
          echo "✗ libvfio-user in the image predates the"
          echo "  vfu_setup_device_dma() max_regions parameter (#835)."
          exit 1
        fi
        echo "✓ libvfio-user present: $LIB"

    # The one line that separates this lane from every other: without
    # it the server has no P4 code at all, no --p4* options, and the
    # guest would find no capability to bind to.
    - name: Build rocm-ernic server
      run: |
        echo "=== Building rocm-ernic server (P4 enabled) ==="
        cmake -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=Debug \
          -DCMAKE_INSTALL_PREFIX=/usr \
          -DERNIC_WERROR=ON \
          -DERNIC_BUILD_P4=ON
        cmake --build build
        ls -lh build/rocm-ernic
        echo "✓ Server built successfully"

    # Before a guest is anywhere near it, so a failure here is the
    # engine's and not the lane's.
    - name: P4 unit tests
      run: |
        ctest --test-dir build --output-on-failure -R '^(p4-|ionic-harness-p4|ionic-harness-fp8)'

    - name: Start rocm-ernic server
      shell: bash
      run: |
        echo "=== Starting rocm-ernic server (loopback + P4) ==="
        rm -f /tmp/vfio-user-rocm-ernic.sock

        # --p4-guest-scope load is what makes the P4 capability bit
        # appear in LIF_IDENTIFY, which is what makes the patched ionic
        # create the aux device, which is what ernic_p4 binds to. No
        # program is loaded: the guest pushes one down itself.
        ./build/rocm-ernic \
          --socket /tmp/vfio-user-rocm-ernic.sock \
          --backend loopback \
          --p4-guest-scope load \
          --verbose > /tmp/vfu_server.log 2>&1 &

        SERVER_PID=$!
        echo "SERVER_PID=$SERVER_PID" >> "$GITHUB_ENV"
        echo "Server PID: $SERVER_PID"

        for i in {1..30}; do
          if ! kill -0 "$SERVER_PID" 2>/dev/null; then
            echo "✗ Server process died (PID: $SERVER_PID)"
            echo "=== Server log ==="
            cat /tmp/vfu_server.log
            exit 1
          fi
          if [ -S /tmp/vfio-user-rocm-ernic.sock ]; then
            echo "✓ Server socket ready after ${i}s"
            break
          fi
          sleep 1
        done

        if [ ! -S /tmp/vfio-user-rocm-ernic.sock ]; then
          echo "✗ Server socket never appeared"
          cat /tmp/vfu_server.log
          exit 1
        fi

        # The grant is reported at startup, and a lane that silently ran
        # without it would reach the guest and fail there instead, with
        # the symptom three layers from the cause.
        if ! grep -q 'P4 guest scope: load' /tmp/vfu_server.log; then
          echo "::error::the server did not report the P4 guest scope"
          cat /tmp/vfu_server.log
          exit 1
        fi
        echo "✓ Server granted the guest the load scope"

    - name: Start QEMU VM
      shell: bash
      env:
        VM_INFO_DISK: ${{ steps.vm_info.outputs.vm_disk }}
      run: |
        echo "=== Starting QEMU VM ==="
        VM_DISK="${VM_INFO_DISK}"
        SSH_PORT=2222

        # NOTE: memory-backend-memfd is REQUIRED for vfio-user DMA to work
        #
        # hpet=off: now and then a nested guest's kernel hangs for good
        # just after setting up the HPET.  See "boot hang" in
        # scripts/qemu-vm-diagnose.sh, which says what to do if it
        # still happens.
        qemu-system-x86_64 \
          -machine "q35,accel=${QEMU_ACCEL},memory-backend=mem0,hpet=off" \
          -cpu "${QEMU_CPU}" \
          -smp "${VM_VCPUS}" \
          -m "${VM_MEM_MB}M" \
          -object "memory-backend-memfd,id=mem0,share=on,size=${VM_MEM_MB}M" \
          -nographic \
          -drive file="$VM_DISK",format=qcow2,if=virtio \
          -netdev user,id=net0,hostfwd=tcp::$SSH_PORT-:22 \
          -device virtio-net-pci,netdev=net0 \
          -device '{"driver":"vfio-user-pci","socket":{"type":"unix","path":"/tmp/vfio-user-rocm-ernic.sock"}}' \
          -serial file:/tmp/qemu-console.log \
          -monitor none \
          -qmp unix:/tmp/qmp.sock,server=on,wait=off > /tmp/qemu.log 2>&1 &

        QEMU_PID=$!
        echo "QEMU_PID=$QEMU_PID" >> "$GITHUB_ENV"
        echo "SSH_PORT=$SSH_PORT" >> "$GITHUB_ENV"
        echo "✓ QEMU started (PID: $QEMU_PID)"

        echo "Monitoring QEMU for early failures..."
        sleep 5
        if ! kill -0 "$QEMU_PID" 2>/dev/null; then
          echo "✗ QEMU process died within 5 seconds (PID: $QEMU_PID)"
          echo "=== QEMU log ==="
          cat /tmp/qemu.log || echo "Log file not found"
          echo ""
          echo "=== Guest console ==="
          cat /tmp/qemu-console.log || echo "Console log not found"
          wait "$QEMU_PID" 2>&1 || echo "Exit code: $?"
          exit 1
        fi
        echo "✓ QEMU still running after 5 seconds"

    - name: Setup SSH keys
      shell: bash
      env:
        VM_INFO_SSH_KEY_PRIVATE: ${{ steps.vm_info.outputs.ssh_key_private }}
        VM_INFO_SSH_KEY_PUBLIC: ${{ steps.vm_info.outputs.ssh_key_public }}
      run: |
        echo "=== Setting up SSH keys ==="
        SSH_KEY_PRIVATE="${VM_INFO_SSH_KEY_PRIVATE}"
        SSH_KEY_PUBLIC="${VM_INFO_SSH_KEY_PUBLIC}"

        mkdir -p ~/.ssh
        chmod 700 ~/.ssh

        if [ -z "$SSH_KEY_PRIVATE" ] || [ -z "$SSH_KEY_PUBLIC" ]; then
          echo "✗ SSH key paths are required in vm-info.json"
          exit 1
        fi
        if [ ! -f "$SSH_KEY_PRIVATE" ] || [ ! -f "$SSH_KEY_PUBLIC" ]; then
          echo "✗ SSH key file not found ($SSH_KEY_PRIVATE / $SSH_KEY_PUBLIC)"
          exit 1
        fi

        ssh-keyscan -p "$SSH_PORT" localhost >> ~/.ssh/known_hosts 2>/dev/null || true

        # Use the key where the fetch action left it rather than copying
        # it into ~/.ssh: a container job sets HOME to /github/home, but
        # OpenSSH builds its default identity path from getpwuid().
        # The options go in a config file for ssh -F, so the later steps pass
        # them as one quoted argument.  The paths are expanded here, since
        # OpenSSH would resolve ~ with getpwuid() too.
        SSH_CONFIG="$RUNNER_TEMP/ernic-ssh-config"
        cat > "$SSH_CONFIG" <<EOF
        Host *
          IdentityFile "$SSH_KEY_PRIVATE"
          IdentitiesOnly yes
          BatchMode yes
          StrictHostKeyChecking no
          UserKnownHostsFile "$HOME/.ssh/known_hosts"
        EOF
        # SSH_KEY_PRIVATE and VM_USER are not exported through
        # $GITHUB_ENV: they come from vm-info.json in the downloaded
        # image, and a newline in either would let it define any
        # variable, such as BASH_ENV, for every later step.  The steps
        # that need them map them from steps.vm_info.outputs instead.
        echo "SSH_CONFIG=$SSH_CONFIG" >> "$GITHUB_ENV"
        echo "✓ SSH_CONFIG=$SSH_CONFIG:"
        cat "$SSH_CONFIG"

    - name: Wait for VM SSH
      shell: bash
      env:
        VM_INFO_USER: ${{ steps.vm_info.outputs.vm_user }}
      run: |
        echo "=== Waiting for VM SSH ==="
        VM_USER="${VM_INFO_USER}"

        for i in {1..60}; do
          if ssh -F "$SSH_CONFIG" -o ConnectTimeout=5 -p "$SSH_PORT" "${VM_USER}@localhost" 'echo VM Ready' 2>/tmp/ssh-attempt.err; then
            echo "✓ VM SSH is ready (attempt $i/60)"
            exit 0
          fi
          echo "Attempt $i/60: $(tr '\n' ' ' < /tmp/ssh-attempt.err | cut -c1-160)"
          sleep 5
        done

        echo "✗ VM SSH timeout"
        ssh -vvv -F "$SSH_CONFIG" -o ConnectTimeout=5 \
          -p "$SSH_PORT" "${VM_USER}@localhost" true 2>&1 | tail -40 || true

        "${GITHUB_WORKSPACE}/scripts/qemu-vm-diagnose.sh" \
          --label VM \
          --ssh-port "$SSH_PORT" \
          --qmp /tmp/qmp.sock \
          --console /tmp/qemu-console.log \
          --qemu-log /tmp/qemu.log \
          --pid "$QEMU_PID"
        exit 1

    - name: Verify the ionic PCI function is present in the VM
      shell: bash
      env:
        VM_USER: ${{ steps.vm_info.outputs.vm_user }}
      run: |
        echo "=== Verifying the emulated PCI function in the VM ==="

        ssh -F "$SSH_CONFIG" -p "$SSH_PORT" "${VM_USER}@localhost" 'bash -s' << 'EOFVM'
        set -e

        echo "=== PCI devices ==="
        sudo lspci -nn

        echo ""
        PCI_BDF="$(for dev in /sys/bus/pci/devices/*; do
          [ "$(cat "$dev/vendor")" = '0x1dd8' ] || continue
          [ "$(cat "$dev/device")" = '0x1002' ] || continue
          [ "$(cat "$dev/subsystem_vendor")" = '0x1dd8' ] || continue
          [ "$(cat "$dev/subsystem_device")" = '0x5400' ] || continue
          basename "$dev"
          break
        done)"
        if [ -z "$PCI_BDF" ]; then
          echo "✗ ionic PCI function 1dd8:1002 not present on the guest bus"
          echo "  The vfio-user device did not attach.  Check the server"
          echo "  log and the QEMU console for the vfio-user handshake."
          exit 1
        fi

        SUBSYSTEM_VENDOR="$(cat "/sys/bus/pci/devices/$PCI_BDF/subsystem_vendor")"
        SUBSYSTEM_DEVICE="$(cat "/sys/bus/pci/devices/$PCI_BDF/subsystem_device")"
        echo "=== Raw PCI IDs for $PCI_BDF ==="
        echo "subsystem_vendor=$SUBSYSTEM_VENDOR"
        echo "subsystem_device=$SUBSYSTEM_DEVICE"

        if [ "$SUBSYSTEM_VENDOR" != '0x1dd8' ] || [ "$SUBSYSTEM_DEVICE" != '0x5400' ]; then
          echo "✗ ionic PCI function present, but subsystem is ${SUBSYSTEM_VENDOR#0x}:${SUBSYSTEM_DEVICE#0x}"
          exit 1
        fi
        echo "✓ ionic PCI function 1dd8:1002 present with subsystem 1dd8:5400"
        EOFVM

    - name: Install the Ansible collection dependencies
      shell: bash
      run: |
        echo "=== Installing the Ansible collection dependencies ==="
        # The guest is provisioned by the sbates130272.rocm_ernic
        # collection in this repo, so the same role the self-hosted CI
        # and developers use is what this job exercises.
        ansible --version
        # Galaxy resets connections often enough to fail a lane on its
        # own, and only someone with write access can rerun the job.
        for attempt in 1 2 3; do
          if ansible-galaxy collection install community.general; then
            exit 0
          fi
          echo "::warning::galaxy install failed (attempt ${attempt}/3)"
          sleep $((attempt * 20))
        done
        echo "::error::galaxy install failed after 3 attempts"
        exit 1

    - name: Install kernel headers, build tools and pciutils in VM
      shell: bash
      env:
        VM_USER: ${{ steps.vm_info.outputs.vm_user }}
      run: |
        echo "=== Installing kernel headers, build tools and pciutils in VM ==="
        ssh -F "$SSH_CONFIG" -p "$SSH_PORT" "${VM_USER}@localhost" << 'EOFVM'
        set -e
        KVER=$(uname -r)

        # Headers are a check, not an install: a guest on a mainline
        # kernel has them from the .deb, and kernel.ubuntu.com has no
        # Packages index behind it, so linux-headers-$(uname -r) 404s.
        HEADER_PKG=""
        if [ -d "/lib/modules/${KVER}/build" ]; then
          echo "Kernel headers already present for ${KVER}"
        else
          echo "No build tree for ${KVER}; asking apt for the headers"
          HEADER_PKG="linux-headers-${KVER}"
        fi

        for i in 1 2 3; do
          if sudo apt-get -o DPkg::Lock::Timeout=300 update -qq; then
            break
          fi
          echo "apt-get update retry $i/3"; sleep 5
        done
        for i in 1 2 3 4 5; do
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o DPkg::Lock::Timeout=300 install -y -qq \
            ${HEADER_PKG:+"$HEADER_PKG"} dkms git build-essential cmake ninja-build \
            pciutils \
            pkg-config libnl-3-dev libnl-route-3-dev libudev-dev && break
          [ "$i" -eq 5 ] && { echo "apt-get install failed after 5 attempts"; exit 1; }
          echo "apt-get install retry $i/5"; sleep 10
        done

        echo "✓ Kernel packages installed for ${KVER}"
        EOFVM

    # ernic_guest_ionic_extra_patches is what makes this lane possible.
    # The guest's ionic is built HERE, and only a tree with patches/p4
    # advertises IONIC_LIF_CAP_P4 and creates the aux device ernic_p4
    # binds to. Building the module against a patched tree is not
    # enough: it would load and never probe.
    - name: Provision the VM with the Ansible collection
      shell: bash
      env:
        VM_USER: ${{ steps.vm_info.outputs.vm_user }}
        SSH_KEY_PRIVATE: ${{ steps.vm_info.outputs.ssh_key_private }}
      run: |
        echo "=== Provisioning the guest via ernic_guest_setup ==="
        ERNIC_RUN_DIR=/tmp/ernic-ci
        mkdir -p "$ERNIC_RUN_DIR"

        # vm-register.yml turns this manifest into the ernic_vms
        # inventory group; on the self-hosted path ernicctl writes it.
        cat > "$ERNIC_RUN_DIR/instances.json" << EOFJSON
        {
          "instances": [
            {
              "id": 1,
              "vm": {
                "vm_name": "gh-p4-vm1",
                "ssh_port": ${SSH_PORT},
                "ssh_user": "${VM_USER}"
              }
            }
          ]
        }
        EOFJSON

        export ANSIBLE_HOST_KEY_CHECKING=false
        export ANSIBLE_PRIVATE_KEY_FILE="$SSH_KEY_PRIVATE"
        export ANSIBLE_ROLES_PATH="$PWD/ansible/roles"
        PROJECT_ROOT="$PWD"

        cd ansible
        ansible-playbook ci-site.yml --tags guest-setup \
          -e ernic_project_root="$PROJECT_ROOT" \
          -e ernic_run_dir="$ERNIC_RUN_DIR" \
          -e ernic_instances=1 \
          -e ernic_vm_ssh_base_port="$SSH_PORT" \
          -e ernic_vm_ssh_user="$VM_USER" \
          -e ernic_gpu_passthrough=false \
          -e ernic_guest_agent=false \
          -e ernic_set_hostname=false \
          -e ernic_configure_nic=false \
          -e '{"ernic_guest_ionic_extra_patches": ["patches/p4"]}'
        # NOTE: ernic_configure_nic is deliberately left at its default
        # (true), unlike the loopback job.  Without an IPv4 address on
        # the emulated NIC the guest has no route to the endpoint at
        # all, and ionic_rdma populates no RoCEv2 GID for the client to
        # mint into its token.  vm-register.yml gives instance 1 the
        # .10 address on ernic_nic_subnet, the same segment the object
        # endpoint answers on.

    # The driver the guest needs to reach the engine at all.
    #
    # The same play a developer and the self-hosted lane run, so there
    # is one definition of "the guest can reach the P4 engine": the
    # module builds against both patch series, loads, and /dev/ernic-p4
    # is there. The role asserts that last part because this lane
    # started the server with a scope, so an absent node is a failure
    # and not a configuration.
    - name: Build and load ernic_p4 in the VM
      shell: bash
      env:
        VM_USER: ${{ steps.vm_info.outputs.vm_user }}
        SSH_KEY_PRIVATE: ${{ steps.vm_info.outputs.ssh_key_private }}
      run: |
        echo "=== Building ernic_p4 in the guest ==="
        ERNIC_RUN_DIR=/tmp/ernic-ci

        export ANSIBLE_HOST_KEY_CHECKING=false
        export ANSIBLE_PRIVATE_KEY_FILE="$SSH_KEY_PRIVATE"
        export ANSIBLE_ROLES_PATH="$PWD/ansible/roles"
        PROJECT_ROOT="$PWD"

        cd ansible
        ansible-playbook ci-site.yml --tags p4 \
          -e ernic_project_root="$PROJECT_ROOT" \
          -e ernic_run_dir="$ERNIC_RUN_DIR" \
          -e ernic_instances=1 \
          -e ernic_vm_ssh_base_port="$SSH_PORT" \
          -e ernic_vm_ssh_user="$VM_USER"

    # The whole point of the stack, run from where it has to work.
    #
    # $RDMA_DEVICE is passed in rather than rediscovered, as the other
    # guest tests do: with it set the client exits 1 rather than 77 when
    # the device is missing, so a skip here is a failure like any other.
    # The same goes for /dev/ernic-p4 -- the server granted a scope, so
    # the node is not allowed to be absent.
    - name: Guest-driven fp8 reduction over P4
      shell: bash
      env:
        VM_USER: ${{ steps.vm_info.outputs.vm_user }}
      run: |
        echo "=== Guest-driven fp8 reduction ==="
        ssh -F "$SSH_CONFIG" -p "$SSH_PORT" \
          "${VM_USER}@localhost" "mkdir -p /tmp/p4-fp8"
        scp -F "$SSH_CONFIG" -P "$SSH_PORT" \
          tests/p4_fp8_client.c tests/ernic_device.h src/parse_int.h \
          src/p4/p4_devcmd.h src/p4/p4_fp8.h \
          drivers/ernic_p4/uapi/ernic_p4.h \
          tests/data/p4/fp8_policy.json \
          "${VM_USER}@localhost:/tmp/p4-fp8/"

        set +e
        ssh -F "$SSH_CONFIG" -p "$SSH_PORT" "${VM_USER}@localhost" \
          "RDMA_DEVICE='$RDMA_DEVICE' bash -s" <<'EOFVM'
        set -e
        cd /tmp/p4-fp8
        read -ra IBV_FLAGS <<< "$(pkg-config --cflags --libs libibverbs)"
        gcc -O2 -Wall -Wextra \
          -o p4_fp8_client p4_fp8_client.c \
          "${IBV_FLAGS[@]}"
        ls -l /dev/ernic-p4
        set +e
        # As root: the node is mode 0600 and owned by root, because a
        # process that can reach the engine decides where every frame
        # goes. Compiling as the ordinary user and running as root keeps
        # the build off the root account.
        sudo -n RDMA_DEVICE="$RDMA_DEVICE" \
          timeout 60s ./p4_fp8_client fp8_policy.json
        exit $?
        EOFVM
        P4_EXIT=$?
        set -e

        if [ "$P4_EXIT" -eq 77 ]; then
          echo "::error::the client skipped (77) although the server"
          echo "granted the load scope and RDMA_DEVICE was set. Either"
          echo "/dev/ernic-p4 is absent -- ernic_p4 built but did not"
          echo "bind, so the ionic in this guest lacks patches/p4 --"
          echo "or the emulated device went away."
          exit 1
        fi
        if [ "$P4_EXIT" -ne 0 ]; then
          echo "::error::guest-driven fp8 reduction failed (exit $P4_EXIT)"
          exit 1
        fi
        echo "✓ a guest loaded a P4 program and reduced fp8 through it"

    - name: Check the server survived the run
      if: always()
      shell: bash
      run: |
        # A store that crashed mid-run invalidates every check above it,
        # and from inside the guest the vfio-user teardown looks exactly
        # like a connection the server closed.  Name it here.
        if [ -n "$SERVER_PID" ] && kill -0 "$SERVER_PID" 2>/dev/null; then
          echo "✓ ERNIC server still running after the P4 run"
        else
          echo "✗ ERNIC server died during the P4 run"
          tail -60 /tmp/vfu_server.log || true
          exit 1
        fi

    - name: Show logs
      if: always()
      run: |
        echo "=== Server Logs ==="
        ls -lh /tmp/vfu_server*.log || echo "No server logs"
        echo "--- P4 lines ---"
        grep -i 'p4' /tmp/vfu_server.log || echo "(none)"
        echo "--- tail ---"
        tail -50 /tmp/vfu_server*.log || true
        echo ""
        echo "=== QEMU Log ==="
        cat /tmp/qemu.log || echo "No QEMU log"
        echo ""
        echo "=== Guest console (complete) ==="
        cat /tmp/qemu-console.log || echo "No console log"

    - name: Upload test logs
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: p4-backend-test-logs
        path: |
          /tmp/vfu_server.log
          /tmp/qemu.log
          /tmp/qemu-console.log
        retention-days: 7
        if-no-files-found: ignore

    # ── Publish (nightly only) ───────────────────────
    - name: Cleanup
      if: always()
      run: |
        if [ -n "$QEMU_PID" ]; then
          kill "$QEMU_PID" 2>/dev/null || true
        fi
        if [ -n "$SERVER_PID" ]; then
          kill "$SERVER_PID" 2>/dev/null || true
        fi
        rm -f /tmp/vfio-user-rocm-ernic*.sock
        echo "✓ Cleanup complete"

