# SPDX-License-Identifier: MIT
#
# Self-hosted CI for rocm-ernic.
#
# Runs on the lab node registered by
# ci/runner/install-runner.sh.  Unlike the ubuntu-hosted
# workflows in this directory, this one can bring up
# real VMs over the emulated RDMA NIC and produce
# functional and performance reports.
#
# SECURITY
# --------
# rocm-ernic is public, and this workflow runs on a lab
# machine rather than a throwaway GitHub runner, so nothing
# reaches the node without a maintainer asking for it.
# There is no pull_request trigger: the only ways in are a
# manual dispatch and the nightly schedule.
#
# Fork pull requests ARE testable, via the pr input.  The
# split that makes this safe is that dispatch runs the
# workflow file from the branch given to --ref (normally
# develop) while checking out refs/pull/<pr>/head as the code
# under test.  A fork therefore supplies code to compile
# and run, but cannot alter what this workflow does, and
# cannot start a run at all: workflow_dispatch requires
# write access.
#
# What that does NOT protect is the node itself.  Fork code
# runs as the runner's user, so anyone who can dispatch a
# fork PR can execute arbitrary code there.  Treat the
# ability to dispatch as equivalent to shell access on the
# lab node, and see ci/README.md for the hardening that is
# still outstanding.

name: rocm-ernic - Self-Hosted CI

run-name: >-
  rocm-ernic - Self-Hosted CI
  ${{ inputs.pr && format('- PR #{0}', inputs.pr) || '' }}
  ${{ inputs.tier && format('({0})', inputs.tier) || '' }}

on:
  workflow_dispatch:
    inputs:
      tier:
        description: 'How much to run'
        required: true
        default: 'functional'
        type: choice
        options:
          - build          # build + ctest + loopback
          - functional     # ... plus 2-VM RDMA tests
          - full           # ... plus performance sweeps
      accel:
        description: 'VM accelerator'
        required: true
        default: 'kvm'
        type: choice
        options:
          - kvm
          - tcg            # emulation; functional only
      pr:
        description: >-
          Pull request number to test. Works for forks:
          refs/pull/<pr>/head is checked out as the code
          under test. Leave empty to run the dispatched ref.
        required: false
        type: string
  schedule:
    # 02:30 UTC nightly.  Off the hour to avoid the
    # thundering herd of every cron job on the fleet.
    - cron: '37 2 * * *'

# Default every job to read-only.  The tiers below run untrusted code
# on a persistent self-hosted node, so they must not hold a token that
# can write; the report job re-grants exactly what it needs.
permissions:
  contents: read

# One run at a time on the node: concurrent runs would
# collide on VM ssh ports, the instance manifest and the
# qcow2 overlays.  Queue rather than cancel so a nightly
# run is never silently dropped.
concurrency:
  group: rocm-ernic-self-hosted
  # Queue rather than cancel so a nightly run is never
  # silently dropped.  The node can only service one run at
  # a time, so pull requests serialise behind each other.
  cancel-in-progress: false

env:
  CI_WORK: /var/tmp/ernic-ci-work
  CI_VM_ACCEL: ${{ inputs.accel || 'kvm' }}
  # The code under test.  refs/pull/<n>/head resolves for
  # fork pull requests too, which is what makes them
  # testable without granting the fork any other reach.
  CI_CHECKOUT_REF: >-
    ${{ inputs.pr
        && format('refs/pull/{0}/head', inputs.pr)
        || github.ref }}

jobs:

  preflight:
    name: Preflight
    runs-on: [self-hosted, linux, x64, rocm-ernic]
    outputs:
      tier: ${{ steps.plan.outputs.tier }}
      kvm: ${{ steps.plan.outputs.kvm }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CI_CHECKOUT_REF }}

      - name: Reset workspace results
        run: |
          rm -rf "${CI_WORK}/results" "${CI_WORK}/report"
          mkdir -p "${CI_WORK}/results" "${CI_WORK}/report"

      - name: Run doctor
        id: doctor
        continue-on-error: true
        run: bash ci/doctor.sh | tee "${CI_WORK}/results/doctor.txt"

      - name: Decide what can run
        id: plan
        run: |
          # schedule/push have no inputs; default to full
          # nightly coverage and functional on push.
          case "${{ github.event_name }}" in
            workflow_dispatch) tier="${{ inputs.tier }}" ;;
            schedule)          tier="full" ;;
            *)                 tier="functional" ;;
          esac

          if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            kvm=true
          else
            kvm=false
            echo "::warning::/dev/kvm is not accessible; VM and perf jobs will be skipped."
          fi

          echo "tier=${tier}" >> "$GITHUB_OUTPUT"
          echo "kvm=${kvm}"   >> "$GITHUB_OUTPUT"
          echo "tier=${tier} kvm=${kvm}"

      - name: Publish doctor output
        run: |
          {
            echo '## Preflight'
            echo '```'
            cat "${CI_WORK}/results/doctor.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build and unit tests
    needs: preflight
    runs-on: [self-hosted, linux, x64, rocm-ernic]
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, Debug]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CI_CHECKOUT_REF }}

      - name: Build and test (${{ matrix.build_type }})
        env:
          CI_BUILD_TYPE: ${{ matrix.build_type }}
          # Keep matrix legs in separate build trees so
          # they cannot clobber one another on the node.
          CI_BUILD_DIR: /var/tmp/ernic-ci-work/build-${{ matrix.build_type }}
        run: bash ci/jobs/build.sh

      - name: Upload CTest results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ctest-${{ matrix.build_type }}
          path: /var/tmp/ernic-ci-work/results/ctest-junit.xml
          if-no-files-found: warn

  loopback:
    name: Loopback functional
    needs: build
    runs-on: [self-hosted, linux, x64, rocm-ernic]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CI_CHECKOUT_REF }}

      - name: Loopback backend tests
        env:
          CI_BUILD_DIR: /var/tmp/ernic-ci-work/build-Release
        run: bash ci/jobs/loopback.sh

  vm-functional:
    name: 2-VM RDMA functional
    needs: [preflight, loopback]
    if: >-
      needs.preflight.outputs.tier != 'build'
    runs-on: [self-hosted, linux, x64, rocm-ernic, kvm]
    timeout-minutes: 90
    env:
      CI_BUILD_DIR: /var/tmp/ernic-ci-work/build-Release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CI_CHECKOUT_REF }}

      - name: Bring up VMs
        run: bash ci/jobs/vm-up.sh

      - name: RDMA functional tests
        run: bash ci/jobs/vm-functional.sh

      - name: Tear down VMs
        if: always()
        run: bash ci/jobs/vm-down.sh

      - name: Upload VM logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vm-logs
          path: /var/tmp/ernic-ci-work/log/
          if-no-files-found: warn

  # Shares the VM work directory with vm-functional, so it runs
  # after it rather than beside it on the same runner.
  vm-nvmeof:
    name: 1-VM NVMe-oF functional
    needs: [preflight, vm-functional]
    if: >-
      needs.preflight.outputs.tier != 'build'
    runs-on: [self-hosted, linux, x64, rocm-ernic, kvm]
    timeout-minutes: 60
    env:
      CI_BUILD_DIR: /var/tmp/ernic-ci-work/build-Release
      # One guest and one server are a complete fabric here: the
      # instance runs the NVMe-oF controller itself, so there is no
      # peer to wire up and the lane is cheap enough to run on every
      # functional tier.
      ERNIC_INSTANCES: '1'
      ERNIC_BACKEND: 'nvmeof:size=256M,bs=4096'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CI_CHECKOUT_REF }}

      - name: Bring up VM
        run: bash ci/jobs/vm-up.sh

      - name: NVMe-oF functional tests
        run: bash ci/jobs/vm-nvmeof.sh

      - name: Tear down VM
        if: always()
        run: bash ci/jobs/vm-down.sh

      - name: Upload VM logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vm-nvmeof-logs
          path: /var/tmp/ernic-ci-work/log/
          if-no-files-found: warn

  # Same shared VM work directory again, so this queues behind
  # vm-nvmeof rather than racing it.
  vm-s3:
    name: 1-VM S3-over-RDMA functional
    needs: [preflight, vm-nvmeof]
    if: >-
      needs.preflight.outputs.tier != 'build'
    runs-on: [self-hosted, linux, x64, rocm-ernic, kvm]
    timeout-minutes: 60
    env:
      CI_BUILD_DIR: /var/tmp/ernic-ci-work/build-Release
      # As with nvmeof: the instance is the object store, so one
      # guest is the whole fabric and the lane is cheap.
      ERNIC_INSTANCES: '1'
      ERNIC_BACKEND: 's3:size=256M,bucket=ernic,ip=192.168.200.1,port=9000'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CI_CHECKOUT_REF }}

      - name: Bring up VM
        run: bash ci/jobs/vm-up.sh

      - name: S3-over-RDMA functional tests
        run: bash ci/jobs/vm-s3.sh

      - name: Tear down VM
        if: always()
        run: bash ci/jobs/vm-down.sh

      - name: Upload VM logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vm-s3-logs
          path: /var/tmp/ernic-ci-work/log/
          if-no-files-found: warn

  perf:
    name: Performance sweeps
    needs: [preflight, vm-s3]
    if: >-
      needs.preflight.outputs.tier == 'full'
    runs-on: [self-hosted, linux, x64, rocm-ernic, kvm]
    timeout-minutes: 180
    env:
      CI_BUILD_DIR: /var/tmp/ernic-ci-work/build-Release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CI_CHECKOUT_REF }}

      - name: Bring up VMs
        run: bash ci/jobs/vm-up.sh

      - name: Performance sweeps
        run: bash ci/jobs/perf.sh

      - name: Tear down VMs
        if: always()
        run: bash ci/jobs/vm-down.sh

      - name: Upload perf CSVs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: perf-csv
          path: /var/tmp/ernic-ci-work/results/perf-csv/
          if-no-files-found: warn

      # The rocm-ernic instance logs are what diagnose a
      # mid-sweep server crash; without them a perf
      # failure is just a wall of FAIL rows.
      - name: Upload server and VM logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: perf-logs
          path: /var/tmp/ernic-ci-work/log/
          if-no-files-found: warn

  report:
    name: Report
    # Only this job needs more than read: it comments results
    # back on a pull request.  The tiers that actually run
    # untrusted code keep the default read-only token.
    #
    # It no longer writes contents.  The published perf history and
    # the README shields are fed by the GitHub-hosted lanes in
    # system-tests.yml so that every published number comes off the
    # same class of machine; this node still sweeps, reports and
    # gates regressions, but its figures stay in the run's artifacts.
    permissions:
      # A job-level block replaces the workflow default outright,
      # so contents has to be restated or checkout loses its read.
      contents: read
      issues: write
      pull-requests: write
    needs: [preflight, build, loopback, vm-functional, vm-nvmeof, vm-s3, perf]
    # Report on whatever actually ran, including when an
    # upstream tier was skipped or failed.  Still refuses
    # fork pull requests.
    if: always()
    runs-on: [self-hosted, linux, x64, rocm-ernic]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CI_CHECKOUT_REF }}

      - name: Generate functional and performance report
        id: report
        continue-on-error: true
        env:
          # What was actually checked out and tested. github.sha still
          # points at develop for a `pr`-dispatched run, so reporting it
          # would label the report with the wrong tree.
          CI_TESTED_REF: ${{ env.CI_CHECKOUT_REF }}
        run: |
          CI_TESTED_SHA="$(git rev-parse HEAD)"
          export CI_TESTED_SHA
          echo "reporting against ${CI_TESTED_SHA} (${CI_TESTED_REF})"
          baseline="${CI_WORK}/baseline/summary.json"
          args=(--results "${CI_WORK}/results"
                --out "${CI_WORK}/report")
          if [ -f "${baseline}" ]; then
            args+=(--baseline "${baseline}" --threshold 15)
            echo "comparing against baseline from ${baseline}"
          else
            echo "no baseline yet; skipping regression check"
          fi
          python3 ci/report/gen-report.py "${args[@]}"

      - name: Update baseline
        # Only a clean full run on develop is allowed to
        # move the baseline, so a failing or partial run
        # can never silently lower the bar.
        #
        # inputs.pr must be empty too.  With the pr input
        # github.ref is still develop while the code under test is
        # the pull request's, so without this any PR -- a fork's
        # included -- could redefine what "no regression" means.
        if: >-
          steps.report.outcome == 'success' &&
          github.ref == 'refs/heads/develop' &&
          inputs.pr == '' &&
          needs.preflight.outputs.tier == 'full' &&
          needs.perf.result == 'success'
        run: |
          mkdir -p "${CI_WORK}/baseline"
          cp "${CI_WORK}/report/summary.json" "${CI_WORK}/baseline/summary.json"
          echo "baseline updated from run ${GITHUB_RUN_ID}"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-report
          path: |
            /var/tmp/ernic-ci-work/report/
            /var/tmp/ernic-ci-work/results/
          if-no-files-found: warn

      - name: Summarise the outcome
        id: outcome
        if: always()
        run: |
          set -uo pipefail
          # This job runs under always(), so a skipped or failed
          # upstream tier still has to be described rather than
          # inferred from the job's own status.
          overall=success
          for r in "${{ needs.preflight.result }}" \
                   "${{ needs.build.result }}" \
                   "${{ needs.loopback.result }}" \
                   "${{ needs.vm-nvmeof.result }}" \
                   "${{ needs.vm-s3.result }}" \
                   "${{ needs.vm-functional.result }}" \
                   "${{ needs.perf.result }}"; do
            case "${r}" in
              failure|cancelled) overall=failure ;;
            esac
          done
          [ "${{ steps.report.outcome }}" = "success" ] || overall=failure

          # One line on purpose: multi-line Python inside a
          # run: | block has to sit at column 0 to satisfy
          # Python, which ends the YAML block scalar.
          detail="$(python3 -c "import json; d=json.load(open('${CI_WORK}/report/summary.json')); f=d['functional']; print('%d/%d checks passed, %d failed, %d regression(s)' % (f['passed'], f['total'], f['failed'], len(d.get('regressions') or [])))" 2>/dev/null || true)"

          {
            echo "overall=${overall}"
            echo "detail=${detail}"
          } >> "$GITHUB_OUTPUT"
          echo "overall=${overall} ${detail}"

      - name: Report completion on the pull request
        if: always() && inputs.pr != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OVERALL: ${{ steps.outcome.outputs.overall }}
          DETAIL: ${{ steps.outcome.outputs.detail }}
        run: |
          if [ "${OVERALL}" = "success" ]; then
            head="Self-hosted CI passed"
          else
            head="Self-hosted CI failed"
          fi
          {
            echo "**${head}** on \`${{ runner.name }}\`, tier \`${{ needs.preflight.outputs.tier }}\`."
            echo
            echo "| Stage | Result |"
            echo "|---|---|"
            echo "| Build + ctest | ${{ needs.build.result }} |"
            echo "| Loopback | ${{ needs.loopback.result }} |"
            echo "| NVMe-oF (1 VM) | ${{ needs.vm-nvmeof.result }} |"
            echo "| S3 over RDMA (1 VM) | ${{ needs.vm-s3.result }} |"
            echo "| 2-VM RDMA functional | ${{ needs.vm-functional.result }} |"
            echo "| Performance sweeps | ${{ needs.perf.result }} |"
            echo
            if [ -n "${DETAIL}" ]; then
              echo "Checks: ${DETAIL}"
              echo
            fi
            echo "[Full run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}); the report is attached as the \`ci-report\` artifact."
          } > body.md
          gh api -X POST \
            "repos/${{ github.repository }}/issues/${{ inputs.pr }}/comments" \
            -F body=@body.md --silent
          echo "posted result to PR #${{ inputs.pr }}"

      - name: Fail if the report found problems
        if: steps.report.outcome != 'success'
        run: |
          echo "::error::Functional failures or performance regressions were reported."
          exit 1
