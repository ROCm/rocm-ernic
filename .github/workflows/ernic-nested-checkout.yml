#
# The project in a directory of a larger repository, as it will be in
# rocm-systems (emulation/ernic/), with its workflows and actions at the
# top, beside another project's. tests/test_nested_checkout.sh checks
# that every workflow and action is named ernic-*, that the image pin
# checks and the embedded shell check look at the project's files and
# only those, and that the project configures and builds there. It needs ShellCheck and PyYAML, which the Build and Test
# workflow doesn't install, and builds the project a second time, so it's
# a workflow of its own rather than a CTest test.
name: rocm-ernic - Nested checkout

on:
  pull_request:
    branches: [ develop ]
    paths:
      - 'tools/**'
      - 'ci/**'
      - '.github/**'
      - 'CMakeLists.txt'
      - '**/CMakeLists.txt'
      - 'cmake/**'
      - 'tests/test_nested_checkout.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nested-checkout:
    name: Checks and build in emulation/ernic/
    runs-on: ubuntu-26.04
    # A run takes a few minutes. A slow mirror can stretch the package
    # download to an hour, and a stalled one past GitHub's six-hour
    # default, holding a runner all the while.
    timeout-minutes: 30
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # build-essential, cmake, ninja-build and pkg-config are
      # preinstalled on the hosted image. libjson-c-dev is for
      # -DERNIC_BUILD_P4=ON, below.
      - name: Install system dependencies
        uses: $/.github/actions/ernic-apt-install
        with:
          packages: >-
            libibverbs-dev
            librdmacm-dev
            libjson-c-dev

      # The same key and paths as the Build and Test workflow, so the two
      # share the cached build
      - name: Cache libvfio-user build
        id: cache-libvfio-user
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /usr/lib/x86_64-linux-gnu/libvfio-user*
            /usr/lib/x86_64-linux-gnu/pkgconfig/libvfio-user.pc
            /usr/include/vfio-user
          # pins.env holds the libvfio-user pin; a change to any of its
          # pins rebuilds this cache once, which is cheap
          key: libvfio-user-${{ hashFiles('ci/images/builder/pins.env') }}-ubuntu-26.04

      # The pin is LIBVFIO_USER_COMMIT in ci/images/builder/pins.env;
      # ernic-build-and-test.yml says why only the library is built
      - name: Clone and build libvfio-user
        if: steps.cache-libvfio-user.outputs.cache-hit != 'true'
        run: |
          sudo apt-get install -y meson libcmocka-dev
          . ci/images/builder/pins.env
          git clone "$LIBVFIO_USER_REPO" /tmp/libvfio-user
          cd /tmp/libvfio-user
          git checkout "$LIBVFIO_USER_COMMIT"
          meson setup build --prefix=/usr -Dwarning_level=0
          meson compile -C build vfio-user
          sudo meson install -C build --no-rebuild --tags runtime,devel
          sudo ldconfig

      - name: Reload ldconfig after cache restore
        if: steps.cache-libvfio-user.outputs.cache-hit == 'true'
        run: sudo ldconfig

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # The same versions as the ShellCheck workflow
      - name: Install PyYAML and ShellCheck
        run: python3 -m pip install pyyaml==6.0.3 shellcheck-py==0.11.0.1

      # ERNIC_WERROR is off: the Build and Test workflow checks for
      # warnings, and this job is only about where the project is.
      - name: Check and build the project in emulation/ernic/
        run: |
          tests/test_nested_checkout.sh . -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug -DERNIC_BUILD_P4=ON
