#
# Publishes the CI images defined under ci/images/ to GHCR, each under a
# tag naming its contents (ci/images/image-tag.sh). One already published
# under its tag isn't built again, so a run that changes no definition
# only looks. See ci/images/README.md.
#
# System Tests calls it first and runs its lanes in the builder image it
# returns, so a pull request that changes the builder publishes it and
# tests the lanes in it. It has no pull_request trigger of its own:
# System Tests runs for every change under ci/.
name: "rocm-ernic - CI images"

on:
  workflow_call:
    outputs:
      builder_image:
        description: >-
          The builder image's full reference, REGISTRY/ci-builder:TAG,
          published and checked
        value: ${{ jobs.builder.outputs.ref }}
  workflow_dispatch:

permissions: {}

jobs:
  resolve:
    name: Resolve the image tags
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      builder_tag: ${{ steps.tags.outputs.builder_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The scripts that tag and publish the images, before they're
      # trusted to: the same test as CTest's ernic-ci-images, which Build
      # and Test doesn't run for a change only under ci/images/
      - name: Test the image scripts
        shell: bash
        run: tests/test_ci_images.sh ci/images

      # ci/guest-image.env pins the builder too, for anything outside
      # these workflows that wants it, so it must name this tree's image
      - name: Check the lockfile pins the images defined here
        shell: bash
        run: ci/images/image-tag.sh --check builder

      - name: Compute the tags
        id: tags
        shell: bash
        run: |
          tag=$(ci/images/image-tag.sh builder)
          echo "builder_tag=$tag" >> "$GITHUB_OUTPUT"
          echo "ci-builder: $tag"

  builder:
    name: Builder image
    needs: resolve
    runs-on: ubuntu-24.04
    # A cold build compiles QEMU; a warm one reuses the registry cache
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    # Two runs that need the same image build it once: the second waits,
    # then finds it published
    concurrency:
      group: ci-images-builder-${{ needs.resolve.outputs.builder_tag }}
      cancel-in-progress: false
    outputs:
      ref: ${{ steps.ensure.outputs.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GHCR
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s\n' "$GH_TOKEN" |
            docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      # The default docker driver can't export a cache to the registry
      - name: Set up a buildx builder
        shell: bash
        run: docker buildx create --name ernic-ci --driver docker-container --use

      - name: Publish the builder image if it isn't already
        id: ensure
        shell: bash
        env:
          OWNER: ${{ github.repository_owner }}
          # A pull request from a fork gets a read-only token
          CI_IMAGES_CAN_PUSH: >-
            ${{ github.event_name != 'pull_request' ||
                !github.event.pull_request.head.repo.fork }}
        run: |
          # GHCR names are lowercase, and the owner is "ROCm"
          export CI_IMAGES_REGISTRY="ghcr.io/${OWNER,,}/rocm-ernic"
          ref=$(ci/images/ensure-image.sh builder)
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
