name: rocm-ernic - Build and Test

on:
  # Pushes to develop run too, so that develop's code coverage can be
  # published for the README's Coverage badge (publish-coverage-badge
  # below).
  pull_request:
    branches: [ develop ]
    paths: &paths
      - 'src/**'
      - 'tests/**'
      - 'service/**'
      # src/rocm_ernic_server.c and src/rdma/tcp_wire.c include
      # shared/rocm-ernic-warnings.h, so a change there changes what this
      # matrix compiles. Without this entry, editing a warning suppression
      # skipped every build leg and all of ctest.
      - 'shared/**'
      # The exporter and the driver pack's patches and scripts are
      # installed, and ernic-package-deb checks the packages they're in
      - 'prometheus/**'
      - 'ansible/files/**'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - '.github/workflows/build-and-test.yml'
  push:
    branches: [ develop ]
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

# A newer commit on a pull request cancels the run for the older one.
# Every other run (a push, a manual run) gets a group of its own: in a
# shared group, a newer run replaces a pending one even without
# cancel-in-progress, which would leave a develop commit untested.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and Test on ${{ matrix.os }} (${{ matrix.compiler }}, ${{ matrix.build_type }}, ${{ matrix.sanitizer }}${{ matrix.coverage == 'on' && ', coverage' || '' }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        compiler: [gcc, clang]
        # `asan` builds with -DERNIC_USE_SANITIZERS=ON, which turns on
        # ASan, LSan, UBSan, and the compiler's other checks that can be
        # combined with them; `tsan` builds with
        # -DERNIC_USE_THREAD_SANITIZER=ON. The two are mutually exclusive
        # (cmake/ErnicSanitizers.cmake makes that a hard error), hence one
        # leg each rather than a combined build.
        sanitizer: [ 'off', asan, tsan ]
        # Release is not just "Debug with -O3". It is the only configuration
        # that exercises three things Debug cannot:
        #
        #   - the optimisation-dependent warnings. ERNIC_WERROR is ON, and
        #     -Wstrict-overflow=4, -Wunsafe-loop-optimizations,
        #     -Wnull-dereference and -Wmaybe-uninitialized are all dataflow
        #     warnings that GCC only issues once the optimiser has run.
        #   - _FORTIFY_SOURCE=3. Both compiler-options modules gate it on
        #     the flags matching -O[2-3s], so the Debug legs compile with it
        #     off entirely.
        #   - NDEBUG, which compiles out assert().
        #
        # The optimiser also reorders and caches aggressively at -O3, which
        # is what makes the Release tsan legs a stronger race check than the
        # Debug ones (see the -Og note in the configure step below).
        build_type: [Debug, Release]
        # coverage is a matrix key, 'off' everywhere, only so the include
        # below adds a leg: an include whose keys all match an existing
        # combination would turn that combination into the coverage leg
        # instead of adding one.
        coverage: [ 'off' ]
        include:
          # One code coverage leg (LLVM source-based coverage, so Clang).
          # Debug, so the report's lines match the source.
          - os: ubuntu-24.04
            compiler: clang
            sanitizer: 'off'
            build_type: Debug
            coverage: 'on'
          # The plain GCC Debug leg also runs the tests under valgrind's
          # memcheck, which finds reads of uninitialized memory, including
          # uninitialized bytes passed to a system call such as send(),
          # that the sanitizers don't look for. Every other key matches
          # that leg, so this adds valgrind to it rather than adding a leg.
          # It can't be a sanitizer leg, since valgrind can't run a program
          # built with ASan or TSan, or a Clang one, since Clang's
          # -ftrivial-auto-var-init=pattern initializes every local
          # variable, which hides the reads valgrind would report.
          - os: ubuntu-24.04
            compiler: gcc
            sanitizer: 'off'
            build_type: Debug
            coverage: 'off'
            valgrind: 'on'

    # The sanitizer builds make every report fatal: ASan, LSan, and UBSan
    # with -fno-sanitize-recover=all, and TSan with halt_on_error=1, which
    # each program sets along with the sanitizers' other default options
    # (cmake/sanitizer-default-options.c). This adds to those defaults.
    # detect_leaks is spelled out rather than left to the platform default.
    # The tsan legs ignore it.
    env:
      ASAN_OPTIONS: detect_leaks=1

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      
      - name: Cache apt packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /var/cache/apt/archives
          key: apt-${{ matrix.os }}-${{ matrix.compiler }}-${{ matrix.build_type }}-build-and-test-${{ hashFiles('.github/workflows/build-and-test.yml') }}
          restore-keys: apt-${{ matrix.os }}-${{ matrix.compiler }}-${{ matrix.build_type }}-build-and-test-

      # build-essential, cmake, ninja-build and pkg-config are preinstalled
      # on the hosted image, so only the things it does not ship are listed.
      #
      # libjson-c-dev is this project's own dependency, not just
      # libvfio-user's: the configure step below passes
      # -DERNIC_BUILD_P4=ON, and that is a REQUIRED pkg_check_modules.
      # It used to be installed beside meson in the libvfio-user step,
      # which runs only on a cache miss, so the configure would have
      # started failing the moment that cache was warm -- which on a
      # branch with its own cache scope is not the run that introduced
      # it.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libibverbs-dev \
            librdmacm-dev \
            libglib2.0-dev \
            libjson-c-dev

      # The coverage report needs the llvm-profdata and llvm-cov of the
      # compiler's own LLVM version, since the profile format changes
      # between versions, so the package is picked from clang's.
      - name: Install LLVM coverage tools
        if: matrix.coverage == 'on'
        run: |
          major=$(clang -dumpversion | cut -d. -f1)
          sudo apt-get install -y "llvm-${major}"

      # Before the configure step, which looks for valgrind's header: a test
      # uses it to skip a row that can't work under valgrind.
      - name: Install valgrind
        if: matrix.valgrind == 'on'
        run: sudo apt-get install -y valgrind

      - name: Cache libvfio-user build
        id: cache-libvfio-user
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /usr/lib/x86_64-linux-gnu/libvfio-user*
            /usr/lib/x86_64-linux-gnu/pkgconfig/libvfio-user.pc
            /usr/include/vfio-user
          key: libvfio-user-5b9c722-${{ matrix.os }}

      - name: Clone and build libvfio-user
        if: steps.cache-libvfio-user.outputs.cache-hit != 'true'
        run: |
          # meson builds libvfio-user and libcmocka-dev builds its tests;
          # nothing else in this job needs either, and the cache key is
          # static, so installing them here keeps them off the
          # steady-state cache-hit path. json-c is not among them: this
          # project needs it too, so it is installed unconditionally
          # above.
          sudo apt-get install -y meson libcmocka-dev
          # Pin to 5b9c722 (pci: preserve upper address bits of small
          # 64-bit BARs, Oct 23 2026). Before it, the upper half of a
          # 64-bit BAR smaller than 4 GiB, as BAR0 and BAR2 are, wasn't
          # writable, so a guest couldn't place the BAR above 4 GiB. It
          # also needs the vfu_setup_device_dma() max_regions parameter
          # added in f3742ed9 (#835), and 5d64ebf (#842): before it,
          # removing every DMA region, as a reset on disconnect does, left
          # a cached region pointer to freed memory for the next DMA. The
          # VM lanes' container images are still built with 8039244, the
          # commit before it.
          git clone https://github.com/nutanix/libvfio-user.git /tmp/libvfio-user
          cd /tmp/libvfio-user
          git checkout 5b9c722
          meson setup build --prefix=/usr -Dwarning_level=0
          ninja -C build
          sudo ninja -C build install
          sudo ldconfig

      - name: Reload ldconfig after cache restore
        if: steps.cache-libvfio-user.outputs.cache-hit == 'true'
        run: sudo ldconfig
      
      - name: Configure project with CMake
        env:
          SANITIZER: ${{ matrix.sanitizer }}
          BUILD_TYPE: ${{ matrix.build_type }}
          COVERAGE: ${{ matrix.coverage }}
        run: |
          asan=OFF
          tsan=OFF
          case "$SANITIZER" in
            asan) asan=ON ;;
            tsan) tsan=ON ;;
          esac
          coverage=OFF
          if [ "$COVERAGE" = "on" ]; then
            coverage=ON
          fi

          # Only the Debug legs need their optimisation level adjusted, and
          # only for tsan. Debug is -O0, which makes a weaker tsan leg than
          # it looks: the compiler does not reorder or cache enough to
          # expose the races a production build will hit. Measured against
          # the reintroduced recv_thread_running race, gcc reports 1 race at
          # -O0 but 2 at -Og, so this is not theoretical.
          #
          # -Og rather than -O1 because it is the level designed to pair
          # with -g, and it detects identically here -- the same comparison
          # gives -Og and -O1 the same race count on both compilers.
          # (profiler-hub-sanitizers.yml in rocm-systems uses -O1 for the
          # same underlying reason.)
          #
          # Release is left at its stock -O3 -DNDEBUG. Overriding it the way
          # the Debug legs do would defeat the point of the leg: -Og is a
          # *lower* optimisation level than -O3, so forcing it here would
          # make the Release tsan run a weaker check than the code it is
          # meant to model, and would drop the NDEBUG and _FORTIFY_SOURCE=3
          # coverage that justifies the leg in the first place.
          build_type_flags=()
          if [ "$BUILD_TYPE" = "Debug" ]; then
            debug_flags="-g"
            if [ "$SANITIZER" = "tsan" ]; then
              debug_flags="-g -Og"
            fi
            build_type_flags+=("-DCMAKE_C_FLAGS_DEBUG=$debug_flags")
          fi

          cmake -B build -G Ninja \
            -DCMAKE_C_COMPILER=${{ matrix.compiler }} \
            -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
            "${build_type_flags[@]}" \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DERNIC_INSTALL_SERVICE=ON \
            -DERNIC_WERROR=ON \
            -DERNIC_BUILD_P4=ON \
            -DERNIC_USE_SANITIZERS=$asan \
            -DERNIC_USE_THREAD_SANITIZER=$tsan \
            -DERNIC_USE_CODE_COVERAGE=$coverage

      - name: Build project
        run: cmake --build build
      
      - name: Verify binaries exist
        run: |
          ls -lh build/rocm-ernic
          ls -lh build/tests/test_pci_client
          ls -lh build/tests/test_data_transfer
          file build/rocm-ernic
          file build/tests/test_pci_client
          file build/tests/test_data_transfer
      
      - name: Check binary dependencies
        run: |
          echo "=== rocm-ernic dependencies ==="
          ldd build/rocm-ernic
          echo ""
          echo "=== test_pci_client dependencies ==="
          ldd build/tests/test_pci_client
          echo ""
          echo "=== test_data_transfer dependencies ==="
          ldd build/tests/test_data_transfer
      
      # Every registered test runs on a hosted runner now -- the three that
      # needed a real RDMA device moved into the VM system tests, so a
      # Skipped line here means something is wrong rather than absent.
      #
      # TEST_WRAP is the ASLR workaround for the tsan legs: TSan maps a large
      # fixed shadow region at startup and aborts with "unexpected memory
      # mapping" when the loader has already randomised something into it.
      # Ubuntu 24.04 ships 32 bits of mmap entropy, which is enough for that
      # to happen on essentially every run -- unwrapped, 13 of 14 tests die
      # before main().
      #
      # `setarch -R` is used rather than `sysctl -w vm.mmap_rnd_bits=28`
      # because it needs no privileges. The sysctl is the other standard fix
      # and is what rocprofiler-sdk uses, but vm.* sysctls are not namespaced
      # and not every runner grants passwordless sudo, so it has to be
      # arranged out-of-band on the host; hipfile-sanitizers.yml carries a
      # note about exactly that. Empty on the non-tsan legs.
      - name: Verify ionic PCI identity without a VM
        env:
          SANITIZER: ${{ matrix.sanitizer }}
        run: |
          TEST_WRAP=""
          if [ "$SANITIZER" = "tsan" ]; then
            TEST_WRAP="setarch $(uname -m) -R"
          fi
          $TEST_WRAP ctest --test-dir build --output-on-failure \
            -R '^ionic-ci$'

      # ernic-package-deb (tests/package/run-package-test.cmake) builds
      # the DEB packages, with the service files (ERNIC_INSTALL_SERVICE
      # above), and checks their files, modes, and dependencies. It's only
      # registered if dpkg-dev, file, and readelf are installed, as they
      # are on the hosted image, so --no-tests=error makes sure it ran.
      # It runs CMake and CPack, not the server, so it needs no setarch.
      - name: Check the packages
        run: |
          ctest --test-dir build --output-on-failure --no-tests=error \
            -R '^ernic-package-deb$'

      - name: Run remaining tests
        env:
          SANITIZER: ${{ matrix.sanitizer }}
        run: |
          TEST_WRAP=""
          if [ "$SANITIZER" = "tsan" ]; then
            TEST_WRAP="setarch $(uname -m) -R"
          fi
          $TEST_WRAP ctest --test-dir build --output-on-failure \
            -E '^(ionic-ci|ernic-package-deb)$' \
            --output-junit build/Testing/ctest-junit.xml

      # Runs the test programs under valgrind's memcheck. Valgrind makes a
      # test fail if it finds an error, such as a read of uninitialized
      # memory, uninitialized bytes passed to a system call, or a read of
      # memory that isn't allocated, or a leak that's definitely or
      # possibly lost. It doesn't report memory that's still reachable at
      # exit.
      #
      # The excluded tests run scripts or CMake, or start the server, so
      # valgrind would only check bash, CMake, or the program that starts
      # the server. The next step runs the server under valgrind instead.
      # Valgrind writes its reports to a log for each test, not to ctest's
      # output, so the logs of the tests with a report are printed here.
      - name: Test with valgrind
        if: matrix.valgrind == 'on'
        run: |
          status=0
          ctest --test-dir build -T memcheck --output-on-failure --no-tests=error -j"$(nproc)" \
            --overwrite "MemoryCheckCommand=$(command -v valgrind)" \
            --overwrite "MemoryCheckCommandOptions=--leak-check=full --track-origins=yes --num-callers=40 --error-exitcode=1" \
            -E '^(pci-config-test|find-rdma-device-tuple|find-ipv4-gid-index|server-lifecycle|ionic-server-smoke|ionic-ci|tcp-mesh-ci|nvmeof-ci|s3-ci|ionic-stats-interval-cli|ionic-eth-queues-cli|cmake-subproject|ernic-package-deb|ernic-vfu-client|ernic-ionic-driver|ernic-p4-driver|ernic-ionic-hw-stats|ernic-mesh-stress)$' \
            || status=$?
          shopt -s nullglob
          for log in build/Testing/Temporary/MemoryChecker.*.log; do
            if ! grep -q 'ERROR SUMMARY: 0 errors' "${log}"; then
              echo "::error::valgrind reported errors in ${log}"
              cat "${log}"
            fi
          done
          exit "${status}"

      # Runs the tests that start the server, and the loopback
      # configurations, with every server they start under valgrind's
      # memcheck. The test scripts run the server under the command in
      # ERNIC_TEST_SERVER_WRAPPER. test_server_lifecycle runs under
      # valgrind itself, with --trace-children=yes to follow it into each
      # server it starts, since a C program that runs a command from the
      # environment is what CodeQL's cpp/uncontrolled-process-operation
      # reports. The scripts don't all check how the server exited, so
      # valgrind writes a log for each process, and the step fails if any
      # log lacks a clean summary, which includes a server that was killed
      # before valgrind could write one.
      #
      # ernic-mesh-stress is left out for that last reason: it SIGKILLs
      # nodes on purpose, to see what the manager does with one that dies
      # without cleaning up, so its servers cannot all write a summary. It
      # runs under the sanitizers instead, in the other legs.
      - name: Test the server with valgrind
        if: matrix.valgrind == 'on'
        run: |
          logs="${PWD}/build/valgrind-server"
          mkdir -p "${logs}"
          valgrind="$(command -v valgrind)"
          opts=(--log-file="${logs}/%p.log" --leak-check=full --track-origins=yes --num-callers=40 --error-exitcode=1)
          ERNIC_TEST_SERVER_WRAPPER="${valgrind} ${opts[*]}"
          export ERNIC_TEST_SERVER_WRAPPER
          status=0
          ctest --test-dir build --output-on-failure --no-tests=error \
            -R '^(pci-config-test|ionic-server-smoke|ionic-ci|tcp-mesh-ci|nvmeof-ci|s3-ci|ernic-vfu-client|ernic-ionic-driver|ernic-p4-driver|ernic-ionic-hw-stats|ionic-stats-interval-cli|ionic-eth-queues-cli)$' \
            || status=$?
          "${valgrind}" --trace-children=yes "${opts[@]}" \
            build/tests/test_server_lifecycle || status=$?
          SERVER_BIN=build/rocm-ernic \
          TEST_BIN=build/tests/test_data_transfer \
          tests/test_loopback_ci.sh || status=$?
          shopt -s nullglob
          found=0
          for log in "${logs}"/*.log; do
            found=1
            if ! grep -q 'ERROR SUMMARY: 0 errors' "${log}"; then
              echo "::error::valgrind reported errors in ${log}"
              cat "${log}"
              status=1
            fi
          done
          if [ "${found}" -eq 0 ]; then
            echo "::error::no server ran under valgrind"
            status=1
          fi
          exit "${status}"

      - name: Test loopback backend configurations
        env:
          SANITIZER: ${{ matrix.sanitizer }}
        run: |
          echo "=== Testing loopback backend configurations ==="
          TEST_WRAP=""
          if [ "$SANITIZER" = "tsan" ]; then
            TEST_WRAP="setarch $(uname -m) -R"
          fi
          # No fallback branch: a missing script used to silently downgrade
          # this step to a weaker startup check that could not detect a
          # backend regression.
          SERVER_BIN=build/rocm-ernic \
          TEST_BIN=build/tests/test_data_transfer \
          $TEST_WRAP tests/test_loopback_ci.sh

      # Runs after every test step, so the report counts the loopback
      # configurations as well as ctest. The report's summary goes on the
      # run's summary page, and the job fails if line coverage of src/ is
      # below MIN_LINE_COVERAGE, a floor under the measured figure
      # that stops it sliding; raise it as tests are added. The step also
      # writes the line coverage to build/coverage/coverage.json, in the
      # format of a shields.io endpoint badge, which the
      # publish-coverage-badge job publishes for the README's badge.
      - name: Code coverage report
        if: matrix.coverage == 'on'
        env:
          MIN_LINE_COVERAGE: 60
        run: |
          cmake --build build --target ernic-coverage
          {
            echo '# Code coverage'
            echo '```'
            cat build/coverage/report.txt
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
          # The TOTAL line's tenth field is the line coverage, e.g. 40.02%
          awk -v min="${MIN_LINE_COVERAGE}" \
            -v badge=build/coverage/coverage.json '
            $1 == "TOTAL" { lines = $10 }
            END {
              if (lines == "") {
                print "::error::No TOTAL line in the coverage report"
                exit 1
              }
              sub(/%$/, "", lines)
              if (lines !~ /^[0-9]+(\.[0-9]+)?$/) {
                printf "::error::Bad line coverage in the report: %s\n", lines
                exit 1
              }
              # Coverage below the floor fails the job, so the badge is
              # never published with it and keeps the last passing value.
              pct = lines + 0
              color = pct >= 90 ? "brightgreen" : \
                      pct >= 75 ? "green" : \
                      pct >= 60 ? "yellowgreen" : \
                      pct >= 40 ? "yellow" : \
                      pct >= 20 ? "orange" : "red"
              printf "{\"schemaVersion\":1,\"label\":\"coverage\",\"message\":\"%s%%\",\"color\":\"%s\"}\n", \
                lines, color > badge
              close(badge)
              if (pct < min) {
                printf "::error::Line coverage is %s%%, below the %s%% floor\n", lines, min
                exit 1
              }
              printf "Line coverage is %s%% (floor %s%%)\n", lines, min
            }' build/coverage/report.txt

      # Only develop's coverage goes on the badge, not a pull request's or
      # another branch's.
      - name: Upload coverage badge data
        if: >-
          matrix.coverage == 'on' &&
          github.event_name != 'pull_request' &&
          github.ref == 'refs/heads/develop'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-badge
          path: build/coverage/coverage.json
          if-no-files-found: error
          retention-days: 1

      # The coverage leg shares its compiler, build type and sanitizer with
      # a plain leg, and artifact names must be unique within a run.
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.compiler }}-${{ matrix.build_type }}-${{ matrix.sanitizer }}${{ matrix.coverage == 'on' && '-coverage' || '' }}
          path: build/Testing/
          retention-days: 7

      # A single leg publishes binaries: gcc, Release, uninstrumented.
      #
      # Release because that is what anyone downloading these would want to
      # run, gcc because it is the reference compiler, and uninstrumented
      # because a sanitizer build is a check rather than an artifact and
      # cannot run without its runtime anyway.
      #
      # Gating on all three matters now that build_type is in the matrix:
      # the old `sanitizer == 'off'` condition would match four legs, and
      # since artifact names must be unique within a run, the three extra
      # uploads would be a hard failure rather than a silent duplicate.
      - name: Upload binaries
        if: >-
          success() && matrix.sanitizer == 'off'
          && matrix.compiler == 'gcc' && matrix.build_type == 'Release'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binaries-${{ matrix.os }}-${{ matrix.compiler }}-${{ matrix.build_type }}
          path: |
            build/rocm-ernic
            build/tests/test_pci_client
            build/tests/test_data_transfer
          retention-days: 7

  # Publish develop's line coverage for the README's Coverage badge, which
  # shields.io draws from coverage.json on the badges branch. That branch
  # holds a single commit with only that file, replaced on every run, so
  # it never grows. It is kept off gh-pages so it never races the perf
  # lanes and docs-deploy for that branch. This is a separate job so that
  # the token that can push to the repository is never present while the
  # repository's code runs; this job only copies the build job's JSON into
  # the branch. It runs only when every build leg passes, so the badge
  # shows the coverage of the latest develop commit that passed.
  publish-coverage-badge:
    name: Publish Coverage Badge
    needs: build-test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push to the badges branch
    # One publish at a time. A newer pending run replaces an older one.
    # This does not order the publishes: the build jobs are in groups of
    # their own, so runs can reach here out of order. "Publish to badges"
    # does that.
    concurrency:
      group: ${{ github.workflow }}-publish-coverage-badge
      cancel-in-progress: false
    steps:
      # Only for a repository to push from and for develop's history:
      # nothing in the checkout runs.
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history, for the ancestry check in "Publish to
          # badges".
          fetch-depth: 0
          # "Publish to badges" pushes through origin with this token.
          persist-credentials: true

      # Outside the workspace, so it can't land in either worktree.
      - name: Download coverage badge data
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-badge
          path: ${{ runner.temp }}/coverage-badge

      - name: Publish to badges
        run: |
          set -euo pipefail

          git config user.name  "rocm-ernic-ci"
          git config user.email "rocm-ernic-ci@users.noreply.github.com"
          git config commit.gpgSign false

          # Runs can get here out of order, and an old run can be re-run,
          # so a run whose commit is the published one or an ancestor of
          # it publishes nothing. The published commit is the
          # Source-Commit trailer of the badges commit. If that is not
          # in develop's history (develop was rewritten), this run
          # publishes. The push's lease makes it fail, rather than
          # overwrite, if badges moved after this check.
          lease=$(git ls-remote origin refs/heads/badges | cut -f1)
          if [ -n "${lease}" ]; then
            git fetch --quiet origin "${lease}"
            published=$(git log -1 \
              --format='%(trailers:key=Source-Commit,valueonly)' "${lease}")
            if [[ "${published}" =~ ^[0-9a-f]{40}$ ]] &&
               git cat-file -e "${published}^{commit}" 2>/dev/null &&
               git merge-base --is-ancestor "${GITHUB_SHA}" "${published}"; then
              echo "badges has ${published}, which contains ${GITHUB_SHA}: not published"
              exit 0
            fi
          fi

          git worktree add --quiet --orphan -b badges ../badges
          cp "${RUNNER_TEMP}/coverage-badge/coverage.json" ../badges/
          git -C ../badges add coverage.json
          git -C ../badges commit --quiet \
            -m "Coverage badge from ${GITHUB_SHA}" \
            -m "Published by build-and-test.yml. [skip ci]" \
            -m "Source-Commit: ${GITHUB_SHA}"
          git -C ../badges push --quiet \
            --force-with-lease="refs/heads/badges:${lease}" \
            origin HEAD:refs/heads/badges
          echo "published: $(cat ../badges/coverage.json)"
