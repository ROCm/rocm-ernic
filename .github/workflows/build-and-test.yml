name: rocm-ernic - Build and Test

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'service/**'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - '.github/workflows/build-and-test.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and Test on ${{ matrix.os }} (${{ matrix.compiler }}, ${{ matrix.sanitizer }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        compiler: [gcc, clang]
        # `asan` builds with -DERNIC_USE_SANITIZERS=ON, which turns on
        # ASan + LSan + UBSan together (see cmake/ErnicSanitizers.cmake).
        # TSan is deliberately absent: it is mutually exclusive with this
        # set, and the hosted runners' ASLR entropy makes it abort before
        # main() without a `setarch -R` wrapper.
        sanitizer: [ 'off', asan ]

    # UBSan's default is to print a diagnostic and keep going with a zero
    # exit status, so without halt_on_error the asan legs would report
    # success over real undefined behaviour. ASan and LSan already exit
    # non-zero on a finding; detect_leaks is spelled out rather than left
    # to the platform default. Ignored by the non-sanitizer legs, which
    # have no sanitizer runtime to read them.
    env:
      ASAN_OPTIONS: detect_leaks=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Cache apt packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /var/cache/apt/archives
          key: apt-${{ matrix.os }}-${{ matrix.compiler }}-build-and-test-${{ hashFiles('.github/workflows/build-and-test.yml') }}
          restore-keys: apt-${{ matrix.os }}-${{ matrix.compiler }}-build-and-test-

      # build-essential, cmake, ninja-build and pkg-config are preinstalled
      # on the hosted image, so only the things it does not ship are listed.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libibverbs-dev \
            librdmacm-dev \
            libglib2.0-dev

      - name: Cache libvfio-user build
        id: cache-libvfio-user
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /usr/lib/x86_64-linux-gnu/libvfio-user*
            /usr/lib/x86_64-linux-gnu/pkgconfig/libvfio-user.pc
            /usr/include/vfio-user
          key: libvfio-user-20e9803-${{ matrix.os }}

      - name: Clone and build libvfio-user
        if: steps.cache-libvfio-user.outputs.cache-hit != 'true'
        run: |
          # meson and libjson-c-dev build libvfio-user and libcmocka-dev
          # builds its tests; nothing else in this job needs them, and the
          # cache key is static, so installing them here keeps them off the
          # steady-state cache-hit path.
          sudo apt-get install -y meson libjson-c-dev libcmocka-dev
          # Pin to 20e9803 (De-duplicate FDs for DMA region access, Apr 7 2026)
          # This version includes the vfu_setup_device_dma() max_regions
          # parameter added in f3742ed9 (#835).
          git clone https://github.com/nutanix/libvfio-user.git /tmp/libvfio-user
          cd /tmp/libvfio-user
          git checkout 20e9803
          meson setup build --prefix=/usr -Dwarning_level=0
          ninja -C build
          sudo ninja -C build install
          sudo ldconfig

      - name: Reload ldconfig after cache restore
        if: steps.cache-libvfio-user.outputs.cache-hit == 'true'
        run: sudo ldconfig
      
      - name: Configure project with CMake
        env:
          SANITIZER: ${{ matrix.sanitizer }}
        run: |
          san=OFF
          if [ "$SANITIZER" = "asan" ]; then
            san=ON
          fi
          cmake -B build -G Ninja \
            -DCMAKE_C_COMPILER=${{ matrix.compiler }} \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DERNIC_WERROR=ON \
            -DERNIC_USE_SANITIZERS=$san
      
      - name: Build project
        run: cmake --build build
      
      - name: Verify rdma_cm protocol symbols
        run: |
          echo "=== Verifying rdma_cm_proto.c symbols ==="
          if nm build/rocm-ernic 2>/dev/null | grep -q "rdma_cm_process_message"; then
            echo "✓ rdma_cm_process_message symbol found in binary"
          else
            echo "⚠️  rdma_cm_process_message symbol not found (may be inlined)"
          fi
      
      - name: Verify binaries exist
        run: |
          ls -lh build/rocm-ernic
          ls -lh build/tests/test_pci_client
          ls -lh build/tests/test_data_transfer
          file build/rocm-ernic
          file build/tests/test_pci_client
          file build/tests/test_data_transfer
      
      - name: Check binary dependencies
        run: |
          echo "=== rocm-ernic dependencies ==="
          ldd build/rocm-ernic
          echo ""
          echo "=== test_pci_client dependencies ==="
          ldd build/tests/test_pci_client
          echo ""
          echo "=== test_data_transfer dependencies ==="
          ldd build/tests/test_data_transfer
      
      # Every registered test runs on a hosted runner now -- the three that
      # needed a real RDMA device moved into the VM system tests, so a
      # Skipped line here means something is wrong rather than absent.
      - name: Run tests
        run: |
          ctest --test-dir build --output-on-failure \
            --output-junit build/Testing/ctest-junit.xml

      - name: Test loopback backend configurations
        run: |
          echo "=== Testing loopback backend configurations ==="
          # No fallback branch: a missing script used to silently downgrade
          # this step to a weaker startup check that could not detect a
          # backend regression.
          SERVER_BIN=build/rocm-ernic \
          TEST_BIN=build/tests/test_data_transfer \
          tests/test_loopback_ci.sh

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.compiler }}-${{ matrix.sanitizer }}
          path: build/Testing/
          retention-days: 7
      
      # Only the uninstrumented legs, whose binaries are the ones anyone
      # would want to download; a sanitizer build is a check, not an
      # artifact, and it cannot run without its runtime anyway.
      - name: Upload binaries
        if: success() && matrix.sanitizer == 'off'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binaries-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            build/rocm-ernic
            build/tests/test_pci_client
            build/tests/test_data_transfer
          retention-days: 7
