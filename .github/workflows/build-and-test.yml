name: Build and Test

on:
  push:
    branches: [ main, dev/*, test-* ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-24.04
    
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          meson \
          ninja-build \
          gcc \
          pkg-config \
          libjson-c-dev \
          libcmocka-dev \
          libibverbs-dev \
          librdmacm-dev \
          rdma-core \
          ibverbs-utils
    
    - name: Install libvfio-user
      run: |
        git clone https://github.com/nutanix/libvfio-user.git /tmp/libvfio-user
        cd /tmp/libvfio-user
        git checkout 0.9.2
        mkdir build
        cd build
        cmake -DCMAKE_BUILD_TYPE=Release ..
        make -j$(nproc)
        sudo make install
        sudo ldconfig
    
    - name: Configure with Meson
      run: |
        meson setup build \
          -Dbuildtype=debug \
          -Db_sanitize=address,undefined
    
    - name: Build
      run: meson compile -C build
    
    - name: Run loopback backend tests
      run: |
        cd tests
        # Build test client
        gcc -o test_loopback_ci test_loopback_standalone.c \
          -I../src -libverbs -lpthread
        
        # Start server in background
        timeout 300 sudo ../build/vfu_pvrdma \
          -s /tmp/vfio-test.sock \
          -b loopback > /tmp/server.log 2>&1 &
        SERVER_PID=$!
        
        # Wait for socket
        for i in {1..30}; do
          if [ -S /tmp/vfio-test.sock ]; then
            break
          fi
          sleep 1
        done
        
        # Run tests
        sudo ./test_loopback_ci
        TEST_EXIT=$?
        
        # Cleanup
        sudo kill $SERVER_PID 2>/dev/null || true
        
        # Show logs on failure
        if [ $TEST_EXIT -ne 0 ]; then
          echo "=== Server Log ==="
          cat /tmp/server.log
        fi
        
        exit $TEST_EXIT
    
    - name: Upload server logs on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: server-logs
        path: /tmp/server.log

