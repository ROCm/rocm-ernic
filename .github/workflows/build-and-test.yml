name: Build and Test

on:
  push:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          meson \
          ninja-build \
          gcc \
          pkg-config \
          libglib2.0-dev \
          libjson-c-dev \
          libcmocka-dev \
          libibverbs-dev \
          librdmacm-dev \
          rdma-core \
          ibverbs-utils
    
    - name: Install libvfio-user
      run: |
        git clone https://github.com/nutanix/libvfio-user.git /tmp/libvfio-user
        cd /tmp/libvfio-user
        meson setup build --prefix=/usr -Dwarning_level=0
        ninja -C build
        sudo ninja -C build install
        sudo ldconfig
    
    - name: Configure with Meson
      run: |
        meson setup build \
          -Dbuildtype=debug \
          -Db_sanitize=address,undefined
    
    - name: Build
      run: meson compile -C build
    
    # Note: Loopback backend tests require RDMA hardware and are not
    # suitable for CI environments. They are tested locally with real
    # RDMA devices. CI focuses on build verification and basic
    # functionality tests.

