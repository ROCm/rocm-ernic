name: rocm-ernic - CMB/EXPDB Lane

# The CMB/EXPDB system-test lane, factored out of system-tests.yml.
#
# Verifies the BAR4 express-doorbell path end to end: the DISCOVER_CMB
# devcmd, Q_IDENTIFY reporting IONIC_QIDENT_F_EXPDB, CREATE_QP with the
# CMB priv_flags, and WQE doorbells written directly to the EXPDB region
# by the guest ionic_rdma driver.
#
# Caller:
#   .github/workflows/system-tests.yml
#
# There is deliberately no `permissions:` block here: a reusable
# workflow runs with the calling job's token, so the scopes are the
# caller's business, not this file's.

on:
  workflow_call:

jobs:
  system-test-expdb:
    name: CMB/EXPDB Ionic Mode
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    container:
      image: sbates130272/batesste-ci-images-ubuntu-qemu-libvfio-user:20260918.g7438e48-qemu11.1.1-vfu.8039244
      # /dev/kvm lets the guest run accelerated; this lane needs no TAP
      # or NET_ADMIN because --backend loopback has no Ethernet data path.
      options: --device /dev/kvm

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Load the guest image pin
      shell: bash
      run: grep -E '^[A-Za-z_][A-Za-z0-9_]*=' ci/guest-image.env
        >> "$GITHUB_ENV"

    - name: Select QEMU accelerator and guest size
      shell: bash
      env:
        VMS: 1
      run: |
        if [ -c /dev/kvm ] && qemu-system-x86_64 -accel help 2>/dev/null | grep -qw kvm; then
          echo "✓ /dev/kvm present; using KVM acceleration"
          echo "QEMU_ACCEL=kvm" >> "$GITHUB_ENV"
          echo "QEMU_CPU=host" >> "$GITHUB_ENV"
        else
          echo "⚠ /dev/kvm unavailable; falling back to TCG (guests will be slow)"
          echo "QEMU_ACCEL=tcg" >> "$GITHUB_ENV"
          echo "QEMU_CPU=qemu64" >> "$GITHUB_ENV"
        fi

        HOST_CPUS=$(nproc)
        HOST_MEM_MB=$(awk '/^MemTotal:/ {print int($2 / 1024)}' /proc/meminfo)

        VM_VCPUS=$(( (HOST_CPUS - 1) / VMS ))
        # Four is a hard floor: ionic_lif_size() sets neqs to
        # min(eq_qtype.qid_count, num_online_cpus()), and
        # ionic_create_rdma_admin() rejects anything below
        # IONIC_EQ_COUNT_MIN (4) with a silent -EINVAL that surfaces only
        # as "Failed to register ibdev".
        [ "$VM_VCPUS" -lt 4 ] && VM_VCPUS=4
        VM_MEM_MB=$(( HOST_MEM_MB * 3 / 4 / VMS ))
        [ "$VM_MEM_MB" -gt 8192 ] && VM_MEM_MB=8192
        [ "$VM_MEM_MB" -lt 1024 ] && VM_MEM_MB=1024

        echo "VM_VCPUS=$VM_VCPUS" >> "$GITHUB_ENV"
        echo "VM_MEM_MB=$VM_MEM_MB" >> "$GITHUB_ENV"
        echo "runner: ${HOST_CPUS} vCPU, ${HOST_MEM_MB} MB"
        echo "guests: ${VMS} x ${VM_VCPUS} vCPU, ${VM_MEM_MB} MB"

    - name: Display environment
      run: |
        echo "=== Environment ==="
        qemu-system-x86_64 --version || echo "QEMU not found"
        cmake --version || echo "CMake not found"
        ninja --version || echo "Ninja not found"
        pkg-config --exists libibverbs && pkg-config --modversion libibverbs || echo "libibverbs not found"

    - name: Fetch the guest VM image
      id: guest_image
      uses: $/.github/actions/fetch-guest-vm
      with:
        tag: ${{ env.GUEST_ARTIFACT_TAG }}

    - name: Read VM info
      id: vm_info
      shell: bash
      env:
        GUEST_IMAGE_DIR: ${{ steps.guest_image.outputs.output_dir }}
      run: |
        OUT="${GUEST_IMAGE_DIR}"
        echo "=== Reading VM info from $OUT/vm-info.json ==="
        if [ ! -f "$OUT/vm-info.json" ]; then
          echo "✗ vm-info.json not found in $OUT"
          ls -la "$OUT"
          exit 1
        fi

        cat "$OUT/vm-info.json"

        eval "$(python3 - "$OUT" <<'PYEOF'
        import json, os, shlex, sys
        out = sys.argv[1]
        d = json.load(open(os.path.join(out, "vm-info.json")))
        here = lambda p: os.path.join(out, os.path.basename(p)) if p else ""
        keys = {
            "VM_USER": d.get("username", "ci"),
            "VM_DISK": here(d.get("image_path", "")),
            "SSH_KEY": d.get("ssh_key", ""),
            "SSH_KEY_PRIVATE": here(d.get("ssh_keys", {}).get("private_key_path", "")),
            "SSH_KEY_PUBLIC": here(d.get("ssh_keys", {}).get("public_key_path", "")),
            "KERNEL_RELEASE": d.get("kernel_release", ""),
            "KERNEL_REF": d.get("provisioning", {}).get("kernel_ref", ""),
            "FLAVOUR": d.get("flavour", ""),
        }
        for k, v in keys.items():
            print(f"{k}={shlex.quote(str(v))}")
        PYEOF
        )"

        if [ -z "$VM_DISK" ]; then
          echo "✗ image_path not found in vm-info.json"
          exit 1
        fi

        if [ ! -f "$VM_DISK" ]; then
          echo "✗ VM disk image not found: $VM_DISK"
          ls -la "$OUT"
          exit 1
        fi

        QEMU_IMG_OUTPUT=$(qemu-img info "$VM_DISK" 2>&1)
        QEMU_IMG_EXIT=$?
        if [ $QEMU_IMG_EXIT -ne 0 ]; then
          if echo "$QEMU_IMG_OUTPUT" | grep -q "Could not open backing file"; then
            echo "✗ Disk image has backing file reference but backing file does not exist"
            echo "Disk path: $VM_DISK"
            echo "$QEMU_IMG_OUTPUT"
            exit 1
          else
            echo "✗ Failed to read disk image info"
            echo "$QEMU_IMG_OUTPUT"
            exit 1
          fi
        fi

        echo "✓ VM username: $VM_USER"
        echo "✓ VM disk: $VM_DISK"
        echo "✓ Guest flavour: ${FLAVOUR:-unknown}"
        echo "✓ Guest kernel: ${KERNEL_RELEASE:-unknown} (ionic ref ${KERNEL_REF:-unknown})"
        qemu-img info "$VM_DISK" || true

        {
          echo "vm_user=$VM_USER"
          echo "vm_disk=$VM_DISK"
          echo "ssh_key=$SSH_KEY"
          echo "ssh_key_private=$SSH_KEY_PRIVATE"
          echo "ssh_key_public=$SSH_KEY_PUBLIC"
          echo "kernel_release=$KERNEL_RELEASE"
        } >> "$GITHUB_OUTPUT"

    - name: Install dependencies
      run: |
        apt-get update
        apt-get install -y \
          libibverbs-dev \
          librdmacm-dev \
          iproute2

    - name: Verify libvfio-user from the image
      run: |
        set -e
        ldconfig
        HDR=/usr/local/include/vfio-user/libvfio-user.h
        LIB=$(find /usr/local/lib/x86_64-linux-gnu -maxdepth 1 -name 'libvfio-user.so*' 2>/dev/null | sort | head -1)
        if [ ! -f "$HDR" ] || [ -z "$LIB" ]; then
          echo "✗ libvfio-user missing from the container image"
          ls -la /usr/local/lib/x86_64-linux-gnu/ /usr/local/include/ || true
          exit 1
        fi
        if ! grep -A2 'vfu_setup_device_dma' "$HDR" | grep -q 'max_regions'; then
          echo "✗ libvfio-user in the image predates the"
          echo "  vfu_setup_device_dma() max_regions parameter (#835)."
          exit 1
        fi
        echo "✓ libvfio-user present: $LIB"

    - name: Build rocm-ernic server
      run: |
        echo "=== Building rocm-ernic server ==="
        cmake -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=Debug \
          -DCMAKE_INSTALL_PREFIX=/usr \
          -DERNIC_WERROR=ON
        cmake --build build
        ls -lh build/rocm-ernic
        echo "✓ Server built successfully"

    - name: Start rocm-ernic server
      shell: bash
      run: |
        echo "=== Starting rocm-ernic server (loopback backend) ==="
        rm -f /tmp/vfio-user-rocm-ernic.sock

        # The loopback backend reflects RDMA operations back through the
        # emulator without a TCP peer or an NVMe-oF controller, so this
        # lane needs no TAP, no bridge, and no second VM.  What it
        # exercises is the ionic emulation layer itself: DISCOVER_CMB,
        # Q_IDENTIFY with IONIC_QIDENT_F_EXPDB, CREATE_QP with CMB
        # priv_flags, and the guest's express-doorbell writes to BAR4.
        ./build/rocm-ernic \
          --socket /tmp/vfio-user-rocm-ernic.sock \
          --backend loopback \
          --verbose > /tmp/vfu_server.log 2>&1 &

        SERVER_PID=$!
        echo "SERVER_PID=$SERVER_PID" >> "$GITHUB_ENV"
        echo "Server PID: $SERVER_PID"

        for i in {1..30}; do
          if ! kill -0 "$SERVER_PID" 2>/dev/null; then
            echo "✗ Server process died (PID: $SERVER_PID)"
            cat /tmp/vfu_server.log
            exit 1
          fi
          if [ -S /tmp/vfio-user-rocm-ernic.sock ]; then
            echo "✓ Server started (PID: $SERVER_PID)"
            echo "✓ Socket created: /tmp/vfio-user-rocm-ernic.sock"
            ls -la /tmp/vfio-user-rocm-ernic.sock
            exit 0
          fi
          if [ $((i % 5)) -eq 0 ]; then
            echo "Waiting for socket... (attempt $i/30)"
          fi
          sleep 1
        done

        echo "✗ Server failed to create socket after 30 seconds"
        cat /tmp/vfu_server.log
        exit 1

    - name: Start QEMU VM
      shell: bash
      env:
        VM_INFO_DISK: ${{ steps.vm_info.outputs.vm_disk }}
      run: |
        echo "=== Starting QEMU VM ==="
        VM_DISK="${VM_INFO_DISK}"
        SSH_PORT=2222

        qemu-system-x86_64 \
          -machine "q35,accel=${QEMU_ACCEL},memory-backend=mem0,hpet=off" \
          -cpu "${QEMU_CPU}" \
          -smp "${VM_VCPUS}" \
          -m "${VM_MEM_MB}M" \
          -object "memory-backend-memfd,id=mem0,share=on,size=${VM_MEM_MB}M" \
          -nographic \
          -drive file="$VM_DISK",format=qcow2,if=virtio \
          -netdev user,id=net0,hostfwd=tcp::$SSH_PORT-:22 \
          -device virtio-net-pci,netdev=net0 \
          -device '{"driver":"vfio-user-pci","socket":{"type":"unix","path":"/tmp/vfio-user-rocm-ernic.sock"}}' \
          -serial file:/tmp/qemu-console.log \
          -monitor none \
          -qmp unix:/tmp/qmp.sock,server=on,wait=off > /tmp/qemu.log 2>&1 &

        QEMU_PID=$!
        echo "QEMU_PID=$QEMU_PID" >> "$GITHUB_ENV"
        echo "SSH_PORT=$SSH_PORT" >> "$GITHUB_ENV"
        echo "✓ QEMU started (PID: $QEMU_PID)"

        sleep 5
        if ! kill -0 "$QEMU_PID" 2>/dev/null; then
          echo "✗ QEMU process died within 5 seconds"
          cat /tmp/qemu.log || echo "Log file not found"
          cat /tmp/qemu-console.log || echo "Console log not found"
          exit 1
        fi
        echo "✓ QEMU still running after 5 seconds"

    - name: Setup SSH keys
      shell: bash
      env:
        VM_INFO_SSH_KEY_PRIVATE: ${{ steps.vm_info.outputs.ssh_key_private }}
        VM_INFO_SSH_KEY_PUBLIC: ${{ steps.vm_info.outputs.ssh_key_public }}
      run: |
        echo "=== Setting up SSH keys ==="
        SSH_KEY_PRIVATE="${VM_INFO_SSH_KEY_PRIVATE}"
        SSH_KEY_PUBLIC="${VM_INFO_SSH_KEY_PUBLIC}"

        mkdir -p ~/.ssh
        chmod 700 ~/.ssh

        if [ -z "$SSH_KEY_PRIVATE" ] || [ -z "$SSH_KEY_PUBLIC" ]; then
          echo "✗ SSH key paths are required in vm-info.json"
          exit 1
        fi
        if [ ! -f "$SSH_KEY_PRIVATE" ]; then
          echo "✗ SSH private key file not found: $SSH_KEY_PRIVATE"
          exit 1
        fi
        if [ ! -f "$SSH_KEY_PUBLIC" ]; then
          echo "✗ SSH public key file not found: $SSH_KEY_PUBLIC"
          exit 1
        fi

        echo "✓ Using SSH keys from vm-info.json"
        ssh-keyscan -p "$SSH_PORT" localhost >> ~/.ssh/known_hosts 2>/dev/null || true

        SSH_CONFIG="$RUNNER_TEMP/ernic-ssh-config"
        cat > "$SSH_CONFIG" <<EOF
        Host *
          IdentityFile "$SSH_KEY_PRIVATE"
          IdentitiesOnly yes
          BatchMode yes
          StrictHostKeyChecking no
          UserKnownHostsFile "$HOME/.ssh/known_hosts"
        EOF
        echo "SSH_CONFIG=$SSH_CONFIG" >> "$GITHUB_ENV"
        echo "✓ SSH_CONFIG=$SSH_CONFIG"

        PW_HOME=$(getent passwd "$(id -u)" | cut -d: -f6)
        for d in "$PW_HOME" "$HOME"; do
          [ -n "$d" ] || continue
          mkdir -p "$d/.ssh"
          chmod 700 "$d/.ssh"
          install -m 600 "$SSH_KEY_PRIVATE" "$d/.ssh/id_rsa"
        done
        echo "✓ key installed for default-path ssh"

    - name: Wait for VM SSH
      shell: bash
      env:
        VM_INFO_USER: ${{ steps.vm_info.outputs.vm_user }}
      run: |
        echo "=== Waiting for VM SSH ==="
        VM_USER="${VM_INFO_USER}"

        for i in {1..60}; do
          if ssh -F "$SSH_CONFIG" -o ConnectTimeout=5 -p "$SSH_PORT" "${VM_USER}@localhost" 'echo VM Ready' 2>/tmp/ssh-attempt.err; then
            echo "✓ VM SSH is ready (attempt $i/60)"
            exit 0
          fi
          echo "Attempt $i/60: $(tr '\n' ' ' < /tmp/ssh-attempt.err | cut -c1-160)"
          sleep 5
        done

        echo "✗ VM SSH timeout"
        ssh -vvv -F "$SSH_CONFIG" -o ConnectTimeout=5 \
          -p "$SSH_PORT" "${VM_USER}@localhost" true 2>&1 | tail -40 || true
        "${GITHUB_WORKSPACE}/scripts/qemu-vm-diagnose.sh" \
          --label VM \
          --ssh-port "$SSH_PORT" \
          --qmp /tmp/qmp.sock \
          --console /tmp/qemu-console.log \
          --qemu-log /tmp/qemu.log \
          --pid "$QEMU_PID"
        exit 1

    - name: Verify the ionic PCI function is present in the VM
      shell: bash
      env:
        VM_USER: ${{ steps.vm_info.outputs.vm_user }}
      run: |
        echo "=== Verifying the emulated PCI function in the VM ==="
        ssh -F "$SSH_CONFIG" -p "$SSH_PORT" "${VM_USER}@localhost" 'bash -s' << 'EOFVM'
        set -e

        echo "=== PCI devices ==="
        sudo lspci -nn

        echo ""
        PCI_BDF="$(for dev in /sys/bus/pci/devices/*; do
          [ "$(cat "$dev/vendor")" = '0x1dd8' ] || continue
          [ "$(cat "$dev/device")" = '0x1002' ] || continue
          [ "$(cat "$dev/subsystem_vendor")" = '0x1dd8' ] || continue
          [ "$(cat "$dev/subsystem_device")" = '0x5400' ] || continue
          basename "$dev"
          break
        done)"
        if [ -z "$PCI_BDF" ]; then
          echo "✗ ionic PCI function 1dd8:1002 not present on the guest bus"
          exit 1
        fi

        SUBSYSTEM_VENDOR="$(cat "/sys/bus/pci/devices/$PCI_BDF/subsystem_vendor")"
        SUBSYSTEM_DEVICE="$(cat "/sys/bus/pci/devices/$PCI_BDF/subsystem_device")"
        if [ "$SUBSYSTEM_VENDOR" != '0x1dd8' ] || [ "$SUBSYSTEM_DEVICE" != '0x5400' ]; then
          echo "✗ ionic PCI function present, but subsystem is ${SUBSYSTEM_VENDOR#0x}:${SUBSYSTEM_DEVICE#0x}"
          exit 1
        fi
        echo "✓ ionic PCI function 1dd8:1002 present with subsystem 1dd8:5400"

        # The CMB/EXPDB region lives on BAR4.  Assert it is present and
        # mapped before the driver claims the device.
        BAR4_SIZE="$(cat "/sys/bus/pci/devices/$PCI_BDF/resource" | awk 'NR==5 {start=strtonum($1); end=strtonum($2); if (start && end) print end-start+1}')"
        if [ -z "$BAR4_SIZE" ] || [ "$BAR4_SIZE" -lt 1 ]; then
          echo "✗ BAR4 not present or zero-sized on $PCI_BDF"
          cat "/sys/bus/pci/devices/$PCI_BDF/resource"
          exit 1
        fi
        echo "✓ BAR4 present on $PCI_BDF (${BAR4_SIZE} bytes)"
        EOFVM

    - name: Install the Ansible collection dependencies
      shell: bash
      run: |
        echo "=== Installing the Ansible collection dependencies ==="
        ansible --version
        for attempt in 1 2 3; do
          if ansible-galaxy collection install community.general; then
            exit 0
          fi
          echo "::warning::galaxy install failed (attempt ${attempt}/3)"
          sleep $((attempt * 20))
        done
        echo "::error::galaxy install failed after 3 attempts"
        exit 1

    - name: Install kernel headers, build tools and pciutils in VM
      shell: bash
      env:
        VM_USER: ${{ steps.vm_info.outputs.vm_user }}
      run: |
        echo "=== Installing kernel headers, build tools and pciutils in VM ==="
        ssh -F "$SSH_CONFIG" -p "$SSH_PORT" "${VM_USER}@localhost" << 'EOFVM'
        set -e
        KVER=$(uname -r)

        HEADER_PKG=""
        if [ -d "/lib/modules/${KVER}/build" ]; then
          echo "Kernel headers already present for ${KVER}"
        else
          echo "No build tree for ${KVER}; asking apt for the headers"
          HEADER_PKG="linux-headers-${KVER}"
        fi

        for i in 1 2 3; do
          if sudo apt-get -o DPkg::Lock::Timeout=300 update -qq; then
            break
          fi
          echo "apt-get update retry $i/3"; sleep 5
        done
        for i in 1 2 3 4 5; do
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o DPkg::Lock::Timeout=300 install -y -qq \
            ${HEADER_PKG:+"$HEADER_PKG"} dkms git build-essential cmake ninja-build \
            pciutils \
            pkg-config libnl-3-dev libnl-route-3-dev libudev-dev && break
          [ "$i" -eq 5 ] && { echo "apt-get install failed after 5 attempts"; exit 1; }
          echo "apt-get install retry $i/5"; sleep 10
        done

        echo "✓ Kernel packages installed for ${KVER}"
        EOFVM

    - name: Provision the VM with the Ansible collection
      shell: bash
      env:
        VM_USER: ${{ steps.vm_info.outputs.vm_user }}
        SSH_KEY_PRIVATE: ${{ steps.vm_info.outputs.ssh_key_private }}
      run: |
        echo "=== Provisioning the guest via ernic_guest_setup ==="
        ERNIC_RUN_DIR=/tmp/ernic-ci
        mkdir -p "$ERNIC_RUN_DIR"

        cat > "$ERNIC_RUN_DIR/instances.json" << EOFJSON
        {
          "instances": [
            {
              "id": 1,
              "vm": {
                "vm_name": "gh-expdb-vm1",
                "ssh_port": ${SSH_PORT},
                "ssh_user": "${VM_USER}"
              }
            }
          ]
        }
        EOFJSON

        export ANSIBLE_HOST_KEY_CHECKING=false
        export ANSIBLE_PRIVATE_KEY_FILE="$SSH_KEY_PRIVATE"
        export ANSIBLE_ROLES_PATH="$PWD/ansible/roles"
        PROJECT_ROOT="$PWD"

        cd ansible
        # ernic_configure_nic is left at its default (true): ionic_rdma
        # needs an IP address to populate a RoCEv2 GID entry, without
        # which the loopback connect fails with ENETUNREACH.
        ansible-playbook ci-site.yml --tags guest-setup \
          -e ernic_project_root="$PROJECT_ROOT" \
          -e ernic_run_dir="$ERNIC_RUN_DIR" \
          -e ernic_instances=1 \
          -e ernic_vm_ssh_base_port="$SSH_PORT" \
          -e ernic_vm_ssh_user="$VM_USER" \
          -e ernic_gpu_passthrough=false \
          -e ernic_guest_agent=false \
          -e ernic_set_hostname=false

    - name: Verify the RDMA device and the EXPDB path
      shell: bash
      env:
        VM_USER: ${{ steps.vm_info.outputs.vm_user }}
        SSH_KEY_PRIVATE: ${{ steps.vm_info.outputs.ssh_key_private }}
      run: |
        echo "=== Verifying the RDMA device and CMB/EXPDB path ==="

        if ! kill -0 "$SERVER_PID" 2>/dev/null; then
          echo "✗ ERNIC server (PID $SERVER_PID) is no longer running"
          tail -30 /tmp/vfu_server.log || true
          exit 1
        fi
        echo "✓ ERNIC server still running (PID $SERVER_PID)"

        # The server logs DISCOVER_CMB and Q_IDENTIFY when the guest
        # driver queries them at module load time.  Assert the devcmds
        # appeared: a missing line means the driver skipped the EXPDB
        # negotiation and the rest of this check would be vacuous.
        if ! grep -q 'DISCOVER_CMB\|discover_cmb\|cmb' /tmp/vfu_server.log; then
          echo "⚠  No CMB devcmd in the server log yet (driver may still"
          echo "   be loading); checking again after RDMA device appears."
        fi

        DEVICE=$(ssh -F "$SSH_CONFIG" -p "$SSH_PORT" "${VM_USER}@localhost" \
          'sh -s' < scripts/find-rdma-device.sh | tr -d '\r') || true

        if [ -z "$DEVICE" ]; then
          echo "✗ RDMA device not found in the guest"
          ssh -F "$SSH_CONFIG" -p "$SSH_PORT" "${VM_USER}@localhost" \
            'ibv_devices; lsmod | grep ionic; sudo -n dmesg | grep -i ionic | tail -30' || true
          exit 1
        fi
        echo "✓ RDMA device found: $DEVICE"

        if ! ssh -F "$SSH_CONFIG" -p "$SSH_PORT" "${VM_USER}@localhost" \
             "ibv_devinfo -d $DEVICE" | tee /dev/stderr | grep -q 'PORT_ACTIVE'; then
          echo "✗ $DEVICE never reached PORT_ACTIVE"
          exit 1
        fi
        echo "✓ $DEVICE is PORT_ACTIVE"

        # Run an RDMA loopback round trip to exercise the EXPDB doorbell
        # path.  rdma_verify is built from tests/ and installed by
        # ernic_guest_setup.  Pass --loopback so it connects back to the
        # same device rather than waiting for a second VM.
        ERNIC_RUN_DIR=/tmp/ernic-ci
        export ANSIBLE_HOST_KEY_CHECKING=false
        export ANSIBLE_PRIVATE_KEY_FILE="$SSH_KEY_PRIVATE"
        export ANSIBLE_ROLES_PATH="$PWD/ansible/roles"
        PROJECT_ROOT="$PWD"
        cd ansible
        ansible-playbook ci-site.yml --tags rdma \
          -e ernic_project_root="$PROJECT_ROOT" \
          -e ernic_run_dir="$ERNIC_RUN_DIR" \
          -e ernic_instances=1 \
          -e ernic_vm_ssh_base_port="$SSH_PORT" \
          -e ernic_vm_ssh_user="$VM_USER"
        cd -

        # After the RDMA test the driver will have opened at least one QP
        # through the EXPDB path; confirm the server logged the CMB
        # devcmds.
        if grep -q 'DISCOVER_CMB\|discover_cmb\|cmb' /tmp/vfu_server.log; then
          echo "✓ CMB/EXPDB devcmds appear in the server log"
        else
          echo "⚠  No CMB-related lines in the server log."
          echo "   The ionic_rdma driver may not have requested EXPDB on"
          echo "   this kernel version; the RDMA path test above is still valid."
          grep -i 'ionic\|devcmd\|admin' /tmp/vfu_server.log | tail -20 || true
        fi

    - name: Check the server survived the run
      if: always()
      shell: bash
      run: |
        if [ -n "$SERVER_PID" ] && kill -0 "$SERVER_PID" 2>/dev/null; then
          echo "✓ ERNIC server still running after the EXPDB run"
        else
          echo "✗ ERNIC server died during the EXPDB run"
          tail -60 /tmp/vfu_server.log || true
          exit 1
        fi

    - name: Show logs
      if: always()
      run: |
        echo "=== Server log ==="
        echo "--- CMB/EXPDB-related lines ---"
        grep -iE 'cmb|expdb|discover|bar4' /tmp/vfu_server.log || echo "(none)"
        echo "--- adminq lines ---"
        grep -i 'adminq\|create_qp\|identify' /tmp/vfu_server.log | tail -20 || echo "(none)"
        echo "--- tail ---"
        tail -50 /tmp/vfu_server.log || true
        echo ""
        echo "=== QEMU log ==="
        cat /tmp/qemu.log || echo "No QEMU log"
        echo ""
        echo "=== Guest console (complete) ==="
        cat /tmp/qemu-console.log || echo "No console log"

    - name: Upload test logs
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: expdb-lane-test-logs
        path: |
          /tmp/vfu_server.log
          /tmp/qemu.log
          /tmp/qemu-console.log
        retention-days: 7
        if-no-files-found: ignore

    - name: Cleanup
      if: always()
      run: |
        if [ -n "$QEMU_PID" ]; then
          kill "$QEMU_PID" 2>/dev/null || true
        fi
        if [ -n "$SERVER_PID" ]; then
          kill "$SERVER_PID" 2>/dev/null || true
        fi
        rm -f /tmp/vfio-user-rocm-ernic*.sock
        echo "✓ Cleanup complete"
