#
# CodeQL analysis of the C code
#
# CodeQL's C/C++ extractor works by tracing the real compiler invocations,
# so init -> build -> analyze must all run in the same job. Results show up
# in the repository's Security tab and as annotations on pull requests.
#
# develop is analyzed on every push that touches the code, which gives pull
# requests a baseline to be compared against, and weekly so that new CodeQL
# queries are applied to code that has not changed.
#
# Every pull request is analyzed, whether or not it touches C. GitHub's
# CodeQL check compares a pull request's analyses against all of develop's
# and gives up if any is missing, so skipping this one would also stop the
# check from reporting new alerts from the other analyses. The CodeQL job
# in pr-security-scan.yml uploads one for the workflows themselves
# (category /language:actions), even though that file's other scanners
# only produce reports.
name: rocm-ernic - CodeQL

on:
  push:
    branches: [ develop ]
    paths:
      - '**.c'
      - '**.h'
      - '**.cmake'
      - '**/CMakeLists.txt'
      - '.github/workflows/codeql.yml'
  pull_request:
    branches: [ develop ]
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze C code
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      # required to upload analysis results
      security-events: write
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # build-essential, cmake, ninja-build and pkg-config are preinstalled
      # on the hosted image. meson and libcmocka-dev are only needed to
      # build libvfio-user; libjson-c-dev is also needed for
      # -DERNIC_BUILD_P4=ON.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libibverbs-dev \
            librdmacm-dev \
            libglib2.0-dev \
            meson \
            libjson-c-dev \
            libcmocka-dev

      # Built before CodeQL is initialized so that only rocm-ernic's own
      # compilation is traced. Keep the pinned commit in sync with
      # build-and-test.yml.
      - name: Build and install libvfio-user
        run: |
          git clone https://github.com/nutanix/libvfio-user.git /tmp/libvfio-user
          cd /tmp/libvfio-user
          git checkout 5b9c722
          meson setup build --prefix=/usr -Dwarning_level=0
          ninja -C build
          sudo ninja -C build install
          sudo ldconfig

      # c-cpp is CodeQL's name for its C/C++ extractor; only a C compiler
      # is configured below, so only C is analyzed. security-and-quality
      # is a superset of security-extended.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: c-cpp
          build-mode: manual
          queries: security-and-quality

      # Plain build: we only want CodeQL to observe the compiler. Debug
      # keeps optimizations off so the extracted database is closer to the
      # source. CodeQL analyzes only what's compiled, so ERNIC_BUILD_P4 is
      # on, as in the Build and Test workflow, to include src/p4.
      - name: Configure and build rocm-ernic
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=gcc \
            -DERNIC_BUILD_P4=ON
          cmake --build build

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: "/language:c-cpp"
