#
# CodeQL analysis of the C code, the Python code and the workflows
#
# CodeQL's C/C++ extractor works by tracing the real compiler invocations,
# so init -> build -> analyze must all run in the same job. The Python and
# Actions extractors read the source and need no build. Results show up in
# the repository's Security tab and as annotations on pull requests.
#
# develop is analyzed on every push that touches the code, which gives pull
# requests a baseline to be compared against, and weekly so that new CodeQL
# queries are applied to code that has not changed.
#
# Every pull request is analyzed in every language, whether or not it
# touches it. GitHub's CodeQL check compares a pull request's analyses
# against every configuration develop has, and if any is missing it can't
# tell which alerts are new, so it reports none, C's included.
# weekly-security-scan.yml gives develop /language:c-cpp, /language:python
# and /language:actions, but pr-security-scan.yml analyzes only the
# languages a pull request touches, so it doesn't fill the gap.
name: rocm-ernic - CodeQL

on:
  push:
    branches: [ develop ]
    paths:
      - '**.c'
      - '**.h'
      - '**.cmake'
      - '**/CMakeLists.txt'
      - '**.py'
      - '.github/workflows/**'
      - '.github/actions/**'
  pull_request:
    branches: [ develop ]
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      # required to upload analysis results
      security-events: write
    strategy:
      fail-fast: false
      # c-cpp is CodeQL's name for its C/C++ extractor; only a C compiler
      # is configured below, so only C is analyzed. actions covers the
      # workflows and the composite actions in .github/actions/.
      matrix:
        include:
          - name: Analyze C code
            language: c-cpp
            build-mode: manual
          - name: Analyze Python code
            language: python
            build-mode: none
          - name: Analyze workflows
            language: actions
            build-mode: none
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # build-essential, cmake, ninja-build and pkg-config are preinstalled
      # on the hosted image. meson and libcmocka-dev are only needed to
      # build libvfio-user; libjson-c-dev is also needed for
      # -DERNIC_BUILD_P4=ON.
      - name: Install system dependencies
        if: matrix.language == 'c-cpp'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libibverbs-dev \
            librdmacm-dev \
            libglib2.0-dev \
            meson \
            libjson-c-dev \
            libcmocka-dev

      # Built before CodeQL is initialized so that only rocm-ernic's own
      # compilation is traced. Keep the pinned commit in sync with
      # build-and-test.yml.
      - name: Build and install libvfio-user
        if: matrix.language == 'c-cpp'
        run: |
          git clone https://github.com/nutanix/libvfio-user.git /tmp/libvfio-user
          cd /tmp/libvfio-user
          git checkout 5b9c722
          meson setup build --prefix=/usr -Dwarning_level=0
          ninja -C build
          sudo ninja -C build install
          sudo ldconfig

      # security-and-quality is a superset of security-extended, which the
      # security scan workflows use.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality

      # Plain build: we only want CodeQL to observe the compiler. Debug
      # keeps optimizations off so the extracted database is closer to the
      # source. CodeQL analyzes only what's compiled, so ERNIC_BUILD_P4 is
      # on, as in the Build and Test workflow, to include src/p4.
      - name: Configure and build rocm-ernic
        if: matrix.language == 'c-cpp'
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=gcc \
            -DERNIC_BUILD_P4=ON
          cmake --build build

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:${{ matrix.language }}"
