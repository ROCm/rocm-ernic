# Deploy Sphinx documentation to GitHub Pages.
#
# Prerequisites (one-time, requires repo-admin access):
#   Settings > Pages > Source = "GitHub Actions"

name: rocm-ernic - Docs Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'src/**/*.h'
      - 'service/**'
      - 'requirements.txt'
      - '.github/workflows/docs-deploy.yml'

# Serialise deploys to Pages.  Unlike the pull request workflows this does
# NOT cancel in progress: a half-finished deploy would leave the published
# site in whatever state actions/deploy-pages had reached, so a superseded
# run queues behind the current one and then publishes the newer docs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: sphinx-build
    runs-on: ubuntu-latest
    steps:
    - name: Check out code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y doxygen

    - name: Configure docs-only build
      run: |
        cmake -S . -B build \
          -DERNIC_DOCS_ONLY=ON \
          -DERNIC_BUILD_DOCS=ON

    - name: Build documentation
      run: cmake --build build --target sphinx-html

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
      with:
        path: build/docs/html

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
