# SPDX-License-Identifier: MIT
name: rocm-ernic - Driver Build

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'driver/**'
      - 'patches/**'
      - 'scripts/setup-ionic-dkms.sh'
      - 'cmake/ErnicKernelModule.cmake'
      - '.github/workflows/driver-build.yml'
  workflow_dispatch:

jobs:
  driver-build:
    name: Build Deprecated rocm_ernic Driver on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    
    strategy:
      matrix:
        os: [ubuntu-24.04]
      fail-fast: false
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install kernel headers and build tools
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          linux-headers-$(uname -r) \
          build-essential \
          kmod
    
    - name: Display build environment
      run: |
        echo "=== Kernel Version ==="
        uname -r
        echo ""
        echo "=== Kernel Headers ==="
        ls -la /lib/modules/$(uname -r)/build || echo "Headers not found"
        echo ""
        echo "=== GCC Version ==="
        gcc --version
        echo ""
        echo "=== Make Version ==="
        make --version
    
    - name: Build driver module
      run: |
        cd driver
        echo "=== Building driver modules ==="
        make KDIR=/lib/modules/$(uname -r)/build 2>&1 | tee build.log
        BUILD_EXIT_CODE=${PIPESTATUS[0]}
        if [ $BUILD_EXIT_CODE -ne 0 ]; then
          echo "❌ Driver build failed with exit code $BUILD_EXIT_CODE"
          echo "=== Build log ==="
          cat build.log
          exit $BUILD_EXIT_CODE
        fi
        echo "✅ Driver build completed"
    
    - name: Verify driver build
      run: |
        cd driver
        echo "=== Verifying driver modules ==="
        if [ ! -f rocm_ernic_eth.ko ] || [ ! -f rocm_ernic_rdma.ko ]; then
          echo "❌ Driver modules not found!"
          echo "Expected: rocm_ernic_eth.ko and rocm_ernic_rdma.ko"
          echo "=== Files in driver directory ==="
          ls -lh *.ko 2>/dev/null || echo "No .ko files found"
          echo ""
          echo "=== Build log (last 50 lines) ==="
          tail -50 build.log 2>/dev/null || echo "No build.log found"
          exit 1
        fi
        echo "✅ Driver modules built successfully"
        ls -lh rocm_ernic_eth.ko rocm_ernic_rdma.ko
        file rocm_ernic_eth.ko rocm_ernic_rdma.ko
        modinfo rocm_ernic_eth.ko
        modinfo rocm_ernic_rdma.ko
    
    - name: Check for build warnings
      run: |
        cd driver
        if [ -f build.log ]; then
          if grep -i "warning:" build.log; then
            echo "⚠️  Build warnings detected (non-fatal)"
          else
            echo "✅ No build warnings"
          fi
        else
          echo "⚠️  build.log not found, cannot check warnings"
        fi
    
    - name: Upload driver artifacts
      uses: actions/upload-artifact@v4
      with:
        name: rocm_ernic-${{ matrix.os }}-$(uname -r)
        path: |
          driver/rocm_ernic_eth.ko
          driver/rocm_ernic_rdma.ko
        retention-days: 7
    
    - name: Clean build artifacts
      run: |
        cd driver
        rm -f *.o *.ko *.mod *.mod.c *.mod.o .*.cmd Module.symvers \
          modules.order build.log

  # The ionic path does not ship a driver of its own: it runs the upstream
  # Linux ionic.ko and ionic_rdma.ko with the patches in patches/ applied.
  # What CI can check on a hosted runner is that the pinned upstream ref still
  # exists and that every patch still applies to it -- the modules themselves
  # need kernel >= 6.18 headers, which hosted runners do not have.
  ionic-patches:
    name: Apply ionic Driver Patches (default path)
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Fetch upstream ionic sources and apply patches
      run: |
        # Mirror cmake/ErnicKernelModule.cmake, but without configuring the
        # whole project: this job only needs git.  The pinned ref is read
        # from the cmake file so the two cannot drift apart.
        REF=$(sed -n 's/^set(IONIC_KERNEL_REF "\([^"]*\)".*/\1/p' \
              cmake/ErnicKernelModule.cmake)
        if [ -z "$REF" ]; then
          echo "::error::could not read IONIC_KERNEL_REF from cmake/ErnicKernelModule.cmake"
          exit 1
        fi
        echo "ionic kernel ref: $REF"

        git config --global user.email "ci@rocm-ernic.invalid"
        git config --global user.name "rocm-ernic CI"

        # Fetch into an empty repo rather than "clone --branch", which only
        # accepts a tag or branch: this resolves a bare SHA too, with a full
        # blobless fetch as the fallback if the server will not serve it.
        URL=https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git
        mkdir -p ionic-kernel-src
        (
          cd ionic-kernel-src
          git init -q .
          git remote add origin "$URL"
          git sparse-checkout init --cone
          git sparse-checkout set \
            drivers/net/ethernet/pensando/ionic \
            drivers/infiniband/hw/ionic
          if git fetch -q --depth 1 --filter=blob:none origin "$REF"; then
            rev=FETCH_HEAD
          else
            echo "$REF is not directly fetchable; fetching full history"
            git fetch -q --filter=blob:none --tags origin
            rev=$REF
          fi
          git checkout -q --detach "$rev"
        )
        git -C ionic-kernel-src rev-parse HEAD > /tmp/ionic-base-sha

        for p in $(ls patches/*.patch 2>/dev/null | sort); do
          echo "  applying: $p"
          git -C ionic-kernel-src am --whitespace=fix "$(pwd)/$p" || {
            echo "::error file=$p::patch does not apply to $REF"
            exit 1
          }
        done

    - name: Verify the patched tree
      run: |
        SRC=ionic-kernel-src
        for d in drivers/net/ethernet/pensando/ionic drivers/infiniband/hw/ionic; do
          if [ ! -d "$SRC/$d" ]; then
            echo "::error::missing $d in the fetched tree"
            exit 1
          fi
        done

        # Every patch in patches/ must appear as a commit on top of the ref.
        # Count from the pre-patch SHA: the fetch may have pulled full history.
        base=$(cat /tmp/ionic-base-sha)
        want=$(ls patches/*.patch 2>/dev/null | wc -l)
        got=$(git -C "$SRC" rev-list --count "${base}..HEAD")
        echo "patches in tree: $want, commits applied: $got"
        if [ "$want" -ne "$got" ]; then
          echo "::error::expected $want patch commits, found $got"
          git -C "$SRC" log --oneline "${base}..HEAD"
          exit 1
        fi
        git -C "$SRC" log --oneline "${base}..HEAD"

  driver-build-status:
    name: Driver Build Status
    needs: [driver-build, ionic-patches]
    runs-on: ubuntu-latest
    if: always()

    steps:
    - name: Check build result
      run: |
        rc=0
        if [ "${{ needs.ionic-patches.result }}" = "success" ]; then
          echo "✅ ionic patches apply cleanly (default driver path)"
        else
          echo "❌ ionic patches do not apply (default driver path)"
          rc=1
        fi
        if [ "${{ needs.driver-build.result }}" = "success" ]; then
          echo "✅ rocm_ernic driver build succeeded (deprecated path)"
        else
          echo "❌ rocm_ernic driver build failed (deprecated path)"
          rc=1
        fi
        exit $rc

