name: rocm-ernic - ionic Driver Patches

on:
  pull_request:
    branches: [ develop ]
    paths:
      # The series and the two scripts that apply them live in the
      # Ansible collection, so that a consumer installing it gets them at
      # the ref of the roles that apply them.  See ansible/files/README.md.
      - 'ansible/files/**'
      - 'cmake/ErnicKernelModule.cmake'
      - 'ansible/roles/ernic_srq_dkms/**'
      # The rdma-core base SHA lives here as well as in
      # ansible/files/patches/rdma-core/README.md, and the
      # rdma-core-patches job below
      # now checks the two agree. Without this entry, bumping the role's
      # copy alone -- which is the edit someone makes when #1799 is
      # force-pushed -- changes which tree gets built and runs no check.
      - 'ansible/roles/ernic_srq_provider/**'
      - '.github/workflows/driver-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # rocm-ernic does not ship a driver of its own: it runs the upstream
  # Linux ionic.ko and ionic_rdma.ko with the patches in
  # ansible/files/patches/ applied.
  # What CI can check on a hosted runner is that the pinned upstream ref still
  # exists and that every patch still applies to it -- the modules themselves
  # need kernel >= 6.18 headers, which hosted runners do not have.  Compiling
  # and loading them is the VM lane's job, in the SRQ steps of
  # .github/workflows/system-tests.yml.
  #
  # Two series are checked, because there are two.  The patch at the top of
  # ansible/files/patches is what the shipping driver is built from, pinned to
  # the cmake ref; its srq/ subdirectory is the SRQ-enabling series, pinned to
  # its own (newer) ref because the SRQ commits apply to no older tag.  They
  # rot independently and for different reasons -- ours when upstream ionic
  # moves, the SRQ series when its prerequisites land upstream and the carried
  # copies start applying twice -- so a single job covering only the base
  # series left the SRQ series untested until a guest failed.
  ionic-patches:
    name: Apply ionic Driver Patches (${{ matrix.series }})
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - series: base
            patches: ansible/files/patches
          - series: srq
            patches: ansible/files/patches/srq

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Resolve the pinned kernel ref
      id: ref
      run: |
        # Each series names its own base, and neither is spelled here: the
        # build reads the same two files, so a bump in one place cannot leave
        # CI testing the other.
        case "${{ matrix.series }}" in
        base)
          REF=$(sed -n 's/^set(IONIC_KERNEL_REF "\([^"]*\)".*/\1/p' \
                cmake/ErnicKernelModule.cmake)
          WHERE=cmake/ErnicKernelModule.cmake
          ;;
        srq)
          # First "ref:" under ernic_srq_dkms_sources in the role defaults.
          REF=$(sed -n '/^ernic_srq_dkms_sources:/,/^[a-z]/ s/^  *- *ref: *//p' \
                ansible/roles/ernic_srq_dkms/defaults/main.yml | head -1)
          WHERE=ansible/roles/ernic_srq_dkms/defaults/main.yml
          ;;
        esac
        if [ -z "$REF" ]; then
          echo "::error::could not read the kernel ref from $WHERE"
          exit 1
        fi
        echo "${{ matrix.series }} kernel ref: $REF (from $WHERE)"
        echo "ref=$REF" >> "$GITHUB_OUTPUT"

    - name: Fetch upstream ionic sources and apply patches
      env:
        # Read from files a PR can change, so pass it through the environment
        # rather than expanding it into the script.
        KERNEL_REF: ${{ steps.ref.outputs.ref }}
      run: |
        git config --global user.email "ci@rocm-ernic.invalid"
        git config --global user.name "rocm-ernic CI"

        # Call the script the humans and the ernic_srq_dkms role call, rather
        # than reimplementing the fetch here.  The inline copy this replaces
        # carried its own sparse-checkout path list, which silently drifted:
        # it lacked include/uapi/rdma, so the SRQ series -- which touches
        # ionic-abi.h -- would have failed here on a file that was simply not
        # checked out, reported as "patch does not apply".
        ./ansible/files/scripts/fetch-ionic-sources.sh \
          --source-dir "$PWD/ionic-kernel-src" \
          --kernel-ref "$KERNEL_REF" \
          --patches-dir "$PWD/${{ matrix.patches }}"

    - name: Verify the patched tree
      run: |
        SRC=ionic-kernel-src
        for d in drivers/net/ethernet/pensando/ionic drivers/infiniband/hw/ionic; do
          if [ ! -d "$SRC/$d" ]; then
            echo "::error::missing $d in the fetched tree"
            exit 1
          fi
        done

        # Every patch must appear as a commit on top of the ref, with its own
        # subject.  Comparing subjects rather than counting commits is what
        # catches a patch that applied as an empty commit, or a series whose
        # order was changed by a renumbering.
        PATCHES="${{ matrix.patches }}"
        want=$(find "$PATCHES" -maxdepth 1 -name '*.patch' | wc -l)
        if [ "$want" -eq 0 ]; then
          echo "::error::no patches found in $PATCHES"
          exit 1
        fi
        echo "patches in $PATCHES: $want"

        if ! git -C "$SRC" rev-parse -q --verify "HEAD~${want}^{commit}" >/dev/null; then
          echo "::error::fewer than $want commits on top of the ref"
          git -C "$SRC" log --oneline -n "$((want + 1))"
          exit 1
        fi
        git -C "$SRC" log --oneline "HEAD~${want}..HEAD"

        git -C "$SRC" log --format=%s "HEAD~${want}..HEAD" > /tmp/applied-subjects
        rc=0
        for p in "$PATCHES"/*.patch; do
          # Unwrap a folded Subject: header, then strip the [PATCH nn/nn] tag
          # that git-format-patch puts there and git-am strips on the way in.
          # The trailing-space strip is not cosmetic: unfolding consumes the
          # blank line that ends the header block as one more continuation, so
          # every folded subject picks up a trailing space that git's %s does
          # not have, and an exact match would never fire.
          subj=$(sed -n '/^Subject: /{s/^Subject: //; :a; N; /\n[^ \t]/!{s/\n[ \t]*/ /; ba}; s/\n.*//; p; q}' "$p" \
                 | sed -e 's/^\[[^]]*\] *//' -e 's/[[:space:]]*$//')
          if ! grep -qxF "$subj" /tmp/applied-subjects; then
            echo "::error file=$p::applied, but no commit has its subject: $subj"
            rc=1
          fi
        done
        [ "$rc" -eq 0 ] || exit 1
        echo "all $want patch subjects present as commits"

    # The three facts the srq series exists to produce.  Without these it
    # can apply cleanly and still yield a driver reporting max_srq=0, which is
    # exactly the state the SRQ work exists to leave behind -- and it would
    # surface three lanes later as UCX declining rc_verbs.
    - name: Verify the SRQ series actually enabled SRQ
      if: matrix.series == 'srq'
      run: |
        SRC=ionic-kernel-src/drivers/infiniband/hw/ionic
        ABI=ionic-kernel-src/include/uapi/rdma/ionic-abi.h
        rc=0
        check() {
          if grep -qE "$2" "$1"; then
            echo "  ✓ $3"
          else
            echo "::error::$3 -- not found in $1"
            rc=1
          fi
        }
        check "$SRC/ionic_controlpath.c" 'ionic_create_srq_cmd|\.create_srq[[:space:]]*=' \
              'create_srq verb present'
        check "$SRC/ionic_ibdev.c" 'max_srq[[:space:]]*=' \
              'max_srq advertised in device attributes'
        if [ ! -f "$ABI" ]; then
          echo "::error::$ABI is missing -- is include/uapi/rdma in the sparse checkout?"
          rc=1
        else
          check "$ABI" '__u32[[:space:]]+srqid' 'srqid in the user ABI'
        fi
        [ "$rc" -eq 0 ] || exit 1

  # The userspace half, which rots for a different reason than the kernel
  # half does. ansible/files/patches/rdma-core carries
  # linux-rdma/rdma-core#1799, still
  # open; the hazard it guards against is that PR being rebased or merged
  # upstream, at which point these either stop applying or start applying
  # twice. Same check, different repository -- so a separate job rather than
  # another matrix entry, because nothing here fetches a kernel.
  rdma-core-patches:
    name: Apply rdma-core ionic Patches
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Apply the series to its pinned base
      run: |
        set -euo pipefail
        PATCHES=ansible/files/patches/rdma-core

        # The base is recorded in the README rather than a separate pin file:
        # one SHA, in the document that explains why it is that SHA.
        # shellcheck disable=SC2016  # the backticks are literal Markdown
        BASE=$(sed -n 's/^## The base: `\([0-9a-f]\{40\}\)`.*/\1/p' \
               "$PATCHES/README.md" | head -1)
        if [ -z "$BASE" ]; then
          echo "::error::could not read the pinned base SHA from $PATCHES/README.md"
          exit 1
        fi
        echo "rdma-core base: $BASE"

        # The same SHA lives in the role that builds the provider. The role
        # asserts the two agree, but only once a VM is up, which is far too
        # late to tell a reviewer that the series and its rationale describe
        # different trees. Check it here, the way the kernel half already
        # resolves its ref from one place: a bump in one file cannot leave
        # CI testing the other.
        PROVIDER_DEFAULTS=ansible/roles/ernic_srq_provider/defaults/main.yml
        ROLE_BASE=$(sed -n \
          's/^ernic_srq_provider_base: *\([0-9a-f]\{40\}\).*/\1/p' \
          "$PROVIDER_DEFAULTS" | head -1)
        if [ -z "$ROLE_BASE" ]; then
          echo "::error file=$PROVIDER_DEFAULTS::could not read" \
               "ernic_srq_provider_base"
          exit 1
        fi
        if [ "$ROLE_BASE" != "$BASE" ]; then
          echo "::error file=$PROVIDER_DEFAULTS::ernic_srq_provider_base is" \
               "$ROLE_BASE but $PATCHES/README.md documents $BASE."
          echo "  Bump both, or the build and its rationale describe" \
               "different trees."
          exit 1
        fi
        echo "rdma-core base agrees with $PROVIDER_DEFAULTS"

        git config --global user.email "ci@rocm-ernic.invalid"
        git config --global user.name "rocm-ernic CI"

        git clone -q --filter=blob:none \
          https://github.com/linux-rdma/rdma-core.git /tmp/rdma-core
        git -C /tmp/rdma-core checkout -q "$BASE"

        for p in "$PATCHES"/*.patch; do
          echo "  applying: $p"
          git -C /tmp/rdma-core am --whitespace=fix "$(pwd)/$p" || {
            echo "::error file=$p::does not apply to $BASE -- has #1799 been"
            echo "  rebased or merged upstream? See $PATCHES/README.md."
            exit 1
          }
        done

    - name: Verify the provider gained SRQ
      run: |
        set -euo pipefail
        SRC=/tmp/rdma-core
        rc=0
        # The point of the series. Applying cleanly is not the same as
        # producing a provider with the verbs, and a provider without them
        # fails far downstream as ibv_create_srq() returning EOPNOTSUPP on a
        # device reporting max_srq=32768.
        for sym in ionic_create_srq ionic_destroy_srq ionic_modify_srq \
                   ionic_query_srq ionic_post_recv_srq; do
          if grep -q "$sym" "$SRC/providers/ionic/ionic_verbs.c"; then
            echo "  ✓ $sym"
          else
            echo "::error::$sym missing from providers/ionic/ionic_verbs.c"
            rc=1
          fi
        done
        if ! grep -qE '__u32[[:space:]]+srqid' \
             "$SRC/kernel-headers/rdma/ionic-abi.h"; then
          echo "::error::srqid missing from the kernel-headers ABI copy"
          rc=1
        fi

        # The local corrections, 0005 and 0006, are the ones a rebase loses.
        # 0001-0004 come from upstream and will reappear in whatever replaces
        # #1799; these two will not, and the symbol checks above pass happily
        # without them. Both SRQ receive paths must ring the RQ qtype: a
        # receive doorbell on the CQ qtype reaches the device as a completion
        # -queue index update, so the SRQ never learns a receive was posted
        # and a bound QP hangs instead of failing. The CQ doorbells elsewhere
        # in this file are not checked -- they are supposed to be cq_qtype.
        for fn in ionic_post_recv_srq ionic_post_pending_srq_wrs; do
          body=$(awk -v fn="$fn" \
                 '$0 ~ "^(static )?(void|int) " fn "\\(" {f=1}
                  f {print}
                  f && /^}/ {exit}' \
                 "$SRC/providers/ionic/ionic_verbs.c")
          if [ -z "$body" ]; then
            echo "::error::$fn not found; has the series been restructured?"
            rc=1
          elif printf '%s\n' "$body" | grep -q 'cq_qtype'; then
            echo "::error::$fn rings cq_qtype -- 0005 of the rdma-core"
            echo "  series is missing or was dropped in a rebase. See its"
            echo "  README: 0005 and 0006 are local fixes, not upstream's."
            rc=1
          elif ! printf '%s\n' "$body" | grep -q 'rq_qtype'; then
            echo "::error::$fn rings no rq_qtype doorbell at all"
            rc=1
          else
            echo "  ✓ $fn rings rq_qtype"
          fi
        done
        [ "$rc" -eq 0 ] || exit 1

  driver-build-status:
    name: Driver Build Status
    needs: [ionic-patches, rdma-core-patches]
    runs-on: ubuntu-latest
    if: always()

    steps:
    - name: Check build result
      run: |
        # Both halves, and both reported. Needing a job without checking its
        # result is a gate that goes green on its failure -- which is how a
        # lane ends up proving nothing while looking like it passed.
        rc=0
        if [ "${{ needs.ionic-patches.result }}" = "success" ]; then
          echo "✅ ionic kernel patches apply cleanly"
        else
          echo "❌ ionic kernel patches do not apply"
          rc=1
        fi
        if [ "${{ needs.rdma-core-patches.result }}" = "success" ]; then
          echo "✅ rdma-core ionic patches apply cleanly"
        else
          echo "❌ rdma-core ionic patches do not apply"
          rc=1
        fi
        exit "$rc"
