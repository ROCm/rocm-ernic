name: Build Test

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'service/**'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - '.github/workflows/build-test.yml'
  workflow_dispatch:

jobs:
  build-test:
    name: Build and Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
    
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            meson \
            ninja-build \
            pkg-config \
            libibverbs-dev \
            librdmacm-dev \
            libglib2.0-dev \
            libjson-c-dev \
            libcmocka-dev
      
      - name: Clone and build libvfio-user
        run: |
          # Pin to 20e9803 (De-duplicate FDs for DMA region access, Apr 7 2026)
          # This version includes the vfu_setup_device_dma() max_regions
          # parameter added in f3742ed9 (#835).
          git clone https://github.com/nutanix/libvfio-user.git /tmp/libvfio-user
          cd /tmp/libvfio-user
          git checkout 20e9803
          meson setup build --prefix=/usr -Dwarning_level=0
          ninja -C build
          sudo ninja -C build install
          sudo ldconfig
      
      - name: Configure project with CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DERNIC_WERROR=ON
      
      - name: Build project
        run: cmake --build build
      
      - name: Verify rdma_cm protocol symbols
        run: |
          echo "=== Verifying rdma_cm_proto.c symbols ==="
          if nm build/rocm-ernic 2>/dev/null | grep -q "rdma_cm_process_message"; then
            echo "✓ rdma_cm_process_message symbol found in binary"
          else
            echo "⚠️  rdma_cm_process_message symbol not found (may be inlined)"
          fi
      
      - name: Verify binaries exist
        run: |
          ls -lh build/rocm-ernic
          ls -lh build/tests/test_pci_client
          ls -lh build/tests/test_data_transfer
          file build/rocm-ernic
          file build/tests/test_pci_client
          file build/tests/test_data_transfer
      
      - name: Check binary dependencies
        run: |
          echo "=== rocm-ernic dependencies ==="
          ldd build/rocm-ernic
          echo ""
          echo "=== test_pci_client dependencies ==="
          ldd build/tests/test_pci_client
          echo ""
          echo "=== test_data_transfer dependencies ==="
          ldd build/tests/test_data_transfer
      
      - name: Run tests
        run: ctest --test-dir build --output-on-failure
      
      - name: Test loopback backend configurations
        run: |
          echo "=== Testing loopback backend configurations ==="
          if [ -f tests/test_loopback_ci.sh ]; then
            SERVER_BIN=build/rocm-ernic \
            TEST_BIN=build/tests/test_data_transfer \
            tests/test_loopback_ci.sh
          else
            echo "⚠️  test_loopback_ci.sh not found, skipping loopback config tests"
            # Fallback: test basic loopback startup
            echo "Testing basic loopback backend..."
            timeout 10 build/rocm-ernic \
              --socket /tmp/test-loopback.sock \
              --backend loopback:mode=preserve \
              --verbose > /tmp/loopback-test.log 2>&1 &
            SERVER_PID=$!
            sleep 2
            if [ -S /tmp/test-loopback.sock ]; then
              echo "✓ Loopback backend started successfully"
              kill $SERVER_PID 2>/dev/null || true
              rm -f /tmp/test-loopback.sock
            else
              echo "✗ Loopback backend failed to start"
              cat /tmp/loopback-test.log
              exit 1
            fi
          fi
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: build/Testing/
          retention-days: 7
      
      - name: Upload binaries
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.os }}
          path: |
            build/rocm-ernic
            build/tests/test_pci_client
            build/tests/test_data_transfer
          retention-days: 7
