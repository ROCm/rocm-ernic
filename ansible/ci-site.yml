#
# Master playbook for the CI VM lanes.
#
# site.yml is the developer-facing entry point: it
# builds, installs and drives systemd, all of which need
# root.  ci-site.yml assumes the VMs are already running
# and their instance manifest written -- the system-tests
# lanes launch them and write it themselves -- and runs
# only guest setup and the test phases.
#
# Usage (normally from the system-tests lanes, not by
# hand):
#
#   ansible-playbook ci-site.yml \
#       -e ernic_run_dir=/tmp/ernic-ci \
#       -e ernic_vm_ssh_base_port=2222 \
#       -e ernic_instances=2 \
#       --tags functional
#
# Tags:
#   functional -- guest setup + sanity tests + RDMA-Tutorial examples
#   tutorial   -- RDMA-Tutorial examples
#   nvmeof     -- single-VM NVMe-oF against the in-process controller
#   s3         -- single-VM S3 over RDMA against the in-process store
#   p4         -- single-VM guest-driven P4 fp8 reduction
#   perf       -- iperf3 + RDMA perftest sweeps

---
- name: "CI: register running VMs"
  ansible.builtin.import_playbook: playbooks/vm-register.yml
  tags: [always]

- name: "CI: guest setup (driver, rdma-core, NIC config)"
  ansible.builtin.import_playbook: playbooks/guest-setup.yml
  tags: [functional, guest-setup]

- name: "CI: sanity tests (ping, iperf3, perftest)"
  ansible.builtin.import_playbook: playbooks/sanity-tests.yml
  tags: [functional, sanity]

- name: "CI: RDMA-Tutorial examples"
  ansible.builtin.import_playbook: playbooks/tutorial-tests.yml
  tags: [functional, tutorial]

# Single-VM lane: the instance runs the NVMe-oF controller
# itself, so this is NOT part of the `functional` tag -- it
# would fail against the two-VM mesh, which runs a transport
# backend and has no controller to connect to.  Ask for it by
# name with --tags nvmeof.
- name: "CI: NVMe-oF tests (in-process controller)"
  ansible.builtin.import_playbook: playbooks/nvmeof-tests.yml
  tags: [nvmeof]

# Single-VM lane, for the same reason as nvmeof above: the
# instance runs the object store itself, so this is NOT part
# of the `functional` tag.  Ask for it by name with --tags s3.
- name: "CI: S3-over-RDMA tests (in-process object store)"
  ansible.builtin.import_playbook: playbooks/s3-tests.yml
  tags: [s3]

# Single-VM lane, like nvmeof and s3 above, and like them NOT part of
# `functional`: it needs a server started with --p4-guest-scope, which
# only the P4 lane does. Ask for it by name with --tags p4.
- name: "CI: P4 control driver and guest-driven fp8"
  ansible.builtin.import_playbook: playbooks/p4-tests.yml
  tags: [p4]

- name: "CI: TCP/IP performance (iperf3)"
  ansible.builtin.import_playbook: playbooks/tcp-performance-tests.yml
  tags: [perf, tcp-perf]

- name: "CI: RDMA performance sweeps (perftest)"
  ansible.builtin.import_playbook: playbooks/performance-tests.yml
  tags: [perf, rdma-perf]
