#
# Master playbook for rocm-ernic integration testing.
#
# The guest image is not built here.  It is a published
# artifact from batesste-ci-images -- flavour `ionic`, which
# bakes the pinned mainline kernel, the RDMA userspace and the
# build toolchain -- fetched by scripts/fetch-guest-image.sh or
# by ci/jobs/vm-up.sh.  This playbook starts from that image.
#
# Phases:
#   1. Host setup   -- build, install, configure service, TAPs
#   2. Guest setup  -- ionic DKMS driver, rdma-core, NIC config
#   3. Sanity tests -- ping, netcat, perftest
#   4. Performance  -- iperf3 and RDMA perftest sweeps
#
# Usage:
#   cd ansible
#   ansible-playbook site.yml
#
# Override variables with -e:
#   ansible-playbook site.yml -e ernic_instances=4
#   ansible-playbook site.yml -e ernic_build=false
#
# Select phases by tag (--tags / --skip-tags):
#   ansible-playbook site.yml --tags setup
#   ansible-playbook site.yml --tags sanity
#   ansible-playbook site.yml --skip-tags perf
#
# Available tags:
#   setup       -- host-setup + guest-setup
#   host-setup  -- phase 1 only
#   guest-setup -- phase 2 only
#   test        -- all test phases
#   sanity      -- phase 3 only
#   perf        -- phase 4 (tcp-perf + rdma-perf)

---
- name: "Phase 1: Host setup"
  ansible.builtin.import_playbook: playbooks/host-setup.yml
  tags: [setup, host-setup]

- name: "Register the running VMs in inventory"
  ansible.builtin.import_playbook: playbooks/vm-register.yml
  tags: [always]

- name: "Phase 2: Guest setup"
  ansible.builtin.import_playbook: playbooks/guest-setup.yml
  tags: [setup, guest-setup]

- name: "Phase 3: Sanity tests"
  ansible.builtin.import_playbook: playbooks/sanity-tests.yml
  tags: [test, sanity]

- name: "Phase 4a: TCP/IP performance tests (iperf3)"
  ansible.builtin.import_playbook: playbooks/tcp-performance-tests.yml
  tags: [test, perf, tcp-perf]

- name: "Phase 4b: RDMA performance tests (perftest)"
  ansible.builtin.import_playbook: playbooks/performance-tests.yml
  tags: [test, perf, rdma-perf]
