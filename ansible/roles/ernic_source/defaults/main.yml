#
# Where the rocm-ernic driver, rdma-core provider and udev
# rules come from.  Everything the other roles copy into a
# guest is read from ``ernic_source_dir`` on the controller.

---
# Set this to an existing rocm-ernic checkout to skip the
# clone entirely.  The playbooks in the rocm-ernic repo set
# it to the repo root; standalone consumers leave it empty
# and get a clone at ``ernic_source_clone_dir``.
ernic_source_dir: ""

ernic_source_repo_url: "https://github.com/ROCm/rocm-ernic.git"
ernic_source_repo_version: "main"
ernic_source_clone_dir: "/var/tmp/rocm-ernic-src"

# Re-clone even when the checkout already exists.
ernic_source_force_clone: false

# Upstream kernel tag the ionic driver sources are taken from.
# Empty means read IONIC_KERNEL_REF out of
# cmake/ErnicKernelModule.cmake, which is the single pin the C
# build, the guest DKMS build and the golden image all share.
ernic_ionic_kernel_ref: ""
