#
# Resolve the rocm-ernic source tree on the *controller*.
# The guest roles copy the udev rules and find-rdma-device.sh from
# here, and the ionic kernel ref is read out of it; the host role
# builds the server from it.  The clone deliberately happens on
# localhost and not inside the target VM -- guests in the test mesh
# generally have no route to GitHub.
#
# The ionic patch series and the two DKMS scripts used to come from
# here too.  They ship in the collection now (ansible/files/), so the
# SRQ roles need no checkout at all.

---
- name: Verify ernic_source_repo_version is set when a clone is needed
  ansible.builtin.assert:
    that:
      - (ernic_source_dir | trim | length > 0)
        or (ernic_source_repo_version | trim | length > 0)
    fail_msg: >-
      ernic_source_repo_version is not set and ernic_source_dir is empty.
      Set ernic_source_repo_version to a SHA or tag (e.g. the commit that
      matches your server build), or point ernic_source_dir at an existing
      checkout. A moving branch as the default silently decouples the compiled
      sources from the collection version, so there is no safe default here.
  run_once: true

- name: Resolve the rocm-ernic source checkout
  when: not (ernic_source_resolved | default(false))
  block:

    - name: Clone rocm-ernic on the controller
      ansible.builtin.git:
        repo: "{{ ernic_source_repo_url }}"
        dest: "{{ ernic_source_clone_dir }}"
        version: "{{ ernic_source_repo_version }}"
        accept_hostkey: true
        force: "{{ ernic_source_force_clone | bool }}"
      delegate_to: localhost
      become: false
      run_once: true
      when: not (ernic_source_dir | trim | length > 0)

    - name: Record the resolved source directory
      ansible.builtin.set_fact:
        ernic_source_dir: >-
          {{ (ernic_source_dir | trim)
             if (ernic_source_dir | trim | length > 0)
             else ernic_source_clone_dir }}

    - name: Verify the source tree looks like rocm-ernic
      ansible.builtin.stat:
        path: "{{ ernic_source_dir }}/{{ item }}"
      register: ernic_source_probe
      delegate_to: localhost
      become: false
      run_once: true
      # What the roles actually read out of this checkout.  The ionic
      # patch series and the two DKMS scripts are no longer among them:
      # they ship in the collection (ansible/files/), so probing for
      # them here would fail on a perfectly good checkout.
      loop:
        - udev/99-rocm-ernic.rules
        - scripts/find-rdma-device.sh
        - cmake/ErnicKernelModule.cmake

    - name: Fail when the source tree is incomplete
      ansible.builtin.assert:
        that:
          - ernic_source_probe.results
            | rejectattr('stat.exists')
            | list | length == 0
        fail_msg: >-
          {{ ernic_source_dir }} does not look like a rocm-ernic
          checkout; missing
          {{ ernic_source_probe.results
             | rejectattr('stat.exists')
             | map(attribute='item') | join(', ') }}.
          Set ernic_source_dir to a checkout, or leave it empty
          to clone {{ ernic_source_repo_url }}.
      run_once: true

    # Set last: the block's guard is re-evaluated per task, so
    # raising this flag any earlier would skip the rest of the
    # block on the very run that is meant to do the work.
    - name: Mark the source as resolved
      ansible.builtin.set_fact:
        ernic_source_resolved: true

- name: Resolve the ionic kernel ref
  ansible.builtin.include_tasks: ionic_ref.yml
  when: ernic_ionic_ref is not defined
