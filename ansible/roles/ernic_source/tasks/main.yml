#
# Resolve the rocm-ernic source tree on the *controller*.
# The guest roles copy the udev rules and find-rdma-device.sh from
# here, and the ionic kernel ref is read out of it; the host role
# builds the server from it.  The clone deliberately happens on
# localhost and not inside the target VM -- guests in the test mesh
# generally have no route to GitHub.
#
# The ionic patch series and the two DKMS scripts used to come from
# here too.  They ship in the collection now (ansible/files/), so the
# SRQ roles need no checkout at all.

---
- name: Verify ernic_source_repo_version is set when a clone is needed
  ansible.builtin.assert:
    that:
      - (ernic_source_dir | trim | length > 0)
        or (ernic_source_repo_version | trim | length > 0)
    fail_msg: >-
      ernic_source_repo_version is not set and ernic_source_dir is empty.
      Set ernic_source_repo_version to a SHA or tag (e.g. the commit that
      matches your server build), or point ernic_source_dir at an existing
      checkout. A moving branch as the default silently decouples the compiled
      sources from the collection version, so there is no safe default here.
  run_once: true

- name: Verify ernic_source_subdir is a relative path inside the clone
  ansible.builtin.assert:
    that:
      - not (ernic_source_subdir | trim).startswith('/')
      - "'..' not in (ernic_source_subdir | trim).split('/')"
    fail_msg: >-
      ernic_source_subdir ({{ ernic_source_subdir }}) must be a path
      relative to the top of the clone, with no '..' in it.
  run_once: true

- name: Resolve the rocm-ernic source checkout
  when: not (ernic_source_resolved | default(false))
  block:

    # ansible.builtin.git can't make a blob-less or sparse clone,
    # and a full clone of a monorepo is gigabytes.  This fetches
    # only the commit asked for and its history, without file
    # contents (--filter=blob:none); checking out then downloads
    # the files it needs, which with ernic_source_subdir set are
    # only that directory's.
    #
    # A version is fetched by name first.  A remote can't resolve
    # an abbreviated SHA, so that falls back to fetching every
    # branch and tag and resolving it here.
    - name: Clone rocm-ernic on the controller
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -euo pipefail

          if [ ! -e "${ERNIC_CLONE_DIR}/.git" ]; then
            if [ -n "$(find "${ERNIC_CLONE_DIR}" -mindepth 1 -maxdepth 1 \
                         -print -quit 2>/dev/null)" ]; then
              echo "${ERNIC_CLONE_DIR} is not empty and not a git" \
                   "checkout; remove it or set ernic_source_clone_dir" >&2
              exit 1
            fi
            git init --quiet -- "${ERNIC_CLONE_DIR}"
          fi
          cd "${ERNIC_CLONE_DIR}"

          before="$(git rev-parse --quiet --verify HEAD || true)"
          before+=" $(git sparse-checkout list 2>/dev/null || true)"
          before+=" $(git status --porcelain --untracked-files=no)"

          if [ "${ERNIC_FORCE}" != true ] && [ -n "$(git rev-parse \
               --quiet --verify HEAD)" ] && [ -n "$(git status \
               --porcelain --untracked-files=no)" ]; then
            echo "${ERNIC_CLONE_DIR} has local changes; set" \
                 "ernic_source_force_clone to discard them" >&2
            exit 1
          fi

          if git remote get-url origin >/dev/null 2>&1; then
            git remote set-url origin "${ERNIC_REPO_URL}"
          else
            git remote add origin "${ERNIC_REPO_URL}"
          fi

          if git fetch --quiet --no-tags --filter=blob:none \
               origin -- "${ERNIC_VERSION}" 2>/dev/null; then
            target="$(git rev-parse --verify 'FETCH_HEAD^{commit}')"
          else
            git fetch --quiet --tags --filter=blob:none origin \
              '+refs/heads/*:refs/remotes/origin/*'
            if ! target="$(git rev-parse --quiet --verify \
                             "${ERNIC_VERSION}^{commit}")"; then
              echo "${ERNIC_REPO_URL} has no commit, branch or tag" \
                   "named ${ERNIC_VERSION}" >&2
              exit 1
            fi
          fi

          if [ -n "${ERNIC_SUBDIR}" ]; then
            git sparse-checkout set --cone -- "${ERNIC_SUBDIR}"
          elif [ "$(git config --bool core.sparseCheckout || true)" = true ]
          then
            git sparse-checkout disable
          fi

          force=()
          if [ "${ERNIC_FORCE}" = true ]; then
            force=(--force)
          fi
          git checkout --quiet "${force[@]}" --detach "${target}"

          after="$(git rev-parse HEAD)"
          after+=" $(git sparse-checkout list 2>/dev/null || true)"
          after+=" $(git status --porcelain --untracked-files=no)"
          if [ "${before}" = "${after}" ]; then
            echo "already at ${target}"
          else
            echo "checked out ${target}"
          fi
      environment:
        ERNIC_REPO_URL: "{{ ernic_source_repo_url }}"
        ERNIC_VERSION: "{{ ernic_source_repo_version | trim }}"
        ERNIC_CLONE_DIR: "{{ ernic_source_clone_dir }}"
        ERNIC_SUBDIR: >-
          {{ ernic_source_subdir | trim | regex_replace('/+$', '') }}
        ERNIC_FORCE: "{{ ernic_source_force_clone | bool | lower }}"
        # Fail rather than wait for a password nobody will type, and
        # accept an SSH remote's host key the first time, as
        # ansible.builtin.git's accept_hostkey did, but not a key
        # that has changed since.
        GIT_TERMINAL_PROMPT: "0"
        GIT_SSH_COMMAND: ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new
      register: ernic_source_clone
      changed_when: "'already at' not in ernic_source_clone.stdout"
      delegate_to: localhost
      become: false
      run_once: true
      when: not (ernic_source_dir | trim | length > 0)

    # ernic_source_subdir applies only to the clone: an
    # ernic_source_dir you set is the project directory itself.
    - name: Record the resolved source directory
      ansible.builtin.set_fact:
        ernic_source_dir: >-
          {{ (ernic_source_dir | trim)
             if (ernic_source_dir | trim | length > 0)
             else ([ernic_source_clone_dir]
                   + ([ernic_source_subdir | trim
                       | regex_replace('/+$', '')]
                      if (ernic_source_subdir | trim | length > 0)
                      else []))
                  | join('/') }}

    - name: Verify the source tree looks like rocm-ernic
      ansible.builtin.stat:
        path: "{{ ernic_source_dir }}/{{ item }}"
      register: ernic_source_probe
      delegate_to: localhost
      become: false
      run_once: true
      # What the roles actually read out of this checkout.  The ionic
      # patch series and the two DKMS scripts are no longer among them:
      # they ship in the collection (ansible/files/), so probing for
      # them here would fail on a perfectly good checkout.
      loop:
        - udev/99-rocm-ernic.rules
        - scripts/find-rdma-device.sh
        - cmake/ErnicKernelModule.cmake

    - name: Fail when the source tree is incomplete
      ansible.builtin.assert:
        that:
          - ernic_source_probe.results
            | rejectattr('stat.exists')
            | list | length == 0
        fail_msg: >-
          {{ ernic_source_dir }} does not look like a rocm-ernic
          checkout; missing
          {{ ernic_source_probe.results
             | rejectattr('stat.exists')
             | map(attribute='item') | join(', ') }}.
          Set ernic_source_dir to a checkout, or leave it empty
          to clone {{ ernic_source_repo_url }}, setting
          ernic_source_subdir to rocm-ernic's directory in it
          if it isn't the whole repository.
      run_once: true

    # Set last: the block's guard is re-evaluated per task, so
    # raising this flag any earlier would skip the rest of the
    # block on the very run that is meant to do the work.
    - name: Mark the source as resolved
      ansible.builtin.set_fact:
        ernic_source_resolved: true

- name: Resolve the ionic kernel ref
  ansible.builtin.include_tasks: ionic_ref.yml
  when: ernic_ionic_ref is not defined
