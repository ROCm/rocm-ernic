---
# One kernel ref: fetch the sources, prove they actually carry SRQ, build.
#
# Included per-ref from main.yml with ernic_srq_src set to the list entry.

- name: "Set the checkout paths for {{ ernic_srq_src.ref[:12] }}"
  ansible.builtin.set_fact:
    # Where the build happens: the staging root for a controller-fetched run,
    # the role's own source root for a local one.
    ernic_srq_dir: >-
      {{ (ernic_srq_dkms_stage_dir
          if ernic_srq_dkms_fetch_on_controller | bool
          else ernic_srq_dkms_source_root) ~ '/' ~ ernic_srq_src.ref }}
    # Where the controller fetches and patches. Unused when the fetch is local.
    ernic_srq_ctl_dir: >-
      {{ ernic_srq_dkms_controller_root ~ '/' ~ ernic_srq_src.ref }}
    # Which copy of setup-ionic-dkms.sh to run. The staged one is on the
    # target; the default is a controller path that only resolves when the
    # target IS the controller.
    ernic_srq_dkms_script: >-
      {{ ernic_srq_dkms_stage_dir ~ '/setup-ionic-dkms.sh'
         if ernic_srq_dkms_fetch_on_controller | bool
         else ernic_srq_dkms_scripts_dir ~ '/setup-ionic-dkms.sh' }}

- name: "Stage the sources from the controller
    ({{ ernic_srq_src.ref[:12] }})"
  when: ernic_srq_dkms_fetch_on_controller | bool
  ansible.builtin.include_tasks: stage.yml

# Discarded rather than reused, because this role exists to VERIFY the patches
# apply and build. The fetch script's sentinel names the ref and a digest of
# patches/srq, so it does fetch again when the series changes, but it names
# the ref, not the commit the ref resolved to, and it cannot tell that a tree
# was edited after it was patched. On a persistent build host either one
# means the role builds sources that are not what the repository holds and
# reports success, which is the one answer a verification gate must never
# give. Re-fetching costs a clone; being wrong costs a merged patch that does
# not apply.
#
# The fetch task has no `creates:`. A directory that exists says nothing
# about which series was applied, and the sentinel's name depends on the
# digest, which only the script computes, so the script decides.
- name: "Discard any cached checkout for {{ ernic_srq_src.ref[:12] }}"
  become: true
  when:
    - not (ernic_srq_dkms_fetch_on_controller | bool)
    - ernic_srq_dkms_force_fetch | bool
  ansible.builtin.file:
    path: "{{ ernic_srq_dir }}"
    state: absent

- name: "Fetch ionic sources at {{ ernic_srq_src.ref[:12] }}"
  become: true
  when: not (ernic_srq_dkms_fetch_on_controller | bool)
  ansible.builtin.command:
    cmd: >-
      {{ ernic_srq_dkms_scripts_dir }}/fetch-ionic-sources.sh
      --source-dir {{ ernic_srq_dir }}
      --kernel-ref {{ ernic_srq_src.ref }}
      --repo {{ ernic_srq_src.repo }}
      --patches-dir {{ ernic_srq_dkms_patches_dir }}
  register: ernic_srq_dkms_fetch
  changed_when: "'nothing to do' not in ernic_srq_dkms_fetch.stdout"

# The check that makes a wrong ref loud.
#
# Without it, a ref that predates the series fetches fine, builds fine, and
# produces an ionic_rdma with no SRQ at all -- which surfaces much later as a
# guest reporting max_srq=0, with nothing pointing back at this role. Grep
# for the verb implementation rather than the string "srq": IONIC_QPT_SRQ and
# the IB_USER_VERBS_CMD_*_SRQ command bits are present in the protocol header
# even in trees with no SRQ support, so a bare grep matches both.
- name: "Confirm the ref carries SRQ support ({{ ernic_srq_src.ref[:12] }})"
  become: true
  when: not (ernic_srq_dkms_fetch_on_controller | bool)
  ansible.builtin.command:
    cmd: >-
      grep -lE 'ionic_create_srq_cmd|\.create_srq[[:space:]]*='
      {{ ernic_srq_dir }}/drivers/infiniband/hw/ionic/ionic_controlpath.c
  register: ernic_srq_probe
  changed_when: false
  failed_when: false

- name: "Fail when the ref has no SRQ support ({{ ernic_srq_src.ref[:12] }})"
  when:
    - not (ernic_srq_dkms_fetch_on_controller | bool)
    - ernic_srq_dkms_require_srq | bool
    - ernic_srq_probe.rc != 0
  ansible.builtin.fail:
    msg: >-
      {{ ernic_srq_src.ref }} does not implement SRQ: no create_srq verb in
      ionic_controlpath.c. Building it would produce a driver that reports
      max_srq=0, which is exactly the state this role exists to avoid. The
      series is in rdma/for-next; pick a ref that contains
      "RDMA/ionic: add Shared receive queue (SRQ) support", or set
      ernic_srq_dkms_require_srq=false to build it anyway.

- name: "Build the DKMS modules for {{ ernic_srq_src.ref[:12] }}"
  become: true
  ansible.builtin.command:
    cmd: >-
      {{ ernic_srq_dkms_script }}
      --source-dir {{ ernic_srq_dir }}
      --kernel-ref {{ ernic_srq_src.ref }}
      {{ '--build-only' if not (ernic_srq_dkms_install | bool) else '' }}
  changed_when: true
  register: ernic_srq_dkms_build

- name: "Show the build result for {{ ernic_srq_src.ref[:12] }}"
  ansible.builtin.debug:
    msg: "{{ ernic_srq_dkms_build.stdout_lines[-8:] | default([]) }}"
