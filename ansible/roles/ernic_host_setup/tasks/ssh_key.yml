#
# The guest image has no SSH key or password: ernicctl vm-launch
# authorizes a key at each boot, the .pub beside ERNIC_VM_SSH_IDENTITY
# (ernic_vm_ssh_identity, which the env file then sets), or else beside
# the first of id_rsa, id_ed25519 and id_ecdsa in the ~/.ssh, from the
# passwd database, of SUDO_USER, the user who ran it with sudo.  Run as
# root without sudo, it has no user to look in.  Without a key, nobody
# can log in to the guests it boots, so fail now, before anything is
# built.

---
# ernic_vm_launch_user, or whoever runs this play, or if that's root,
# whoever ran it with sudo
- name: Work out who will run ernicctl vm-launch with sudo
  ansible.builtin.set_fact:
    ernic_vm_key_user: >-
      {{ ernic_vm_launch_user | default('', true)
         or (ansible_user_id if ansible_user_id != 'root'
             else ansible_env.SUDO_USER | default('', true)) }}

- name: Look up their home directory
  ansible.builtin.getent:
    database: passwd
    key: "{{ ernic_vm_key_user }}"
  when:
    - not (ernic_vm_ssh_identity | default('') | trim)
    - ernic_vm_key_user | length > 0

- name: Note their home directory
  ansible.builtin.set_fact:
    ernic_vm_key_home: "{{ ansible_facts.getent_passwd[ernic_vm_key_user][4] }}"
  when:
    - not (ernic_vm_ssh_identity | default('') | trim)
    - ernic_vm_key_user | length > 0

- name: List the SSH keys ernicctl vm-launch would look for
  ansible.builtin.set_fact:
    ernic_vm_key_candidates: >-
      {{ [ernic_vm_ssh_identity]
         if (ernic_vm_ssh_identity | default('') | trim)
         else (['id_rsa', 'id_ed25519', 'id_ecdsa']
               | map('regex_replace', '^', ernic_vm_key_home ~ '/.ssh/')
               | list)
         if ernic_vm_key_user | length > 0
         else [] }}

- name: Look for the private keys
  ansible.builtin.stat:
    path: "{{ item }}"
  loop: "{{ ernic_vm_key_candidates }}"
  register: ernic_vm_private_keys

- name: Look for their public halves
  ansible.builtin.stat:
    path: "{{ item }}.pub"
  loop: "{{ ernic_vm_key_candidates }}"
  register: ernic_vm_public_keys

# ernicctl takes the first private key it finds, and authorizes its .pub
- name: Check vm-launch has a key to authorize
  vars:
    ernic_vm_key: >-
      {{ ernic_vm_private_keys.results | selectattr('stat.exists')
         | map(attribute='item') | first | default('') }}
    ernic_vm_public: >-
      {{ ernic_vm_public_keys.results | selectattr('stat.exists')
         | map(attribute='item') | list }}
  ansible.builtin.assert:
    that:
      - ernic_vm_key | length > 0
      - ernic_vm_key in ernic_vm_public
    fail_msg: >-
      ernicctl vm-launch has no SSH key to authorize in the guests it boots,
      which have none of their own.
      {% if ernic_vm_key | length > 0 %}{{ ernic_vm_key }}.pub is missing;
      make it with: ssh-keygen -y -f {{ ernic_vm_key }} > {{ ernic_vm_key }}.pub
      {% elif ernic_vm_ssh_identity | default('') | trim %}{{
      ernic_vm_ssh_identity }} doesn't exist; set ernic_vm_ssh_identity to a
      private key with its .pub beside it.
      {% elif ernic_vm_key_user | length == 0 %}This play runs as root, not
      under sudo, and vm-launch run that way looks for no key of its own:
      set ernic_vm_ssh_identity to a private key with its .pub beside it, or
      ernic_vm_launch_user to the user who will run vm-launch with sudo.
      {% else %}{{ ernic_vm_key_user }}, who will run vm-launch with sudo,
      has none of id_rsa, id_ed25519 and id_ecdsa in
      {{ ernic_vm_key_home }}/.ssh.
      Make one with: ssh-keygen -t ed25519, as {{ ernic_vm_key_user }}, or
      set ernic_vm_launch_user or ernic_vm_ssh_identity.
      {% endif %}
    quiet: true
