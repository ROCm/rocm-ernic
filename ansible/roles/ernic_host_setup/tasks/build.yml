---
# Configured on every run, not only when there's no build yet, so that
# a changed ernic_install_prefix or ernic_build_type reaches the build.
# The paths the installed files name, and ernic_config_dir, follow the
# prefix.
- name: Configure the CMake build
  ansible.builtin.command:
    argv:
      - cmake
      - -B
      - "{{ ernic_build_dir }}"
      - -G
      - Ninja
      - "-DCMAKE_BUILD_TYPE={{ ernic_build_type }}"
      - "-DCMAKE_INSTALL_PREFIX={{ ernic_install_prefix }}"
      - -DERNIC_INSTALL_SERVICE=ON
    chdir: "{{ ernic_source_dir }}"
  changed_when: true

- name: Build the project
  ansible.builtin.command:
    argv:
      - cmake
      - --build
      - "{{ ernic_build_dir }}"
    chdir: "{{ ernic_source_dir }}"
  changed_when: true

- name: Install rocm-ernic (server, ernicctl, systemd units)
  ansible.builtin.command:
    argv:
      - cmake
      - --install
      - "{{ ernic_build_dir }}"
  become: true
  changed_when: true
