---
# ── Phase gates ──────────────────────────────────
ernic_build: true
ernic_install_service: true
ernic_start_service: true

# ── Build ────────────────────────────────────────
ernic_build_dir: "{{ ernic_source_dir }}/build"
ernic_build_type: Release
ernic_install_prefix: /usr/local

# ── Service / env-file settings ──────────────────
ernic_config_dir: /etc/rocm-ernic
ernic_bin: /usr/local/bin/rocm-ernic
ernic_run_dir: /run/rocm-ernic
ernic_log_dir: /var/log/rocm-ernic
ernic_instances: 2
ernic_tcp_port: 6320
ernic_manager_ip: 127.0.0.1
ernic_verbose: "false"

# Server log verbosity written into the env file: one of
# none, error, warn, info, debug.  warn keeps steady-state
# logs to WARN/ERROR plus a short startup banner.  Note that
# ernic_verbose: "true" overrides this with debug.
ernic_log_level: warn

# When true, /etc/rocm-ernic/rocm-ernic.env sets ERNIC_DEBUG_MESH=1
# so rocm-ernic logs rate-limited mesh Ethernet diagnostics (EAGAIN
# drops, inject failures, etc.).  Set false on production hosts to
# cut log noise.
ernic_debug_mesh: true
# When true, each pci_dma_map logs a line (very noisy under load).
# Use only for short-lived pointer / mapping debugging.
ernic_debug_dma_map: false

# ── Driver distribution ─────────────────────────
ernic_driver_source: /usr/share/rocm-ernic/driver
ernic_driver_tarball: /tmp/rocm-ernic-driver.tar.gz

# ── QEMU / VM defaults written into the env file ─
ernic_qemu_minimal: "{{ ansible_env.HOME }}/Projects/qemu-minimal"
ernic_qemu_path: /opt/qemu/bin/
ernic_vm_image_dir: /opt/qemu-images
ernic_vm_name_base: rocm-ernic-vm
ernic_vm_vcpus: 16
ernic_vm_mem: 32768
ernic_vm_ssh_user: ubuntu
ernic_vm_ssh_host: local-vm
ernic_vm_ssh_base_port: 2250

# ── GPU passthrough (vfio-pci) ──────────────────
# Bind the listed GPUs to vfio-pci so QEMU can pass them into
# the VMs.  Requires IOMMU enabled on the kernel command line.
ernic_gpu_passthrough: true
ernic_pci_mmio_bridge: true
ernic_gpu_pci_devices: {}

# ── rocm-xio staging ────────────────────────────
# Cloned on this host and tarred up so the guests, which have no
# GitHub access, can unpack it.
ernic_rocm_xio_repo: "https://github.com/ROCm/rocm-xio.git"
ernic_rocm_xio_branch: "main"
# Pin to a specific commit SHA for reproducibility.
# Leave empty to use the branch tip.
ernic_rocm_xio_commit: ""
ernic_rocm_xio_clone_dir: /tmp/rocm-xio
ernic_rocm_xio_tarball: /tmp/rocm-xio.tar.gz

# ── Service restart handling ─────────────────────
# Stop VMs and instances left over from a previous run before
# restarting.  Set false to leave a running mesh alone.
ernic_restart_existing: true
ernic_socket_wait: 30
