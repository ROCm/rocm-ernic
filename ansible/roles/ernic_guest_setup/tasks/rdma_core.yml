#
# Build and install rdma-core.
#
# We use stock rdma-core, whose providers/ionic has been upstream
# since v61; the only local change is the rocm-xio GDA direct-verbs
# patch series, applied when the guest has a GPU.
#
# Rebuild whenever the inputs differ from what is installed, and
# skip otherwise.  The build takes about seven minutes per guest,
# so this is worth getting right.
#
---
# providers/ionic first shipped in rdma-core v61.
- name: Assert rdma-core is new enough to carry providers/ionic
  ansible.builtin.assert:
    that:
      - ernic_rdma_core_version is version('61', '>=')
    fail_msg: >-
      ernic_rdma_core_version is {{ ernic_rdma_core_version }};
      providers/ionic needs v61 or newer.  Raise the version.

- name: Fetch rocm-xio for its ionic GDA patches
  ansible.builtin.include_tasks: rocm_xio_fetch.yml
  when: ernic_gpu_passthrough | bool

- name: Hash the ionic GDA patch series
  ansible.builtin.shell: |
    set -o pipefail
    find "{{ ernic_ionic_gda_patch_dir }}" -name '*.patch' -print0 \
      | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1
  args:
    executable: /bin/bash
  changed_when: false
  register: ernic_gda_patch_hash
  when: ernic_gpu_passthrough | bool

- name: Read the installed provider stamp
  ansible.builtin.slurp:
    src: "{{ ernic_guest_stamp_dir }}/provider.stamp"
  register: ernic_provider_stamp
  failed_when: false

# The GDA patch hash is part of the stamp, so toggling GPU
# passthrough forces a rebuild instead of silently reusing an
# rdma-core built for the other one.
- name: Decide whether rdma-core needs rebuilding
  ansible.builtin.set_fact:
    ernic_provider_want: >-
      {{ ernic_rdma_core_version }}:{{
         (ernic_gda_patch_hash.stdout | default(''))
         | trim | default('none', true) }}
    ernic_provider_have: >-
      {{ (ernic_provider_stamp.content | b64decode | trim)
         if (ernic_provider_stamp.content is defined)
         else '' }}

- name: Report that the installed rdma-core is current
  ansible.builtin.debug:
    msg: >-
      rdma-core {{ ernic_rdma_core_version }} already built from
      these sources; skipping rebuild.
  when: ernic_provider_want == ernic_provider_have

- name: Build and install rdma-core
  when: ernic_provider_want != ernic_provider_have
  vars:
    rc_base: "{{ ernic_rdma_core_build_dir }}"
    rc_src: >-
      {{ ernic_rdma_core_build_dir }}/rdma-core-{{
         ernic_rdma_core_version }}
    rc_tar: >-
      {{ ernic_rdma_core_build_dir }}/rdma-core-{{
         ernic_rdma_core_version }}.tar.gz
  block:

    - name: Create the rdma-core build directory
      ansible.builtin.file:
        path: "{{ rc_base }}"
        state: directory
        mode: "0755"

    # Removed rather than reused: the GDA patches are applied with
    # patch(1), so a tree left over from an earlier run would be
    # patched twice.
    - name: Remove any previous rdma-core source tree
      ansible.builtin.file:
        path: "{{ rc_src }}"
        state: absent

    # The release CDN returns a 500 often enough to fail a CI run on its
    # own, and every other fetch in this collection already retries.
    - name: Download the rdma-core tarball
      ansible.builtin.get_url:
        url: "{{ ernic_rdma_core_url }}"
        dest: "{{ rc_tar }}"
        mode: "0644"
      register: ernic_rdma_core_tarball
      retries: "{{ ernic_guest_build_deps_retries }}"
      delay: "{{ ernic_guest_build_deps_delay }}"
      until: ernic_rdma_core_tarball is success

    - name: Extract the rdma-core tarball
      ansible.builtin.unarchive:
        src: "{{ rc_tar }}"
        dest: "{{ rc_base }}/"
        remote_src: true

    # The source tree is extracted fresh above, so these apply
    # exactly once and any failure is a real conflict.
    - name: Apply the ionic GDA patches
      ansible.builtin.shell:
        executable: /bin/bash
        chdir: "{{ rc_src }}"
        cmd: |
          set -euo pipefail
          shopt -s nullglob
          found=false
          for p in "{{ ernic_ionic_gda_patch_dir }}"/*.patch; do
            echo "applying $(basename "$p")"
            patch -p1 < "$p"
            found=true
          done
          if ! $found; then
            echo "no patches in {{ ernic_ionic_gda_patch_dir }}" >&2
            exit 1
          fi
      changed_when: true
      when: ernic_gpu_passthrough | bool

    - name: Configure the rdma-core build
      ansible.builtin.command:
        argv:
          - cmake
          - -S
          - "{{ rc_src }}"
          - -B
          - "{{ rc_base }}/build"
          - -GNinja
          - "-DCMAKE_INSTALL_PREFIX={{ ernic_rdma_core_prefix }}"
          - -DCMAKE_BUILD_TYPE=Release
          - -DNO_PYVERBS=1
          - -DNO_MAN_PAGES=1
          - -DENABLE_STATIC=0
      changed_when: true

    - name: Build rdma-core
      ansible.builtin.command:
        argv:
          - cmake
          - --build
          - "{{ rc_base }}/build"
          - "-j{{ ansible_processor_vcpus | default(2) }}"
      changed_when: true

    - name: Install rdma-core
      ansible.builtin.command:
        argv:
          - cmake
          - --install
          - "{{ rc_base }}/build"
      changed_when: true

    - name: Run ldconfig
      ansible.builtin.command:
        cmd: ldconfig
      changed_when: true

    - name: Ensure the stamp directory exists
      ansible.builtin.file:
        path: "{{ ernic_guest_stamp_dir }}"
        state: directory
        mode: "0755"

    # Written as soon as the install has happened, and before the
    # verification below, because by this point dpkg's files are
    # already overwritten whether or not the rest of the run
    # succeeds -- which is exactly the condition the holds exist
    # for.
    - name: Record that this guest's rdma-core came from source
      ansible.builtin.copy:
        content: "{{ ernic_provider_want }}\n"
        dest: "{{ ernic_guest_source_stamp }}"
        mode: "0644"
      when: ernic_rdma_core_prefix == '/usr'

    - name: Verify the ionic provider installed
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: >-
          set -o pipefail;
          ls /usr/lib/*/libibverbs/libionic*.so
      changed_when: false

    # Written last, so an interrupted build is not
    # mistaken for a complete one on the next run.
    - name: Record what rdma-core was built from
      ansible.builtin.copy:
        content: "{{ ernic_provider_want }}\n"
        dest: "{{ ernic_guest_stamp_dir }}/provider.stamp"
        mode: "0644"

- name: Look for a record of a source build in this guest
  ansible.builtin.stat:
    path: "{{ ernic_guest_source_stamp }}"
  register: ernic_source_build_marker

# A source build into /usr overwrites the distro's rdma-core in
# place while dpkg still believes its own version is installed.
# Only that build ships an ionic provider, so an apt upgrade that
# restores the packaged libraries takes the device away entirely --
# and does it long after the fact, with nothing to connect the
# failure to its cause.  Held outside the build block so re-runs
# that skip the rebuild still reapply it, which is why the gate is
# the marker rather than the block: the prefix says where a build
# would install, not whether one ever did, and the provider stamp
# cannot tell us either because the ionic guest image writes one
# for a provider that came from the archive.  Holding that guest
# would pin the distro's RDMA userspace against its own security
# updates to protect a build that never happened.
#
# Guests source-built before the marker existed have none, and need
# no migration: dpkg_selections clears nothing by absence, so the
# hold an earlier run put on them is still there.
- name: Hold the packages our rdma-core build overwrites
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop: "{{ ernic_rdma_core_hold_packages }}"
  failed_when: false
  when:
    - ernic_rdma_core_hold | bool
    - ernic_rdma_core_prefix == '/usr'
    - ernic_source_build_marker.stat.exists
