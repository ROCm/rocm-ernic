#
# Give each guest a unique hostname and an address on the
# emulated NIC, so the mesh is reachable for the test plays.

---
- name: Set the VM hostname
  ansible.builtin.hostname:
    name: "{{ ernic_vm_name_base }}-{{ ernic_guest_vm_index }}"
  when: ernic_set_hostname | bool

- name: Update /etc/hosts with the new hostname
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.1\.1'
    line: >-
      127.0.1.1 {{ ernic_vm_name_base }}-{{ ernic_guest_vm_index }}
  when: ernic_set_hostname | bool

- name: Fail when no address was supplied for the NIC
  ansible.builtin.assert:
    that:
      - ernic_guest_vm_ip | trim | length > 0
    fail_msg: >-
      ernic_guest_vm_ip is empty.  Set it (or the vm_ip host var
      that vm-register.yml supplies) to the address this guest
      should take on {{ ernic_nic_name }}.  vm-register.yml derives
      it as {{ ernic_nic_subnet }}.{{ 10 * (ernic_guest_vm_index
      | int) }} for index {{ ernic_guest_vm_index }} -- .10 and .20
      for a two-guest mesh, which is what the sanity and
      performance plays expect.

- name: Check that the emulated NIC exists
  ansible.builtin.command:
    cmd: "ip -o link show {{ ernic_nic_name }}"
  register: ernic_nic_check
  changed_when: false
  failed_when: false

- name: Fail if the NIC is not found
  ansible.builtin.assert:
    that:
      - ernic_nic_check.rc == 0
    fail_msg: >-
      NIC {{ ernic_nic_name }} not found.  preflight.yml confirmed
      {{ ernic_device_vendor_id }}:{{ ernic_device_id }} is on the
      bus, so the device exists and it is the rename that did not
      happen: check that udev/99-rocm-ernic.rules landed in
      /etc/udev/rules.d and that ionic is the bound driver
      (the rules also match on DRIVERS=="ionic").

- name: Bring the emulated NIC up
  ansible.builtin.command:
    argv:
      - ip
      - link
      - set
      - "{{ ernic_nic_name }}"
      - up
  changed_when: true

- name: Check the existing IP on the NIC
  ansible.builtin.command:
    argv:
      - ip
      - addr
      - show
      - dev
      - "{{ ernic_nic_name }}"
  register: ernic_nic_addr_check
  changed_when: false

- name: Assign the IP address to the emulated NIC
  ansible.builtin.command:
    argv:
      - ip
      - addr
      - add
      - "{{ ernic_guest_vm_ip }}/{{ ernic_nic_prefix }}"
      - dev
      - "{{ ernic_nic_name }}"
  when: ernic_guest_vm_ip not in ernic_nic_addr_check.stdout
  changed_when: true

- name: Display the NIC configuration
  ansible.builtin.command:
    argv:
      - ip
      - addr
      - show
      - dev
      - "{{ ernic_nic_name }}"
  register: ernic_nic_config
  changed_when: false

- name: Show NIC details
  ansible.builtin.debug:
    var: ernic_nic_config.stdout_lines
