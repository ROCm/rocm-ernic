#
# Name the emulated NIC in the guest's pci.ids by subsystem ID.
#
# The emulated device reuses a real, vendor-assigned pair: current
# hwdata already lists 1dd8:100a as "DSC Serial Port Controller".
# Newer pci.ids releases add a subsystem-specific 1dd8:5400 line that
# renames just rocm-ernic to "ROCm Emulated RDMA NIC". On an
# up-to-date guest there is therefore nothing to add. Adding a second
# 100a device line would be wrong and can make pciutils reject the
# file outright, so the guard below works at subsystem granularity
# inside the existing device block.
#
# scripts/pci.ids.rocm-ernic is the canonical copy of the entry;
# ernic_guest_pciids_entry must match it.

---
- name: Find the system pci.ids path
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - /usr/share/hwdata/pci.ids
    - /usr/share/misc/pci.ids
  register: ernic_pciids_stat

- name: Set the pci.ids path fact
  ansible.builtin.set_fact:
    ernic_pciids_path: >-
      {{ (ernic_pciids_stat.results
          | selectattr('stat.exists')
          | map(attribute='item')
          | first
          | default('')) }}

# No pci.ids at all means no pciutils database to amend.  Cosmetic
# either way, so this is skipped rather than fatal.
- name: Amend pci.ids
  when: ernic_pciids_path | length > 0
  block:

    # pci.ids is a flat file with block structure: a vendor line at
    # column 0, its devices indented one tab, subsystems two.  So
    # "does this vendor already list this device" needs a stateful
    # scan, not a grep -- a bare grep for the device id matches the
    # same four hex digits under a dozen other vendors.
    - name: Check whether the vendor block already lists the device
      ansible.builtin.command:
        argv:
          - awk
          - >-
            /^[0-9a-fA-F]{4}[ \t]/ {
              inblock = ($1 == vendor)
            }
            inblock && $0 ~ "^\t" device "[ \t]" { found = 1 }
            END { exit found ? 0 : 1 }
          - "vendor={{ ernic_guest_pciids_vendor }}"
          - "device={{ ernic_guest_pciids_device }}"
          - "{{ ernic_pciids_path }}"
      register: ernic_pciids_have_device
      failed_when: false
      changed_when: false

    - name: Check whether the device block already lists the subsystem
      ansible.builtin.command:
        argv:
          - awk
          - >-
            /^[0-9a-fA-F]{4}[ \t]/ {
              in_vendor = ($1 == vendor)
              in_device = 0
            }
            in_vendor && $0 ~ "^\t" device "[ \t]" {
              in_device = 1
              next
            }
            in_vendor && $0 ~ "^\t[0-9a-fA-F]{4}[ \t]" { in_device = 0 }
            in_device && $0 ~ "^\t\t" subvendor "[ \t]+" subdevice "[ \t]" {
              found = 1
            }
            END { exit found ? 0 : 1 }
          - "vendor={{ ernic_guest_pciids_vendor }}"
          - "device={{ ernic_guest_pciids_device }}"
          - "subvendor={{ ernic_guest_pciids_entry.split()[0] }}"
          - "subdevice={{ ernic_guest_pciids_entry.split()[1] }}"
          - "{{ ernic_pciids_path }}"
      register: ernic_pciids_have_subsystem
      failed_when: false
      changed_when: false

    # Inserted directly under the device line, because pci.ids is
    # parsed sequentially: a subsystem line belongs to the device
    # block it sits in, so appending at the end of the file would
    # land it under the class section and never match.
    - name: Merge the rocm-ernic subsystem into pci.ids
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import sys

          path = Path({{ ernic_pciids_path | to_json }})
          vendor = {{ ernic_guest_pciids_vendor | to_json }}
          device = {{ ernic_guest_pciids_device | to_json }}
          entry = "\t\t" + {{ ernic_guest_pciids_entry | to_json }}

          lines = path.read_text().splitlines()
          in_vendor = False

          for idx, line in enumerate(lines):
              if re.match(r'^[0-9A-Fa-f]{4}[ \t]', line):
                  in_vendor = line.split()[0] == vendor
                  continue

              if in_vendor and re.match(r'^\t' + re.escape(device) + r'[ \t]', line):
                  lines.insert(idx + 1, entry)
                  path.write_text('\n'.join(lines) + '\n')
                  print('changed')
                  sys.exit(0)

          sys.exit(2)
          PY
      register: ernic_pciids_merge
      changed_when: "'changed' in ernic_pciids_merge.stdout"
      failed_when: false
      when:
        - ernic_pciids_have_device.rc == 0
        - ernic_pciids_have_subsystem.rc != 0

    # A hwdata too old to know the vendor leaves the replace above a
    # silent no-op and the entry quietly never appears.  Say so
    # rather than pretend it worked.
    - name: Warn when the pci.ids vendor block is missing
      ansible.builtin.debug:
        msg: >-
          {{ ernic_pciids_path }} does not list
          {{ ernic_guest_pciids_vendor }}:{{
          ernic_guest_pciids_device }}, so the rocm-ernic subsystem
          entry was not added. Update the guest's hwdata package so
          the subsystem name has a device block to attach to.
      when:
        - ernic_pciids_have_device.rc != 0
        - not (ernic_pciids_merge.changed | default(false))

    - name: Report the name pci.ids already gives the device
      ansible.builtin.debug:
        msg: >-
          {{ ernic_pciids_path }} already lists subsystem
          {{ ernic_guest_pciids_entry.split()[0] }}:{{
          ernic_guest_pciids_entry.split()[1] }} for
          {{ ernic_guest_pciids_vendor }}:{{
          ernic_guest_pciids_device }}, so it was left alone.
      when: ernic_pciids_have_subsystem.rc == 0

    - name: Warn when the subsystem entry could not be inserted
      ansible.builtin.debug:
        msg: >-
          {{ ernic_pciids_path }} has device
          {{ ernic_guest_pciids_vendor }}:{{
          ernic_guest_pciids_device }}, but the rocm-ernic subsystem
          line could not be inserted under it. Re-run update-pciids and
          inspect that device block manually.
      when:
        - ernic_pciids_have_device.rc == 0
        - ernic_pciids_have_subsystem.rc != 0
        - ernic_pciids_merge is defined
        - ernic_pciids_merge.rc not in [0, 2]

    # Cheap, and the only thing that proves the file is still
    # parseable: on a duplicate device id pciutils prints
    # "Duplicate entry at <file>, line N" and resolves no names at
    # all, for any device on the bus.  Skipped when pciutils is
    # absent -- this role does not install it, and a missing binary
    # is not evidence of a corrupt file.
    - name: Verify pci.ids still parses
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: >-
          command -v lspci >/dev/null || exit 0;
          lspci -i {{ ernic_pciids_path | quote }} -nn 2>&1 >/dev/null
      register: ernic_pciids_verify
      changed_when: false
      failed_when: false
      when:
        - ernic_pciids_have_device.rc == 0
        - ernic_pciids_have_subsystem.rc != 0

    - name: Assert pci.ids was not corrupted
      ansible.builtin.assert:
        that:
          - "'Duplicate entry' not in (ernic_pciids_verify.stdout | default(''))"
        fail_msg: >-
          Merging the rocm-ernic entry left
          {{ ernic_pciids_path }} unparsable, so lspci now resolves
          no names for any device: {{
          ernic_pciids_verify.stdout | default('') }}.  Restore it
          with "update-pciids" and set ernic_guest_pciids=false.
      when:
        - ernic_pciids_have_device.rc == 0
        - ernic_pciids_have_subsystem.rc != 0
