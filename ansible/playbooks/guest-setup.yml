#
# Play 3: Provision guest VMs with RDMA packages, the
# rocm-ernic kernel driver, and the custom rdma-core
# provider.  Configure IP addresses on the emulated
# NICs for inter-VM connectivity.

---
- name: Guest setup -- driver, rdma-core, NIC config
  hosts: ernic_vms
  become: true
  gather_facts: true
  vars_files:
    - ../group_vars/all.yml

  tasks:

    # ── RDMA packages via collection role ────────────
    # The rdma_setup role installs perftest, rdma-core,
    # ibverbs-utils, kernel headers, etc.  Its rdma-detect
    # script may fail for emulated devices (no link state),
    # so we allow the role to fail gracefully.
    - name: Install RDMA packages via rdma_setup role
      block:
        - name: Run sbates130272.batesste.rdma_setup
          ansible.builtin.include_role:
            name: sbates130272.batesste.rdma_setup
      rescue:
        - name: Note rdma_setup non-fatal failure
          ansible.builtin.debug:
            msg: >-
              rdma_setup role failed (likely rdma-detect
              on emulated device). Packages were
              installed; continuing.
      when: not (ernic_skip_guest_ansible_roles | bool)

    - name: Skipping guest Ansible roles
      ansible.builtin.debug:
        msg: "ernic_skip_guest_ansible_roles is set"
      when: ernic_skip_guest_ansible_roles | bool

    # ── Extra packages ───────────────────────────────
    - name: Install additional build and test packages
      ansible.builtin.apt:
        name:
          - iperf3
          - build-essential
          - cmake
          - ninja-build
          - pkg-config
          - curl
        state: present
        update_cache: true
      register: guest_apt_result
      retries: 3
      delay: 10
      until: guest_apt_result is success
      when: not (ernic_skip_guest_ansible_roles | bool)

    # ── Copy driver source ───────────────────────────
    - name: Copy driver source to guest
      ansible.builtin.copy:
        src: "{{ ernic_project_root }}/driver/"
        dest: /tmp/driver/
        mode: "0755"

    # ── Copy rdma-core provider ──────────────────────
    - name: Create rdma-core provider directory
      ansible.builtin.file:
        path: /tmp/rdma-core-provider
        state: directory
        mode: "0755"

    - name: Copy rdma-core providers directory
      ansible.builtin.copy:
        src: "{{ ernic_project_root }}/rdma-core/providers/"
        dest: /tmp/rdma-core-provider/providers/
        mode: "0755"

    - name: Copy rdma-core rocm-ernic-dv directory
      ansible.builtin.copy:
        src: "{{ ernic_project_root }}/rdma-core/rocm-ernic-dv/"
        dest: /tmp/rdma-core-provider/rocm-ernic-dv/
        mode: "0755"

    # ── Build custom rdma-core with provider ─────────
    - name: Check if custom rdma-core is already installed
      ansible.builtin.stat:
        path: /usr/lib/libibverbs/librocm_ernic.so
      register: ernic_provider_check

    - name: Set rdma-core path facts
      ansible.builtin.set_fact:
        rc_ver: "{{ ernic_rdma_core_version }}"
        rc_base: /tmp/rdma-core-build
      when: not ernic_provider_check.stat.exists

    - name: Build and install custom rdma-core
      when: not ernic_provider_check.stat.exists
      vars:
        rc_src: "{{ rc_base }}/rdma-core-{{ rc_ver }}"
        rc_tar: "{{ rc_base }}/rdma-core-{{ rc_ver }}.tar.gz"
        rc_url: >-
          https://github.com/linux-rdma/rdma-core/releases/download/v{{ rc_ver }}/rdma-core-{{ rc_ver }}.tar.gz
      block:
        - name: Create rdma-core build directory
          ansible.builtin.file:
            path: "{{ rc_base }}"
            state: directory
            mode: "0755"

        - name: Download rdma-core tarball
          ansible.builtin.get_url:
            url: "{{ rc_url }}"
            dest: "{{ rc_tar }}"
            mode: "0644"

        - name: Extract rdma-core tarball
          ansible.builtin.unarchive:
            src: "{{ rc_tar }}"
            dest: "{{ rc_base }}/"
            remote_src: true

        - name: Inject rocm_ernic provider
          ansible.builtin.copy:
            src: /tmp/rdma-core-provider/providers/rocm_ernic/
            dest: "{{ rc_src }}/providers/rocm_ernic/"
            remote_src: true
            mode: "0755"

        - name: Check if provider is registered
          ansible.builtin.command:
            argv:
              - grep
              - -q
              - rocm_ernic
              - "{{ rc_src }}/CMakeLists.txt"
          register: provider_grep
          failed_when: false
          changed_when: false

        - name: Register provider in CMakeLists.txt
          ansible.builtin.lineinfile:
            path: "{{ rc_src }}/CMakeLists.txt"
            line: "add_subdirectory(providers/rocm_ernic)"
            insertafter: EOF
          when: provider_grep.rc != 0

        - name: Configure rdma-core build
          ansible.builtin.command:
            argv:
              - cmake
              - -S
              - "{{ rc_src }}"
              - -B
              - "{{ rc_base }}/build"
              - -GNinja
              - -DCMAKE_INSTALL_PREFIX=/usr
              - -DCMAKE_BUILD_TYPE=Release
              - -DNO_PYVERBS=1
              - -DNO_MAN_PAGES=1
              - -DENABLE_STATIC=0
          changed_when: true

        - name: Build rdma-core
          ansible.builtin.command:
            argv:
              - cmake
              - --build
              - "{{ rc_base }}/build"
              - "-j{{ ansible_processor_vcpus | default(2) }}"
          changed_when: true

        - name: Install rdma-core
          ansible.builtin.command:
            argv:
              - cmake
              - --install
              - "{{ rc_base }}/build"
          changed_when: true

        - name: Run ldconfig
          ansible.builtin.command:
            cmd: ldconfig
          changed_when: true

    # ── Build and load kernel driver ─────────────────
    - name: Build the kernel driver
      community.general.make:
        chdir: /tmp/driver
        params:
          KDIR: "/lib/modules/{{ ansible_kernel }}/build"

    - name: Verify driver modules were built
      ansible.builtin.stat:
        path: "/tmp/driver/{{ item }}"
      register: driver_ko_stat
      failed_when: not driver_ko_stat.stat.exists
      loop:
        - rocm_ernic_eth.ko
        - rocm_ernic_rdma.ko

    # ── Install udev rules BEFORE loading driver ─────
    - name: Copy rocm-ernic udev rules
      ansible.builtin.copy:
        src: "{{ ernic_project_root }}/udev/99-rocm-ernic.rules"
        dest: /etc/udev/rules.d/99-rocm-ernic.rules
        owner: root
        group: root
        mode: "0644"

    - name: Reload udev rules
      ansible.builtin.command:
        cmd: udevadm control --reload-rules
      changed_when: true

    # ── Merge pci.ids fragment for lspci display ─────
    - name: Find system pci.ids path
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /usr/share/hwdata/pci.ids
        - /usr/share/misc/pci.ids
      register: pciids_stat

    - name: Set pci.ids path fact
      ansible.builtin.set_fact:
        pciids_path: >-
          {{ (pciids_stat.results
              | selectattr('stat.exists')
              | first
              | default({})).item | default('') }}

    - name: Check if ROCm ERNIC entry exists in pci.ids
      ansible.builtin.command:
        argv:
          - grep
          - -q
          - "8000  ROCm Emulated RDMA NIC"
          - "{{ pciids_path }}"
      register: pciids_grep
      failed_when: false
      changed_when: false
      when: pciids_path | length > 0

    - name: Merge ROCm ERNIC device into pci.ids
      ansible.builtin.replace:
        path: "{{ pciids_path }}"
        regexp: '^(1022\s+.*)$'
        replace: '\1\n\t8000  ROCm Emulated RDMA NIC'
      when:
        - pciids_path | length > 0
        - pciids_grep.rc | default(1) != 0

    # ── Load driver modules ──────────────────────────
    - name: Load ib_core module
      community.general.modprobe:
        name: ib_core
        state: present

    - name: Load ib_uverbs module
      community.general.modprobe:
        name: ib_uverbs
        state: present

    - name: Check if rocm_ernic_eth is already loaded
      ansible.builtin.command:
        argv:
          - lsmod
      register: lsmod_output
      changed_when: false

    - name: Load rocm_ernic_eth module
      ansible.builtin.command:
        argv:
          - insmod
          - /tmp/driver/rocm_ernic_eth.ko
      when: "'rocm_ernic_eth' not in lsmod_output.stdout"
      changed_when: true

    - name: Load rocm_ernic_rdma module
      ansible.builtin.command:
        argv:
          - insmod
          - /tmp/driver/rocm_ernic_rdma.ko
      when: "'rocm_ernic_rdma' not in lsmod_output.stdout"
      changed_when: true

    # ── Trigger udev for stable device names ─────────
    - name: Trigger udev to apply naming rules
      ansible.builtin.shell:
        cmd: >-
          udevadm trigger --subsystem-match=net
          --subsystem-match=infiniband;
          udevadm settle --timeout=10
      changed_when: true

    # ── Verify RDMA device ───────────────────────────
    - name: Wait for RDMA device to register
      ansible.builtin.pause:
        seconds: 5

    - name: Check for RDMA device
      ansible.builtin.command:
        cmd: ibv_devices
      register: ibv_devices_output
      changed_when: false

    - name: Verify rocm-ernic RDMA device exists
      ansible.builtin.assert:
        that:
          - >-
            'rocm-rdma-ernic' in ibv_devices_output.stdout
            or 'rocep' in ibv_devices_output.stdout
        fail_msg: >-
          RDMA device not found. ibv_devices output:
          {{ ibv_devices_output.stdout }}

    - name: Get RDMA device name
      ansible.builtin.shell:
        cmd: >-
          ibv_devices | grep -E 'rocm-rdma-ernic|rocep'
          | awk '{print $1}' | head -1
      register: rdma_dev_name
      changed_when: false

    - name: Display RDMA device info
      ansible.builtin.shell:
        cmd: >-
          ibv_devinfo -d {{ rdma_dev_name.stdout }}
          | head -20
      register: ibv_devinfo_output
      changed_when: false

    - name: Show RDMA device details
      ansible.builtin.debug:
        var: ibv_devinfo_output.stdout_lines

    # ── Disable KillUserProcesses ─────────────────────
    # Perftest server processes (ib_send_bw, etc.) are
    # launched over SSH. Without this, systemd-logind
    # kills them when the SSH session ends.
    - name: Disable KillUserProcesses in logind
      ansible.builtin.copy:
        dest: /etc/systemd/logind.conf.d/99-kill-user-processes.conf
        content: |
          [Login]
          KillUserProcesses=no
        owner: root
        group: root
        mode: "0644"
      notify: restart logind

    # ── Set unique hostname per VM ────────────────────
    - name: Set VM hostname
      ansible.builtin.hostname:
        name: "{{ ernic_vm_name }}-{{ vm_index }}"

    - name: Update /etc/hosts with new hostname
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: '^127\.0\.1\.1'
        line: "127.0.1.1 {{ ernic_vm_name }}-{{ vm_index }}"

    # ── Configure emulated NIC IP addresses ──────────
    - name: Detect emulated NIC name
      ansible.builtin.shell:
        cmd: >-
          if ip -o link show {{ ernic_nic_name }}
          >/dev/null 2>&1; then
            echo {{ ernic_nic_name }};
          else
            ls /sys/bus/pci/drivers/rocm_ernic_eth/*/net/
            2>/dev/null | head -1;
          fi
      register: detected_nic
      changed_when: false

    - name: Assert NIC was detected
      ansible.builtin.assert:
        that:
          - detected_nic.stdout | trim | length > 0
        fail_msg: >-
          Could not find the rocm-ernic NIC.
          Check udev rules and driver loading.

    - name: Set NIC name fact
      ansible.builtin.set_fact:
        nic_name: "{{ detected_nic.stdout | trim }}"

    - name: Bring emulated NIC up
      ansible.builtin.command:
        argv:
          - ip
          - link
          - set
          - "{{ nic_name }}"
          - up
      changed_when: true

    - name: Check existing IP on NIC
      ansible.builtin.command:
        argv:
          - ip
          - addr
          - show
          - dev
          - "{{ nic_name }}"
      register: nic_addr_check
      changed_when: false

    - name: Assign IP address to emulated NIC
      ansible.builtin.command:
        argv:
          - ip
          - addr
          - add
          - "{{ vm_ip }}/24"
          - dev
          - "{{ nic_name }}"
      when: "vm_ip not in nic_addr_check.stdout"
      changed_when: true

    - name: Display NIC configuration
      ansible.builtin.command:
        argv:
          - ip
          - addr
          - show
          - dev
          - "{{ nic_name }}"
      register: nic_config
      changed_when: false

    - name: Show NIC details
      ansible.builtin.debug:
        var: nic_config.stdout_lines

    # ── GPU passthrough: ROCm + rocm-xio ────────────
    - name: Install ROCm via rocm_setup role
      ansible.builtin.include_role:
        name: sbates130272.batesste.rocm_setup
      vars:
        rocm_setup_skip_reboot: true
        rocm_setup_run_checks: false
        rocm_setup_install_metrics_exporter: false
      when: ernic_gpu_passthrough | bool

    - name: Install extra packages for rocm-xio build
      ansible.builtin.apt:
        name:
          - libcli11-dev
        state: present
        update_cache: false
      when: ernic_gpu_passthrough | bool

    - name: Load amdgpu kernel module
      community.general.modprobe:
        name: amdgpu
        state: present
      when: ernic_gpu_passthrough | bool

    - name: Verify GPU via rocm-smi
      ansible.builtin.command:
        cmd: rocm-smi --showid
      register: rocm_smi_check
      changed_when: false
      failed_when: false
      when: ernic_gpu_passthrough | bool

    - name: Display rocm-smi output
      ansible.builtin.debug:
        var: rocm_smi_check.stdout_lines
      when: ernic_gpu_passthrough | bool

    - name: Assert GPU is visible in guest
      ansible.builtin.assert:
        that:
          - rocm_smi_check.rc == 0
        fail_msg: >-
          rocm-smi failed. The GPU may not be
          passed through correctly. Check QEMU
          PCI_HOSTDEV and IOMMU configuration.
      when: ernic_gpu_passthrough | bool

    - name: Copy and extract rocm-xio tarball
      ansible.builtin.unarchive:
        src: /tmp/rocm-xio.tar.gz
        dest: /opt
        creates: /opt/rocm-xio
      when: ernic_gpu_passthrough | bool

    - name: Create ERNIC_PROJECT_DIR stub
      ansible.builtin.file:
        path: /opt/rocm-ernic-stub/rdma-core/providers
        state: directory
        mode: "0755"
      when: ernic_gpu_passthrough | bool

    - name: Symlink rocm_ernic provider into stub
      ansible.builtin.file:
        src: /tmp/rdma-core-provider/providers/rocm_ernic
        dest: /opt/rocm-ernic-stub/rdma-core/providers/rocm_ernic
        state: link
      when: ernic_gpu_passthrough | bool

    - name: Remove stale rocm-xio build directory
      ansible.builtin.file:
        path: /opt/rocm-xio/build
        state: absent
      when: ernic_gpu_passthrough | bool

    - name: Configure rocm-xio build
      ansible.builtin.command:
        argv:
          - cmake
          - -S
          - /opt/rocm-xio
          - -B
          - /opt/rocm-xio/build
          - -GNinja
          - -DCMAKE_BUILD_TYPE=Release
          - -DGDA_ERNIC=ON
          - -DERNIC_PROJECT_DIR=/opt/rocm-ernic-stub
      changed_when: true
      when: ernic_gpu_passthrough | bool

    - name: Build rocm-xio
      ansible.builtin.command:
        argv:
          - cmake
          - --build
          - /opt/rocm-xio/build
          - "-j{{ ansible_processor_vcpus
                  | default(2) }}"
      changed_when: true
      when: ernic_gpu_passthrough | bool

    - name: Build rocm-xio kernel module
      community.general.make:
        chdir: /opt/rocm-xio/kernel/rocm-xio
        params:
          KDIR: "/lib/modules/{{ ansible_kernel }}/build"
      when:
        - ernic_gpu_passthrough | bool
        - ernic_pci_mmio_bridge | bool

    - name: Load rocm-xio kernel module
      ansible.builtin.command:
        argv:
          - insmod
          - /opt/rocm-xio/kernel/rocm-xio/rocm-xio.ko
      when:
        - ernic_gpu_passthrough | bool
        - ernic_pci_mmio_bridge | bool
        - "'rocm_xio' not in lsmod_output.stdout"
      changed_when: true

    - name: Verify /dev/rocm-xio exists
      ansible.builtin.stat:
        path: /dev/rocm-xio
      register: rocm_xio_dev
      when:
        - ernic_gpu_passthrough | bool
        - ernic_pci_mmio_bridge | bool

    - name: Assert rocm-xio device node exists
      ansible.builtin.assert:
        that:
          - rocm_xio_dev.stat.exists
        fail_msg: >-
          /dev/rocm-xio not found after loading
          rocm-xio.ko. Check dmesg for errors.
      when:
        - ernic_gpu_passthrough | bool
        - ernic_pci_mmio_bridge | bool

    - name: Locate xio-tester binary
      ansible.builtin.shell:
        cmd: >-
          find /opt/rocm-xio/build -name xio-tester
          -type f | head -1
      register: xio_tester_path
      changed_when: false
      when: ernic_gpu_passthrough | bool

    - name: Verify xio-tester exists
      ansible.builtin.assert:
        that:
          - >-
            xio_tester_path.stdout | length > 0
        fail_msg: >-
          xio-tester binary not found after
          building rocm-xio. Check the build
          output for errors.
      when: ernic_gpu_passthrough | bool

    - name: Display xio-tester location
      ansible.builtin.debug:
        msg: "xio-tester: {{ xio_tester_path.stdout }}"
      when: ernic_gpu_passthrough | bool

  handlers:
    - name: restart logind
      ansible.builtin.systemd:
        name: systemd-logind
        state: restarted
