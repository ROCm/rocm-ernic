#
# Play 3: Provision guest VMs with the rocm-ernic kernel
# driver, the custom rdma-core provider, and IP addresses on
# the emulated NICs.
#
# The work lives in the ernic_guest_setup role of the
# sbates130272.rocm_ernic collection (source in ansible/
# collection/, published to Galaxy).  Base packages, the pinned
# kernel and the RDMA userspace are baked into the guest image.

---
- name: Guest setup -- driver, rdma-core, NIC config
  hosts: ernic_vms
  become: true
  gather_facts: true
  vars_files:
    - ../group_vars/all.yml

  roles:
    - role: ernic_guest_setup
      vars:
        ernic_source_dir: "{{ ernic_project_root }}"
