#
# Play 3: Provision guest VMs with RDMA packages, the
# rocm-ernic kernel driver, and the custom rdma-core
# provider.  Configure IP addresses on the emulated
# NICs for inter-VM connectivity.  Installs
# qemu-guest-agent so the host can query guest load
# via QMP (guest-get-load) from ernicctl status.

---
- name: Guest setup -- driver, rdma-core, NIC config
  hosts: ernic_vms
  become: true
  gather_facts: true
  vars_files:
    - ../group_vars/all.yml
  # Fresh DKMS id each play so setup-rocm-ernic-dkms.sh cannot short-circuit on
  # "already installed" while /tmp/driver sources were updated (see script skip
  # when PKG_VERSION matches an installed row).
  vars:
    rocm_ernic_dkms_pkg_version: >-
      0.2.0-p{{ lookup('pipe', 'date +%s') }}

  tasks:

    # ── Base packages are baked into the golden image ─
    # The rdma_setup, rocm_setup roles and build tools
    # are installed during vm-create.yml golden image
    # provisioning.  This play adds qemu-guest-agent
    # plus rocm-ernic-specific setup (driver, rdma-core
    # provider, NIC config, rocm-xio).

    # ── QEMU guest agent (QMP guest-get-load, etc.) ──
    # A freshly booted guest runs unattended-upgrades, which
    # holds the dpkg lock for the first minute or so.  Ansible's
    # apt tasks race it and fail with "Could not get lock
    # /var/lib/dpkg/lock-frontend".  In CI the guests are cloned
    # and booted seconds before this play runs, so the race is
    # hit routinely -- and only on whichever VM loses it, which
    # makes it look like a random one-guest failure.
    - name: Wait for unattended-upgrades to release the dpkg lock
      ansible.builtin.shell: |
        for _ in $(seq 1 60); do
          fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1 || exit 0
          sleep 5
        done
        echo "dpkg lock still held after 300s" >&2
        fuser -v /var/lib/dpkg/lock-frontend >&2 || true
        exit 1
      args:
        executable: /bin/bash
      changed_when: false

    - name: Install qemu-guest-agent for QMP guest metrics
      ansible.builtin.apt:
        name: qemu-guest-agent
        state: present

    # The agent unit pulls in a systemd device unit for this path.  If QEMU
    # was started without a virtio-serial org.qemu.guest_agent.0 channel
    # (common until run-vm exposes it), start would fail the whole play.
    - name: Check for QEMU guest-agent virtio port in the guest
      ansible.builtin.stat:
        path: /dev/virtio-ports/org.qemu.guest_agent.0
      register: qga_virtio_port

    - name: Enable and start qemu-guest-agent when virtio port exists
      ansible.builtin.systemd:
        name: qemu-guest-agent.service
        enabled: true
        state: started
      when: qga_virtio_port.stat.exists

    - name: Report when guest-agent channel is missing from QEMU
      ansible.builtin.debug:
        msg: >-
          qemu-guest-agent is installed but the virtio-serial channel
          org.qemu.guest_agent.0 is not present.  Add it in run-vm / QEMU
          (then re-run this task or: systemctl enable --now
          qemu-guest-agent).  Until then, ernicctl status VM_LOAD falls
          back to SSH.
      when: not qga_virtio_port.stat.exists

    # ── Copy driver source ───────────────────────────
    - name: Copy driver source to guest
      ansible.builtin.copy:
        src: "{{ ernic_project_root }}/driver/"
        dest: /tmp/driver/
        mode: "0755"

    # ── Copy rdma-core provider ──────────────────────
    - name: Create rdma-core provider directory
      ansible.builtin.file:
        path: /tmp/rdma-core-provider
        state: directory
        mode: "0755"

    - name: Copy rdma-core providers directory
      ansible.builtin.copy:
        src: "{{ ernic_project_root }}/rdma-core/providers/"
        dest: /tmp/rdma-core-provider/providers/
        mode: "0755"

    - name: Copy rdma-core rocm-ernic-dv directory
      ansible.builtin.copy:
        src: "{{ ernic_project_root }}/rdma-core/rocm-ernic-dv/"
        dest: /tmp/rdma-core-provider/rocm-ernic-dv/
        mode: "0755"

    # ── Build custom rdma-core with provider ─────────
    - name: Check if custom rdma-core is already installed
      ansible.builtin.stat:
        path: /usr/lib/libibverbs/librocm_ernic.so
      register: ernic_provider_check

    - name: Set rdma-core path facts
      ansible.builtin.set_fact:
        rc_ver: "{{ ernic_rdma_core_version }}"
        rc_base: /tmp/rdma-core-build
      when: not ernic_provider_check.stat.exists

    - name: Build and install custom rdma-core
      when: not ernic_provider_check.stat.exists
      vars:
        rc_src: "{{ rc_base }}/rdma-core-{{ rc_ver }}"
        rc_tar: "{{ rc_base }}/rdma-core-{{ rc_ver }}.tar.gz"
        rc_url: >-
          https://github.com/linux-rdma/rdma-core/releases/download/v{{ rc_ver }}/rdma-core-{{ rc_ver }}.tar.gz
      block:
        - name: Create rdma-core build directory
          ansible.builtin.file:
            path: "{{ rc_base }}"
            state: directory
            mode: "0755"

        - name: Download rdma-core tarball
          ansible.builtin.get_url:
            url: "{{ rc_url }}"
            dest: "{{ rc_tar }}"
            mode: "0644"

        - name: Extract rdma-core tarball
          ansible.builtin.unarchive:
            src: "{{ rc_tar }}"
            dest: "{{ rc_base }}/"
            remote_src: true

        - name: Inject rocm_ernic provider
          ansible.builtin.copy:
            src: /tmp/rdma-core-provider/providers/rocm_ernic/
            dest: "{{ rc_src }}/providers/rocm_ernic/"
            remote_src: true
            mode: "0755"

        - name: Check if provider is registered
          ansible.builtin.command:
            argv:
              - grep
              - -q
              - rocm_ernic
              - "{{ rc_src }}/CMakeLists.txt"
          register: provider_grep
          failed_when: false
          changed_when: false

        - name: Register provider in CMakeLists.txt
          ansible.builtin.lineinfile:
            path: "{{ rc_src }}/CMakeLists.txt"
            line: "add_subdirectory(providers/rocm_ernic)"
            insertafter: EOF
          when: provider_grep.rc != 0

        - name: Configure rdma-core build
          ansible.builtin.command:
            argv:
              - cmake
              - -S
              - "{{ rc_src }}"
              - -B
              - "{{ rc_base }}/build"
              - -GNinja
              - -DCMAKE_INSTALL_PREFIX=/usr
              - -DCMAKE_BUILD_TYPE=Release
              - -DNO_PYVERBS=1
              - -DNO_MAN_PAGES=1
              - -DENABLE_STATIC=0
          changed_when: true

        - name: Build rdma-core
          ansible.builtin.command:
            argv:
              - cmake
              - --build
              - "{{ rc_base }}/build"
              - "-j{{ ansible_processor_vcpus | default(2) }}"
          changed_when: true

        - name: Install rdma-core
          ansible.builtin.command:
            argv:
              - cmake
              - --install
              - "{{ rc_base }}/build"
          changed_when: true

        - name: Run ldconfig
          ansible.builtin.command:
            cmd: ldconfig
          changed_when: true

    # ── Build and install kernel driver via DKMS ──────
    - name: Install rocm-ernic driver via DKMS
      ansible.builtin.command:
        argv:
          - bash
          - /tmp/driver/setup-rocm-ernic-dkms.sh
          - --version
          - "{{ rocm_ernic_dkms_pkg_version | trim }}"
      environment:
        DEBIAN_FRONTEND: noninteractive
      changed_when: true

    # ── Install udev rules BEFORE loading driver ─────
    - name: Copy rocm-ernic udev rules
      ansible.builtin.copy:
        src: "{{ ernic_project_root }}/udev/99-rocm-ernic.rules"
        dest: /etc/udev/rules.d/99-rocm-ernic.rules
        owner: root
        group: root
        mode: "0644"

    - name: Reload udev rules
      ansible.builtin.command:
        cmd: udevadm control --reload-rules
      changed_when: true

    # ── Load driver modules ──────────────────────────
    - name: Load ib_core module
      community.general.modprobe:
        name: ib_core
        state: present

    - name: Load ib_uverbs module
      community.general.modprobe:
        name: ib_uverbs
        state: present

    - name: Load rocm_ernic_eth module
      community.general.modprobe:
        name: rocm_ernic_eth
        state: present

    - name: Load rocm_ernic_rdma module
      community.general.modprobe:
        name: rocm_ernic_rdma
        state: present

    - name: Verify rocm-ernic modules loaded
      ansible.builtin.shell:
        cmd: lsmod | grep rocm_ernic
      register: lsmod_output
      changed_when: false

    # ── Trigger udev for stable device names ─────────
    - name: Trigger udev to apply naming rules
      ansible.builtin.shell:
        cmd: >-
          udevadm trigger --subsystem-match=net
          --subsystem-match=infiniband;
          udevadm settle --timeout=10
      changed_when: true

    # ── Verify RDMA device ───────────────────────────
    - name: Wait for RDMA device to register
      ansible.builtin.pause:
        seconds: 5

    - name: Check for RDMA device
      ansible.builtin.command:
        cmd: ibv_devices
      register: ibv_devices_output
      changed_when: false

    - name: Verify rocm-ernic RDMA device exists
      ansible.builtin.assert:
        that:
          - >-
            'rocm-rdma-ernic' in ibv_devices_output.stdout
            or 'rocep' in ibv_devices_output.stdout
        fail_msg: >-
          RDMA device not found. ibv_devices output:
          {{ ibv_devices_output.stdout }}

    - name: Get RDMA device name
      ansible.builtin.shell:
        cmd: >-
          ibv_devices | grep -E 'rocm-rdma-ernic|rocep'
          | awk '{print $1}' | head -1
      register: rdma_dev_name
      changed_when: false

    - name: Display RDMA device info
      ansible.builtin.shell:
        cmd: >-
          ibv_devinfo -d {{ rdma_dev_name.stdout }}
          | head -20
      register: ibv_devinfo_output
      changed_when: false

    - name: Show RDMA device details
      ansible.builtin.debug:
        var: ibv_devinfo_output.stdout_lines

    - name: Symlink RDMA counters for exporter
      ansible.builtin.shell:
        cmd: |
          DEV=$(ibv_devices | grep -oE 'rocm-rdma-ernic[0-9]+|rocep[0-9]+s[0-9]+' | head -1)
          [ -z "$DEV" ] && exit 0
          for PORT_DIR in /sys/class/infiniband/"$DEV"/ports/*/; do
            [ -d "$PORT_DIR/hw_counters" ] || continue
            [ -e "$PORT_DIR/counters" ] && continue
            ln -s hw_counters "$PORT_DIR/counters"
          done
      changed_when: false
      failed_when: false

    # ── Set unique hostname per VM ────────────────────
    - name: Set VM hostname
      ansible.builtin.hostname:
        name: "{{ ernic_vm_name_base }}-{{ vm_index }}"

    - name: Update /etc/hosts with new hostname
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: '^127\.0\.1\.1'
        line: "127.0.1.1 {{ ernic_vm_name_base }}-{{ vm_index }}"

    # ── Configure emulated NIC IP addresses ──────────
    - name: Assert emulated NIC exists
      ansible.builtin.command:
        cmd: "ip -o link show {{ ernic_nic_name }}"
      register: nic_check
      changed_when: false
      failed_when: false

    - name: Fail if NIC not found
      ansible.builtin.assert:
        that:
          - nic_check.rc == 0
        fail_msg: >-
          NIC {{ ernic_nic_name }} not found.
          Check udev rules and driver loading.

    - name: Bring emulated NIC up
      ansible.builtin.command:
        argv:
          - ip
          - link
          - set
          - "{{ ernic_nic_name }}"
          - up
      changed_when: true

    - name: Check existing IP on NIC
      ansible.builtin.command:
        argv:
          - ip
          - addr
          - show
          - dev
          - "{{ ernic_nic_name }}"
      register: nic_addr_check
      changed_when: false

    - name: Assign IP address to emulated NIC
      ansible.builtin.command:
        argv:
          - ip
          - addr
          - add
          - "{{ vm_ip }}/24"
          - dev
          - "{{ ernic_nic_name }}"
      when: "vm_ip not in nic_addr_check.stdout"
      changed_when: true

    - name: Display NIC configuration
      ansible.builtin.command:
        argv:
          - ip
          - addr
          - show
          - dev
          - "{{ ernic_nic_name }}"
      register: nic_config
      changed_when: false

    - name: Show NIC details
      ansible.builtin.debug:
        var: nic_config.stdout_lines

    # ── GPU passthrough: rocm-xio ─────────────────────
    # ROCm and build tools are baked into the golden
    # image.  Only rocm-xio build/install happens here.
    - name: Add VM user to render and video groups
      ansible.builtin.user:
        name: "{{ ansible_user }}"
        groups: render,video
        append: true
      when: ernic_gpu_passthrough | bool

    - name: Load amdgpu kernel module
      community.general.modprobe:
        name: amdgpu
        state: present
      when: ernic_gpu_passthrough | bool

    - name: Verify GPU via rocm-smi
      ansible.builtin.command:
        cmd: rocm-smi --showid
      register: rocm_smi_check
      changed_when: false
      failed_when: false
      when: ernic_gpu_passthrough | bool

    - name: Display rocm-smi output
      ansible.builtin.debug:
        var: rocm_smi_check.stdout_lines
      when: ernic_gpu_passthrough | bool

    - name: Assert GPU is visible in guest
      ansible.builtin.assert:
        that:
          - rocm_smi_check.rc == 0
        fail_msg: >-
          rocm-smi failed. The GPU may not be
          passed through correctly. Check QEMU
          PCI_HOSTDEV and IOMMU configuration.
      when: ernic_gpu_passthrough | bool

    - name: Copy and extract rocm-xio tarball
      ansible.builtin.unarchive:
        src: /tmp/rocm-xio.tar.gz
        dest: /opt
        creates: /opt/rocm-xio
      when: ernic_gpu_passthrough | bool

    - name: Create ERNIC_PROJECT_DIR stub
      ansible.builtin.file:
        path: /opt/rocm-ernic-stub/rdma-core/providers
        state: directory
        mode: "0755"
      when: ernic_gpu_passthrough | bool

    - name: Symlink rocm_ernic provider into stub
      ansible.builtin.file:
        src: /tmp/rdma-core-provider/providers/rocm_ernic
        dest: /opt/rocm-ernic-stub/rdma-core/providers/rocm_ernic
        state: link
      when: ernic_gpu_passthrough | bool

    - name: Remove stale rocm-xio build directory
      ansible.builtin.file:
        path: /opt/rocm-xio/build
        state: absent
      when: ernic_gpu_passthrough | bool

    - name: Configure rocm-xio build
      ansible.builtin.command:
        argv:
          - cmake
          - -S
          - /opt/rocm-xio
          - -B
          - /opt/rocm-xio/build
          - -GNinja
          - -DCMAKE_BUILD_TYPE=Release
          - -DGDA_ERNIC=ON
          - -DERNIC_PROJECT_DIR=/opt/rocm-ernic-stub
      changed_when: true
      when: ernic_gpu_passthrough | bool

    - name: Build rocm-xio
      ansible.builtin.command:
        argv:
          - cmake
          - --build
          - /opt/rocm-xio/build
          - "-j{{ ansible_processor_vcpus
                  | default(2) }}"
      changed_when: true
      when: ernic_gpu_passthrough | bool

    - name: Build rocm-xio kernel module
      community.general.make:
        chdir: /opt/rocm-xio/kernel/rocm-xio
        params:
          KDIR: "/lib/modules/{{ ansible_kernel }}/build"
      when:
        - ernic_gpu_passthrough | bool
        - ernic_pci_mmio_bridge | bool

    - name: Install rocm-xio module for modprobe
      ansible.builtin.shell:
        cmd: >-
          mkdir -p /lib/modules/{{ ansible_kernel }}/extra
          && cp -f /opt/rocm-xio/kernel/rocm-xio/rocm-xio.ko
          /lib/modules/{{ ansible_kernel }}/extra/
          && depmod -a
      when:
        - ernic_gpu_passthrough | bool
        - ernic_pci_mmio_bridge | bool

    - name: Load rocm-xio kernel module
      community.general.modprobe:
        name: rocm_xio
        state: present
      when:
        - ernic_gpu_passthrough | bool
        - ernic_pci_mmio_bridge | bool

    - name: Verify rocm-xio module loaded
      ansible.builtin.shell:
        cmd: lsmod | grep -q rocm_xio
      changed_when: false
      when:
        - ernic_gpu_passthrough | bool
        - ernic_pci_mmio_bridge | bool

    - name: Verify /dev/rocm-xio exists
      ansible.builtin.stat:
        path: /dev/rocm-xio
      register: rocm_xio_dev
      when:
        - ernic_gpu_passthrough | bool
        - ernic_pci_mmio_bridge | bool

    - name: Assert rocm-xio device node exists
      ansible.builtin.assert:
        that:
          - rocm_xio_dev.stat.exists
        fail_msg: >-
          /dev/rocm-xio not found after loading
          rocm-xio.ko. Check dmesg for errors.
      when:
        - ernic_gpu_passthrough | bool
        - ernic_pci_mmio_bridge | bool

    - name: Locate xio-tester binary
      ansible.builtin.shell:
        cmd: >-
          find /opt/rocm-xio/build -name xio-tester
          -type f | head -1
      register: xio_tester_path
      changed_when: false
      when: ernic_gpu_passthrough | bool

    - name: Verify xio-tester exists
      ansible.builtin.assert:
        that:
          - >-
            xio_tester_path.stdout | length > 0
        fail_msg: >-
          xio-tester binary not found after
          building rocm-xio. Check the build
          output for errors.
      when: ernic_gpu_passthrough | bool

    - name: Display xio-tester location
      ansible.builtin.debug:
        msg: "xio-tester: {{ xio_tester_path.stdout }}"
      when: ernic_gpu_passthrough | bool
