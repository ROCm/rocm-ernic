#
# Play 6b: GPU-initiated perftest via rocm-xio.
#
# Runs ib_{write,read}_{bw,lat} with the client using
# --use_rocm_xio (GPU-initiated WQE posting) and the
# server running unmodified standard perftest
# (CPU-posted verbs).
#
# This play assumes:
#   - Exactly two VMs reachable via SSH
#   - GPUs visible via rocm-smi on both VMs
#   - rocm-xio kernel module loaded
#   - Standard perftest installed (system package)
#
# perftest-xio is cloned and built automatically on
# VM2 (client) if not already present.
#
# Usage:
#   ansible-playbook playbooks/gpu-perftest.yml
#
# Override sweep parameters:
#   ansible-playbook playbooks/gpu-perftest.yml \
#     -e ernic_gpu_perftest_bw_iters=200

# ─────────────────────────────────────────────────────
# Play 1: Register VMs into inventory
# ─────────────────────────────────────────────────────
---
- name: "GPU perftest -- register VMs"
  hosts: localhost
  gather_facts: false
  vars_files:
    - ../group_vars/all.yml

  tasks:

    - name: Skip if not enabled
      ansible.builtin.meta: end_play
      when: >-
        not (ernic_gpu_passthrough | bool)
        or not (ernic_gpu_perftest | bool)

    - name: Assert two instances for GPU perftest
      ansible.builtin.assert:
        that:
          - (ernic_instances | int) == 2
        fail_msg: >-
          gpu-perftest.yml requires exactly two VMs.

    - name: Add VMs to inventory
      ansible.builtin.add_host:
        name: "ernic_vm_{{ item }}"
        groups: ernic_vms
        ansible_host: localhost
        ansible_port: >-
          {{ ernic_vm_ssh_base_port | int + item - 1 }}
        ansible_user: "{{ ernic_vm_ssh_user }}"
        ansible_ssh_common_args: >-
          -o StrictHostKeyChecking=no
          -o UserKnownHostsFile=/dev/null
          -o PasswordAuthentication=no
        vm_index: "{{ item }}"
        vm_ip: "{{ ernic_nic_subnet }}.{{ 10 * item }}"
      loop: [1, 2]

# ─────────────────────────────────────────────────────
# Play 2: Build perftest-xio on VM2 (client)
# ─────────────────────────────────────────────────────
- name: "GPU perftest -- build perftest-xio on VM2"
  hosts: ernic_vm_2
  become: true
  gather_facts: true
  vars_files:
    - ../group_vars/all.yml

  vars:
    xio_prefix: "{{ ernic_perftest_prefix }}"

  tasks:

    - name: Skip if not enabled
      ansible.builtin.meta: end_play
      when: >-
        not (ernic_gpu_passthrough | bool)
        or not (ernic_gpu_perftest | bool)

    - name: Check if perftest-xio already built
      ansible.builtin.stat:
        path: "{{ xio_prefix }}/bin/ib_write_bw"
      register: perftest_xio_stat

    - name: Create perftest-xio tarball on host
      ansible.builtin.command:
        argv:
          - tar
          - czf
          - /tmp/perftest-xio.tar.gz
          - -C
          - "{{ ernic_perftest_source | dirname }}"
          - "{{ ernic_perftest_source | basename }}"
      delegate_to: localhost
      become: false
      changed_when: true
      when: not perftest_xio_stat.stat.exists

    - name: Copy and extract perftest-xio source
      ansible.builtin.unarchive:
        src: /tmp/perftest-xio.tar.gz
        dest: /tmp
      when: not perftest_xio_stat.stat.exists

    - name: Install perftest build dependencies
      ansible.builtin.apt:
        name:
          - autoconf
          - automake
          - libtool
          - libibverbs-dev
          - libpci-dev
        state: present
        update_cache: false
      when: not perftest_xio_stat.stat.exists

    - name: Generate perftest configure script
      ansible.builtin.command:
        cmd: ./autogen.sh
        chdir: /tmp/perftest-xio
      changed_when: true
      when: not perftest_xio_stat.stat.exists

    - name: Configure perftest with rocm-xio
      ansible.builtin.shell:
        cmd: >-
          export PATH=/opt/rocm/bin:$PATH;
          ./configure
          --prefix={{ xio_prefix }}
          --enable-rocm-xio
          --with-rocm-xio=/opt/rocm-xio
          HIPCC=/opt/rocm/bin/hipcc
          CFLAGS="-I/opt/rocm/include"
          LDFLAGS="-L/opt/rocm/lib -Wl,-rpath,/opt/rocm/lib"
        chdir: /tmp/perftest-xio
      changed_when: true
      when: not perftest_xio_stat.stat.exists

    - name: Build perftest-xio
      ansible.builtin.shell:
        cmd: >-
          export PATH=/opt/rocm/bin:$PATH;
          make -j{{ ansible_processor_vcpus | default(2) }}
          ib_write_bw ib_write_lat ib_read_bw ib_read_lat
          ib_send_bw ib_send_lat ib_atomic_bw ib_atomic_lat
        chdir: /tmp/perftest-xio
      changed_when: true
      when: not perftest_xio_stat.stat.exists

    - name: Install perftest-xio binaries
      ansible.builtin.shell:
        cmd: >-
          mkdir -p {{ xio_prefix }}/bin &&
          cp -f ib_write_bw ib_write_lat ib_read_bw
          ib_read_lat ib_send_bw ib_send_lat
          ib_atomic_bw ib_atomic_lat
          {{ xio_prefix }}/bin/
        chdir: /tmp/perftest-xio
      changed_when: true
      when: not perftest_xio_stat.stat.exists

    - name: Verify perftest-xio binary exists
      ansible.builtin.stat:
        path: "{{ xio_prefix }}/bin/ib_write_bw"
      register: perftest_xio_verify

    - name: Assert perftest-xio installed
      ansible.builtin.assert:
        that:
          - perftest_xio_verify.stat.exists
        fail_msg: >-
          perftest-xio binary not found at
          {{ xio_prefix }}/bin/ib_write_bw
          after build.

# ─────────────────────────────────────────────────────
# Play 3: Pre-flight, sweeps, summary (from VM1)
# ─────────────────────────────────────────────────────
- name: "GPU perftest -- BW and latency sweeps"
  hosts: ernic_vm_1
  become: true
  gather_facts: true
  vars_files:
    - ../group_vars/all.yml

  vars:
    vm2: ernic_vm_2
    server_ip: "{{ hostvars['ernic_vm_1'].vm_ip }}"
    client_ip: "{{ hostvars['ernic_vm_2'].vm_ip }}"

    bw_iters: >-
      {{ ernic_gpu_perftest_bw_iters | default(100) }}
    lat_iters: >-
      {{ ernic_gpu_perftest_lat_iters | default(50) }}
    sweep_sizes: >-
      {{ ernic_gpu_perftest_sizes
         | default([4096, 16384, 65536]) }}
    test_timeout: >-
      {{ ernic_gpu_perftest_timeout | default(180) }}

    xio_prefix: "{{ ernic_perftest_prefix }}"

    bw_verbs:
      - tool: ib_write_bw
        label: write
      - tool: ib_read_bw
        label: read

    lat_verbs:
      - tool: ib_write_lat
        label: write
      - tool: ib_read_lat
        label: read

    ts: >-
      {{ ansible_date_time.date }}-{{
         ansible_date_time.hour }}{{
         ansible_date_time.minute }}{{
         ansible_date_time.second }}
    results_dir: >-
      {{ ernic_project_root }}/docs/perf-results
    gpu_bw_csv: >-
      {{ results_dir }}/gpu-perftest-bw-{{ ts }}.csv
    gpu_lat_csv: >-
      {{ results_dir }}/gpu-perftest-lat-{{ ts }}.csv

  tasks:

    - name: Skip if not enabled
      ansible.builtin.meta: end_play
      when: >-
        not (ernic_gpu_passthrough | bool)
        or not (ernic_gpu_perftest | bool)

    # ── Pre-flight ─────────────────────────────────
    - name: "Pre-flight: free perftest port"
      ansible.builtin.include_tasks:
        file: tasks/free-perftest-port.yml
      vars:
        fpp_hosts:
          - "{{ inventory_hostname }}"
          - "{{ vm2 }}"

    - name: "Pre-flight: verify GPU on VM1 (server)"
      ansible.builtin.command:
        cmd: rocm-smi --showid
      register: gpu_check_vm1
      changed_when: false
      failed_when: false

    - name: Assert GPU visible on server VM
      ansible.builtin.assert:
        that:
          - gpu_check_vm1.rc == 0
        fail_msg: >-
          rocm-smi failed on VM1. GPU passthrough may
          not be configured.

    - name: "Pre-flight: verify GPU on VM2 (client)"
      ansible.builtin.command:
        cmd: rocm-smi --showid
      delegate_to: "{{ vm2 }}"
      register: gpu_check_vm2
      changed_when: false
      failed_when: false

    - name: Assert GPU visible on client VM
      ansible.builtin.assert:
        that:
          - gpu_check_vm2.rc == 0
        fail_msg: >-
          rocm-smi failed on VM2. GPU passthrough may
          not be configured.

    - name: Detect RDMA device name
      ansible.builtin.shell:
        cmd: >-
          ibv_devices
          | grep -oE
          "rocm-rdma-ernic[0-9]+|rocep[0-9]+s[0-9]+"
          | head -1
      register: rdma_dev_detect
      changed_when: false
      failed_when: false

    - name: Set RDMA device name
      ansible.builtin.set_fact:
        rdma_dev: >-
          {{ rdma_dev_detect.stdout | trim
             | default('rocm-rdma-ernic0', true) }}

    # ── Results setup (on host) ────────────────────
    - name: Create results directory
      ansible.builtin.file:
        path: "{{ results_dir }}"
        state: directory
        mode: "0755"
      delegate_to: localhost
      become: false

    - name: Write CSV headers
      ansible.builtin.copy:
        dest: "{{ item.path }}"
        content: "{{ item.header }}\n"
        mode: "0644"
      loop:
        - path: "{{ gpu_bw_csv }}"
          header: "verb,size,elapsed_us,iters,bw_GBs"
        - path: "{{ gpu_lat_csv }}"
          header: "verb,size,lat_avg_us"
      delegate_to: localhost
      become: false

    - name: Display GPU perftest configuration
      ansible.builtin.debug:
        msg:
          - "=== GPU Perftest Config ==="
          - "Device:        {{ rdma_dev }}"
          - "BW iterations: {{ bw_iters }}"
          - "Lat iterations:{{ lat_iters }}"
          - "Sizes:         {{ sweep_sizes }}"
          - "XIO prefix:    {{ xio_prefix }}"

    # ── Bandwidth sweep ────────────────────────────
    - name: "GPU BW sweep"
      ansible.builtin.include_tasks:
        file: tasks/gpu-perftest-point.yml
      vars:
        pt_tool: "{{ item.0.tool }}"
        pt_label: "{{ item.0.label }}"
        pt_size: "{{ item.1 }}"
        pt_iters: "{{ bw_iters }}"
        pt_unit: "gpu-perftest-bw-{{ item.0.tool }}-{{ item.1 }}"
        pt_csv: "{{ gpu_bw_csv }}"
        pt_mode: bw
        pt_extra_client_args: "--report_gbits"
        pt_extra_server_args: "--report_gbits"
      loop: >-
        {{ bw_verbs | product(sweep_sizes) | list }}
      loop_control:
        label: "{{ item.0.label }} @ {{ item.1 }}"

    # ── Latency sweep ──────────────────────────────
    - name: "GPU Lat sweep"
      ansible.builtin.include_tasks:
        file: tasks/gpu-perftest-point.yml
      vars:
        pt_tool: "{{ item.0.tool }}"
        pt_label: "{{ item.0.label }}"
        pt_size: "{{ item.1 }}"
        pt_iters: "{{ lat_iters }}"
        pt_unit: "gpu-perftest-lat-{{ item.0.tool }}-{{ item.1 }}"
        pt_csv: "{{ gpu_lat_csv }}"
        pt_mode: lat
        pt_extra_client_args: ""
        pt_extra_server_args: ""
      loop: >-
        {{ lat_verbs | product(sweep_sizes) | list }}
      loop_control:
        label: "{{ item.0.label }} @ {{ item.1 }}"

    # ── Summary ────────────────────────────────────
    - name: Count failures
      ansible.builtin.shell:
        cmd: >-
          grep -c 'FAIL\|NODATA'
          "{{ gpu_bw_csv }}" "{{ gpu_lat_csv }}"
          2>/dev/null
          | awk -F: '{s+=$2} END {print s+0}'
      register: gpu_fail_count
      changed_when: false
      delegate_to: localhost
      become: false

    - name: GPU perftest summary
      ansible.builtin.debug:
        msg:
          - "=== GPU Perftest Complete ==="
          - "BW CSV:    {{ gpu_bw_csv }}"
          - "Lat CSV:   {{ gpu_lat_csv }}"
          - "BW tests:  {{ bw_verbs | length * sweep_sizes | length }}"
          - "Lat tests: {{ lat_verbs | length * sweep_sizes | length }}"
          - "Failures:  {{ gpu_fail_count.stdout | default('0') }}"

    - name: Display GPU BW CSV
      ansible.builtin.shell:
        cmd: "column -t -s, {{ gpu_bw_csv }}"
      register: gpu_bw_table
      changed_when: false
      delegate_to: localhost
      become: false

    - name: GPU BW results table
      ansible.builtin.debug:
        msg: "{{ gpu_bw_table.stdout_lines }}"

    - name: Display GPU Lat CSV
      ansible.builtin.shell:
        cmd: "column -t -s, {{ gpu_lat_csv }}"
      register: gpu_lat_table
      changed_when: false
      delegate_to: localhost
      become: false

    - name: GPU Lat results table
      ansible.builtin.debug:
        msg: "{{ gpu_lat_table.stdout_lines }}"

    - name: Assert no test failures
      ansible.builtin.assert:
        that:
          - (gpu_fail_count.stdout | default('0') | int) == 0
        fail_msg: >-
          {{ gpu_fail_count.stdout }} GPU perftest(s)
          failed or returned no data. Check the CSV
          files for FAIL/NODATA entries.
