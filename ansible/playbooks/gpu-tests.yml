# Play 5: GPU RDMA tests using rocm-xio xio-tester.
#
# Runs xio-tester between two VMs that each have a
# vfio-pci-passed GPU and the rocm-ernic emulated NIC
# with pci-mmio-bridge enabled.
#
# This play assumes exactly two VMs with GPUs visible
# via rocm-smi and xio-tester built by guest-setup.yml.

---
- name: GPU RDMA tests -- xio-tester 2-node
  hosts: localhost
  gather_facts: false
  vars_files:
    - ../group_vars/all.yml

  vars:
    vm1_ssh: >-
      ssh -o StrictHostKeyChecking=no
      -o UserKnownHostsFile=/dev/null
      -o BatchMode=yes
      -o PasswordAuthentication=no
      -o ConnectTimeout=30
      -p {{ ernic_vm_ssh_base_port | int }}
      {{ ernic_vm_ssh_user }}@localhost
    vm2_ssh: >-
      ssh -o StrictHostKeyChecking=no
      -o UserKnownHostsFile=/dev/null
      -o BatchMode=yes
      -o PasswordAuthentication=no
      -o ConnectTimeout=30
      -p {{ ernic_vm_ssh_base_port | int + 1 }}
      {{ ernic_vm_ssh_user }}@localhost
    vm1_ip: "{{ ernic_nic_subnet }}.10"
    vm2_ip: "{{ ernic_nic_subnet }}.20"

  tasks:

    - name: Skip GPU tests if not enabled
      ansible.builtin.meta: end_play
      when: >-
        not (ernic_gpu_passthrough | bool)
        or not (ernic_gpu_tests | bool)

    - name: Assert exactly two instances for GPU tests
      ansible.builtin.assert:
        that:
          - (ernic_instances | int) == 2
        fail_msg: >-
          gpu-tests.yml requires exactly two VMs
          but ernic_instances is
          {{ ernic_instances }}. Set
          ernic_instances to 2 or update this
          playbook for other counts.

    # ─────────────────────────────────────────────────
    # Pre-flight checks
    # ─────────────────────────────────────────────────
    - name: "Pre-flight: verify GPU on VM1"
      ansible.builtin.shell:
        cmd: >-
          {{ vm1_ssh }}
          'rocm-smi --showid 2>&1'
      register: gpu_check_vm1
      changed_when: false
      failed_when: false

    - name: Display VM1 GPU status
      ansible.builtin.debug:
        var: gpu_check_vm1.stdout_lines

    - name: "Pre-flight: verify GPU on VM2"
      ansible.builtin.shell:
        cmd: >-
          {{ vm2_ssh }}
          'rocm-smi --showid 2>&1'
      register: gpu_check_vm2
      changed_when: false
      failed_when: false

    - name: Display VM2 GPU status
      ansible.builtin.debug:
        var: gpu_check_vm2.stdout_lines

    - name: Assert GPUs visible in both VMs
      ansible.builtin.assert:
        that:
          - gpu_check_vm1.rc == 0
          - gpu_check_vm2.rc == 0
        fail_msg: >-
          rocm-smi failed on one or both VMs.
          Check GPU passthrough configuration.

    - name: "Pre-flight: locate xio-tester on VM1"
      ansible.builtin.shell:
        cmd: >-
          {{ vm1_ssh }}
          'find /opt/rocm-xio/build
          -name xio-tester -type f
          | head -1'
      register: xio_tester_vm1
      changed_when: false

    - name: "Pre-flight: locate xio-tester on VM2"
      ansible.builtin.shell:
        cmd: >-
          {{ vm2_ssh }}
          'find /opt/rocm-xio/build
          -name xio-tester -type f
          | head -1'
      register: xio_tester_vm2
      changed_when: false

    - name: Set xio-tester path fact
      ansible.builtin.set_fact:
        xio_tester: >-
          {{ xio_tester_vm1.stdout | trim }}

    - name: Assert xio-tester exists on both VMs
      ansible.builtin.assert:
        that:
          - xio_tester | length > 0
          - xio_tester_vm2.stdout | trim | length > 0
        fail_msg: >-
          xio-tester not found on one or both VMs.
          Ensure guest-setup.yml completed
          successfully with ernic_gpu_passthrough.

    - name: Detect RDMA device name on VM1
      ansible.builtin.shell:
        cmd: >-
          {{ vm1_ssh }}
          'ibv_devices
          | grep -oE "rocm-rdma-ernic[0-9]+|rocep[0-9]+s[0-9]+"
          | head -1'
      register: rdma_dev_detect
      changed_when: false
      failed_when: false

    - name: Set RDMA device name
      ansible.builtin.set_fact:
        rdma_dev: >-
          {{ rdma_dev_detect.stdout | trim
             | default('rocep1s0', true) }}

    # ─────────────────────────────────────────────────
    # xio-tester: loopback on each VM
    # ─────────────────────────────────────────────────
    - name: "GPU RDMA: run xio-tester loopback on VM1"
      ansible.builtin.shell:
        cmd: >-
          {{ vm1_ssh }}
          'sudo timeout 120 {{ xio_tester }}
          --pci-mmio-bridge
          rdma-ep
          --provider ernic
          --device {{ rdma_dev }}
          --loopback
          -n 10
          -v
          2>&1'
      register: xio_vm1_result
      changed_when: false
      failed_when: false

    - name: Display VM1 xio-tester results
      ansible.builtin.debug:
        var: xio_vm1_result.stdout_lines

    - name: "GPU RDMA: run xio-tester loopback on VM2"
      ansible.builtin.shell:
        cmd: >-
          {{ vm2_ssh }}
          'sudo timeout 120 {{ xio_tester }}
          --pci-mmio-bridge
          rdma-ep
          --provider ernic
          --device {{ rdma_dev }}
          --loopback
          -n 10
          -v
          2>&1'
      register: xio_vm2_result
      changed_when: false
      failed_when: false

    - name: Display VM2 xio-tester results
      ansible.builtin.debug:
        var: xio_vm2_result.stdout_lines

    # ─────────────────────────────────────────────────
    # xio-tester: 2-node (server on VM1, client on VM2)
    # ─────────────────────────────────────────────────
    - name: Skip 2-node GPU tests if disabled
      ansible.builtin.set_fact:
        run_2node: >-
          {{ ernic_gpu_2node_tests | bool }}

    - name: "GPU 2-Node: size sweep"
      ansible.builtin.shell:
        cmd: |
          SIZE="{{ item }}"
          ITERS="{{ ernic_gpu_2node_iters }}"
          TOUT="{{ ernic_gpu_2node_timeout }}"
          XIO="{{ xio_tester }}"
          DEV="{{ rdma_dev }}"
          IP="{{ vm1_ip }}"
          UNIT="xio-2node-server-${SIZE}"

          # Start server on VM1
          {{ vm1_ssh }} "
            sudo pkill -9 xio-tester 2>/dev/null; true;
            sudo systemctl stop $UNIT 2>/dev/null;
            sudo systemctl reset-failed $UNIT 2>/dev/null;
            sudo systemd-run --unit=$UNIT \
              bash -c '$XIO --pci-mmio-bridge \
              rdma-ep --provider ernic --device $DEV \
              --server -n $ITERS --transfer-size $SIZE \
              -v >/tmp/xio-2node-server-${SIZE}.log 2>&1';
            sleep 1
          "

          sleep 5

          # Run client on VM2
          RAW=$({{ vm2_ssh }} "
            sudo timeout $TOUT $XIO --pci-mmio-bridge \
              rdma-ep --provider ernic --device $DEV \
              --client --server-host $IP \
              -n $ITERS --transfer-size $SIZE \
              -v 2>&1
          ")
          CLIENT_RC=$?

          # Collect server result
          SERVER=$({{ vm1_ssh }} "
            grep -E 'WRITE PASSED|WRITE FAILED|Ping-pong' \
              /tmp/xio-2node-server-${SIZE}.log 2>/dev/null
          ")

          PP=$(echo "$RAW" | grep "round-trips" \
               | sed 's/.*= //' | sed 's/ us.*//')
          LFSR=$(echo "$RAW" | grep -c "LFSR PASSED")
          STATUS=$(echo "$RAW" | grep -c "completed successfully")

          echo "SIZE=${SIZE} LAT=${PP:-TIMEOUT}us/iter"
          echo "LFSR=${LFSR} STATUS=${STATUS} RC=${CLIENT_RC}"
          echo "SERVER: ${SERVER}"

          if [ "$CLIENT_RC" -ne 0 ] || [ "$STATUS" -eq 0 ]; then
            exit 1
          fi
      register: gpu_2node_result
      changed_when: false
      failed_when: false
      loop: "{{ ernic_gpu_2node_sizes }}"
      loop_control:
        label: "{{ item }} B"
      when: run_2node | bool

    - name: Display 2-node results
      ansible.builtin.debug:
        msg: "{{ item.stdout_lines | default(['(skipped)']) }}"
      loop: "{{ gpu_2node_result.results | default([]) }}"
      loop_control:
        label: "{{ item.item | default('?') }} B"
      when:
        - run_2node | bool
        - item.stdout is defined

    # ─────────────────────────────────────────────────
    # Summary
    # ─────────────────────────────────────────────────
    - name: Set GPU test result facts
      ansible.builtin.set_fact:
        gpu_vm1_ok: >-
          {{ gpu_check_vm1.rc == 0 }}
        gpu_vm2_ok: >-
          {{ gpu_check_vm2.rc == 0 }}
        xio_vm1_pass: >-
          {{ xio_vm1_result.rc == 0
             and xio_vm1_result.stdout
                 | length > 0 }}
        xio_vm2_pass: >-
          {{ xio_vm2_result.rc == 0
             and xio_vm2_result.stdout
                 | length > 0 }}
        xio_2node_pass: >-
          {{ not (run_2node | bool)
             or (gpu_2node_result.results | default([])
                 | selectattr('rc', 'defined')
                 | selectattr('rc', 'equalto', 0)
                 | list | length
                 == ernic_gpu_2node_sizes | length) }}

    - name: GPU RDMA test summary
      ansible.builtin.debug:
        msg:
          - "=== GPU RDMA Test Results ==="
          - "GPU VM1:        {{ 'PASS' if gpu_vm1_ok else 'FAIL' }}"
          - "GPU VM2:        {{ 'PASS' if gpu_vm2_ok else 'FAIL' }}"
          - "Loopback VM1:   {{ 'PASS' if xio_vm1_pass else 'FAIL' }}"
          - "Loopback VM2:   {{ 'PASS' if xio_vm2_pass else 'FAIL' }}"
          - "2-Node ({{ ernic_gpu_2node_sizes | length }} sizes): {{ 'PASS' if xio_2node_pass else 'FAIL' }}"

    - name: Assert GPU RDMA tests passed
      ansible.builtin.assert:
        that:
          - gpu_check_vm1.rc == 0
          - gpu_check_vm2.rc == 0
          - xio_vm1_result.rc == 0
          - xio_vm2_result.rc == 0
          - xio_2node_pass | bool
        fail_msg: >-
          GPU RDMA tests failed. Check the output
          above for details.
