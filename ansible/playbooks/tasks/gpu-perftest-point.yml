#
# Single GPU perftest data point (BW or latency).
#
# Included by gpu-perftest.yml via include_tasks.
# Runs on ernic_vm_1 (server) and delegates client
# commands to ernic_vm_2.
#
# Required variables from the caller:
#   pt_tool   -- perftest binary (e.g. ib_write_bw)
#   pt_label  -- human label (e.g. write)
#   pt_size   -- message size in bytes
#   pt_iters  -- iteration count
#   pt_unit   -- systemd unit name for the server
#   pt_csv    -- CSV file path (on localhost)
#   pt_mode   -- "bw" or "lat"
#   pt_extra_client_args -- extra args for client
#   pt_extra_server_args -- extra args for server

---
- name: "{{ pt_label }} @ {{ pt_size }}B: free port"
  ansible.builtin.include_tasks:
    file: tasks/free-perftest-port.yml
  vars:
    fpp_hosts:
      - "{{ inventory_hostname }}"
      - "{{ vm2 }}"

- name: "{{ pt_label }} @ {{ pt_size }}B: start server"
  ansible.builtin.shell:
    cmd: |
      systemctl stop {{ pt_unit }} 2>/dev/null
      systemctl reset-failed {{ pt_unit }} 2>/dev/null
      systemd-run --unit={{ pt_unit }} \
        bash -c '{{ pt_tool }} \
          -d {{ rdma_dev }} -x 1 \
          -s {{ pt_size }} \
          {{ "--duration " ~ pt_duration if pt_duration is defined else "-n " ~ pt_iters }} \
          {{ pt_extra_server_args }} \
          >/tmp/{{ pt_unit }}.log 2>&1'
      sleep 1
  changed_when: true

- name: "{{ pt_label }} @ {{ pt_size }}B: wait for server bind"
  ansible.builtin.pause:
    seconds: 3

- name: "{{ pt_label }} @ {{ pt_size }}B: run client"
  ansible.builtin.shell:
    cmd: >-
      timeout {{ test_timeout }}
      {{ xio_prefix }}/bin/{{ pt_tool }}
      -d {{ rdma_dev }} -x 1
      -s {{ pt_size }}
      {{ "--duration " ~ pt_duration if pt_duration is defined else "-n " ~ pt_iters }}
      --use_rocm_xio=0 --pci_mmio_bridge
      {{ pt_extra_client_args }}
      {{ server_ip }} 2>&1
  delegate_to: "{{ vm2 }}"
  environment:
    LD_LIBRARY_PATH: "/opt/rocm/lib:{{ ansible_env.LD_LIBRARY_PATH | default('') }}"
  register: pt_client
  changed_when: false
  failed_when: false

- name: "{{ pt_label }} @ {{ pt_size }}B: parse BW result"
  when: pt_mode == "bw"
  block:
    - name: "{{ pt_label }} @ {{ pt_size }}B: extract BW"
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -o pipefail
          RAW={{ pt_client.stdout | quote }}
          RC={{ pt_client.rc }}

          if [ "$RC" -ne 0 ]; then
            echo "{{ pt_label }},{{ pt_size }},FAIL,0,FAIL" \
              >> "{{ pt_csv }}"
            echo "FAIL rc=$RC"
            exit 0
          fi

          LINE=$(echo "$RAW" | grep -E '^\s+[0-9]' | tail -1)
          if [ -z "$LINE" ]; then
            echo "{{ pt_label }},{{ pt_size }},NODATA,0,NODATA" \
              >> "{{ pt_csv }}"
            echo "NODATA"
            exit 0
          fi

          ITERS=$(echo "$LINE" | awk '{print $2}')
          AVG=$(echo "$LINE" | awk '{print $4}')
          AVG_GB=$(echo "scale=2; $AVG / 8" \
                   | bc -l 2>/dev/null || echo "$AVG")

          echo "{{ pt_label }},{{ pt_size }},-,$ITERS,$AVG_GB" \
            >> "{{ pt_csv }}"
          echo "{{ pt_label }} {{ pt_size }}: avg=${AVG_GB} GB/s iters=$ITERS (GPU-initiated)"
      delegate_to: localhost
      become: false
      changed_when: false
      register: pt_bw_parsed

    - name: "{{ pt_label }} @ {{ pt_size }}B: show BW"
      ansible.builtin.debug:
        msg: "{{ pt_bw_parsed.stdout_lines }}"

- name: "{{ pt_label }} @ {{ pt_size }}B: parse Lat result"
  when: pt_mode == "lat"
  block:
    - name: "{{ pt_label }} @ {{ pt_size }}B: extract Lat"
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -o pipefail
          RAW={{ pt_client.stdout | quote }}
          RC={{ pt_client.rc }}

          if [ "$RC" -ne 0 ]; then
            echo "{{ pt_label }},{{ pt_size }},FAIL" \
              >> "{{ pt_csv }}"
            echo "FAIL rc=$RC"
            exit 0
          fi

          LINE=$(echo "$RAW" | grep -E '^\s+[0-9]' | tail -1)
          if [ -z "$LINE" ]; then
            echo "{{ pt_label }},{{ pt_size }},NODATA" \
              >> "{{ pt_csv }}"
            echo "NODATA"
            exit 0
          fi

          TTYP=$(echo "$LINE" | awk '{print $5}')

          echo "{{ pt_label }},{{ pt_size }},$TTYP" \
            >> "{{ pt_csv }}"
          echo "{{ pt_label }} {{ pt_size }}: typ=${TTYP} us (GPU-initiated)"
      delegate_to: localhost
      become: false
      changed_when: false
      register: pt_lat_parsed

    - name: "{{ pt_label }} @ {{ pt_size }}B: show Lat"
      ansible.builtin.debug:
        msg: "{{ pt_lat_parsed.stdout_lines }}"
