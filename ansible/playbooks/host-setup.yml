# Play 1: Build, install, configure, and start the
# rocm-ernic systemd service on the local host.

---
- name: Host setup -- build and install rocm-ernic service
  hosts: localhost
  gather_facts: true
  vars_files:
    - ../group_vars/all.yml

  tasks:

    # ── Build ────────────────────────────────────────
    - name: Configure the CMake build
      ansible.builtin.command:
        argv:
          - cmake
          - -B
          - "{{ ernic_build_dir }}"
          - -G
          - Ninja
          - "-DCMAKE_BUILD_TYPE={{ ernic_build_type }}"
          - -DCMAKE_INSTALL_PREFIX=/usr/local
          - -DERNIC_INSTALL_SERVICE=ON
        chdir: "{{ ernic_project_root }}"
        creates: "{{ ernic_build_dir }}/build.ninja"
      when: not ernic_skip_build

    - name: Build the project
      ansible.builtin.command:
        argv:
          - cmake
          - --build
          - "{{ ernic_build_dir }}"
        chdir: "{{ ernic_project_root }}"
      changed_when: true
      when: not ernic_skip_build

    # ── Install ──────────────────────────────────────
    - name: Install rocm-ernic (server, ernicctl, systemd units)
      ansible.builtin.command:
        argv:
          - cmake
          - --install
          - "{{ ernic_build_dir }}"
      become: true
      changed_when: true
      when: not ernic_skip_build

    # ── Env file ─────────────────────────────────────
    - name: Ensure /etc/rocm-ernic directory exists
      ansible.builtin.file:
        path: /etc/rocm-ernic
        state: directory
        mode: "0755"
        owner: root
        group: root
      become: true

    - name: Template the rocm-ernic env file
      ansible.builtin.template:
        src: "{{ ernic_project_root }}/ansible/templates/rocm-ernic.env.j2"
        dest: /etc/rocm-ernic/rocm-ernic.env
        owner: root
        group: root
        mode: "0644"
      become: true

    # ── Systemd ──────────────────────────────────────
    - name: Reload systemd daemon
      ansible.builtin.systemd:
        daemon_reload: true
      become: true

    - name: Check if service is already running
      ansible.builtin.stat:
        path: "{{ ernic_run_dir }}/instances.json"
      register: ernic_manifest

    - name: Stop VMs attached to existing instances
      ansible.builtin.shell:
        cmd: >-
          for i in $(seq 1 20); do
            ernicctl vm-stop $i 2>/dev/null || true;
          done
      become: true
      changed_when: true
      when: ernic_manifest.stat.exists

    - name: Find QEMU processes on target SSH ports
      ansible.builtin.shell:
        cmd: >-
          ss -tlnp 2>/dev/null
          | grep ':{{ item }} '
          | sed -n 's/.*pid=\([0-9]*\).*/\1/p'
          | head -1
      register: cleanup_port_pids
      changed_when: false
      failed_when: false
      loop: "{{ range(ernic_vm_ssh_base_port | int,
                 ernic_vm_ssh_base_port | int
                 + ernic_instances | int) | list }}"
      when: ernic_manifest.stat.exists

    - name: Kill QEMU processes on target SSH ports
      ansible.builtin.command:
        argv:
          - kill
          - -9
          - "{{ item.stdout }}"
      become: true
      changed_when: true
      failed_when: false
      loop: "{{ cleanup_port_pids.results | default([]) }}"
      when:
        - ernic_manifest.stat.exists
        - item.stdout is defined
        - item.stdout | length > 0

    - name: Wait for killed processes to release ports
      ansible.builtin.pause:
        seconds: 3
      when: ernic_manifest.stat.exists

    - name: Stop existing service for clean restart
      ansible.builtin.command:
        argv:
          - ernicctl
          - stop
      become: true
      changed_when: true
      when: ernic_manifest.stat.exists

    - name: Wait for cleanup to complete
      ansible.builtin.pause:
        seconds: 3
      when: ernic_manifest.stat.exists

    - name: Start the rocm-ernic service
      ansible.builtin.command:
        argv:
          - ernicctl
          - start
      become: true
      changed_when: true

    # ── Verify ───────────────────────────────────────
    - name: Wait for instance sockets to appear
      ansible.builtin.wait_for:
        path: "{{ ernic_run_dir }}/{{ item }}.sock"
        timeout: 30
      loop: "{{ range(1, ernic_instances | int + 1) | list }}"

    - name: Verify service status
      ansible.builtin.command:
        argv:
          - ernicctl
          - status
          - --json
      register: ernic_status
      changed_when: false

    - name: Display service status
      ansible.builtin.debug:
        var: ernic_status.stdout_lines

    # ── GPU passthrough: bind GPUs to vfio-pci ──────
    - name: Collect GPU BDF addresses
      ansible.builtin.set_fact:
        ernic_gpu_bdfs: >-
          {{ ernic_gpu_pci_devices.values()
             | select('ne', '')
             | list }}
      when: ernic_gpu_passthrough | bool

    - name: Verify IOMMU is enabled
      ansible.builtin.shell:
        cmd: >-
          ls /sys/kernel/iommu_groups/ 2>/dev/null
          | head -1 | grep -q .
          && echo OK || echo MISSING
      register: iommu_check
      changed_when: false
      when: ernic_gpu_passthrough | bool

    - name: Fail if IOMMU is not enabled
      ansible.builtin.fail:
        msg: >-
          IOMMU does not appear to be enabled
          (no groups in /sys/kernel/iommu_groups/).
          Add amd_iommu=on (or intel_iommu=on) to
          the kernel command line and reboot.
      when:
        - ernic_gpu_passthrough | bool
        - "'MISSING' in iommu_check.stdout"

    - name: Load vfio-pci kernel module
      community.general.modprobe:
        name: vfio-pci
        state: present
      become: true
      when: ernic_gpu_passthrough | bool

    - name: Get vendor/device IDs for each GPU
      ansible.builtin.shell:
        cmd: >-
          lspci -n -s {{ item }}
          | awk '{print $3}'
      register: gpu_dev_ids
      changed_when: false
      loop: "{{ ernic_gpu_bdfs }}"
      when: ernic_gpu_passthrough | bool

    - name: Check current driver for each GPU
      ansible.builtin.shell:
        cmd: >-
          basename "$(readlink -f
          /sys/bus/pci/devices/{{ item }}/driver
          2>/dev/null)" 2>/dev/null || echo none
      register: gpu_current_driver
      changed_when: false
      loop: "{{ ernic_gpu_bdfs }}"
      when: ernic_gpu_passthrough | bool

    - name: Unbind GPUs from current driver
      ansible.builtin.shell:
        cmd: >-
          echo '{{ item.item }}'
          > /sys/bus/pci/devices/{{ item.item }}/driver/unbind
      become: true
      changed_when: true
      loop: "{{ gpu_current_driver.results }}"
      when:
        - ernic_gpu_passthrough | bool
        - item.stdout != 'none'
        - item.stdout != 'vfio-pci'

    - name: Register GPU vendor:device with vfio-pci
      ansible.builtin.shell:
        cmd: >-
          echo '{{ item.stdout }}'
          > /sys/bus/pci/drivers/vfio-pci/new_id
          2>/dev/null || true
      become: true
      changed_when: true
      loop: "{{ gpu_dev_ids.results }}"
      when: ernic_gpu_passthrough | bool

    - name: Bind GPUs to vfio-pci
      ansible.builtin.shell:
        cmd: >-
          echo '{{ item }}'
          > /sys/bus/pci/drivers/vfio-pci/bind
          2>/dev/null || true
      become: true
      changed_when: true
      loop: "{{ ernic_gpu_bdfs }}"
      when: ernic_gpu_passthrough | bool

    - name: Verify GPUs are bound to vfio-pci
      ansible.builtin.shell:
        cmd: >-
          lspci -k -s {{ item }}
          | grep -q 'Kernel driver in use: vfio-pci'
          && echo OK || echo FAIL
      register: gpu_vfio_verify
      changed_when: false
      loop: "{{ ernic_gpu_bdfs }}"
      when: ernic_gpu_passthrough | bool

    - name: Assert all GPUs bound to vfio-pci
      ansible.builtin.assert:
        that:
          - item.stdout == 'OK'
        fail_msg: >-
          GPU {{ item.item }} is not bound to
          vfio-pci. Check IOMMU groups and driver
          binding.
      loop: "{{ gpu_vfio_verify.results }}"
      when: ernic_gpu_passthrough | bool

    # ── Prepare rocm-xio tarball for VMs ─────────────
    - name: Clone rocm-xio on controller
      ansible.builtin.git:
        repo: "{{ ernic_rocm_xio_repo }}"
        dest: /tmp/rocm-xio
        version: "{{ ernic_rocm_xio_branch }}"
        accept_hostkey: true
        force: true
      when: ernic_gpu_passthrough | bool

    - name: Create rocm-xio tarball
      ansible.builtin.command:
        argv:
          - tar
          - czf
          - /tmp/rocm-xio.tar.gz
          - -C
          - /tmp
          - rocm-xio
      changed_when: true
      when: ernic_gpu_passthrough | bool
