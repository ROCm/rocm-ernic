#
# Play 4: Run sanity tests between two VMs.
#   - iperf3 for TCP/IP over the emulated Ethernet NICs
#   - perftest (ib_send_bw) for RDMA bandwidth
#   - ibv_rc_pingpong for RDMA latency
#
# This play assumes exactly two VMs (ernic_vm_1 and
# ernic_vm_2) with IPs already configured by
# guest-setup.yml.

---
- name: Sanity tests -- iperf3 and perftest
  hosts: localhost
  gather_facts: false
  vars_files:
    - ../group_vars/all.yml

  vars:
    vm1_ssh: >-
      ssh -o StrictHostKeyChecking=no
      -o UserKnownHostsFile=/dev/null
      -p {{ ernic_vm_ssh_base_port | int }}
      {{ ernic_vm_ssh_user }}@localhost
    vm2_ssh: >-
      ssh -o StrictHostKeyChecking=no
      -o UserKnownHostsFile=/dev/null
      -p {{ ernic_vm_ssh_base_port | int + 1 }}
      {{ ernic_vm_ssh_user }}@localhost
    vm1_ip: "{{ ernic_nic_subnet }}.10"
    vm2_ip: "{{ ernic_nic_subnet }}.20"
    iperf_bw: >-
      {{ ernic_iperf_bandwidth
         | regex_replace('(?i)iB/s$', '')
         | regex_replace('(?i)B/s$', '') }}
    rdma_dev: rocm-rdma-ernic0

  tasks:

    - name: Detect RDMA device name on VM1
      ansible.builtin.shell:
        cmd: >-
          {{ vm1_ssh }}
          'ibv_devices | grep -oE "rocm-rdma-ernic[0-9]+|rocep[0-9]+s[0-9]+"
          | head -1'
      register: rdma_dev_detect
      changed_when: false
      failed_when: false

    - name: Set RDMA device name
      ansible.builtin.set_fact:
        rdma_dev: >-
          {{ rdma_dev_detect.stdout | trim
             | default('rocep1s0', true) }}

    - name: Skip all tests if requested
      ansible.builtin.meta: end_play
      when: ernic_skip_tests | bool

    # ─────────────────────────────────────────────────
    # TCP/IP sanity test (ping)
    # ─────────────────────────────────────────────────
    - name: "TCP/IP test: ping VM2 from VM1"
      ansible.builtin.shell:
        cmd: >-
          {{ vm1_ssh }}
          'ping -c 5 -W 5 {{ vm2_ip }}'
      register: ping_v1_to_v2
      changed_when: false
      failed_when: false

    - name: Display VM1 -> VM2 ping results
      ansible.builtin.debug:
        var: ping_v1_to_v2.stdout_lines

    - name: "TCP/IP test: ping VM1 from VM2"
      ansible.builtin.shell:
        cmd: >-
          {{ vm2_ssh }}
          'ping -c 5 -W 5 {{ vm1_ip }}'
      register: ping_v2_to_v1
      changed_when: false
      failed_when: false

    - name: Display VM2 -> VM1 ping results
      ansible.builtin.debug:
        var: ping_v2_to_v1.stdout_lines

    - name: Assert ping connectivity
      ansible.builtin.assert:
        that:
          - ping_v1_to_v2.rc == 0
          - ping_v2_to_v1.rc == 0
        fail_msg: >-
          Ping failed between VMs over emulated NICs.
          Check NIC configuration and TCP mesh.

    # ─────────────────────────────────────────────────
    # RDMA bandwidth test (ib_send_bw)
    # ─────────────────────────────────────────────────
    - name: "RDMA BW test: start ib_send_bw server on VM1"
      ansible.builtin.shell:
        cmd: >-
          {{ vm1_ssh }}
          'sudo systemctl stop ib-send-bw-server 2>/dev/null;
          sudo systemctl reset-failed ib-send-bw-server 2>/dev/null;
          sudo systemd-run --unit=ib-send-bw-server
          bash -c "ib_send_bw -d {{ rdma_dev }} -x 1 -n 10
          --report_gbits
          >/tmp/ib_send_bw_server.log 2>&1";
          sleep 1'
      changed_when: true

    - name: Wait for ib_send_bw server to listen
      ansible.builtin.pause:
        seconds: 5

    - name: "RDMA BW test: run ib_send_bw client from VM2"
      ansible.builtin.shell:
        cmd: >-
          {{ vm2_ssh }} 'timeout 30 ib_send_bw
          -d {{ rdma_dev }} -x 1 -n 10 --report_gbits
          {{ vm1_ip }} 2>&1 || true'
      register: ib_send_bw_result
      changed_when: false
      failed_when: false

    - name: Display ib_send_bw results
      ansible.builtin.debug:
        var: ib_send_bw_result.stdout_lines

    - name: Collect ib_send_bw server log
      ansible.builtin.shell:
        cmd: >-
          {{ vm1_ssh }} 'cat /tmp/ib_send_bw_server.log'
      register: ib_send_bw_server_log
      changed_when: false
      failed_when: false

    - name: Display ib_send_bw server output
      ansible.builtin.debug:
        var: ib_send_bw_server_log.stdout_lines

    # ─────────────────────────────────────────────────
    # RDMA latency test (ibv_rc_pingpong)
    # ─────────────────────────────────────────────────
    - name: "RDMA latency test: start ibv_rc_pingpong server on VM1"
      ansible.builtin.shell:
        cmd: >-
          {{ vm1_ssh }}
          'sudo systemctl stop ibv-rc-pingpong-server 2>/dev/null;
          sudo systemctl reset-failed ibv-rc-pingpong-server 2>/dev/null;
          sudo systemd-run --unit=ibv-rc-pingpong-server
          bash -c "ibv_rc_pingpong -d {{ rdma_dev }} -g 1 -n 100
          >/tmp/ibv_rc_pingpong_server.log 2>&1";
          sleep 1'
      changed_when: true

    - name: Wait for ibv_rc_pingpong server to listen
      ansible.builtin.pause:
        seconds: 5

    - name: "RDMA latency test: run ibv_rc_pingpong client from VM2"
      ansible.builtin.shell:
        cmd: >-
          {{ vm2_ssh }} 'timeout 30 ibv_rc_pingpong
          -d {{ rdma_dev }} -g 1 -n 100
          {{ vm1_ip }} 2>&1 || true'
      register: ibv_rc_pingpong_result
      changed_when: false
      failed_when: false

    - name: Display ibv_rc_pingpong client results
      ansible.builtin.debug:
        var: ibv_rc_pingpong_result.stdout_lines

    - name: Collect ibv_rc_pingpong server log
      ansible.builtin.shell:
        cmd: >-
          {{ vm1_ssh }} 'cat /tmp/ibv_rc_pingpong_server.log'
      register: ibv_rc_pingpong_server_log
      changed_when: false
      failed_when: false

    - name: Display ibv_rc_pingpong server output
      ansible.builtin.debug:
        var: ibv_rc_pingpong_server_log.stdout_lines

    # ─────────────────────────────────────────────────
    # Summary
    # ─────────────────────────────────────────────────
    - name: Set test result facts
      ansible.builtin.set_fact:
        ping_pass: >-
          {{ ping_v1_to_v2.rc == 0
             and ping_v2_to_v1.rc == 0 }}
        bw_pass: "{{ ib_send_bw_result.rc == 0 }}"
        pp_pass: "{{ ibv_rc_pingpong_result.rc == 0 }}"

    - name: Sanity test summary
      ansible.builtin.debug:
        msg:
          - "=== Sanity Test Results ==="
          - "ping:            {{ 'PASS' if ping_pass else 'FAIL' }}"
          - "ib_send_bw:      {{ 'PASS' if bw_pass else 'FAIL' }}"
          - "ibv_rc_pingpong: {{ 'PASS' if pp_pass else 'FAIL' }}"

    - name: Fail if ping test failed
      ansible.builtin.assert:
        that:
          - ping_v1_to_v2.rc == 0
          - ping_v2_to_v1.rc == 0
        fail_msg: >-
          Ping between VMs failed. Check the output
          above for details.
