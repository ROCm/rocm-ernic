#
# Play 4: Run sanity tests between two VMs.
#   - iperf3 for TCP/IP over the emulated Ethernet NICs
#   - perftest (ib_send_bw) for RDMA bandwidth
#   - ibv_rc_pingpong for RDMA latency
#
# This play assumes exactly two VMs (ernic_vm_1 and
# ernic_vm_2) with IPs already configured by
# guest-setup.yml.

---
- name: Sanity tests -- iperf3 and perftest
  hosts: localhost
  gather_facts: false
  vars_files:
    - ../group_vars/all.yml

  vars:
    vm1_ssh: >-
      ssh {{ ernic_guest_ssh_id_opts }}
      -o StrictHostKeyChecking=no
      -o UserKnownHostsFile=/dev/null
      -o BatchMode=yes
      -o ConnectTimeout=15
      -o ServerAliveInterval=10
      -o ServerAliveCountMax=3
      -p {{ ernic_vm_ssh_base_port | int }}
      {{ ernic_vm_ssh_user }}@localhost
    vm2_ssh: >-
      ssh {{ ernic_guest_ssh_id_opts }}
      -o StrictHostKeyChecking=no
      -o UserKnownHostsFile=/dev/null
      -o BatchMode=yes
      -o ConnectTimeout=15
      -o ServerAliveInterval=10
      -o ServerAliveCountMax=3
      -p {{ ernic_vm_ssh_base_port | int + 1 }}
      {{ ernic_vm_ssh_user }}@localhost
    vm1_ip: "{{ ernic_nic_subnet }}.10"
    vm2_ip: "{{ ernic_nic_subnet }}.20"

  tasks:

    # Identifies the device by the emulated PCI tuple rather than by name: the
    # name is rewritten twice during boot and says nothing about which
    # driver bound the device.  See scripts/find-rdma-device.sh.
    - name: Detect RDMA device name on VM1
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: >-
          {{ vm1_ssh }} 'sh -s'
          < {{ ernic_project_root }}/scripts/find-rdma-device.sh
      register: rdma_dev_detect
      changed_when: false
      failed_when: false

    # No default here.  Falling back to a hard-coded name hands every
    # RDMA test below a device that was never there, and they then
    # fail against it instead of reporting that detection came up
    # empty.
    - name: Assert an RDMA device was detected on VM1
      ansible.builtin.assert:
        that:
          - rdma_dev_detect.stdout | trim | length > 0
        fail_msg: >-
          No RDMA device matching PCI 0x1dd8:0x1002 subsystem
          0x1dd8:0x5400 found on VM1, so the driver did not bind or the
          port never came up.

    - name: Set RDMA device name
      ansible.builtin.set_fact:
        rdma_dev: "{{ rdma_dev_detect.stdout | trim }}"

    - name: Skip all tests if requested
      ansible.builtin.meta: end_play
      when: not (ernic_tests | bool)

    # ─────────────────────────────────────────────────
    # TCP/IP sanity test (ping)
    # ─────────────────────────────────────────────────
    - name: "TCP/IP test: ping VM2 from VM1"
      ansible.builtin.command:
        cmd: >-
          {{ vm1_ssh }}
          'ping -c 5 -W 5 {{ vm2_ip }}'
      register: ping_v1_to_v2
      changed_when: false
      failed_when: false

    - name: Display VM1 -> VM2 ping results
      ansible.builtin.debug:
        var: ping_v1_to_v2.stdout_lines

    - name: "TCP/IP test: ping VM1 from VM2"
      ansible.builtin.command:
        cmd: >-
          {{ vm2_ssh }}
          'ping -c 5 -W 5 {{ vm1_ip }}'
      register: ping_v2_to_v1
      changed_when: false
      failed_when: false

    - name: Display VM2 -> VM1 ping results
      ansible.builtin.debug:
        var: ping_v2_to_v1.stdout_lines

    - name: Assert ping connectivity
      ansible.builtin.assert:
        that:
          - ping_v1_to_v2.rc == 0
          - ping_v2_to_v1.rc == 0
        fail_msg: >-
          Ping failed between VMs over emulated NICs.
          Check NIC configuration and TCP mesh.

    # ─────────────────────────────────────────────────
    # TCP connectivity test (netcat echo)
    # ─────────────────────────────────────────────────
    - name: "TCP test: start netcat listener on VM1"
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: >-
          set -o pipefail;
          {{ vm1_ssh }}
          'sudo systemctl stop nc-echo 2>/dev/null;
          sudo systemctl reset-failed nc-echo 2>/dev/null;
          sudo systemd-run --unit=nc-echo
          bash -c "echo ERNIC_OK | nc -l -p 9999 -q 1"'
      changed_when: true

    # systemd-run returns once the unit has started, which can be before nc
    # is listening, and a client that connects first is refused.  This reads
    # the listener table rather than connecting, since nc -l serves one
    # connection and a probe would use it up.  It also stops waiting if nc
    # exits, so the client fails and the details below say why.
    #
    # Running out of retries marks a task failed whatever failed_when says,
    # so ignore_errors is what lets a listener that never came up reach the
    # client, the details, and the rest of the tests.  The final assert
    # still fails the play on the TCP result.
    - name: "TCP test: wait for the netcat listener on VM1"
      ansible.builtin.command:
        cmd: >-
          {{ vm1_ssh }}
          'systemctl is-active nc-echo;
          ss -Hltn "sport = :9999"'
      register: nc_listen
      until: >-
        nc_listen.rc == 0
        and (nc_listen.stdout_lines | length > 1
             or nc_listen.stdout_lines[:1] != ['active'])
      retries: 15
      delay: 1
      changed_when: false
      ignore_errors: true

    - name: "TCP test: connect from VM2 and read"
      ansible.builtin.command:
        cmd: >-
          {{ vm2_ssh }}
          'timeout 30
          bash -c "nc -w 5 {{ vm1_ip }} 9999"'
      register: tcp_result
      changed_when: false
      failed_when: false

    - name: Set TCP test result
      ansible.builtin.set_fact:
        tcp_pass: >-
          {{ tcp_result.rc == 0
             and 'ERNIC_OK' in tcp_result.stdout }}

    - name: Display TCP test result
      ansible.builtin.debug:
        msg: >-
          TCP connectivity:
          {{ 'PASS -- received: '
             + tcp_result.stdout
             if tcp_pass | bool
             else 'FAIL' }}

    # A listener that never came up and a connection that never arrived
    # look alike from the client, so show the listener's side as well.
    - name: "TCP test: collect the netcat listener's state on VM1"
      ansible.builtin.command:
        cmd: >-
          {{ vm1_ssh }}
          'sudo systemctl status --no-pager --full nc-echo;
          ss -Hltn "sport = :9999"'
      register: nc_listener_state
      changed_when: false
      failed_when: false
      when: not (tcp_pass | bool)

    - name: Display TCP test failure details
      ansible.builtin.debug:
        msg:
          - "client exit status: {{ tcp_result.rc }}"
          - "client stdout: {{ tcp_result.stdout }}"
          - "client stderr: {{ tcp_result.stderr }}"
          - "listener on VM1:"
          - "{{ nc_listener_state.stdout_lines }}"
      when: not (tcp_pass | bool)

    # ─────────────────────────────────────────────────
    # RDMA bandwidth test (ib_send_bw)
    # ─────────────────────────────────────────────────
    - name: "RDMA BW test: start ib_send_bw server on VM1"
      ansible.builtin.shell:
        cmd: >-
          {{ vm1_ssh }}
          'sudo systemctl stop ib-send-bw-server 2>/dev/null;
          sudo systemctl reset-failed ib-send-bw-server 2>/dev/null;
          sudo systemd-run --unit=ib-send-bw-server
          bash -c "ib_send_bw -d {{ rdma_dev }} -x 1 -n 10
          --report_gbits
          >/tmp/ib_send_bw_server.log 2>&1";
          sleep 1'
      changed_when: true

    - name: Wait for ib_send_bw server to listen
      ansible.builtin.pause:
        seconds: 5

    - name: "RDMA BW test: run ib_send_bw client from VM2"
      ansible.builtin.shell:
        cmd: >-
          {{ vm2_ssh }} 'timeout 30 ib_send_bw
          -d {{ rdma_dev }} -x 1 -n 10 --report_gbits
          {{ vm1_ip }} 2>&1'
      register: ib_send_bw_result
      changed_when: false
      failed_when: false

    - name: Display ib_send_bw results
      ansible.builtin.debug:
        var: ib_send_bw_result.stdout_lines

    # The server can still be finishing when the client returns.  Until it
    # exits it holds port 18515, where the ibv_rc_pingpong server listens
    # next, and its log, which is written at exit, is empty.
    - name: Wait for the ib_send_bw server unit to finish
      ansible.builtin.command:
        cmd: >-
          {{ vm1_ssh }}
          'systemctl show -p SubState --value ib-send-bw-server'
      register: ib_send_bw_substate
      until: ib_send_bw_substate.stdout | trim != 'running'
      retries: 12
      delay: 5
      changed_when: false
      failed_when: false

    - name: Collect ib_send_bw server log
      ansible.builtin.command:
        cmd: >-
          {{ vm1_ssh }} 'cat /tmp/ib_send_bw_server.log'
      register: ib_send_bw_server_log
      changed_when: false
      failed_when: false

    - name: Display ib_send_bw server output
      ansible.builtin.debug:
        var: ib_send_bw_server_log.stdout_lines

    # ─────────────────────────────────────────────────
    # RDMA latency test (ibv_rc_pingpong)
    # ─────────────────────────────────────────────────
    - name: "RDMA latency test: start ibv_rc_pingpong server on VM1"
      ansible.builtin.shell:
        cmd: >-
          {{ vm1_ssh }}
          'sudo systemctl stop ibv-rc-pingpong-server 2>/dev/null;
          sudo systemctl reset-failed ibv-rc-pingpong-server 2>/dev/null;
          sudo systemd-run --unit=ibv-rc-pingpong-server
          bash -c "ibv_rc_pingpong -d {{ rdma_dev }} -g 1 -n 100
          >/tmp/ibv_rc_pingpong_server.log 2>&1";
          sleep 1'
      changed_when: true

    - name: Wait for ibv_rc_pingpong server to listen
      ansible.builtin.pause:
        seconds: 5

    - name: "RDMA latency test: run ibv_rc_pingpong client from VM2"
      ansible.builtin.shell:
        cmd: >-
          {{ vm2_ssh }} 'timeout 30 ibv_rc_pingpong
          -d {{ rdma_dev }} -g 1 -n 100
          {{ vm1_ip }} 2>&1'
      register: ibv_rc_pingpong_result
      changed_when: false
      failed_when: false

    - name: Display ibv_rc_pingpong client results
      ansible.builtin.debug:
        var: ibv_rc_pingpong_result.stdout_lines

    # As for ib_send_bw: the UD mesh server listens on port 18515 next
    - name: Wait for the ibv_rc_pingpong server unit to finish
      ansible.builtin.command:
        cmd: >-
          {{ vm1_ssh }}
          'systemctl show -p SubState --value ibv-rc-pingpong-server'
      register: ibv_rc_pingpong_substate
      until: ibv_rc_pingpong_substate.stdout | trim != 'running'
      retries: 12
      delay: 5
      changed_when: false
      failed_when: false

    - name: Collect ibv_rc_pingpong server log
      ansible.builtin.command:
        cmd: >-
          {{ vm1_ssh }} 'cat /tmp/ibv_rc_pingpong_server.log'
      register: ibv_rc_pingpong_server_log
      changed_when: false
      failed_when: false

    - name: Display ibv_rc_pingpong server output
      ansible.builtin.debug:
        var: ibv_rc_pingpong_server_log.stdout_lines

    # ─────────────────────────────────────────────────
    # UD across the mesh (test_ud_mesh)
    # ─────────────────────────────────────────────────
    #
    # The only test in the tree that crosses the mesh wire with a datagram.
    # ib_send_bw and ibv_rc_pingpong above are RC, and every UD test in
    # tests/ puts both endpoints on one node, where a self-GID resolves to
    # the local node and the ionic data path delivers it in-process.
    # This addresses the AH with the PEER's GID, which is what selects
    # tcp_resolve_node_from_gid()'s remote path.
    #
    # Unlike the perftest pair, the assertions live in the SERVER: it is the
    # side that sees byte_len, the GRH offset and src_qp. Its exit status is
    # collected explicitly below rather than inferred from the client's.
    #
    # There is deliberately no SRQ equivalent here. The TCP backend carries
    # SRQ geometry and nothing else -- see the comment on TcpSRQ in
    # src/rdma/rdma_backend_tcp.c -- because shared receives are served from
    # ionic_datapath.c's rings, which do not vary with the backend. An SRQ
    # test on this lane would re-cover what the loopback lane already covers,
    # and would need the DKMS driver and the SRQ provider built in both
    # guests to do it.
    - name: "UD mesh test: detect RDMA device on VM2"
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: >-
          {{ vm2_ssh }} 'sh -s'
          < {{ ernic_project_root }}/scripts/find-rdma-device.sh
      register: rdma_dev_detect_vm2
      changed_when: false
      failed_when: false

    # Detected per guest rather than reusing rdma_dev: that was detected on
    # VM1, and the two guests are separate devices whose names need not agree.
    - name: "UD mesh test: assert an RDMA device was detected on VM2"
      ansible.builtin.assert:
        that:
          - rdma_dev_detect_vm2.stdout | trim | length > 0
        fail_msg: >-
          No RDMA device matching PCI 0x1dd8:0x1002 subsystem 0x1dd8:0x5400
          found on VM2, so the driver did not bind or the port never came up.

    - name: "UD mesh test: set VM2 RDMA device name"
      ansible.builtin.set_fact:
        rdma_dev_vm2: "{{ rdma_dev_detect_vm2.stdout | trim }}"

    - name: "UD mesh test: copy the test sources to both guests"
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: >-
          set -o pipefail;
          {{ item }} 'mkdir -p /tmp/ud-mesh' &&
          tar -C {{ ernic_project_root }}/tests -cf -
          test_ud_mesh.c ernic_device.h |
          {{ item }} 'tar -C /tmp/ud-mesh -xf -'
      loop:
        - "{{ vm1_ssh }}"
        - "{{ vm2_ssh }}"
      loop_control:
        label: "{{ 'vm1' if item == vm1_ssh else 'vm2' }}"
      changed_when: true

    - name: "UD mesh test: build the test in both guests"
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          {{ item }} 'bash -s' <<'EOF'
          set -e
          cd /tmp/ud-mesh
          read -ra ibverbs <<< "$(pkg-config --cflags --libs libibverbs)"
          gcc -O2 -Wall -Wextra -D_GNU_SOURCE -o test_ud_mesh test_ud_mesh.c \
            "${ibverbs[@]}"
          EOF
      loop:
        - "{{ vm1_ssh }}"
        - "{{ vm2_ssh }}"
      loop_control:
        label: "{{ 'vm1' if item == vm1_ssh else 'vm2' }}"
      changed_when: true

    - name: "UD mesh test: start the server on VM1"
      ansible.builtin.shell:
        cmd: >-
          {{ vm1_ssh }}
          'sudo systemctl stop ud-mesh-server 2>/dev/null;
          sudo systemctl reset-failed ud-mesh-server 2>/dev/null;
          sudo systemd-run --unit=ud-mesh-server
          bash -c "/tmp/ud-mesh/test_ud_mesh --server {{ rdma_dev }}
          >/tmp/ud_mesh_server.log 2>&1";
          sleep 1'
      changed_when: true

    - name: "UD mesh test: wait for the server to listen"
      ansible.builtin.pause:
        seconds: 5

    - name: "UD mesh test: run the client from VM2"
      ansible.builtin.shell:
        cmd: >-
          {{ vm2_ssh }} 'timeout 60
          /tmp/ud-mesh/test_ud_mesh --client {{ vm1_ip }} {{ rdma_dev_vm2 }}
          2>&1'
      register: ud_mesh_client
      changed_when: false
      failed_when: false

    - name: Display UD mesh client output
      ansible.builtin.debug:
        var: ud_mesh_client.stdout_lines

    # The server holds the assertions, so its exit status is the result.
    # systemd keeps it after the unit finishes; wait for the unit to leave
    # 'running' first, or ExecMainStatus is still 0 from a live process.
    - name: "UD mesh test: wait for the server unit to finish"
      ansible.builtin.command:
        cmd: >-
          {{ vm1_ssh }}
          'systemctl show -p SubState --value ud-mesh-server'
      register: ud_mesh_substate
      until: ud_mesh_substate.stdout | trim != 'running'
      retries: 12
      delay: 5
      changed_when: false
      failed_when: false

    - name: "UD mesh test: collect the server exit status"
      ansible.builtin.command:
        cmd: >-
          {{ vm1_ssh }}
          'systemctl show -p ExecMainStatus --value ud-mesh-server'
      register: ud_mesh_server_status
      changed_when: false
      failed_when: false

    - name: Collect UD mesh server log
      ansible.builtin.command:
        cmd: >-
          {{ vm1_ssh }} 'cat /tmp/ud_mesh_server.log'
      register: ud_mesh_server_log
      changed_when: false
      failed_when: false

    - name: Display UD mesh server output
      ansible.builtin.debug:
        var: ud_mesh_server_log.stdout_lines

    # ─────────────────────────────────────────────────
    # Summary
    # ─────────────────────────────────────────────────
    - name: Set test result facts
      ansible.builtin.set_fact:
        ping_pass: >-
          {{ ping_v1_to_v2.rc == 0
             and ping_v2_to_v1.rc == 0 }}
        bw_pass: >-
          {{ ib_send_bw_result.rc == 0
             and ib_send_bw_result.stdout | length > 0 }}
        pp_pass: >-
          {{ ibv_rc_pingpong_result.rc == 0
             and ibv_rc_pingpong_result.stdout | length > 0 }}
        # Exit 0 exactly. 77 means "no usable device", which the loopback
        # lane tolerates in its smoke step but which is a failure here: a
        # device was asserted present on both guests a few tasks ago, so a
        # skip at this point is the bug, not a reason to pass.
        ud_mesh_pass: >-
          {{ ud_mesh_client.rc == 0
             and ud_mesh_server_status.stdout | trim == '0' }}

    - name: Sanity test summary
      ansible.builtin.debug:
        msg:
          - "=== Sanity Test Results ==="
          - "ping:            {{ 'PASS' if ping_pass else 'FAIL' }}"
          - "tcp:             {{ 'PASS' if tcp_pass else 'FAIL' }}"
          - "ib_send_bw:      {{ 'PASS' if bw_pass else 'FAIL' }}"
          - "ibv_rc_pingpong: {{ 'PASS' if pp_pass else 'FAIL' }}"
          - "ud_mesh:         {{ 'PASS' if ud_mesh_pass else 'FAIL' }}"

    # The RDMA results were computed into bw_pass/pp_pass and printed
    # in the summary above, but were left out of this assert, so a run
    # where ib_send_bw and ibv_rc_pingpong both failed still reported
    # the play as passing.  The Ethernet path working says nothing
    # about whether the emulated NIC carries RDMA.
    - name: Fail if connectivity or RDMA tests failed
      ansible.builtin.assert:
        that:
          - ping_v1_to_v2.rc == 0
          - ping_v2_to_v1.rc == 0
          - tcp_result.rc == 0
          - "'ERNIC_OK' in tcp_result.stdout"
          - bw_pass | bool
          - pp_pass | bool
          - ud_mesh_pass | bool
        fail_msg: >-
          Sanity tests failed (ping={{ ping_pass }},
          tcp={{ tcp_pass }}, ib_send_bw={{ bw_pass }},
          ibv_rc_pingpong={{ pp_pass }},
          ud_mesh={{ ud_mesh_pass }}). Check the output
          above for details.
