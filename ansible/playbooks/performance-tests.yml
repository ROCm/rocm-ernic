#
# Play 5: Full RDMA bandwidth and latency sweeps.
#
# Runs ib_{send,write,read}_{bw,lat} across a
# configurable range of message sizes and iteration
# counts, then runs ibv_rc_pingpong for multi-run
# reliability.  Results are collected into a
# timestamped CSV file on the host for easy comparison
# between runs.
#
# This play assumes exactly two VMs with IPs already
# configured by guest-setup.yml and that the sanity
# tests have passed.
#
# Usage:
#   ansible-playbook playbooks/performance-tests.yml
#
# Override sweep parameters:
#   ansible-playbook playbooks/performance-tests.yml \
#     -e ernic_perf_bw_iters=2000 \
#     -e ernic_perf_lat_iters=100 \
#     -e ernic_perf_reliability_runs=10

---
- name: Performance tests -- bandwidth and latency sweeps
  hosts: localhost
  gather_facts: true
  vars_files:
    - ../group_vars/all.yml

  vars:
    # The sweep runs some 300 commands on the guests, and a new
    # connection for each was a few hundred chances for ssh to fail
    # to connect, which has failed a nightly run on a point that
    # never reached the device.  ControlMaster shares one connection
    # to each guest, made by the first command, among all of them.
    # ControlPersist closes a connection left idle for a minute, so
    # one left behind by a play that stopped early doesn't outlive it
    # by much; the play closes them itself at the end.
    ssh_mux_opts: >-
      -o ControlMaster=auto
      -o ControlPath={{ ssh_mux_dir.path }}/%C
      -o ControlPersist=60

    # BatchMode and the keepalives are not optional: without them
    # a bare ssh to a healthy guest can block indefinitely, and one
    # did -- a 25-minute hang on a two-second command.  LogLevel=ERROR
    # drops the warning that each connection adds the guest's host
    # key to UserKnownHostsFile, and keeps the errors.
    vm1_ssh: >-
      ssh {{ ernic_guest_ssh_id_opts }}
      -o StrictHostKeyChecking=no
      -o UserKnownHostsFile=/dev/null
      -o LogLevel=ERROR
      -o BatchMode=yes
      -o ConnectTimeout=15
      -o ServerAliveInterval=10
      -o ServerAliveCountMax=3
      {{ ssh_mux_opts }}
      -p {{ ernic_vm_ssh_base_port | int }}
      {{ ernic_vm_ssh_user }}@localhost
    vm2_ssh: >-
      ssh {{ ernic_guest_ssh_id_opts }}
      -o StrictHostKeyChecking=no
      -o UserKnownHostsFile=/dev/null
      -o LogLevel=ERROR
      -o BatchMode=yes
      -o ConnectTimeout=15
      -o ServerAliveInterval=10
      -o ServerAliveCountMax=3
      {{ ssh_mux_opts }}
      -p {{ ernic_vm_ssh_base_port | int + 1 }}
      {{ ernic_vm_ssh_user }}@localhost

    # vm1_ssh and vm2_ssh, but try again if ssh fails before the
    # command starts, and never start it twice; see run-on-guest.sh.
    # Use these for every command that doesn't read stdin, which they
    # don't pass on.
    run_on_guest: >-
      {{ ernic_project_root }}/ansible/playbooks/files/run-on-guest.sh
    vm1_run: "{{ run_on_guest }} {{ vm1_ssh }}"
    vm2_run: "{{ run_on_guest }} {{ vm2_ssh }}"
    vm1_ip: "{{ ernic_nic_subnet }}.10"
    vm2_ip: "{{ ernic_nic_subnet }}.20"

    bw_iters: "{{ ernic_perf_bw_iters | default(1000) }}"
    lat_iters: "{{ ernic_perf_lat_iters | default(50) }}"
    rel_iters: "{{ ernic_perf_reliability_iters | default(100) }}"
    rel_runs: "{{ ernic_perf_reliability_runs | default(5) }}"
    rel_size: "{{ ernic_perf_reliability_size | default(65536) }}"
    pp_iters: "{{ ernic_perf_pingpong_iters | default(100) }}"
    pp_size: "{{ ernic_perf_pingpong_size | default(4096) }}"

    perftest_timeout: 120

    kill_perftest: >-
      sudo /usr/local/bin/free-perftest-port 2>/dev/null;
      true

    sweep_sizes:
      - 4096
      - 8192
      - 16384
      - 32768
      - 65536
      - 131072
      - 262144
      - 524288
      - 1048576
      - 2097152
      - 4194304
      - 8388608

    bw_verbs:
      - {tool: ib_send_bw, label: send}
      - {tool: ib_write_bw, label: write}
      - {tool: ib_read_bw, label: read}

    lat_verbs:
      - {tool: ib_send_lat, label: send}
      - {tool: ib_write_lat, label: write}
      - {tool: ib_read_lat, label: read}

    ts: >-
      {{ ansible_date_time.date }}-{{
         ansible_date_time.hour }}{{
         ansible_date_time.minute }}{{
         ansible_date_time.second }}
    results_dir: >-
      {{ ernic_project_root }}/docs/perf-results
    bw_csv: "{{ results_dir }}/bw-{{ ts }}.csv"
    lat_csv: "{{ results_dir }}/lat-{{ ts }}.csv"
    rel_csv: "{{ results_dir }}/reliability-{{ ts }}.csv"

  tasks:

    - name: Skip if tests disabled
      ansible.builtin.meta: end_play
      when: not (ernic_tests | bool)

    # ─────────────────────────────────────────────────
    # Setup
    # ─────────────────────────────────────────────────
    # Holds the ControlPath sockets (see ssh_mux_opts).  Private to
    # this run, since a socket there is a way into the guests.
    - name: Create the directory for the ssh connection sockets
      ansible.builtin.tempfile:
        state: directory
        prefix: ernic-ssh.
      register: ssh_mux_dir

    - name: Copy free-perftest-port to VM1
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: >-
          set -o pipefail;
          cat {{ ernic_project_root }}/ansible/playbooks/files/free-perftest-port.sh
          | {{ vm1_ssh }} 'sudo tee /usr/local/bin/free-perftest-port > /dev/null
          && sudo chmod 755 /usr/local/bin/free-perftest-port'
      changed_when: false

    - name: Copy free-perftest-port to VM2
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: >-
          set -o pipefail;
          cat {{ ernic_project_root }}/ansible/playbooks/files/free-perftest-port.sh
          | {{ vm2_ssh }} 'sudo tee /usr/local/bin/free-perftest-port > /dev/null
          && sudo chmod 755 /usr/local/bin/free-perftest-port'
      changed_when: false

    - name: Free perftest port on VM1
      ansible.builtin.command:
        cmd: >-
          {{ vm1_run }} 'sudo /usr/local/bin/free-perftest-port'
      changed_when: false
      failed_when: false

    - name: Free perftest port on VM2
      ansible.builtin.command:
        cmd: >-
          {{ vm2_run }} 'sudo /usr/local/bin/free-perftest-port'
      changed_when: false
      failed_when: false

    # Identifies the device by the emulated PCI tuple rather than by name: the
    # name is rewritten twice during boot and says nothing about which
    # driver bound the device.  See scripts/find-rdma-device.sh.
    - name: Detect RDMA device name on VM1
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: >-
          {{ vm1_ssh }} 'sh -s'
          < {{ ernic_project_root }}/scripts/find-rdma-device.sh
      register: rdma_dev_detect
      changed_when: false
      failed_when: false

    # No default here.  Falling back to a hard-coded name hands every
    # RDMA test below a device that was never there, and they then
    # fail against it instead of reporting that detection came up
    # empty.
    - name: Assert an RDMA device was detected on VM1
      ansible.builtin.assert:
        that:
          - rdma_dev_detect.stdout | trim | length > 0
        fail_msg: >-
          No RDMA device matching PCI 0x1dd8:0x1002 subsystem
          0x1dd8:0x5400 found on VM1, so the driver did not bind or the
          port never came up.

    - name: Set RDMA device name
      ansible.builtin.set_fact:
        rdma_dev: "{{ rdma_dev_detect.stdout | trim }}"

    - name: Create results directory
      ansible.builtin.file:
        path: "{{ results_dir }}"
        state: directory
        mode: "0755"

    - name: Write CSV headers
      ansible.builtin.copy:
        dest: "{{ item.path }}"
        content: "{{ item.header }}\n"
        mode: "0644"
      loop:
        - path: "{{ bw_csv }}"
          header: >-
            verb,size,bw_peak_GBs,bw_avg_GBs,msg_rate_mpps
        - path: "{{ lat_csv }}"
          header: >-
            verb,size,lat_min_us,lat_typical_us,lat_max_us
        - path: "{{ rel_csv }}"
          header: >-
            verb,run,size,bw_peak_GBs,bw_avg_GBs,msg_rate_mpps

    - name: Display sweep configuration
      ansible.builtin.debug:
        msg:
          - "=== Performance Sweep Config ==="
          - "Device:          {{ rdma_dev }}"
          - "BW iterations:   {{ bw_iters }}"
          - "Lat iterations:  {{ lat_iters }}"
          - "Sizes:           {{ sweep_sizes | length }} (4 KB - 8 MB)"
          - "Reliability:     {{ rel_runs }} runs x {{ rel_iters }} iters @ {{ rel_size }} B"
          - "Results dir:     {{ results_dir }}"

    # ─────────────────────────────────────────────────
    # Bandwidth sweep
    # ─────────────────────────────────────────────────
    - name: "BW sweep: {{ item.0.label ~ ' @ ' ~ item.1 ~ ' B' }}"
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -o pipefail
          # The task exits 0 whatever happened, and Ansible shows only
          # the stdout of a task that succeeds, so put ssh's errors and
          # run-on-guest.sh's retries there too.
          exec 2>&1
          TOOL="{{ item.0.tool }}"
          DEV="{{ rdma_dev }}"
          SZ="{{ item.1 }}"
          N="{{ bw_iters }}"
          SERVER_IP="{{ vm1_ip }}"
          UNIT="perftest-bw-$TOOL-$SZ"

          # Clean both VMs before starting server
          {{ vm1_run }} '{{ kill_perftest }}'
          {{ vm2_run }} '{{ kill_perftest }}'
          sleep 2

          {{ vm1_run }} "
            sudo systemctl stop $UNIT 2>/dev/null;
            sudo systemctl reset-failed $UNIT 2>/dev/null;
            sudo systemd-run --quiet --unit=$UNIT \
              bash -c '$TOOL -d $DEV -x 1 -s $SZ -n $N \
                --report_gbits \
                >/tmp/${UNIT}.log 2>&1';
            sleep 1
          "

          sleep 3

          RAW=$({{ vm2_run }} "
            timeout {{ perftest_timeout }} \
              $TOOL -d $DEV -x 1 -s $SZ -n $N \
              --report_gbits $SERVER_IP 2>&1
          ")
          RC=$?

          # What the client printed says why it failed.  The server's
          # log is written when it exits, so it's empty if the server
          # is still waiting for a client that never connected.
          if [ $RC -ne 0 ]; then
            echo "{{ item.0.label }},$SZ,FAIL,FAIL,FAIL" \
              >> "{{ bw_csv }}"
            echo "FAIL rc=$RC"
            echo "--- client output (VM2) ---"
            printf '%s\n' "${RAW:-(none)}" | tail -n 40
            echo "--- server log (VM1) ---"
            {{ vm1_run }} "sudo tail -n 40 /tmp/${UNIT}.log"
            exit 0
          fi

          LINE=$(echo "$RAW" | grep -E '^\s+[0-9]' | tail -1)
          if [ -z "$LINE" ]; then
            echo "{{ item.0.label }},$SZ,NODATA,NODATA,NODATA" \
              >> "{{ bw_csv }}"
            echo "NODATA"
            echo "--- client output (VM2) ---"
            printf '%s\n' "${RAW:-(none)}" | tail -n 40
            exit 0
          fi

          PEAK=$(echo "$LINE" | awk '{print $3}')
          AVG=$(echo "$LINE"  | awk '{print $4}')
          MPP=$(echo "$LINE"  | awk '{print $5}')

          # Convert Gb/s to GB/s (divide by 8)
          PEAK_GB=$(echo "scale=2; $PEAK / 8" | bc -l 2>/dev/null || echo "$PEAK")
          AVG_GB=$(echo "scale=2; $AVG / 8" | bc -l 2>/dev/null || echo "$AVG")

          echo "{{ item.0.label }},$SZ,$PEAK_GB,$AVG_GB,$MPP" \
            >> "{{ bw_csv }}"
          echo "{{ item.0.label }} $SZ: peak=${PEAK_GB} avg=${AVG_GB} GB/s"
      register: bw_result
      changed_when: false
      failed_when: false
      loop: >-
        {{ bw_verbs | product(sweep_sizes) | list }}
      loop_control:
        label: "{{ item.0.label }} @ {{ item.1 }}"

    - name: Display bandwidth sweep results
      ansible.builtin.debug:
        msg: "{{ item.stdout_lines | default(['(no output)']) }}"
      loop: "{{ bw_result.results }}"
      loop_control:
        label: "{{ item.item.0.label }} @ {{ item.item.1 }}"
      when: item.stdout is defined

    - name: Assert BW sweep had no failures
      ansible.builtin.assert:
        that:
          - bw_result.results | selectattr('rc', 'ne', 0) | list | length == 0
        fail_msg: >-
          BW sweep had failures. Aborting.

    # ─────────────────────────────────────────────────
    # Latency sweep
    # ─────────────────────────────────────────────────
    - name: "Lat sweep: {{ item.0.label ~ ' @ ' ~ item.1 ~ ' B' }}"
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -o pipefail
          exec 2>&1
          TOOL="{{ item.0.tool }}"
          DEV="{{ rdma_dev }}"
          SZ="{{ item.1 }}"
          N="{{ lat_iters }}"
          SERVER_IP="{{ vm1_ip }}"
          UNIT="perftest-lat-$TOOL-$SZ"

          # Clean both VMs before starting server
          {{ vm1_run }} '{{ kill_perftest }}'
          {{ vm2_run }} '{{ kill_perftest }}'
          sleep 2

          {{ vm1_run }} "
            sudo systemctl stop $UNIT 2>/dev/null;
            sudo systemctl reset-failed $UNIT 2>/dev/null;
            sudo systemd-run --quiet --unit=$UNIT \
              bash -c '$TOOL -d $DEV -x 1 -s $SZ -n $N \
                >/tmp/${UNIT}.log 2>&1';
            sleep 1
          "

          sleep 3

          RAW=$({{ vm2_run }} "
            timeout {{ perftest_timeout }} \
              $TOOL -d $DEV -x 1 -s $SZ -n $N \
              $SERVER_IP 2>&1
          ")
          RC=$?

          if [ $RC -ne 0 ]; then
            echo "{{ item.0.label }},$SZ,FAIL,FAIL,FAIL" \
              >> "{{ lat_csv }}"
            echo "FAIL rc=$RC"
            echo "--- client output (VM2) ---"
            printf '%s\n' "${RAW:-(none)}" | tail -n 40
            echo "--- server log (VM1) ---"
            {{ vm1_run }} "sudo tail -n 40 /tmp/${UNIT}.log"
            exit 0
          fi

          LINE=$(echo "$RAW" | grep -E '^\s+[0-9]' | tail -1)
          if [ -z "$LINE" ]; then
            echo "{{ item.0.label }},$SZ,NODATA,NODATA,NODATA" \
              >> "{{ lat_csv }}"
            echo "NODATA"
            echo "--- client output (VM2) ---"
            printf '%s\n' "${RAW:-(none)}" | tail -n 40
            exit 0
          fi

          # perftest column order is
          #   bytes iters t_min t_max t_typical t_avg t_stdev 99% 99.9%
          # so the minimum is $3 and the maximum is $4.  Reading $4/$5/$6
          # as min/typical/max put t_max in the lat_min_us column and
          # t_avg in lat_max_us, which is why every published row had a
          # "minimum" larger than its "typical".
          TMIN=$(echo "$LINE"  | awk '{print $3}')
          TMAX=$(echo "$LINE"  | awk '{print $4}')
          TTYP=$(echo "$LINE"  | awk '{print $5}')

          echo "{{ item.0.label }},$SZ,$TMIN,$TTYP,$TMAX" \
            >> "{{ lat_csv }}"
          echo "{{ item.0.label }} $SZ: min=${TMIN} typ=${TTYP} max=${TMAX} us"
      register: lat_result
      changed_when: false
      failed_when: false
      loop: >-
        {{ lat_verbs | product(sweep_sizes) | list }}
      loop_control:
        label: "{{ item.0.label }} @ {{ item.1 }}"

    - name: Display latency sweep results
      ansible.builtin.debug:
        msg: "{{ item.stdout_lines | default(['(no output)']) }}"
      loop: "{{ lat_result.results }}"
      loop_control:
        label: "{{ item.item.0.label }} @ {{ item.item.1 }}"
      when: item.stdout is defined

    - name: Assert lat sweep had no failures
      ansible.builtin.assert:
        that:
          - lat_result.results | selectattr('rc', 'ne', 0) | list | length == 0
        fail_msg: >-
          Latency sweep had failures. Aborting.

    # ─────────────────────────────────────────────────
    # Reliability tests (multiple runs at fixed size)
    # ─────────────────────────────────────────────────
    - name: "Reliability: {{ item.0.label ~ ' run ' ~ item.1 }}"
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -o pipefail
          exec 2>&1
          TOOL="{{ item.0.tool }}"
          DEV="{{ rdma_dev }}"
          SZ="{{ rel_size }}"
          N="{{ rel_iters }}"
          SERVER_IP="{{ vm1_ip }}"
          RUN="{{ item.1 }}"
          UNIT="perftest-rel-$TOOL-run$RUN"

          # Clean both VMs before starting server
          {{ vm1_run }} '{{ kill_perftest }}'
          {{ vm2_run }} '{{ kill_perftest }}'
          sleep 2

          {{ vm1_run }} "
            sudo systemctl stop $UNIT 2>/dev/null;
            sudo systemctl reset-failed $UNIT 2>/dev/null;
            sudo systemd-run --quiet --unit=$UNIT \
              bash -c '$TOOL -d $DEV -x 1 -s $SZ -n $N \
                --report_gbits \
                >/tmp/${UNIT}.log 2>&1';
            sleep 1
          "

          sleep 3

          RAW=$({{ vm2_run }} "
            timeout {{ perftest_timeout }} \
              $TOOL -d $DEV -x 1 -s $SZ -n $N \
              --report_gbits $SERVER_IP 2>&1
          ")
          RC=$?

          if [ $RC -ne 0 ]; then
            echo "{{ item.0.label }},$RUN,$SZ,FAIL,FAIL,FAIL" \
              >> "{{ rel_csv }}"
            echo "FAIL rc=$RC"
            echo "--- client output (VM2) ---"
            printf '%s\n' "${RAW:-(none)}" | tail -n 40
            echo "--- server log (VM1) ---"
            {{ vm1_run }} "sudo tail -n 40 /tmp/${UNIT}.log"
            exit 0
          fi

          LINE=$(echo "$RAW" | grep -E '^\s+[0-9]' | tail -1)
          if [ -z "$LINE" ]; then
            echo "{{ item.0.label }},$RUN,$SZ,NODATA,NODATA,NODATA" \
              >> "{{ rel_csv }}"
            echo "NODATA"
            echo "--- client output (VM2) ---"
            printf '%s\n' "${RAW:-(none)}" | tail -n 40
            exit 0
          fi

          PEAK=$(echo "$LINE" | awk '{print $3}')
          AVG=$(echo "$LINE"  | awk '{print $4}')
          MPP=$(echo "$LINE"  | awk '{print $5}')

          PEAK_GB=$(echo "scale=2; $PEAK / 8" | bc -l 2>/dev/null || echo "$PEAK")
          AVG_GB=$(echo "scale=2; $AVG / 8" | bc -l 2>/dev/null || echo "$AVG")

          echo "{{ item.0.label }},$RUN,$SZ,$PEAK_GB,$AVG_GB,$MPP" \
            >> "{{ rel_csv }}"
          echo "{{ item.0.label }} run$RUN: peak=${PEAK_GB} avg=${AVG_GB} GB/s"
      register: rel_result
      changed_when: false
      failed_when: false
      loop: >-
        {{ bw_verbs | product(range(1, rel_runs | int + 1))
           | list }}
      loop_control:
        label: "{{ item.0.label }} run {{ item.1 }}"

    - name: Display reliability sweep results
      ansible.builtin.debug:
        msg: "{{ item.stdout_lines | default(['(no output)']) }}"
      loop: "{{ rel_result.results }}"
      loop_control:
        label: "{{ item.item.0.label }} run {{ item.item.1 }}"
      when: item.stdout is defined

    - name: Assert reliability sweep had no failures
      ansible.builtin.assert:
        that:
          - rel_result.results | selectattr('rc', 'ne', 0) | list | length == 0
        fail_msg: >-
          Reliability sweep had failures. Aborting.

    # ─────────────────────────────────────────────────
    # ibv_rc_pingpong reliability
    # ─────────────────────────────────────────────────
    - name: "Pingpong: run {{ item }}"
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -o pipefail
          exec 2>&1
          DEV="{{ rdma_dev }}"
          N="{{ pp_iters }}"
          SZ="{{ pp_size }}"
          SERVER_IP="{{ vm1_ip }}"
          UNIT="perftest-pp-run{{ item }}"

          # Clean both VMs before starting server
          {{ vm1_run }} '{{ kill_perftest }}'
          {{ vm2_run }} '{{ kill_perftest }}'
          sleep 2

          {{ vm1_run }} "
            sudo systemctl stop $UNIT 2>/dev/null;
            sudo systemctl reset-failed $UNIT 2>/dev/null;
            sudo systemd-run --quiet --unit=$UNIT \
              bash -c 'ibv_rc_pingpong -d $DEV -g 1 \
                -n $N -s $SZ \
                >/tmp/${UNIT}.log 2>&1';
            sleep 1
          "

          sleep 3

          RAW=$({{ vm2_run }} "
            timeout {{ perftest_timeout }} \
              ibv_rc_pingpong -d $DEV -g 1 \
              -n $N -s $SZ $SERVER_IP 2>&1
          ")
          RC=$?

          if [ $RC -ne 0 ]; then
            echo "pingpong,{{ item }},{{ pp_size }},FAIL,FAIL" \
              >> "{{ rel_csv }}"
            echo "FAIL rc=$RC"
            echo "--- client output (VM2) ---"
            printf '%s\n' "${RAW:-(none)}" | tail -n 40
            echo "--- server log (VM1) ---"
            {{ vm1_run }} "sudo tail -n 40 /tmp/${UNIT}.log"
            exit 0
          fi

          BPS=$(echo "$RAW" | grep -oP '[\d.]+\s+Mbit' \
                | awk '{print $1}')
          BYTES=$(echo "$RAW" | grep -oP '[\d]+\s+bytes' \
                  | head -1 | awk '{print $1}')
          ITERS=$(echo "$RAW" | grep -oP '[\d]+\s+iters' \
                  | awk '{print $1}')

          if [ -n "$BPS" ] && [ -n "$ITERS" ] && \
             [ "$ITERS" -gt 0 ] 2>/dev/null; then
            TOTAL_BITS=$(echo "$BYTES * 8 * 2" | bc 2>/dev/null)
            TOTAL_US=$(echo "scale=2; $TOTAL_BITS / ($BPS)" \
                       | bc -l 2>/dev/null)
            US_ITER=$(echo "scale=2; $TOTAL_US / $ITERS" \
                      | bc -l 2>/dev/null || echo "N/A")
          else
            US_ITER="N/A"
          fi

          echo "pingpong,{{ item }},$SZ,$BPS,$US_ITER" \
            >> "{{ rel_csv }}"
          echo "pingpong run{{ item }}: ${BPS} Mbit/s"
      register: pp_result
      changed_when: false
      failed_when: false
      loop: "{{ range(1, rel_runs | int + 1) | list }}"
      loop_control:
        label: "run {{ item }}"

    - name: Display pingpong results
      ansible.builtin.debug:
        msg: "{{ item.stdout_lines | default(['(no output)']) }}"
      loop: "{{ pp_result.results }}"
      loop_control:
        label: "run {{ item.item }}"
      when: item.stdout is defined

    - name: Assert pingpong had no failures
      ansible.builtin.assert:
        that:
          - pp_result.results | selectattr('rc', 'ne', 0) | list | length == 0
        fail_msg: >-
          Pingpong tests had failures. Aborting.

    # The last commands on the guests.  .cache/run-on-guest is
    # GUEST_DIR in run-on-guest.sh, which leaves a directory there for
    # each command it ran.  A play stopped before here leaves them, a
    # few hundred empty directories, and leaves its connections to
    # close themselves after ControlPersist.
    - name: Close the ssh connections to the guests
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          {{ vm1_ssh }} 'rm -rf .cache/run-on-guest'
          {{ vm2_ssh }} 'rm -rf .cache/run-on-guest'
          {{ vm1_ssh }} -O exit 2>/dev/null
          {{ vm2_ssh }} -O exit 2>/dev/null
          true
      changed_when: false

    - name: Remove the directory for the ssh connection sockets
      ansible.builtin.file:
        path: "{{ ssh_mux_dir.path }}"
        state: absent

    # ─────────────────────────────────────────────────
    # Summary
    # ─────────────────────────────────────────────────
    - name: Count failures
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: >-
          set -o pipefail;
          { grep -c 'FAIL\|NODATA'
          "{{ bw_csv }}" "{{ lat_csv }}" "{{ rel_csv }}"
          2>/dev/null || true; }
          | awk -F: '{s+=$2} END {print s+0}'
      register: fail_count
      changed_when: false

    - name: Performance sweep summary
      ansible.builtin.debug:
        msg:
          - "=== Performance Sweep Complete ==="
          - "Bandwidth CSV:    {{ bw_csv }}"
          - "Latency CSV:      {{ lat_csv }}"
          - "Reliability CSV:  {{ rel_csv }}"
          - "BW data points:   {{ bw_verbs | length * sweep_sizes | length }}"
          - "Lat data points:  {{ lat_verbs | length * sweep_sizes | length }}"
          - "Reliability runs: {{ bw_verbs | length * (rel_runs | int) + (rel_runs | int) }}"
          - "Failures:         {{ fail_count.stdout | default('0') }}"

    # `column` is not in every image these plays run in -- the CI
    # container has no bsdmainutils -- and this is a pretty-printer.
    # Falling back to the raw CSV keeps a formatting gap from failing
    # a job that has already measured everything it was asked to.
    - name: Display bandwidth CSV
      ansible.builtin.shell:
        cmd: "column -t -s, {{ bw_csv }} 2>/dev/null || cat {{ bw_csv }}"
      register: bw_table
      changed_when: false

    - name: Bandwidth results table
      ansible.builtin.debug:
        msg: "{{ bw_table.stdout_lines }}"

    - name: Display latency CSV
      ansible.builtin.shell:
        cmd: "column -t -s, {{ lat_csv }} 2>/dev/null || cat {{ lat_csv }}"
      register: lat_table
      changed_when: false

    - name: Latency results table
      ansible.builtin.debug:
        msg: "{{ lat_table.stdout_lines }}"

    - name: Display reliability CSV
      ansible.builtin.shell:
        cmd: "column -t -s, {{ rel_csv }} 2>/dev/null || cat {{ rel_csv }}"
      register: rel_table
      changed_when: false

    - name: Reliability results table
      ansible.builtin.debug:
        msg: "{{ rel_table.stdout_lines }}"

    - name: Assert no test failures
      ansible.builtin.assert:
        that:
          - (fail_count.stdout | default('0') | int) == 0
        fail_msg: >-
          {{ fail_count.stdout }} test(s) failed or
          returned no data. Check the CSV files for
          FAIL/NODATA entries.
