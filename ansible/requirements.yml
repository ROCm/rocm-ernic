#
# Ansible Galaxy collection dependencies for rocm-ernic.
# Install with: ansible-galaxy collection install -r requirements.yml

#
# rocm.ernic is not listed here: the playbooks in this directory
# reach its roles by short name via roles_path in ansible.cfg, so
# they use the source under ansible/roles/.  Consumers outside this
# repo install it from a pinned commit (it is not on Galaxy):
#
#   - name: https://github.com/ROCm/rocm-ernic.git#/ansible/
#     type: git
#     version: <SHA>
#
# community.general >=13.3.0 is what sets the ansible-core >=2.18
# floor in meta/runtime.yml.
---
collections:
  # community.general.modprobe and .make, used by the guest and
  # host roles and by playbooks/nvmeof-tests.yml.
  - name: community.general
    version: ">=13.3.0"
