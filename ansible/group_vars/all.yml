#
# Site configuration for the rocm-ernic Ansible automation.
# Override any value with -e on the command line, e.g.:
#   ansible-playbook site.yml -e ernic_instances=4
#
# Values that are pure role defaults (ernic_bin, ernic_log_dir,
# ernic_nic_name, ernic_rdma_core_version, the debug switches,
# ...) are not repeated here.  They live in the roles of the
# sbates130272.rocm_ernic collection under ansible/roles/;
# see each role's defaults/main.yml.  Anything set in this file
# is loaded as a play var and so wins over the role default.

---
# ── Project paths ────────────────────────────────
ernic_project_root: "{{ playbook_dir }}/../.."

# ── Device ───────────────────────────────────────
# The server presents 1dd8:100a and the guest drives it with
# patched upstream ionic.ko / ionic_rdma.ko.  Guest Ethernet
# leaves through a host TAP on ernic_tap_bridge.

# ── Service / env-file settings ──────────────────
ernic_run_dir: /run/rocm-ernic
ernic_instances: 2

# ── Guest image ──────────────────────────────────
# The guest disk is a published OCI artifact from
# batesste-ci-images, flavour `ionic`.  It is not built here:
# that flavour pins mainline kernel 7.2.3 (nothing older can
# carry drivers/infiniband/hw/ionic, merged for 6.18, and
# nothing below 7.2 can build ionic-ernic, which calls
# ib_umem_get_va), and bakes the RDMA userspace, the DKMS
# toolchain and perftest on a resolute userspace.
#
# scripts/fetch-guest-image.sh and ci/jobs/vm-up.sh pull it.
# Keep the tag equal to GUEST_ARTIFACT_TAG in
# .github/workflows/system-tests.yml so all lanes test one guest.
ernic_vm_artifact_repo: >-
  docker.io/sbates130272/batesste-ci-images-ubuntu-qcow2-gen-ionic
ernic_vm_artifact_tag: 20260916.g2cc8e79-vm.resolute-ionic-qm.5d68689-qcow2
ernic_vm_artifact_info_type: application/vnd.batesste.vm-info.v1
# Tag-scoped, so bumping the tag cannot silently reuse the old disk.
ernic_vm_artifact_dir: >-
  {{ ernic_vm_image_dir }}/artifacts/{{ ernic_vm_artifact_tag }}
ernic_vm_artifact_disk: batesste-ci-vm.qcow2
# Also an ernic_guest_setup role default, where driver_ionic.yml
# gates the same check against the running guest.
ernic_ionic_min_kernel: "6.18"
# The image bakes the whole build toolchain, so this exists for
# one package: iperf3, which packages/ionic.txt does not list and
# tcp-performance-tests.yml measures with.
ernic_guest_build_deps: true

# ── QEMU / VM defaults ──────────────────────────
ernic_qemu_minimal: "{{ ansible_env.HOME }}/Projects/qemu-minimal"
ernic_qemu_path: /opt/qemu-10.2.2-pci-mmio-bridge-submit/bin/
ernic_vm_image_dir: /opt/qemu-images
ernic_vm_name_base: rocm-ernic-ionic-vm
ernic_vm_vcpus: 16
ernic_vm_mem: 32768
# The account the artifact bakes.
ernic_vm_ssh_user: batesste
ernic_vm_ssh_host: local-vm
# Optional: ssh/scp -F path so sudo ernicctl resolves Host aliases
# (e.g. /home/youruser/.ssh/config).  Root's /root/.ssh is not used by
# ernicctl for VM ssh; use this path or ERNIC_VM_SSH_IDENTITY in env.
ernic_vm_ssh_config: "{{ ansible_env.HOME }}/.ssh/config"
# Private key on the target host for ERNIC_VM_SSH_IDENTITY (ernicctl VM_LOAD
# SSH fallback, guest_ssh, etc.).  Omit it entirely in inventory to skip the
# line in ``rocm-ernic.env`` and let ernicctl pick the first readable key
# under SUDO_USER's ``.ssh`` (id_rsa, id_ed25519, id_ecdsa).
ernic_vm_ssh_identity: "{{ ernic_vm_artifact_dir }}/id_rsa"

# The key the GUEST trusts, used for Ansible's own connection and for
# the bare-ssh gates.  Distinct from ernic_vm_ssh_identity above, which
# is the host-side key ernicctl writes into rocm-ernic.env.  Empty
# means "whatever ssh and ANSIBLE_PRIVATE_KEY_FILE already resolve",
# which is how the hosted jobs supply it.
#
# Gated on the key being on disk.  An inventory
# ansible_ssh_private_key_file outranks the env var, so a path that
# only *would* exist after a fetch is worse than no path at all:
# .github/workflows/system-tests.yml exports ANSIBLE_PRIVATE_KEY_FILE
# and calls ci-site.yml, and would have had its own key taken away and
# replaced by an /opt/qemu-images path that does not exist on a hosted
# runner.  The test re-evaluates per reference, so the key starts being
# used as soon as the image has been fetched.
#
# Defined without ansible_env on purpose: vm-register.yml is
# gather_facts: false, where a fact-based value silently evaluates to
# nothing.
ernic_guest_ssh_identity: >-
  {{ ernic_vm_artifact_dir ~ '/id_rsa'
     if ((ernic_vm_artifact_dir ~ '/id_rsa') is exists)
     else '' }}
# The same key as ssh(1) flags, for the test plays that build their own
# ssh command line rather than going through an inventory host.  Empty
# when there is no key, so those plays fall back to the agent and to
# ~/.ssh defaults.
ernic_guest_ssh_id_opts: >-
  {{ '-i ' ~ ernic_guest_ssh_identity ~ ' -o IdentitiesOnly=yes'
     if (ernic_guest_ssh_identity | default('') | trim) else '' }}
ernic_vm_ssh_base_port: 2250

# Backing qcow2 for per-VM overlays.  Each VM gets its own
# overlay; BACKING_SHARED=true is set automatically by
# ernicctl vm-launch, so several VMs share one read-only base.
#
# Deliberately not derived from ernic_vm_name_base: where the disk
# comes from and what the guests are called are separate things,
# and conflating them meant a -e ernic_vm_name_base from a CI job
# silently repointed the image as well.
ernic_vm_backing: >-
  {{ ernic_vm_artifact_dir }}/{{ ernic_vm_artifact_disk }}
# ernic_vm_mcast_group: "230.0.0.1:1234"
# ernic_mac_overrides:
#   1: "aa:bb:cc:dd:ee:01"
#   2: "aa:bb:cc:dd:ee:02"

# ── Guest NIC configuration ─────────────────────
# The NIC name itself is an ernic_guest_setup role default.
ernic_nic_subnet: "192.168.200"
# iperf3 rate limit and duration.  Bandwidth is passed to iperf3 -b verbatim
# (e.g. 100M, 1G); see iperf3(1) for accepted forms.  "0" means unlimited,
# which is the only setting a throughput measurement can use: a cap here is
# indistinguishable in the results from the link running that slowly.
ernic_iperf_bandwidth: "0"
ernic_iperf_duration: 60

# ── NVMe-oF test defaults ────────────────────────
# These describe the in-process NVMe over Fabrics controller
# the nvmeof backend runs, and must match the --backend
# options the instance was started with.  The address
# deliberately sits on ernic_nic_subnet, which is where the
# guest NIC is addressed from.
ernic_nvmeof_traddr: "{{ ernic_nic_subnet }}.1"
ernic_nvmeof_trsvcid: 4420
ernic_nvmeof_nqn: "nvmet-test"
ernic_nvmeof_nsid: 1
# Nothing answers ARP for the controller, so the guest seeds a
# permanent neighbour entry.  The value is arbitrary: the
# emulator routes the connection by queue pair, not by MAC.
ernic_nvmeof_lladdr: "02:00:00:00:c0:01"
# The controller's queue ceiling: the queues= key of the same
# --backend string, which the play cannot see and so has to be
# told.  Eight is NVMEOF_DEFAULT_QUEUES, what the server uses when
# the key is absent.  The connect aims at this rather than letting
# nvme-rdma default nr_io_queues to num_online_cpus(), which would
# make the test cover whatever the guest was sized at -- four on
# the hosted runner, never the eight the controller advertises, so
# never the memory-region budget that eight needs.
ernic_nvmeof_queues: 8
# Written and read back through O_DIRECT, then compared by
# digest.  Keep it well under the namespace size.
ernic_nvmeof_verify_mb: 16
ernic_nvmeof_fio: true
ernic_nvmeof_fio_size: "32M"
ernic_nvmeof_fio_runtime: 20

# The block-size sweep behind the NVMe-oF trend chart and the
# README IOPS shield.  Off by default: it costs three more fio
# runs and only the nightly has a use for the numbers.  Set
# ernic_nvmeof_perf_csv to a path on the controller to turn it
# on -- the play writes one bandwidth CSV there, in the schema
# ci/report/gen-report.py already dispatches on.
#
# The sizes are not free-form: they must stay equal to
# TRACKED_SIZES in ci/report/publish-perf.py, or the chart
# silently drops a series.
ernic_nvmeof_perf_csv: ""
ernic_nvmeof_perf_sweep:
  - {bs: "4k", bytes: 4096}
  - {bs: "64k", bytes: 65536}
  - {bs: "1M", bytes: 1048576}
ernic_nvmeof_perf_size: "64M"
ernic_nvmeof_perf_runtime: 10
ernic_nvmeof_perf_iodepth: 32

# ── S3-over-RDMA test defaults ───────────────────
# These describe the in-process object store the s3 backend
# runs, and must match the --backend options the instance was
# started with.  Unlike the NVMe-oF controller the endpoint is
# a real IP host on the segment -- the emulator answers ARP and
# ICMP for it -- so no neighbour entry has to be seeded.
ernic_s3_addr: "{{ ernic_nic_subnet }}.1"
ernic_s3_port: 9000
ernic_s3_bucket: "ernic"
# The buffer the client registers and mints its token over.
# Half is the PUT source and half the GET destination, so it
# has to be at least twice the largest size in the sweep.
ernic_s3_buffer: 8388608

# The size sweep behind the S3 trend chart and the README
# bandwidth shield.  Off by default: it costs one more guest
# run and only the nightly has a use for the numbers.  Set
# ernic_s3_perf_csv to a path on the controller to turn it on
# -- the client writes the bandwidth CSV in the guest and the
# play fetches it, in the schema ci/report/gen-report.py
# already dispatches on.
#
# The client's own sizes are 4K, 64K and 1M, which must stay
# equal to TRACKED_SIZES in ci/report/publish-perf.py or the
# chart silently drops a series.
ernic_s3_perf_csv: ""
ernic_s3_perf_iters: 20

# ── Performance sweep defaults ───────────────────
ernic_perf_bw_iters: 1000
ernic_perf_lat_iters: 50
ernic_perf_reliability_iters: 100
ernic_perf_reliability_runs: 1
ernic_perf_reliability_size: 65536
ernic_perf_pingpong_iters: 1
ernic_perf_pingpong_size: 4096

# ── GPU passthrough (vfio-pci) ──────────────────
# Off: the pinned image is flavour "ionic" and ships no ROCm, so
# the rocm-xio tasks in ernic_guest_setup have nothing to drive.
# A GPU rig wants a GPU-flavoured guest image; the host-side
# vfio-pci binding in ernic_host_setup is what this gates.
# Requires IOMMU enabled and GPUs unbound from amdgpu on the host.
ernic_gpu_passthrough: false
ernic_pci_mmio_bridge: true
ernic_gpu_pci_devices:
  1: "0000:4a:00.0"
  2: "0000:0f:00.0"

# ── rocm-xio ───────────────────────────────────
ernic_rocm_xio_repo: "git@github.com:ROCm/rocm-xio.git"
ernic_rocm_xio_branch: "main"
# Pin to a specific commit SHA for reproducibility.
# Leave empty to use the branch tip.
ernic_rocm_xio_commit: ""

# ── Feature gates ────────────────────────────────
ernic_build: true
# ernic_debug_mesh / ernic_debug_dma_map are ernic_host_setup
# role defaults (mesh diagnostics on, pci_dma_map logging off).
ernic_tests: true
