#
# Default variables for the rocm-ernic Ansible automation.
# Override any value with -e on the command line, e.g.:
#   ansible-playbook site.yml -e ernic_instances=4

---
# ── Project paths ────────────────────────────────
ernic_project_root: "{{ playbook_dir }}/../.."
ernic_build_dir: "{{ ernic_project_root }}/build"
ernic_build_type: Release

# ── Service / env-file settings ──────────────────
ernic_bin: /usr/local/bin/rocm-ernic
ernic_run_dir: /run/rocm-ernic
ernic_log_dir: /var/log/rocm-ernic
ernic_instances: 2
ernic_tcp_port: 6320
ernic_manager_ip: 127.0.0.1
ernic_verbose: "false"

# ── Driver distribution ─────────────────────────
ernic_driver_source: /usr/share/rocm-ernic/driver
ernic_driver_tarball: /tmp/rocm-ernic-driver.tar.gz

# ── QEMU / VM defaults ──────────────────────────
ernic_qemu_minimal: "{{ ansible_env.HOME }}/Projects/qemu-minimal"
ernic_qemu_path: /opt/qemu-10.2.2-pci-mmio-bridge-submit/bin/
ernic_vm_image_dir: /opt/qemu-images
ernic_vm_name_base: rocm-ernic-april-15-vm
ernic_vm_vcpus: 16
ernic_vm_mem: 32768
ernic_vm_ssh_user: ubuntu
ernic_vm_ssh_pass: password
ernic_vm_ssh_key_file: "{{ ansible_env.HOME }}/.ssh/id_rsa.pub"
ernic_vm_ssh_base_port: 2250
ernic_golden_ssh_port: 2249
ernic_vm_release: noble
ernic_vm_packages: "{{ ernic_project_root }}/ansible/templates/packages-ernic"

# Golden backing qcow2 for per-VM overlays.
# Each VM gets its own overlay; BACKING_SHARED=true
# is set automatically by ernicctl vm-launch.
ernic_vm_backing: "{{ ernic_vm_image_dir }}/backing/{{ ernic_vm_name_base }}-backing.qcow2"
# ernic_vm_mcast_group: "230.0.0.1:1234"
# ernic_mac_overrides:
#   1: "aa:bb:cc:dd:ee:01"
#   2: "aa:bb:cc:dd:ee:02"

# ── rdma-core provider build ────────────────────
ernic_rdma_core_version: "62.0"

# ── Guest NIC configuration ─────────────────────
ernic_nic_name: rocm-ernic0
ernic_nic_subnet: "192.168.200"
# iperf3 rate limit and duration.
# Bandwidth uses human-readable format:
#   100B/s, 1KiB/s, 10MiB/s, 1GiB/s
# Stripped to iperf3 -b compatible form at runtime.
ernic_iperf_bandwidth: "1GiB/s"
ernic_iperf_duration: 30

# ── Performance sweep defaults ───────────────────
ernic_perf_bw_iters: 100
ernic_perf_lat_iters: 50
ernic_perf_reliability_iters: 100
ernic_perf_reliability_runs: 5
ernic_perf_reliability_size: 65536
ernic_perf_pingpong_iters: 100
ernic_perf_pingpong_size: 4096

# ── Stress-test defaults ─────────────────────────
ernic_stress_multi_qp_counts:
  - 2
  - 4
  - 8
ernic_stress_bidir_sizes:
  - 65536
  - 262144
  - 1048576
ernic_stress_soak_duration: 300
ernic_stress_high_iters: 10000
ernic_stress_qp_churn_cycles: 50
ernic_stress_concurrent_duration: 60

# ── GPU passthrough (vfio-pci) ──────────────────
# Pass a real AMD GPU into each VM via vfio-pci.
# Requires IOMMU enabled and GPUs unbound from
# amdgpu on the host (handled by host-setup.yml).
ernic_gpu_passthrough: true
ernic_pci_mmio_bridge: true
ernic_gpu_pci_devices:
  1: "0000:4a:00.0"
  2: "0000:0f:00.0"

# ── rocm-xio ───────────────────────────────────
ernic_rocm_xio_repo: "git@github.com:ROCm/rocm-xio.git"
ernic_rocm_xio_branch: "main"
# Pin to a specific commit SHA for reproducibility.
# Leave empty to use the branch tip.
ernic_rocm_xio_commit: ""

# ── Perftest fork (GPU-initiated via rocm-xio) ──
# Fork of linux-rdma/perftest with --use_rocm_xio
# support for GPU-initiated WQE posting.
# Source is copied from the host to avoid needing
# GitHub access inside VMs.
ernic_perftest_source: "{{ lookup('env', 'HOME') }}/Projects/perftest-xio"
ernic_perftest_prefix: "/opt/perftest-xio"

# ── GPU perftest sweep defaults ──────────────────
ernic_gpu_perftest_bw_iters: 100
ernic_gpu_perftest_lat_iters: 50
ernic_gpu_perftest_sizes:
  - 4096
  - 16384
  - 65536
ernic_gpu_perftest_timeout: 180
ernic_gpu_perftest: true

# ── GPU 2-node test defaults ─────────────────────
ernic_gpu_2node_iters: 100
ernic_gpu_2node_sizes:
  - 64
  - 256
  - 1024
  - 4096
  - 8192
  - 16384
ernic_gpu_2node_timeout: 120

# ── Monitoring (ernic-exporter + Grafana) ────────
ernic_monitoring: true
ernic_exporter_port: 9840
ernic_exporter_venv: /opt/ernic-exporter-venv
ernic_exporter_scrape_interval: 5s
ernic_prometheus_config_dir: /etc/prometheus/file_sd
ernic_grafana_dashboard_dir: /var/lib/grafana/dashboards
ernic_node_exporter_base_port: 9150
ernic_rdma_exporter_base_port: 9160

# ── Feature gates ────────────────────────────────
ernic_build: true
ernic_golden_image: true
ernic_tests: true
ernic_gpu_tests: true
ernic_gpu_2node_tests: true
ernic_force_vm_cleanup: false

# ── rdma_setup role overrides ────────────────────
rdma_setup_reboot: false
rdma_setup_motd: true
