#
# Default variables for the rocm-ernic Ansible automation.
# Override any value with -e on the command line, e.g.:
#   ansible-playbook site.yml -e ernic_instances=4

---
# ── Project paths ────────────────────────────────
ernic_project_root: "{{ playbook_dir }}/.."
ernic_build_dir: "{{ ernic_project_root }}/build"
ernic_build_type: Release

# ── Service / env-file settings ──────────────────
ernic_bin: /usr/local/bin/rocm-ernic
ernic_run_dir: /run/rocm-ernic
ernic_log_dir: /var/log/rocm-ernic
ernic_instances: 2
ernic_tcp_port: 6320
ernic_manager_ip: 127.0.0.1
ernic_verbose: "false"

# ── Driver distribution ─────────────────────────
ernic_driver_source: /usr/share/rocm-ernic/driver
ernic_driver_tarball: /tmp/rocm-ernic-driver.tar.gz

# ── QEMU / VM defaults ──────────────────────────
ernic_qemu_minimal: "{{ ansible_env.HOME }}/Projects/qemu-minimal"
ernic_qemu_path: /opt/qemu-10.2.2-pci-mmio-bridge-submit/bin/
ernic_vm_image_dir: "{{ ernic_qemu_minimal }}/images"
ernic_vm_name: ernic-test-vm
ernic_vm_vcpus: 8
ernic_vm_mem: 16384
ernic_vm_ssh_user: ubuntu
ernic_vm_ssh_base_port: 2250
ernic_vm_release: noble

# Optional -- uncomment or pass via -e to enable.
# ernic_vm_backing: /path/to/golden-backing.qcow2
# ernic_vm_mcast_group: "230.0.0.1:1234"
# ernic_mac_overrides:
#   1: "aa:bb:cc:dd:ee:01"
#   2: "aa:bb:cc:dd:ee:02"

# ── rdma-core provider build ────────────────────
ernic_rdma_core_version: "62.0"

# ── Guest NIC configuration ─────────────────────
ernic_nic_name: enp1s0
ernic_nic_subnet: "192.168.200"

# ── Feature gates ────────────────────────────────
ernic_skip_build: false
ernic_skip_golden_image: false
ernic_skip_tests: false

# ── rdma_setup role overrides ────────────────────
rdma_setup_reboot: false
rdma_setup_motd: false
