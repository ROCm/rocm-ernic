#
# Site configuration for the rocm-ernic Ansible automation.
# Override any value with -e on the command line, e.g.:
#   ansible-playbook site.yml -e ernic_instances=4
#
# Values that are pure role defaults (ernic_bin, ernic_log_dir,
# ernic_nic_name, ernic_rdma_core_version, the debug switches,
# ...) are not repeated here.  They live in the roles of the
# sbates130272.rocm_ernic collection under ansible/roles/;
# see each role's defaults/main.yml.  Anything set in this file
# is loaded as a play var and so wins over the role default.

---
# ── Project paths ────────────────────────────────
ernic_project_root: "{{ playbook_dir }}/../.."

# ── Device ───────────────────────────────────────
# The server presents 1dd8:100a and the guest drives it with
# patched upstream ionic.ko / ionic_rdma.ko.  Guest Ethernet
# leaves through a host TAP on ernic_tap_bridge.

# ── Service / env-file settings ──────────────────
ernic_run_dir: /run/rocm-ernic
ernic_instances: 2

# ── Prebuilt guest artifact ─────────────────────
# Where the guest disk comes from.  The image is published as an
# OCI artifact and is the same one .github/workflows/system-tests.yml
# pulls, so the VMs launched here are the VMs CI tests.  Keep the tag
# equal to GUEST_ARTIFACT_TAG there; playbooks/vm-fetch.yml asserts
# the image's own metadata agrees with the values below.
#
# Setting this false falls back to building a golden image locally
# with gen-vm (see ernic_golden_image).  That path cannot currently
# produce a guest new enough for the ionic driver: Ubuntu ships no
# stock kernel >= 6.18, so the image needs a mainline one installed
# on top, which is what ernic_image_prep exists to do.
ernic_vm_artifact: true
ernic_vm_artifact_repo: >-
  docker.io/sbates130272/batesste-ci-images-ubuntu-qcow2-gen-ionic
ernic_vm_artifact_tag: 20260914-vm.resolute-ionic-qm.737f735-qcow2
ernic_vm_artifact_info_type: application/vnd.batesste.vm-info.v1
# Tag-scoped, so bumping the tag cannot silently reuse the old disk.
ernic_vm_artifact_dir: >-
  {{ ernic_vm_image_dir }}/artifacts/{{ ernic_vm_artifact_tag }}
ernic_vm_artifact_disk: batesste-ci-vm.qcow2
# drivers/infiniband/hw/ionic was merged for 6.18.  Also an
# ernic_guest_setup role default, where it gates the same check
# against the running guest; vm-fetch.yml needs it a play earlier,
# against the image metadata, and role defaults are not in scope
# there.
ernic_ionic_min_kernel: "6.18"
# The published image is provisioned from a runtime package list and
# carries no dkms/cmake/ninja, which ernic_guest_setup builds with.
# On the golden-image path ernic_image_prep bakes those in instead.
ernic_guest_build_deps: "{{ ernic_vm_artifact | bool }}"

# ── QEMU / VM defaults ──────────────────────────
ernic_qemu_minimal: "{{ ansible_env.HOME }}/Projects/qemu-minimal"
ernic_qemu_path: /opt/qemu-10.2.2-pci-mmio-bridge-submit/bin/
ernic_vm_image_dir: /opt/qemu-images
ernic_vm_name_base: rocm-ernic-ionic-vm
ernic_vm_vcpus: 16
ernic_vm_mem: 32768
# The artifact bakes its own account; gen-vm takes whatever it is told.
ernic_vm_ssh_user: "{{ (ernic_vm_artifact | bool) | ternary('batesste', 'ubuntu') }}"
ernic_vm_ssh_host: local-vm
# Optional: ssh/scp -F path so sudo ernicctl resolves Host aliases
# (e.g. /home/youruser/.ssh/config).  Root's /root/.ssh is not used by
# ernicctl for VM ssh; use this path or ERNIC_VM_SSH_IDENTITY in env.
ernic_vm_ssh_config: "{{ ansible_env.HOME }}/.ssh/config"
# Private key on the target host for ERNIC_VM_SSH_IDENTITY (ernicctl VM_LOAD
# SSH fallback, guest_ssh, etc.). Omit ``ernic_vm_ssh_identity`` entirely in
# inventory to skip this line in ``rocm-ernic.env`` and let ernicctl pick the
# first readable key under SUDO_USER's ``.ssh`` (id_rsa, id_ed25519, id_ecdsa).
ernic_vm_ssh_identity: >-
  {{ (ernic_vm_artifact | bool)
     | ternary(ernic_vm_artifact_dir ~ '/id_rsa',
               lookup('env', 'HOME') ~ '/.ssh/id_rsa') }}
ernic_vm_ssh_pass: "{{ (ernic_vm_artifact | bool) | ternary('changeme', 'password') }}"
# gen-vm's input only: the public half baked into a locally built
# image.  It deliberately does not follow ernic_vm_artifact -- the
# artifact's public key has its private half on a public registry,
# so authorising it in a local image would be a real weakening.
ernic_vm_ssh_key_file: "{{ ansible_env.HOME }}/.ssh/id_rsa.pub"

# The key the GUEST trusts, used for Ansible's own connection and for
# the bare-ssh gates.  Distinct from ernic_vm_ssh_identity above, which
# is the host-side key ernicctl writes into rocm-ernic.env.  Empty
# means "whatever ssh and ANSIBLE_PRIVATE_KEY_FILE already resolve",
# which is how the hosted jobs supply it.
#
# Gated on the key being on disk, not merely on ernic_vm_artifact.  An
# inventory ansible_ssh_private_key_file outranks the env var, so a
# path that only *would* exist after a fetch is worse than no path at
# all: .github/workflows/system-tests.yml exports
# ANSIBLE_PRIVATE_KEY_FILE and calls ci-site.yml without ever setting
# ernic_vm_artifact=false, and would have had its own key taken away
# and replaced by an /opt/qemu-images path that does not exist on a
# hosted runner.  The test re-evaluates per reference, so the key
# starts being used as soon as vm-fetch.yml has pulled it.
#
# Defined without ansible_env on purpose: ci-vm-register.yml is
# gather_facts: false, where a fact-based value silently evaluates to
# nothing.
ernic_guest_ssh_identity: >-
  {{ ernic_vm_artifact_dir ~ '/id_rsa'
     if ((ernic_vm_artifact | bool)
         and ((ernic_vm_artifact_dir ~ '/id_rsa') is exists))
     else '' }}
# The same key as ssh(1) flags, for the test plays that build their own
# ssh command line rather than going through an inventory host.  Empty
# when there is no key, so those plays fall back to the agent and to
# ~/.ssh defaults exactly as they did before.
ernic_guest_ssh_id_opts: >-
  {{ '-i ' ~ ernic_guest_ssh_identity ~ ' -o IdentitiesOnly=yes'
     if (ernic_guest_ssh_identity | default('') | trim) else '' }}
ernic_vm_ssh_base_port: 2250
ernic_golden_ssh_port: 2249
# resolute (26.04), not noble: installing a mainline kernel on noble
# needs two workarounds the collection would otherwise have to carry.
# The mainline linux-image preinst hands run-parts two directories and
# noble's debianutils takes one, so the install dies at "missing
# operand"; and 7.x headers want gcc-15, which noble cannot supply.
# Both are absent on resolute, which is also what the CI guest image
# uses.
ernic_vm_release: resolute
ernic_vm_packages: "{{ ernic_project_root }}/ansible/templates/packages-ernic"
ernic_vm_nvme: 1
ernic_vm_qemu_aio: threads

# Backing qcow2 for per-VM overlays.  Each VM gets its own
# overlay; BACKING_SHARED=true is set automatically by
# ernicctl vm-launch, so several VMs share one read-only base.
#
# Deliberately not derived from ernic_vm_name_base any more: where
# the disk comes from and what the guests are called are separate
# things, and conflating them meant a -e ernic_vm_name_base from a
# CI job silently repointed the image as well.
ernic_vm_backing: >-
  {{ (ernic_vm_artifact | bool)
     | ternary(ernic_vm_artifact_dir ~ '/' ~ ernic_vm_artifact_disk,
               ernic_vm_image_dir ~ '/backing/'
               ~ ernic_vm_name_base ~ '-backing.qcow2') }}
# ernic_vm_mcast_group: "230.0.0.1:1234"
# ernic_mac_overrides:
#   1: "aa:bb:cc:dd:ee:01"
#   2: "aa:bb:cc:dd:ee:02"

# ── Guest NIC configuration ─────────────────────
# The NIC name itself is an ernic_guest_setup role default.
ernic_nic_subnet: "192.168.200"
# iperf3 rate limit and duration.  Bandwidth is passed to iperf3 -b verbatim
# (e.g. 100M, 1G); see iperf3(1) for accepted forms.  "0" means unlimited,
# which is the only setting a throughput measurement can use: a cap here is
# indistinguishable in the results from the link running that slowly.  The
# stress run keeps a cap, because there it is the sustained load profile and
# not the peak rate that is under test.
ernic_iperf_bandwidth: "0"
ernic_iperf_stress_bandwidth: "1G"
ernic_iperf_duration: 60

# ── NVMe-oF test defaults ────────────────────────
# These describe the in-process NVMe over Fabrics controller
# the nvmeof backend runs, and must match the --backend
# options the instance was started with.  The address
# deliberately sits on ernic_nic_subnet, which is where the
# guest NIC is addressed from.
ernic_nvmeof_traddr: "{{ ernic_nic_subnet }}.1"
ernic_nvmeof_trsvcid: 4420
ernic_nvmeof_nqn: "nvmet-test"
ernic_nvmeof_nsid: 1
# Nothing answers ARP for the controller, so the guest seeds a
# permanent neighbour entry.  The value is arbitrary: the
# emulator routes the connection by queue pair, not by MAC.
ernic_nvmeof_lladdr: "02:00:00:00:c0:01"
# Written and read back through O_DIRECT, then compared by
# digest.  Keep it well under the namespace size.
ernic_nvmeof_verify_mb: 16
ernic_nvmeof_fio: true
ernic_nvmeof_fio_size: "32M"
ernic_nvmeof_fio_runtime: 20

# The block-size sweep behind the NVMe-oF trend chart and the
# README IOPS shield.  Off by default: it costs three more fio
# runs and only the nightly has a use for the numbers.  Set
# ernic_nvmeof_perf_csv to a path on the controller to turn it
# on -- the play writes one bandwidth CSV there, in the schema
# ci/report/gen-report.py already dispatches on.
#
# The sizes are not free-form: they must stay equal to
# TRACKED_SIZES in ci/report/publish-perf.py, or the chart
# silently drops a series.
ernic_nvmeof_perf_csv: ""
ernic_nvmeof_perf_sweep:
  - {bs: "4k", bytes: 4096}
  - {bs: "64k", bytes: 65536}
  - {bs: "1M", bytes: 1048576}
ernic_nvmeof_perf_size: "64M"
ernic_nvmeof_perf_runtime: 10
ernic_nvmeof_perf_iodepth: 32

# ── Performance sweep defaults ───────────────────
ernic_perf_bw_iters: 1000
ernic_perf_lat_iters: 50
ernic_perf_reliability_iters: 100
ernic_perf_reliability_runs: 1
ernic_perf_reliability_size: 65536
ernic_perf_pingpong_iters: 1
ernic_perf_pingpong_size: 4096

# ── Stress-test defaults ─────────────────────────
ernic_stress_multi_qp_counts:
  - 2
  - 4
  - 8
ernic_stress_bidir_sizes:
  - 65536
  - 262144
  - 1048576
ernic_stress_soak_duration: 300
ernic_stress_high_iters: 10000
ernic_stress_qp_churn_cycles: 50
ernic_stress_concurrent_duration: 60

# ── GPU passthrough (vfio-pci) ──────────────────
# Pass a real AMD GPU into each VM via vfio-pci.
# Requires IOMMU enabled and GPUs unbound from
# amdgpu on the host (handled by host-setup.yml).
# The pinned artifact is flavour "ionic" and ships no ROCm, so the
# GPU roles have nothing to drive there and vm-fetch.yml refuses the
# combination.  A GPU rig wants a GPU-flavoured image, or
# ernic_vm_artifact=false and a locally built one.
ernic_gpu_passthrough: "{{ not (ernic_vm_artifact | bool) }}"
ernic_pci_mmio_bridge: true
ernic_gpu_pci_devices:
  1: "0000:4a:00.0"
  2: "0000:0f:00.0"

# ── rocm-xio ───────────────────────────────────
ernic_rocm_xio_repo: "git@github.com:ROCm/rocm-xio.git"
ernic_rocm_xio_branch: "main"
# Pin to a specific commit SHA for reproducibility.
# Leave empty to use the branch tip.
ernic_rocm_xio_commit: ""

# ── Perftest fork (GPU-initiated via rocm-xio) ──
# Fork of linux-rdma/perftest with --use_rocm_xio
# support for GPU-initiated WQE posting.
# Source is copied from the host to avoid needing
# GitHub access inside VMs.
ernic_perftest_source: "{{ lookup('env', 'HOME') }}/Projects/perftest-xio"
ernic_perftest_prefix: "/opt/perftest-xio"

# ── GPU perftest sweep defaults ──────────────────
ernic_gpu_perftest_bw_duration: 10
ernic_gpu_perftest_lat_iters: 5000
ernic_gpu_perftest_sizes:
  - 4096
  - 16384
  - 65536
ernic_gpu_perftest_timeout: 180
ernic_gpu_perftest: true

# ── GPU 2-node test defaults ─────────────────────
ernic_gpu_2node_iters: 100
ernic_gpu_2node_sizes:
  - 64
  - 256
  - 1024
  - 4096
  - 8192
  - 16384
ernic_gpu_2node_timeout: 120

# ── Monitoring (ernic-exporter + Grafana) ────────
ernic_monitoring: true
ernic_exporter_port: 9840
ernic_exporter_venv: /opt/ernic-exporter-venv
ernic_exporter_scrape_interval: 5s
ernic_prometheus_config_dir: /etc/prometheus/file_sd
ernic_grafana_dashboard_dir: /var/lib/grafana/dashboards
ernic_node_exporter_base_port: 9150
ernic_rdma_exporter_base_port: 9160
ernic_gpu_exporter_base_port: 9170

# ── Feature gates ────────────────────────────────
ernic_build: true
# ernic_debug_mesh / ernic_debug_dma_map are ernic_host_setup
# role defaults (mesh diagnostics on, pci_dma_map logging off).
# Build a golden image with gen-vm.  Mutually exclusive with
# ernic_vm_artifact: with the artifact in place vm-create.yml would
# skip the build anyway (the disk exists), but stating it means a
# mistyped artifact path fails loudly instead of quietly dropping
# into a root qemu-nbd/chroot build whose output lands somewhere
# ernic_vm_backing no longer names.
ernic_golden_image: "{{ not (ernic_vm_artifact | bool) }}"
ernic_tests: true
ernic_gpu_tests: true
ernic_gpu_2node_tests: true
ernic_force_vm_cleanup: false

# ── rdma_setup role overrides ────────────────────
rdma_setup_reboot: false
rdma_setup_motd: true
