# Ansible configuration for rocm-ernic integration testing.

[defaults]
inventory = inventory/hosts.yml
host_key_checking = false
interpreter_python = auto
timeout = 60
stdout_callback = default
# ./roles holds the sbates130272.rocm_ernic collection source.
# The plays here use those roles by short name so they always
# run against this checkout rather than a Galaxy-installed copy.
# Relative to the cwd, so run ansible-playbook from ansible/.
roles_path = ./roles:~/.ansible/roles

[callback_default]
result_format = yaml

[ssh_connection]
pipelining = true
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o PasswordAuthentication=no
