---
minor_changes:
  - >-
    New role ``ernic_p4_dkms`` builds and loads ``ernic_p4.ko`` in a
    guest, so a program there can reach the emulated NIC's P4 pipeline
    through ``/dev/ernic-p4``.  It fetches the ionic sources at the ref
    pinned in ``cmake/ErnicKernelModule.cmake``, applies both
    ``patches/`` and ``patches/p4``, builds the module out of a
    rocm-ernic checkout on the target, installs it and loads it.
  - >-
    ``ernic_p4_dkms`` refuses a tree without ``IONIC_LIF_CAP_P4`` rather
    than building against it.  Such a tree produces an ``ionic`` that
    creates no ``p4`` auxiliary device, so the module would load and
    silently never probe --- a failure that reads as a broken module
    rather than a missing patch series.
  - >-
    ``ernic_p4_dkms_require_device`` asserts that ``/dev/ernic-p4``
    appeared.  It is off by default: the node exists only when the
    server was started with ``--p4-guest-scope``, and a guest talking to
    a server without one is a correct configuration in which the module
    loads and binds to nothing.
  - >-
    New playbook ``playbooks/p4-dkms-build.yml`` runs that role, against
    ``localhost`` by default as a compile gate.
