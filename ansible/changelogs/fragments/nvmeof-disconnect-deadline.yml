trivial:
  - >-
    ``nvmeof-tests.yml`` gives ``nvme disconnect`` 180 seconds.  One
    that hangs in the guest kernel used to stall the play until the CI
    job's own limit cancelled it, with no record of where; now the play
    fails, printing the stacks of the guest's blocked tasks and the end
    of its kernel log.
