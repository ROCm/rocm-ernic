---
# The collection is not published to Galaxy.  Install it from a
# pinned git SHA; see PLAYBOOKS.md for the ansible-galaxy command.
namespace: rocm
name: ernic
version: 0.3.0
# README.md is the collection's landing page, for its consumers;
# the repo-local guide to this directory is PLAYBOOKS.md.
readme: README.md

authors:
  - Advanced Micro Devices, Inc.

description: >-
  Ansible roles that turn a prepared Ubuntu guest into a
  rocm-ernic RDMA node: the patched upstream ionic kernel modules
  as a DKMS package, rdma-core with its upstream ionic provider,
  emulated NIC addressing and rocm-xio -- plus the host side, TAP
  and bridge networking and the rocm-ernic systemd service.

license:
  - MIT

tags:
  - linux
  - rdma
  - rocm
  - gpu
  - qemu
  - virtualization

# community.general is the sole dependency and the thing that sets
# the ansible-core >=2.18 floor in meta/runtime.yml.
dependencies:
  community.general: ">=13.3.0"

repository: https://github.com/ROCm/rocm-ernic
documentation: https://github.com/ROCm/rocm-ernic/tree/develop/ansible
homepage: https://github.com/ROCm/rocm-ernic
issues: https://github.com/ROCm/rocm-ernic/issues

# This directory is both the collection source and the repo's
# own test automation, so build_ignore -- not a subdirectory --
# is what keeps repo-local files out of the collection artifact.
# Anything new added here ships to consumers unless listed. The
# build job in .github/workflows/ansible-collection.yml asserts
# the artifact contents to catch that.
build_ignore:
  - "*.tar.gz"
  - "roles/*/tests"
  - ansible.cfg
  - .ansible-lint
  # ansible-lint and ansible-galaxy stage collections here, so on
  # any workspace that has linted before building this is a live
  # directory -- gitignored, but build_ignore is a separate list.
  - .ansible
  - changelogs/.plugin-cache.yaml
  - PLAYBOOKS.md
  - requirements.yml
  - site.yml
  - ci-site.yml
  - playbooks
  - group_vars
  - inventory
  # No templates/ exists today; kept as a standing deny so re-adding
  # one does not quietly ship it.
  - templates
  #
  # There is deliberately no "*.sh" here, though there used to be.
  # ansible-galaxy matches these patterns with fnmatch against the path
  # relative to the collection root, and fnmatch translates "*" to ".*",
  # which crosses "/" -- so "*.sh" matches files/scripts/*.sh as readily
  # as a top-level script, and would silently ship a collection with no
  # build scripts in it.  It applies to a "type: git" install, so it
  # would reach every consumer.  There is no way to anchor a pattern at
  # the root, so the denylist cannot express "top level only"; the
  # build job in .github/workflows/ansible-collection.yml asserts the
  # artifact's contents in both directions instead.
