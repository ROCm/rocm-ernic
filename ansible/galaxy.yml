---
namespace: sbates130272
name: rocm_ernic
version: 0.2.0
# The Galaxy importer looks for a file literally named README.md
# in the artifact root and rejects the upload without one -- it
# does not consult this key.  So README.md is the Galaxy landing
# page and the repo-local guide to this directory is PLAYBOOKS.md.
readme: README.md

authors:
  - Stephen Bates <stephen@raithlin.com>

description: >-
  Ansible roles that turn a prepared Ubuntu guest into a
  rocm-ernic RDMA node: the patched upstream ionic kernel modules
  as a DKMS package, rdma-core with its upstream ionic provider,
  emulated NIC addressing and rocm-xio -- plus the host side, TAP
  and bridge networking and the rocm-ernic systemd service.

license:
  - MIT

tags:
  - linux
  - rdma
  - rocm
  - gpu
  - qemu
  - virtualization

# sbates130272.batesste was a dependency through 0.1.0 and is not
# one now: ernic_image_prep was its only consumer, and the golden
# image that role built has been replaced by a published guest
# artifact (batesste-ci-images, flavour "ionic").  Declaring it
# would cost a consumer amazon.aws and community.libvirt for
# nothing.  ansible.posix went the same way with vm-create.yml.
#
# community.general is the sole remaining dependency and the thing
# that sets the ansible-core >=2.18 floor in meta/runtime.yml --
# directly now, rather than inherited through batesste.
dependencies:
  community.general: ">=13.3.0"

repository: https://github.com/ROCm/rocm-ernic
documentation: https://github.com/ROCm/rocm-ernic/tree/main/ansible
homepage: https://github.com/ROCm/rocm-ernic
issues: https://github.com/ROCm/rocm-ernic/issues

# This directory is both the collection source and the repo's
# own test automation, so build_ignore -- not a subdirectory --
# is what keeps repo-local files out of the published artifact.
# Anything new added here ships to Galaxy unless listed. The
# build job in .github/workflows/ansible-collection.yml asserts
# the artifact contents to catch that.
build_ignore:
  - "*.tar.gz"
  - "roles/*/tests"
  - ansible.cfg
  - .ansible-lint
  # ansible-lint and ansible-galaxy stage collections here, so on
  # any workspace that has linted before building this is a live
  # directory -- gitignored, but build_ignore is a separate list.
  - .ansible
  - changelogs/.plugin-cache.yaml
  - PLAYBOOKS.md
  - requirements.yml
  - site.yml
  - ci-site.yml
  - playbooks
  - group_vars
  - inventory
  # No top-level *.sh or templates/ exist today.  Both are kept as
  # standing denies so re-adding one does not quietly publish it.
  - templates
  - "*.sh"
