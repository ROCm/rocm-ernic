#
# DKMS recipe for ernic_p4.ko.
#
# IONIC_SRC has to be set in the environment when dkms builds this, and
# must name a tree scripts/fetch-ionic-sources.sh prepared with BOTH
# patches/ and patches/p4 -- the module uses the ionic driver's private
# headers, which no kernel-headers package ships, and binds to an
# auxiliary device only the second series creates. The Makefile checks
# for both and refuses rather than producing a module that would never
# bind.

PACKAGE_NAME="ernic-p4"
PACKAGE_VERSION="0.2.0"

MAKE[0]="make -C ${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build \
    KDIR=/lib/modules/${kernelver}/build IONIC_SRC=${IONIC_SRC}"
CLEAN="make -C ${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build \
    KDIR=/lib/modules/${kernelver}/build clean"

BUILT_MODULE_NAME[0]="ernic_p4"
DEST_MODULE_LOCATION[0]="/updates/dkms"
AUTOINSTALL="yes"
