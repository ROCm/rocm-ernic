#
# DKMS recipe for ernic_p4.ko.
#
# The module uses the ionic driver's private headers, which no
# kernel-headers package ships, so the build needs a tree that
# scripts/fetch-ionic-sources.sh prepared with BOTH patches/ and
# patches/p4 -- the second is what defines IONIC_LIF_CAP_P4 and creates
# the auxiliary device this binds to. The Makefile checks for both and
# refuses rather than producing a module that could never bind.
#
# Where that tree is cannot come from the environment alone. A dkms build
# run after the role -- by hand, for another kernel -- has none of the
# variables the role set, so a recipe that only read $IONIC_SRC would
# work once and then fail. This file is sourced as shell, so it can fall
# back to a path recorded at install time; the ernic_p4_dkms role writes
# it.

PACKAGE_NAME="ernic-p4"
PACKAGE_VERSION="0.2.0"

IONIC_SRC="${IONIC_SRC:-$(cat /etc/ernic-p4-ionic-src 2>/dev/null)}"

# The ionic this module loads against is itself a DKMS module, and
# patches/p4 changes the CRC of the symbol it calls, so build against
# that ionic's symbols rather than the kernel's.
#
# Resolved for ${kernelver}, not for whatever happens to be on disk: an
# ionic Module.symvers left over from an older kernel carries CRCs that
# no longer match anything -- the same non-insertable module as the
# kernel's own symbols, reached by a longer road. find-ionic-symvers.sh
# handles the staleness; see its header.
#
# The Makefile runs it, not this file. dkms sources this file whenever it
# reads the package's configuration -- dkms status, add, remove, and every
# autoinstall pass, before it has read AUTOINSTALL below -- and the helper
# can rebuild ionic. Nor can MAKE[0] carry an escaped $(...) to defer it:
# dkms writes these variables out and sources them again, expanding it
# there. IONIC_SYMVERS in the environment still skips the lookup.
MAKE[0]="make -C ${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build \
    KDIR=/lib/modules/${kernelver}/build IONIC_SRC=${IONIC_SRC} \
    IONIC_SYMVERS=${IONIC_SYMVERS:-} IONIC_SYMVERS_KVER=${kernelver}"
CLEAN="make -C ${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build \
    KDIR=/lib/modules/${kernelver}/build clean"

BUILT_MODULE_NAME[0]="ernic_p4"
DEST_MODULE_LOCATION[0]="/updates/dkms"

# No autoinstall, for the same reasons the ionic package it depends on
# has none (see setup-ionic-dkms.sh): the ionic sources build only
# against a kernel close to the ref they came from, so autoinstall would
# try every kernel with headers installed, including ones no build can
# succeed for. And on a kernel the patched ionic isn't installed for, the
# stock ionic it would load beside has different CRCs, so even a build
# that succeeded would produce a module that won't insert. After a kernel
# upgrade, rebuild ionic and then this; see README.md.
AUTOINSTALL="no"
