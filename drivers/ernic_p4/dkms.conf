#
# DKMS recipe for ernic_p4.ko.
#
# The module uses the ionic driver's private headers, which no
# kernel-headers package ships, so the build needs a tree that
# scripts/fetch-ionic-sources.sh prepared with BOTH patches/ and
# patches/p4 -- the second is what defines IONIC_LIF_CAP_P4 and creates
# the auxiliary device this binds to. The Makefile checks for both and
# refuses rather than producing a module that could never bind.
#
# Where that tree is cannot come from the environment alone. dkms
# autoinstall runs on a kernel upgrade, from a context that has none of
# the variables the original install had, so a recipe that only read
# $IONIC_SRC would work once and then fail silently at exactly the moment
# the module needed rebuilding. This file is sourced as shell, so it can
# fall back to a path recorded at install time; the ernic_p4_dkms role
# writes it.

PACKAGE_NAME="ernic-p4"
PACKAGE_VERSION="0.2.0"

IONIC_SRC="${IONIC_SRC:-$(cat /etc/ernic-p4-ionic-src 2>/dev/null)}"

# The ionic this module loads against is itself a DKMS module, and
# patches/p4 changes the CRC of the symbol it calls, so build against
# that ionic's symbols rather than the kernel's.
#
# Resolved for ${kernelver}, not for whatever happens to be on disk.
# This file is sourced for a kernel upgrade as readily as for the
# running kernel, and an ionic Module.symvers left over from the old one
# carries CRCs that no longer match anything -- the same non-insertable
# module as the kernel's own symbols, reached by a longer road. The
# helper handles the staleness; see its header.
ERNIC_P4_SRC="/usr/src/${PACKAGE_NAME}-${PACKAGE_VERSION}"
if [ -n "${kernelver:-}" ] && [ -z "${IONIC_SYMVERS:-}" ]; then
    IONIC_SYMVERS="$("${ERNIC_P4_SRC}/find-ionic-symvers.sh" \
        "${kernelver}" 2>/dev/null || true)"
fi

MAKE[0]="make -C ${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build \
    KDIR=/lib/modules/${kernelver}/build IONIC_SRC=${IONIC_SRC} \
    IONIC_SYMVERS=${IONIC_SYMVERS}"
CLEAN="make -C ${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build \
    KDIR=/lib/modules/${kernelver}/build clean"

BUILT_MODULE_NAME[0]="ernic_p4"
DEST_MODULE_LOCATION[0]="/updates/dkms"
AUTOINSTALL="yes"
