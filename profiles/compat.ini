# compat: the emulated ionic NIC exactly as rocm-ernic has always presented
# it.  It is the base every other profile layers on, so it sets every key.

[identity]
# none, capri, elba, giglio or salina (IONIC_ASIC_TYPE_*)
asic_type = none
asic_rev = 0
# 1 to 31 printable characters; ethtool -i shows it as firmware-version.
fw_version = rocm-ernic-1.0

[link]
# Mbps: 1000, 10000, 25000, 40000, 50000, 100000, 200000 or 400000
speed_mbps = 100000
# copper, fiber or none; ethtool shows Direct Attach Copper, FIBRE or None.
xcvr = copper
# The largest MTU the guest may set, 1500 to 9582.
mtu_max = 9198

[stats]
# How often the statistics blocks in guest memory are rewritten, 10 to 60000
# ms.  The driver never asks, so this is how stale `ip -s link` can be.
interval_ms = 1000
